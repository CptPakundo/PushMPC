# The Windows core build (PushFPS's pushcore with our patches, its shaders and helpers, the filter, the updater, the
# VapourSynth plugin), shared by core.yml's two shapes: the release's core job and dev-build's single job. Leaves the
# outputs in <workspace>\core-out (what the packaging stages) and sets BUILD (the PushFPS build tree).
# Expects: the repository checked out at <workspace>\repo, a Windows runner, the job env SCCACHE_DIR, SCCACHE_CACHE_SIZE,
# SCCACHE_IDLE_TIMEOUT and GH_TOKEN (core.yml sets them).
# Other tracks: new core steps go here (before "Core build outputs"); their sources go into key.sh.
name: pushmpc-core
description: PushMPC's Windows core build (pushcore, filter, updater, VapourSynth plugin)
inputs:
  dry_run:
    description: 'dry run: no NVOF requirement'
    default: 'false'
  fresh:
    description: 'a tag build: the compiler cache is rewritten, not read (SCCACHE_RECACHE)'
    default: 'false'
  nvof_headers:
    description: 'the NVOF_SDK_HEADERS secret (base64 zip of the NVIDIA Optical Flow SDK headers)'
    default: ''
runs:
  using: composite
  steps:
    - name: Paths and pins
      shell: pwsh
      run: |
        $deps = Join-Path $env:RUNNER_TEMP 'deps'
        New-Item -ItemType Directory -Force $deps | Out-Null
        $pin = Get-Content repo/scripts/pushfps-pin.json -Raw | ConvertFrom-Json
        @(
          "DEPS=$deps"
          "BUILD=$(Join-Path $env:RUNNER_TEMP 'b')"
          "PUSHFPS_REPO=$($pin.pushfps.repository)"
          "PUSHFPS_TAG=$($pin.pushfps.tag)"
          "PUSHFPS_COMMIT=$($pin.pushfps.commit)"
          "PUSHFPS_PATCH=$($pin.pushfps.patch)"
          "PUSHFPS_DISPLAY_VERSION=$($pin.pushfps.displayVersion)"
          "MPCVR_REPO=$($pin.mpcvr.repository)"
          "MPCVR_COMMIT=$($pin.mpcvr.commit)"
        ) | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
        Write-Host "PushFPS $($pin.pushfps.tag) + $($pin.pushfps.patch); MPC-VR $($pin.mpcvr.commit)"

    # PushFPS at the pinned tag (checked against the pinned commit) with our patch set: the same tree as a local build.
    - name: PushFPS source with the PushMPC patches
      shell: pwsh
      run: |
        git config --global advice.detachedHead false
        git config --global core.autocrlf false
        git clone -q --depth 1 --branch $env:PUSHFPS_TAG https://github.com/$env:PUSHFPS_REPO.git PushFPS
        $head = git -C PushFPS rev-parse HEAD
        if ($env:PUSHFPS_COMMIT -and $head -ne $env:PUSHFPS_COMMIT) { Write-Host "::error::$env:PUSHFPS_TAG is $head, pinned $env:PUSHFPS_COMMIT (tag moved?)"; exit 1 }
        git -C PushFPS apply --whitespace=nowarn "$env:GITHUB_WORKSPACE/repo/$env:PUSHFPS_PATCH"
        if ($LASTEXITCODE -ne 0) { Write-Host "::error::$env:PUSHFPS_PATCH does not apply to $env:PUSHFPS_TAG"; exit 1 }

    # PushFPS's own CI is the reference for its dependencies: the pins below are read from its workflow file at this
    # tag, so a PushFPS bump brings its own versions (FFmpeg baseline, DLSS, XeSS, FidelityFX, AMF). pushcore uses only
    # PushFPS's enhancement engine: the streaming clients (Remote Play / Chiaki, Moonlight, Xbox), their static vcpkg
    # tree and the QML UI (Qt) are not configured, fetched or built here.
    - name: Dependency pins from PushFPS's own workflow
      shell: pwsh
      run: |
        $wf = Get-Content PushFPS/.github/workflows/build-windows.yml -Raw
        foreach ($n in 'UPSTREAM_REPO', 'UPSTREAM_TAG', 'VCPKG_COMMIT', 'DLSS_TAG', 'NVCODEC_TAG', 'CUDART_ZIP', 'XESS_TAG', 'FFX1_TAG', 'FFX2_TAG', 'AMF_COMMIT') {
          $m = [regex]::Match($wf, "(?m)^\s+$($n):\s*(\S+)")
          if (-not $m.Success) { Write-Host "::error::$n not found in PushFPS's build-windows.yml"; exit 1 }
          "$n=$($m.Groups[1].Value)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "$n = $($m.Groups[1].Value)"
        }

    - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756   # v1, pinned by commit
      with:
        arch: x64

    # the MSVC loop optimiser bug guard (cmake/msvc-loop-guard.cmake): the canary must make 20 calls when built with the
    # release flags plus /d2NoLUR; also shows whether this runner's compiler still has the bug without the switch
    - name: MSVC loop optimiser guard (tests/msvc-loop-guard.cpp)
      shell: pwsh
      run: |
        $d = "$env:RUNNER_TEMP\loop-guard"; New-Item -ItemType Directory -Force $d | Out-Null
        $flags = @('/nologo', '/O2', '/Ob2', '/DNDEBUG', '/EHsc', '/MT', '/utf-8')
        cl @flags /d2NoLUR repo/tests/msvc-loop-guard.cpp "/Fe:$d\guarded.exe" "/Fo:$d\guarded.obj" | Out-Null
        if ($LASTEXITCODE -ne 0) { Write-Host '::error::cl does not accept /d2NoLUR any more (see cmake/msvc-loop-guard.cmake)'; exit 1 }
        $out = & "$d\guarded.exe"; $rc = $LASTEXITCODE; Write-Host "with /d2NoLUR: $out"
        if ($rc -ne 0) { Write-Host "::error::the MSVC loop optimiser bug is back even with /d2NoLUR: $out"; exit 1 }
        cl @flags repo/tests/msvc-loop-guard.cpp "/Fe:$d\plain.exe" "/Fo:$d\plain.obj" | Out-Null
        $plain = & "$d\plain.exe"; Write-Host "without it: $plain (cl $((cl 2>&1 | Select-Object -First 1) -replace '.*Version\s+(\S+).*', '$1'))"

    # The SDKs below (and the FidelityFX 1.x optical flow libraries built from one of them) are cached under a hash of
    # their pins: a run with the same pins restores them in seconds instead of fetching and building them (about 1 min)
    - name: SDK cache key
      id: sdk-key
      shell: bash
      run: |
        h=$(printf '%s\n' v2-nolur "$DLSS_TAG" "$NVCODEC_TAG" "$CUDART_ZIP" "$XESS_TAG" "$FFX1_TAG" "$FFX2_TAG" "$AMF_COMMIT" | sha256sum | cut -c1-16)
        echo "key=pushmpc-sdks-$h" >> "$GITHUB_OUTPUT"

    - name: Restore the SDKs
      id: sdk-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ env.DEPS }}/dlss
          ${{ env.DEPS }}/nv-codec-headers
          ${{ env.DEPS }}/cudart-root
          ${{ env.DEPS }}/xess
          ${{ env.DEPS }}/ffx2
          ${{ env.DEPS }}/amf
          ${{ env.DEPS }}/ffx1/sdk/bin
          ${{ env.DEPS }}/ffx1/sdk/include
        key: ${{ steps.sdk-key.outputs.key }}

    - name: NVIDIA DLSS SDK headers, NVENC headers, CUDA driver header, XeSS, FidelityFX, AMF headers
      if: steps.sdk-cache.outputs.cache-hit != 'true'
      working-directory: ${{ env.DEPS }}
      shell: bash
      run: |
        set -e
        GIT_LFS_SKIP_SMUDGE=1 git clone -q --depth 1 --branch "$DLSS_TAG" --filter=blob:none --sparse https://github.com/NVIDIA/DLSS.git dlss
        git -C dlss sparse-checkout set include lib/Windows_x86_64/x64
        git clone -q --depth 1 --branch "$NVCODEC_TAG" https://github.com/FFmpeg/nv-codec-headers.git nv-codec-headers
        curl -sSfL "$CUDART_ZIP" -o cudart.zip && unzip -q cudart.zip -d cudart && mv cudart/*/ cudart-root
        gh release download "$XESS_TAG" -R intel/xess -p '*.zip' -O xess.zip && unzip -q xess.zip -d xess
        GIT_LFS_SKIP_SMUDGE=1 git clone -q --depth 1 --branch "$FFX2_TAG" --filter=blob:none --sparse https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK.git ffx2
        git -C ffx2 sparse-checkout set Kits/FidelityFX/api/include Kits/FidelityFX/framegeneration/include Kits/FidelityFX/upscalers/include
        gh release download "$FFX1_TAG" -R GPUOpen-LibrariesAndSDKs/FidelityFX-SDK -p '*.zip' -O ffx1.zip && unzip -q ffx1.zip -d ffx1
        git init -q amf && git -C amf remote add origin https://github.com/GPUOpen-LibrariesAndSDKs/AMF.git
        git -C amf fetch -q --depth 1 --filter=blob:none origin "$AMF_COMMIT"
        git -C amf sparse-checkout set amf/public/include && git -C amf checkout -q FETCH_HEAD

    - name: FidelityFX 1.x optical flow (static, /MT)
      shell: pwsh
      id: ffx1
      if: steps.sdk-cache.outputs.cache-hit != 'true'
      working-directory: ${{ env.DEPS }}/ffx1/sdk
      run: |
        cmake -S . -B build -A x64 -DFFX_API_BACKEND=DX12_X64 -DFFX_ALL=OFF -DFFX_OF=ON -DFFX_AUTO_COMPILE_SHADERS=1 `
          -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded "-DCMAKE_PROJECT_INCLUDE=$($env:GITHUB_WORKSPACE.Replace('\','/'))/repo/cmake/msvc-loop-guard.cmake"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cmake --build build --config Release --parallel
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Save the SDKs
      if: steps.ffx1.outcome == 'success'
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ env.DEPS }}/dlss
          ${{ env.DEPS }}/nv-codec-headers
          ${{ env.DEPS }}/cudart-root
          ${{ env.DEPS }}/xess
          ${{ env.DEPS }}/ffx2
          ${{ env.DEPS }}/amf
          ${{ env.DEPS }}/ffx1/sdk/bin
          ${{ env.DEPS }}/ffx1/sdk/include
        key: ${{ steps.sdk-key.outputs.key }}

    - name: Locate SDK roots
      shell: bash
      run: |
        deps=$(cygpath -u "$DEPS")
        xess=$(dirname "$(dirname "$(dirname "$(find "$deps/xess" -name xefg_swapchain_d3d12.h | head -1)")")")
        ffx1lib=$(find "$deps/ffx1/sdk/bin" -iname 'ffx_opticalflow_x64.lib' | head -1)
        test -n "$ffx1lib" || { echo "::error::FidelityFX optical flow libraries not found"; exit 1; }
        ffx1=$(dirname "$(dirname "$(dirname "$ffx1lib")")")
        { echo "XESS_ROOT=$(cygpath -m "$xess")"; echo "FFX1_ROOT=$(cygpath -m "$ffx1")"; } >> "$GITHUB_ENV"

    # vcpkg's FFmpeg, installed tree cached by the vcpkg commit and the port list: a hit skips the vcpkg clone, its
    # bootstrap and the install (a new PushFPS pin brings a new vcpkg commit and builds it once)
    - name: Restore vcpkg's FFmpeg
      id: vcpkg-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.DEPS }}/vcpkg/installed
        key: pushmpc-vcpkg-installed-v1-${{ env.VCPKG_COMMIT }}-ffmpeg-core-avcodec-avformat-avfilter-swresample-swscale

    - name: FFmpeg (vcpkg at PushFPS's baseline)
      id: vcpkg
      if: steps.vcpkg-cache.outputs.cache-hit != 'true'
      shell: pwsh
      working-directory: ${{ env.DEPS }}
      run: |
        git init -q vcpkg; git -C vcpkg remote add origin https://github.com/microsoft/vcpkg.git
        git -C vcpkg fetch -q --depth 1 origin $env:VCPKG_COMMIT; git -C vcpkg checkout -q FETCH_HEAD
        & vcpkg\bootstrap-vcpkg.bat -disableMetrics
        & vcpkg\vcpkg.exe install "ffmpeg[core,avcodec,avformat,avfilter,swresample,swscale]:x64-windows" --clean-after-build
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Save vcpkg's FFmpeg
      if: steps.vcpkg.outcome == 'success'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.DEPS }}/vcpkg/installed
        key: pushmpc-vcpkg-installed-v1-${{ env.VCPKG_COMMIT }}-ffmpeg-core-avcodec-avformat-avfilter-swresample-swscale

    # As in PushFPS's CI: the headers stay on the runner; nothing uploads or packages them. Required for a release
    # (RC2 F1: a core without them cannot run NVIDIA VFG); a dry run goes on without them and says so loudly.
    - name: NVIDIA Optical Flow headers
      shell: pwsh
      env:
        NVOF_SDK_HEADERS: ${{ inputs.nvof_headers }}
        DRY_RUN: ${{ inputs.dry_run }}
      run: |
        if (-not $env:NVOF_SDK_HEADERS) {
          $msg = 'No NVOF_SDK_HEADERS secret: this core has NO NVIDIA optical flow, so NVIDIA VFG cannot start (Auto falls back to DLSS-G).'
          if ($env:DRY_RUN -ne 'true') { Write-Host "::error::$msg A release needs the secret: not building."; exit 1 }
          Write-Host "::warning::$msg Dry run: building on; this artifact must not be released."
          @('## :warning: No NVIDIA optical flow in this build', '', $msg, '', 'Dry run only: add the repository secret `NVOF_SDK_HEADERS` before a release (a release run fails without it).') -join "`n" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          exit 0
        }
        $root = "$env:RUNNER_TEMP\nvof-sdk"; $dir = "$root\NvOFInterface"
        New-Item -ItemType Directory -Force $dir | Out-Null
        $zip = "$env:RUNNER_TEMP\nvof-headers.zip"
        [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String(($env:NVOF_SDK_HEADERS -replace '\s', '')))
        Expand-Archive $zip -DestinationPath $dir -Force; Remove-Item $zip
        foreach ($h in 'nvOpticalFlowCommon.h', 'nvOpticalFlowD3D12.h') {
          if (-not (Test-Path "$dir\$h")) {
            $found = Get-ChildItem $dir -Recurse -Filter $h | Select-Object -First 1
            if (-not $found) { Write-Host "::error::NVOF_SDK_HEADERS has no $h"; exit 1 }
            Copy-Item $found.FullName "$dir\$h"
          }
        }
        "NVOF_SDK_ROOT=$root" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

    - uses: actions/setup-python@v5
      id: pushflow-python
      with:
        python-version: '3.12'
        update-environment: false

    - name: Cache PushFlow inputs
      id: pushflow-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.DEPS }}/pushflow
        key: pushmpc-pushflow-${{ hashFiles('PushFPS/scripts/pushflow/prepare_runtime.py') }}

    - name: Cache libdovi
      id: dovi-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.DEPS }}/libdovi
        key: pushmpc-libdovi-d1abe0e27ff2c7ab3339614d06db9f8a058af6b2-cbindgen-0.29.4

    - name: PushFlow build inputs (ONNX Runtime + DirectML), as PushFPS prepares them
      shell: pwsh
      if: steps.pushflow-cache.outputs.cache-hit != 'true'
      env:
        PUSHFLOW_PYTHON: ${{ steps.pushflow-python.outputs.python-path }}
      run: |
        $venv = Join-Path $env:RUNNER_TEMP 'pushflow-venv'
        & $env:PUSHFLOW_PYTHON -m venv $venv
        $py = Join-Path $venv 'Scripts\python.exe'
        & $py -m pip install --disable-pip-version-check -q onnx==1.17.0 onnxconverter-common==1.14.0 onnxruntime==1.20.1 numpy==1.26.4
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Push-Location PushFPS
        & $py -I scripts/pushflow/prepare_runtime.py --out "$env:DEPS\pushflow"
        $rc = $LASTEXITCODE; Pop-Location
        if ($rc -ne 0) { exit $rc }

    - name: Save PushFlow inputs
      if: steps.pushflow-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.DEPS }}/pushflow
        key: pushmpc-pushflow-${{ hashFiles('PushFPS/scripts/pushflow/prepare_runtime.py') }}

    - name: Dolby Vision parsing library (libdovi, built from pinned source)
      shell: pwsh
      id: dovi
      if: steps.dovi-cache.outputs.cache-hit != 'true'
      continue-on-error: true
      run: |
        $ErrorActionPreference = 'Stop'
        $src = "$env:DEPS\dovi_tool"; $out = "$env:DEPS\libdovi"
        git init -q $src; git -C $src remote add origin https://github.com/quietvoid/dovi_tool
        git -C $src fetch -q --depth 1 origin d1abe0e27ff2c7ab3339614d06db9f8a058af6b2
        git -C $src checkout -q FETCH_HEAD
        Push-Location "$src\dolby_vision"
        cargo rustc --release --features capi --crate-type cdylib
        if ($LASTEXITCODE -ne 0) { throw 'libdovi did not build' }
        cargo install cbindgen --version 0.29.4 --locked
        if ($LASTEXITCODE -ne 0) { throw 'cbindgen did not install' }
        New-Item -ItemType Directory -Force "$out\include\libdovi", "$out\lib", "$out\bin" | Out-Null
        cbindgen --config cbindgen.toml --crate dolby_vision --output "$out\include\libdovi\rpu_parser.h"
        Pop-Location
        $dll = Get-ChildItem $src -Recurse -File -Filter dolby_vision.dll | Where-Object FullName -match '\\release\\' | Select-Object -First 1
        $lib = Get-ChildItem $src -Recurse -File -Filter dolby_vision.dll.lib | Where-Object FullName -match '\\release\\' | Select-Object -First 1
        Copy-Item $dll.FullName "$out\bin"; Copy-Item $lib.FullName "$out\lib"

    - name: Save libdovi
      if: steps.dovi-cache.outputs.cache-hit != 'true' && steps.dovi.outcome == 'success'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.DEPS }}/libdovi
        key: pushmpc-libdovi-d1abe0e27ff2c7ab3339614d06db9f8a058af6b2-cbindgen-0.29.4

    # pmml (PushMPC's ML runtime layer) lets PushFlow run on other ONNX Runtime EPs than DirectML (TensorRT-RTX,
    # OpenVINO, AMD GPU); it is linked into pushcore with the ONNX Runtime C API headers from its pinned package
    - name: pmml headers (ONNX Runtime C API, pinned)
      shell: pwsh
      env:
        PUSHFLOW_PYTHON: ${{ steps.pushflow-python.outputs.python-path }}
      run: |
        & $env:PUSHFLOW_PYTHON -I repo/pmml/scripts/fetch_runtime.py --pin repo/scripts/ml-runtime-pin.json --platform win-x64 --out "$env:DEPS\pmml" --cache "$env:DEPS\pmml-dl" --flavors core,directml --headers
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    # G10: Intel VPL frame interpolation in pushcore needs Intel's MIT dispatcher (libvpl), pinned by tag + SHA-256 (as
    # intel-video.yml), static with the static CRT; the runtime itself comes with Intel's graphics driver
    - name: Intel VPL dispatcher (libvpl, pinned)
      shell: pwsh
      env:
        LIBVPL_TAG: v2.17.0
        LIBVPL_SHA256: 4DE3E2FAF1E8307FB282E4A43F443191810F6A6B0A484FFFA7995BA1C814C6EC
      run: |
        $d = "$env:RUNNER_TEMP\vpl-dl"; New-Item -ItemType Directory -Force $d | Out-Null
        Invoke-WebRequest -Uri "https://github.com/intel/libvpl/archive/refs/tags/$env:LIBVPL_TAG.tar.gz" -OutFile "$d\libvpl.tar.gz"
        if ((Get-FileHash "$d\libvpl.tar.gz" -Algorithm SHA256).Hash -ne $env:LIBVPL_SHA256) { throw 'libvpl SHA-256 mismatch' }
        tar -xzf "$d\libvpl.tar.gz" -C $d
        $src = (Get-ChildItem $d -Directory -Filter 'libvpl-*' | Select-Object -First 1).FullName
        cmake -S $src -B "$env:RUNNER_TEMP\vplb" -A x64 -DBUILD_SHARED_LIBS=OFF -DUSE_MSVC_STATIC_RUNTIME=ON -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF -DINSTALL_EXAMPLES=OFF "-DCMAKE_INSTALL_PREFIX=$env:DEPS\vpl"
        if ($LASTEXITCODE -ne 0) { throw 'libvpl configure failed' }
        cmake --build "$env:RUNNER_TEMP\vplb" --config Release --target install
        if ($LASTEXITCODE -ne 0) { throw 'libvpl build failed' }
        Copy-Item "$src\LICENSE" "$env:DEPS\vpl\LICENSE.libvpl.txt"

    # sccache (Mozilla's official release build, pinned) in front of MSVC for PushFPS and pushcore: the compiler
    # output is cached by content; the cache is keyed by the PushFPS commit and our sources, restored from the
    # nearest earlier entry and saved right after the build
    - name: sccache
      shell: pwsh
      env:
        SCCACHE_VERSION: v0.10.0
      run: |
        $d = "$env:RUNNER_TEMP\sccache-bin"
        gh release download $env:SCCACHE_VERSION -R mozilla/sccache -p "sccache-$env:SCCACHE_VERSION-x86_64-pc-windows-msvc.zip" -O "$env:RUNNER_TEMP\sccache.zip"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Write-Host "sccache.zip SHA-256 $((Get-FileHash "$env:RUNNER_TEMP\sccache.zip").Hash)"
        Expand-Archive "$env:RUNNER_TEMP\sccache.zip" $d -Force
        $exe = (Get-ChildItem $d -Recurse -Filter sccache.exe | Select-Object -First 1).FullName
        "SCCACHE_EXE=$($exe.Replace('\','/'))" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
        # a tag build compiles everything fresh (no cached object goes into a release) and writes the results back
        if ('${{ inputs.fresh }}' -eq 'true') { 'SCCACHE_RECACHE=1' | Out-File -Append -Encoding utf8 $env:GITHUB_ENV; Write-Host 'tag build: SCCACHE_RECACHE=1' }
        & $exe --version

    # the key is taken before the build: the filter, updater and plugin builds write into repo/*/bin
    - name: Compiler cache key
      id: sccache-key
      shell: bash
      run: echo "key=pushmpc-sccache-core-$PUSHFPS_COMMIT-${{ hashFiles('repo/pushmpc/**', 'repo/patches/**', 'repo/scripts/pushfps-pin.json', 'repo/filter/**', 'repo/updater/**', 'repo/vsplugin/**') }}" >> "$GITHUB_OUTPUT"

    - name: Restore the compiler cache
      id: sccache-cache
      if: inputs.fresh != 'true'
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: ${{ steps.sccache-key.outputs.key }}
        restore-keys: |
          pushmpc-sccache-core-${{ env.PUSHFPS_COMMIT }}-
          pushmpc-sccache-core-

    # /Brepro (MSVC's reproducible-output switch, compiler and linker) in every CMake tree below, through the flags'
    # environment variables (CMake adds them to its defaults): a tag build's binaries can be compared with a dry run's
    - name: Configure PushFPS with pushcore (PUSHMPC_SOURCE_DIR)
      shell: pwsh
      env:
        CFLAGS: /Brepro
        CXXFLAGS: /Brepro
        LDFLAGS: /Brepro
      run: |
        if (Test-Path "$env:DEPS\libdovi\bin\dolby_vision.dll") { $env:LIBDOVI_ROOT = "$env:DEPS\libdovi" }
        $ffmpeg = "$env:DEPS\vcpkg\installed\x64-windows"
        $dovi = @('-DVEYRA_ENABLE_LIBDOVI=OFF')
        if ($env:LIBDOVI_ROOT -and (Test-Path "$env:LIBDOVI_ROOT\bin\dolby_vision.dll")) { $dovi = @('-DVEYRA_ENABLE_LIBDOVI=ON', "-DVEYRA_LIBDOVI_ROOT=$env:LIBDOVI_ROOT") }
        else { Write-Host '::warning::libdovi was not built: no Dolby Vision RPU parsing in this build' }
        $nvof = @(); if ($env:NVOF_SDK_ROOT) { $nvof = @("-DVEYRA_NVOF_SDK_ROOT=$env:NVOF_SDK_ROOT") }
        $vpl = @(); if (Test-Path "$env:DEPS\vpl\lib\vpl.lib") { $vpl = @("-DPUSHMPC_VPL_ROOT=$($env:DEPS.Replace('\','/'))/vpl") } else { Write-Host '::warning::no libvpl: Intel VPL frame interpolation not in this build' }
        cmake -S PushFPS -B $env:BUILD -G Ninja -DCMAKE_BUILD_TYPE=Release `
          "-DCMAKE_PREFIX_PATH=$ffmpeg" "-DCMAKE_C_COMPILER_LAUNCHER=$env:SCCACHE_EXE" "-DCMAKE_CXX_COMPILER_LAUNCHER=$env:SCCACHE_EXE" `
          -DVEYRA_BUILD_QML_UI=OFF -DVEYRA_BUILD_QT_PROBE=OFF -DVEYRA_ENABLE_EXPERIMENTAL_DLSSNR=ON -DVEYRA_ENABLE_D3D12_DEBUG=OFF `
          -DVEYRA_ENABLE_REMOTEPLAY=OFF -DVEYRA_ENABLE_MOONLIGHT=OFF -DVEYRA_ENABLE_XBOX=OFF `
          "-DVEYRA_DISPLAY_VERSION=$env:PUSHFPS_DISPLAY_VERSION" `
          "-DVEYRA_FFMPEG_ROOT=$ffmpeg" `
          "-DVEYRA_DLSS_SDK_ROOT=$env:DEPS\dlss" `
          "-DVEYRA_NVENC_HEADERS_ROOT=$env:DEPS\nv-codec-headers" `
          "-DVEYRA_CUDA_DRIVER_INCLUDE_DIR=$env:DEPS\cudart-root\include" `
          "-DVEYRA_XESS_ROOT=$env:XESS_ROOT" `
          "-DVEYRA_FIDELITYFX_ROOT=$env:FFX1_ROOT" `
          "-DVEYRA_FIDELITYFX2_ROOT=$env:DEPS\ffx2\Kits\FidelityFX" `
          "-DVEYRA_AMF_SDK_ROOT=$env:DEPS\amf\amf\public" `
          "-DVEYRA_ONNXRUNTIME_ROOT=$env:DEPS\pushflow\ort" "-DVEYRA_DIRECTML_ROOT=$env:DEPS\pushflow\dml" `
          "-DPUSHMPC_SOURCE_DIR=$($env:GITHUB_WORKSPACE.Replace('\','/'))/repo/pushmpc" `
          "-DCMAKE_PROJECT_INCLUDE=$($env:GITHUB_WORKSPACE.Replace('\','/'))/repo/cmake/msvc-loop-guard.cmake" `
          "-DPUSHMPC_PMML_ORT_INCLUDE=$($env:DEPS.Replace('\','/'))/pmml/ort/core/include" @nvof @dovi @vpl
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    # only what PushMPC ships: every PushFPS shader target (the .dxil set), pushcore.dll, the HIP preflight child and
    # the GPU harness; nothing of the PushFPS app
    - name: Build PushFPS's shaders, pushcore.dll, the HIP preflight child and the GPU harness
      shell: pwsh
      id: corebuild
      run: |
        $shaders = @(cmake --build $env:BUILD --target help | ForEach-Object { ($_ -split ':')[0].Trim() } | Where-Object { $_ -match '^veyra_shader_[A-Za-z0-9_]+$' } | Sort-Object -Unique)
        Write-Host "$($shaders.Count) shader targets"
        cmake --build $env:BUILD --target @shaders pushcore_dll pushcore_hip_preflight pushcore_gpu_harness pushflow_pmml_check pushcore_zluda_vsr_worker zluda_vsr_stub_worker zluda_vsr_test pmml_winml_ep --parallel
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Write-Host "$((Get-ChildItem "$env:BUILD\shaders" -Recurse -Filter *.dxil).Count) .dxil files"
        Get-Item "$env:BUILD\pushmpc\pushcore.dll" | Format-List Name, Length, VersionInfo
        & $env:SCCACHE_EXE --show-stats

    # Third-party licence texts of what is built into pushcore.dll go with the core component (core\licenses\; staged by
    # pushmpc-install.ps1 stage, listed in docs/licences.md): libvpl (MIT, linked statically) and the Intel XeSS SDK's
    # licence + third-party notices (its headers are compiled in; pins = scripts/xess-fetch.ps1's, XeSS SDK v3.0.2)
    - name: Third-party notices for the core (licenses folder)
      shell: pwsh
      run: |
        $lic = "$env:BUILD\pushmpc\licenses"; New-Item -ItemType Directory -Force $lic | Out-Null
        $vplLic = "$env:DEPS\vpl\LICENSE.libvpl.txt"
        if (Test-Path $vplLic) { Copy-Item $vplLic "$lic\libvpl-LICENSE.txt" } else { Write-Host '::warning::no libvpl licence (libvpl not built)' }
        $pins = @{ 'LICENSE.txt' = '784BE42C39A4A4D03CF85D88E15E59D75828FCA773CE45B8DBFFFBD7EAF208DF'; 'third-party-programs.txt' = 'E8D8899DBFC4DE0E8CA25560BE9358E03C1405D7C956D20A1838C3C709B9B51C' }
        foreach ($n in $pins.Keys) {
          $src = Join-Path $env:XESS_ROOT $n
          if (-not (Test-Path $src)) { Write-Host "::error::XeSS SDK $n missing in $env:XESS_ROOT"; exit 1 }
          if ((Get-FileHash $src -Algorithm SHA256).Hash -ne $pins[$n]) { Write-Host "::warning::XeSS SDK $n differs from the v3.0.2 pin (PushFPS moved XESS_TAG): shipped as found" }
          Copy-Item $src "$lic\intel-xess-$n"
        }
        Get-ChildItem $lic | Format-Table Name, Length

    # G11: RTX VSR on AMD through ZLUDA without an AMD GPU: parameter packing, the worker protocol, the cubin -> PTX index,
    # the picture check, the refusals and the whole worker round trip with the stub worker on WARP (exit = failed checks)
    - name: ZLUDA VSR worker checks (WARP, stub worker)
      shell: pwsh
      run: |
        & "$env:BUILD\pushmpc\zluda_vsr_test.exe" --stub "$env:BUILD\pushmpc\zluda_vsr_stub_worker.exe" --real "$env:BUILD\pushmpc\pushcore_zluda_vsr_worker.exe"
        if ($LASTEXITCODE -ne 0) { Write-Host "::error::zluda_vsr_test: $LASTEXITCODE failed checks"; exit 1 }

    # PushFlow inside pushcore's engine with the network on pmml, on Windows' software GPU (WARP: a full D3D12 device
    # that DirectML runs on): the same two frames through PushFlow's own DirectML session and through pmml's CPU EP
    # (VEYRA_PUSHFLOW_PMML; a DirectML choice stays on PushFlow's own zero-copy session by design), the generated
    # frames compared pixel by pixel
    - name: PushFlow on pmml inside pushcore's engine (WARP)
      shell: pwsh
      env:
        PUSHFLOW_PYTHON: ${{ steps.pushflow-python.outputs.python-path }}
      run: |
        $env:PATH = "$env:DEPS\vcpkg\installed\x64-windows\bin;$env:PATH"
        $tool = "$env:BUILD\pushmpc\pushflow_pmml_check.exe"; $rt = "$env:DEPS\pushflow\runtime"; $sh = "$env:BUILD\shaders"
        $out = "$env:RUNNER_TEMP\pushflow-check"; New-Item -ItemType Directory -Force $out | Out-Null
        $fail = 0
        # pmml-cpu-fails: pmml's run fails after 4 calls (the 2 warm-up runs at start, then frames 1-2; PMML_TEST_FAIL_RUN_AFTER):
        # PushFlow must reopen the network on DirectML within frame 3, and all 6 frames must be made (the last one is compared below)
        foreach ($mode in @(@{n='directml-own'; v=''}, @{n='pmml-cpu'; v="$env:DEPS\pmml|ort:core:cpu:0"}, @{n='pmml-dml-native'; v="$env:DEPS\pmml|ort:directml:dml:0"},
                            @{n='pmml-cpu-fails'; v="$env:DEPS\pmml|ort:core:cpu:0"; failAfter='4'; frames='6'})) {
          $env:VEYRA_PUSHFLOW_PMML = $mode.v; $env:PMML_DML_WARP = '1'
          $env:PMML_TEST_FAIL_RUN_AFTER = $(if ($mode.failAfter) { $mode.failAfter } else { '' })
          $frames = $(if ($mode.frames) { $mode.frames } else { '1' })
          & $tool $rt $sh "$out\$($mode.n).rgba" --warp 1 --size 512x288 --tier 0 --frames $frames 2>&1 | Tee-Object -Variable log | Select-Object -Last 10
          $r = ($log | Select-String '^RESULT ' | Select-Object -Last 1).Line
          $p = ($log | Select-String '^PROVIDER ' | Select-Object -Last 1).Line
          $after = ($log | Select-String '^PROVIDER-AFTER ' | Select-Object -Last 1).Line
          $fr = ($log | Select-String '^FRAMES ' | Select-Object -Last 1).Line
          if ($r -notmatch '^RESULT ok') { Write-Host "::error::$($mode.n): $r ($fr)"; $fail++ }
          elseif ($mode.n -like 'pmml-cpu*' -and $p -notmatch 'pmml') { Write-Host "::error::$($mode.n) did not run on pmml: $p"; $fail++ }
          elseif ($mode.n -eq 'pmml-dml-native' -and $p -ne 'PROVIDER DirectML') { Write-Host "::error::a DirectML choice should stay on PushFlow's own session: $p"; $fail++ }
          elseif ($mode.n -eq 'pmml-cpu-fails' -and ($fr -notmatch ' failed 0$' -or $after -notmatch '^PROVIDER-AFTER DirectML' -or $after -notmatch 'pmml failed')) {
            Write-Host "::error::pmml failing mid-stream did not hand over to DirectML without a lost frame: $fr; $after"; $fail++ }
          "| $($mode.n) | $p | $after | $fr | $r |" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
        }
        $env:VEYRA_PUSHFLOW_PMML = ''; $env:PMML_TEST_FAIL_RUN_AFTER = ''
        if ($fail) { exit 1 }
        & $env:PUSHFLOW_PYTHON -I repo/pmml/scripts/compare_rgba.py $out directml-own pmml-cpu pmml-dml-native pmml-cpu-fails --min-db 35
        if ($LASTEXITCODE -ne 0) { Write-Host '::error::the pmml path does not match PushFlow on DirectML'; exit 1 }

    - name: MPC Video Renderer source (DirectShow base classes for the filter)
      shell: pwsh
      run: |
        git init -q MpcVideoRenderer
        git -C MpcVideoRenderer remote add origin https://github.com/$env:MPCVR_REPO.git
        git -C MpcVideoRenderer fetch -q --depth 1 origin $env:MPCVR_COMMIT
        git -C MpcVideoRenderer checkout -q FETCH_HEAD
        git -C MpcVideoRenderer submodule update -q --init --depth 1 external/BaseClasses
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    # the filter, the updater and the plugin go through sccache as well (same cache, saved after the last of them)
    - name: Filter (PushMpcFilter.ax, PushMpcExit.dll) and the updater (release build)
      shell: pwsh
      id: filterbuild
      env:
        CFLAGS: /Brepro
        CXXFLAGS: /Brepro
        LDFLAGS: /Brepro
      run: |
        $cc = @("-DCMAKE_C_COMPILER_LAUNCHER=$env:SCCACHE_EXE", "-DCMAKE_CXX_COMPILER_LAUNCHER=$env:SCCACHE_EXE")
        cmake -S repo/filter -B "$env:RUNNER_TEMP\filter-build" -G Ninja -DCMAKE_BUILD_TYPE=Release @cc "-DPUSHMPC_MPCVR_DIR=$env:GITHUB_WORKSPACE\MpcVideoRenderer" "-DPMML_ORT_INCLUDE=$($env:DEPS.Replace('\','/'))/pmml/ort/core/include"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cmake --build "$env:RUNNER_TEMP\filter-build" --parallel
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & "$env:RUNNER_TEMP\filter-build\auto_test.exe" | Select-Object -First 20
        # held-frame re-timing (animation on twos / threes): the rules, the GPU test pass on WARP, the output spacing
        & "$env:RUNNER_TEMP\filter-build\held_test.exe" | Tee-Object -Variable held | Select-Object -Last 14
        if ($LASTEXITCODE -ne 0) { Write-Host "::error::held_test failed: $(($held | Select-String '^RESULT').Line)"; exit 1 }
        # ContentDetect: content class, interlacing and frame interval measured from pictures and timestamps (CPU)
        & "$env:RUNNER_TEMP\filter-build\content_test.exe" | Tee-Object -Variable cdt | Select-Object -Last 6
        if ($LASTEXITCODE -ne 0) { Write-Host "::error::content_test failed: $(($cdt | Select-String '^FAIL').Line -join '; ')"; exit 1 }
        cmake -S repo/updater -B "$env:RUNNER_TEMP\updater-build" -G Ninja -DCMAKE_BUILD_TYPE=Release @cc -DPUSHMPC_UPDATER_DEV=OFF
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cmake --build "$env:RUNNER_TEMP\updater-build" --parallel
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    # the mpv route's plugin (optional preview component): built with the VapourSynth SDK headers in the repository
    - name: VapourSynth plugin (pushmpc_vs.dll, mpv preview)
      shell: pwsh
      id: vsbuild
      env:
        CFLAGS: /Brepro
        CXXFLAGS: /Brepro
        LDFLAGS: /Brepro
      run: |
        cmake -S repo/vsplugin -B "$env:RUNNER_TEMP\vsplugin-build" -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_C_COMPILER_LAUNCHER=$env:SCCACHE_EXE" "-DCMAKE_CXX_COMPILER_LAUNCHER=$env:SCCACHE_EXE"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cmake --build "$env:RUNNER_TEMP\vsplugin-build" --target pushmpc_vs --parallel
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Get-Item repo/vsplugin/bin/pushmpc_vs.dll | Format-List Name, Length

    # the image model's helper for plain mpv (pushmpc.lua without PushMPC's engine), shipped next to pushmpc.lua, with
    # its model-free unit test and the no-model check
    - name: Content helper for plain mpv (pushmpc-content.exe)
      shell: pwsh
      env:
        CFLAGS: /Brepro
        CXXFLAGS: /Brepro
        LDFLAGS: /Brepro
      run: |
        cmake -S repo/integrations/mpv/content-helper -B "$env:RUNNER_TEMP\content-helper-build" -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_CXX_COMPILER_LAUNCHER=$env:SCCACHE_EXE" "-DPMML_ORT_INCLUDE=$($env:DEPS.Replace('\','/'))/pmml/ort/core/include"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cmake --build "$env:RUNNER_TEMP\content-helper-build" --target pushmpc-content content_helper_test --parallel
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        ctest --test-dir "$env:RUNNER_TEMP\content-helper-build" -R content_helper --output-on-failure
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Get-Item "$env:RUNNER_TEMP\content-helper-build\pushmpc-content.exe" | Format-List Name, Length

    - name: Compiler cache statistics
      id: sccache-stats
      if: always() && env.SCCACHE_EXE != ''
      shell: pwsh
      run: |
        $s = & $env:SCCACHE_EXE --show-stats 2>&1 | Out-String
        $s
        & $env:SCCACHE_EXE --stop-server 2>&1 | Out-Null
        $m = [regex]::Match($s, '(?m)^Cache misses\s+(\d+)')
        "misses=$(if ($m.Success) { $m.Groups[1].Value } else { 9999 })" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

    # main (deps.yml, release runs) always saves; a branch saves only when it compiled a fair amount (> 50 misses):
    # otherwise main's entry serves it as well, and the 10 GB repository cache is not filled with near-copies
    - name: Save the compiler cache
      # a failed or cancelled build saves what it has under a partial key (picked up by the restore-keys)
      if: always() && steps.sccache-cache.outputs.cache-hit != 'true' && steps.corebuild.outcome != 'skipped' && env.SCCACHE_EXE != '' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || fromJSON(steps.sccache-stats.outputs.misses || '9999') > 50)
      uses: actions/cache/save@v4
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: ${{ steps.vsbuild.outcome == 'success' && steps.sccache-key.outputs.key || format('pushmpc-sccache-core-{0}-partial-{1}', env.PUSHFPS_COMMIT, github.run_id) }}

    # what the build job stages: the filter, the updater, the VapourSynth plugin, pushcore, its preflight child and
    # the shaders, at the same relative places
    - name: Core build outputs
      shell: pwsh
      run: |
        $o = "$env:GITHUB_WORKSPACE\core-out"
        New-Item -ItemType Directory -Force "$o\filter-bin", "$o\updater-bin", "$o\vsplugin-bin", "$o\build\pushmpc" | Out-Null
        Copy-Item repo/filter/bin/* "$o\filter-bin" -Recurse
        Copy-Item repo/updater/bin/PushMpcUpdater.exe "$o\updater-bin"
        Copy-Item repo/vsplugin/bin/pushmpc_vs.dll "$o\vsplugin-bin"
        Copy-Item "$env:RUNNER_TEMP\content-helper-build\pushmpc-content.exe" "$o\vsplugin-bin"   # staged next to pushmpc.lua (Stage-VsPlugin)
        Copy-Item "$env:BUILD\pushmpc\pushcore.dll" "$o\build\pushmpc"
        if (Test-Path "$env:BUILD\pushmpc\pushcore_hip_preflight.exe") { Copy-Item "$env:BUILD\pushmpc\pushcore_hip_preflight.exe" "$o\build\pushmpc" }
        foreach ($x in 'pushcore_zluda_vsr_worker.exe', 'pmml_winml_ep.exe') { if (Test-Path "$env:BUILD\pushmpc\$x") { Copy-Item "$env:BUILD\pushmpc\$x" "$o\build\pushmpc" } }   # G11 (staged into core\)
        if (Test-Path "$env:BUILD\pushmpc\licenses") { Copy-Item "$env:BUILD\pushmpc\licenses" "$o\build\pushmpc" -Recurse }   # libvpl, XeSS SDK notices
        Copy-Item "$env:BUILD\shaders" "$o\build\shaders" -Recurse
        New-Item -ItemType Directory -Force "$o\harness" | Out-Null
        Copy-Item "$env:BUILD\pushmpc\pushcore_gpu_harness.exe" "$o\harness"
        Get-ChildItem $o -Recurse -File | Measure-Object Length -Sum | ForEach-Object { "{0} files, {1:N1} MB" -f $_.Count, ($_.Sum / 1MB) }
