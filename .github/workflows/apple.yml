# The Apple side of PushMPC on hosted runners (manual runs; standard macOS runners are free for this public repository).
#   iina      (ubuntu)   the IINA plugin: Info.json and preference checks, the pinned shaders fetched and hash-checked,
#                        linted for IINA's OpenGL 4.1 (no compute passes), JavaScript checked with node, packed as
#                        .iinaplgz (artifact).
#   vt        (macos-15 with Xcode 26.3, macos-26)
#                        the VapourSynth plugin with the VideoToolbox backend: unit tests, the VideoToolbox probe and
#                        the engine on synthetic clips (apple_vt_test), then pushmpc_vs.dylib built with the pinned
#                        VapourSynth wheel's headers and run through vspipe with backend=apple: frame count, rate,
#                        size, frame kinds, and which backend really ran (apple when this runner's VM offers the ML
#                        effects, else the portable fallback, which must still give the right output).
#   iina-bridge (macos-15) IINA's release DMG on the runner: architectures, entitlements, libmpv's libavfilter imports;
#                        pushmpc-iina.so inside IINA's unmodified libmpv, headless, output rate x2.
#   mac-runtime (macos-15, macos-15-intel)
#                        the content model's runtime as setup.sh installs it on a Mac (sh setup.sh pmml in a fresh
#                        HOME: the pinned ONNX Runtime for this architecture and the content model, each hash-checked,
#                        into ~/Library/Application Support/PushMPC/pmml), then pmml_cli loads that ONNX Runtime from
#                        there (CPU and CoreML listed), and setup.sh's uninstall removes it again.
#   artcnn    (ubuntu)   ArtCNN: the pinned ONNX files converted (.pmnn, fragment GLSL), onnxruntime against PushMPC's
#                        float reference, the fragment shaders in mpv's OpenGL renderer against the same reference.
#   homebrew  (macos-15) the tap route (this repository as the tap, Formula/pushmpc.rb) with the checkout's archives:
#                        brew install --build-from-source, brew test, then Homebrew's mpv in encode mode through the
#                        installed filter on a short public clip (frame count x2), and pushmpc-setup's exact undo.
name: apple

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: 'jobs to run: all | iina | vt | homebrew | artcnn | iina-bridge | mac-runtime | vt,homebrew ...'
        required: false
        default: 'all'

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iina:
    if: inputs.jobs == 'all' || contains(inputs.jobs, 'iina')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/iina-shaders
          key: iina-shaders-${{ hashFiles('integrations/iina/shaders.lock.json', 'vsplugin/models/artcnn.lock.json') }}
      - name: Validate the plugin folder
        run: python3 integrations/iina/build.py validate
      - name: Fetch, verify, lint the shaders and pack the plugin
        timeout-minutes: 5
        run: python3 integrations/iina/build.py build --cache "$RUNNER_TEMP/iina-shaders" --out "$RUNNER_TEMP/iina"
      - uses: actions/upload-artifact@v4
        with:
          name: iina-plugin
          path: ${{ runner.temp }}/iina/*.iinaplgz

  iina-bridge:
    # the IINA in-process bridge: spike facts about the current IINA release (architectures, entitlements, libmpv's
    # libavfilter imports, FFmpeg majors), then pushmpc-iina.so built against Homebrew's FFmpeg / mpv headers and run
    # inside IINA's own, unmodified libmpv (headless host; software frames, so the portable engine runs in the VM)
    if: inputs.jobs == 'all' || contains(inputs.jobs, 'iina-bridge')
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ANALYTICS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew/downloads
            ${{ runner.temp }}/iina-dmg
          key: iina-bridge-${{ runner.os }}-v2   # v2: ffmpeg@7 / ffmpeg@8 bottles too
      - name: IINA release facts (spike)
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/iina-dmg"
          ls "$RUNNER_TEMP"/iina-dmg/*.dmg > /dev/null 2>&1 || gh release download --repo iina/iina --pattern '*.dmg' --dir "$RUNNER_TEMP/iina-dmg"
          dmg=$(ls "$RUNNER_TEMP"/iina-dmg/*.dmg | head -1); echo "DMG: $dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/iina-mnt" "$dmg" > /dev/null
          app="$RUNNER_TEMP/iina-mnt/IINA.app"; fw="$app/Contents/Frameworks"
          echo "IINA_FW=$fw" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist"
          lipo -archs "$app/Contents/MacOS/IINA"; lipo -archs "$fw/libmpv.2.dylib" || true
          codesign -d --entitlements - "$app" 2>/dev/null | grep -E -o 'disable-library-validation|allow-unsigned-executable-memory|allow-jit' | sort -u
          echo "--- libmpv's libavfilter imports"
          nm -m -u "$fw/libmpv.2.dylib" | grep -E 'av_buffersrc|av_buffersink|avfilter_graph_(parse2|alloc_filter|create_filter|free)' || true
          otool -L "$fw/libmpv.2.dylib" | grep -E 'avfilter|avutil'
          otool -l "$fw/libmpv.2.dylib" | grep -E -A1 'LC_DYLD_CHAINED_FIXUPS|sectname __got|sectname __auth_got' | head -12
      - name: Bridge built against Homebrew's FFmpeg / mpv headers (one build per FFmpeg major)
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          ffx=""; for f in ffmpeg@4 ffmpeg@6 ffmpeg@7 ffmpeg@8; do if brew info --formula "$f" >/dev/null 2>&1; then ffx="$ffx $f"; fi; done   # the ones this Homebrew knows (as the formula picks them)
          brew install mpv ffmpeg $ffx > /dev/null
          ffinc=""; for f in $ffx; do ffinc="$ffinc${ffinc:+;}$(brew --prefix "$f")/include"; done; echo "extra FFmpeg formulae:${ffx:- none}"
          ffi=$(brew --prefix ffmpeg)/include; mpvi=$(brew --prefix mpv)/include
          grep -E 'define LIBAVUTIL_VERSION_MAJOR|define LIBAVFILTER_VERSION_MAJOR' "$ffi"/libavutil/version_major.h "$ffi"/libavfilter/version_major.h || true
          cmake -S vsplugin -B build -DCMAKE_BUILD_TYPE=Release -DPUSHMPC_APPLE=ON -DPUSHMPC_IINA_BRIDGE=ON -DFFMPEG_INCLUDE="$ffi" -DMPV_INCLUDE="$mpvi" \
            -DPUSHMPC_IINA_FFMPEG_INCLUDES="$ffinc"
          cmake --build build --target pushmpc_iina pushmpc_iina_extras --parallel
          clang -O2 -I"$mpvi" -Wl,-rpath,"$IINA_FW" -o build/iina_bridge_host vsplugin/tests/iina_bridge_host.c
          ls build/pushmpc-iina*.so
          for f in build/pushmpc-iina*.so; do nm -gU "$f" | grep -q mpv_open_cplugin || { echo "::error::$f exports no mpv_open_cplugin"; exit 1; }; done
          # the build for IINA's own FFmpeg major (its bundled libavutil.<N>.dylib), as pushmpc-apps-mac.sh picks it
          m=$(ls "$IINA_FW" | sed -n 's/^libavutil\.\([0-9][0-9]*\)\.dylib$/\1/p' | head -n 1)
          b="$PWD/build/pushmpc-iina.so"; [ -n "$m" ] && [ -f "build/pushmpc-iina-av$m.so" ] && b="$PWD/build/pushmpc-iina-av$m.so"
          echo "IINA's libavutil ${m:-?}: $b"; echo "IINA_BRIDGE=$b" >> "$GITHUB_ENV"
      - name: The bridge inside IINA's libmpv (headless)
        timeout-minutes: 5
        shell: bash
        run: |
          set +e -o pipefail
          ./build/iina_bridge_host "$IINA_FW/libmpv.2.dylib" "$IINA_BRIDGE" 12 | tee "$RUNNER_TEMP/bridge.txt"; r=$?
          echo "--- bridge log"; cat "$HOME/Library/Logs/PushMPC/iina-bridge.log" || true
          if [ "$r" -ge 128 ]; then
            echo "--- crashed (exit $r): backtrace"
            lldb --batch -o run -o "bt all" -o "register read" -k "bt all" -k quit -- ./build/iina_bridge_host "$IINA_FW/libmpv.2.dylib" "$IINA_BRIDGE" 12 2>&1 | tail -120
          fi
          line=$(grep -h "graph closed:" "$HOME/Library/Logs/PushMPC/iina-bridge.log" | tail -1)
          echo "::notice title=IINA bridge::$(grep -h 'bridge:\|IINA_BRIDGE_RESULT' "$RUNNER_TEMP/bridge.txt" | tr '\n' ' ') $line"
          [ "$r" = 0 ] || exit $r
          n=$(echo "$line" | sed -E 's/.*: ([0-9]+) frames in, ([0-9]+) out.*/\1/'); m=$(echo "$line" | sed -E 's/.*: ([0-9]+) frames in, ([0-9]+) out.*/\2/')
          if [ -z "$n" ] || [ "$n" -le 0 ] || [ $((10 * m)) -lt $((18 * n)) ]; then echo "::error::the bridge did not double the frames ($line)"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iina-bridge
          path: |
            build/pushmpc-iina*.so
            ~/Library/Logs/PushMPC/iina-bridge.log

  mac-runtime:
    # what IINA's bridge (pushmpc/content_model.h) looks for on a Mac: <rt>/ort/core/libonnxruntime.dylib and
    # <rt>/content-model/vision_model_fp16.onnx under ~/Library/Application Support/PushMPC/pmml, installed by setup.sh's
    # own step from the files the Mac bundle carries (setup.sh, pmml/fetch_runtime.py and the two pins). Apple silicon
    # takes the core ONNX Runtime (osx-arm64), Intel the last x86_64 build (osx-x64, ml-runtime-pin.json's macosNote).
    if: inputs.jobs == 'all' || contains(inputs.jobs, 'mac-runtime')
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: setup.sh pmml in a fresh HOME (the Mac's ONNX Runtime and the content model)
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          t=$RUNNER_TEMP/bundle; h=$RUNNER_TEMP/home; mkdir -p "$t/pmml" "$h"
          cp integrations/linux/setup.sh "$t/"
          cp pmml/scripts/fetch_runtime.py scripts/ml-runtime-pin.json scripts/content-model-pin.json "$t/pmml/"
          HOME=$h XDG_DATA_HOME='' PUSHMPC_NO_AUTOBENCH=1 sh "$t/setup.sh" pmml | tee "$RUNNER_TEMP/setup.txt"
          rt="$h/Library/Application Support/PushMPC/pmml"
          echo "RT=$rt" >> "$GITHUB_ENV"
          ls -la "$rt" "$rt/ort/core" "$rt/content-model"
          lib="$rt/ort/core/libonnxruntime.dylib"
          test -f "$lib" || { echo "::error::setup.sh left no $lib"; exit 1; }
          test -f "$rt/content-model/vision_model_fp16.onnx" || { echo "::error::setup.sh left no content model"; exit 1; }
          want=$(uname -m); archs=$(lipo -archs "$lib")
          echo "$archs" | grep -qw "$want" || { echo "::error::$lib is $archs, this Mac is $want"; exit 1; }
          codesign -dv "$lib" 2>&1 | grep -E 'Authority|TeamIdentifier|Signature' || true
          cat "$rt/fetched.json"
          echo "::notice title=Mac runtime ($want)::$(jq -r '.platform + " ONNX Runtime " + .ort.core.version' "$rt/fetched.json"), content model $(stat -f %z "$rt/content-model/vision_model_fp16.onnx") bytes"
          # a second run keeps what is there (no second download)
          HOME=$h XDG_DATA_HOME='' PUSHMPC_NO_AUTOBENCH=1 sh "$t/setup.sh" pmml | tee "$RUNNER_TEMP/setup2.txt"
          grep -q 'already installed' "$RUNNER_TEMP/setup2.txt" || { echo "::error::the second run fetched ONNX Runtime again"; exit 1; }
      - name: pmml loads that ONNX Runtime (CPU, CoreML)
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          # the C API headers of the core version (what the plugins are built with), then pmml_cli
          python3 -I pmml/scripts/fetch_runtime.py --pin scripts/ml-runtime-pin.json --platform osx-arm64 --out "$RUNNER_TEMP/hdr" --cache "$RUNNER_TEMP/hdr-dl" --flavors core --headers > /dev/null
          cmake -S pmml -B build -DCMAKE_BUILD_TYPE=Release -DPMML_ORT_INCLUDE="$RUNNER_TEMP/hdr/ort/core/include"
          cmake --build build --target pmml_cli --parallel
          build/pmml_cli list --runtime "$RT" --flavor core 2>&1 | tee "$RUNNER_TEMP/list.txt"
          grep -q 'ONNX Runtime CPU' "$RUNNER_TEMP/list.txt" || { echo "::error::pmml did not load ONNX Runtime from $RT"; exit 1; }
          grep -q 'CoreML' "$RUNNER_TEMP/list.txt" || { echo "::error::no CoreML device listed"; exit 1; }
      - name: setup.sh uninstall removes it
        shell: bash
        run: |
          set -euo pipefail
          h=$RUNNER_TEMP/home
          HOME=$h XDG_DATA_HOME='' sh "$RUNNER_TEMP/bundle/setup.sh" uninstall | tee "$RUNNER_TEMP/uninstall.txt"
          [ ! -e "$RT" ] || { echo "::error::$RT is still there after uninstall"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-runtime-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/setup.txt
            ${{ runner.temp }}/setup2.txt
            ${{ runner.temp }}/list.txt
            ${{ runner.temp }}/uninstall.txt

  artcnn:
    # ArtCNN independent of the OS: the converter against onnxruntime (float reference), and the generated fragment
    # shaders in mpv's OpenGL renderer (llvmpipe) against the same reference
    if: inputs.jobs == 'all' || contains(inputs.jobs, 'artcnn')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/artcnn
          key: artcnn-${{ hashFiles('vsplugin/models/artcnn.lock.json') }}
      - name: Fetch (pinned), convert, onnxruntime parity
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python3 -m pip install --quiet numpy onnxruntime
          python3 vsplugin/tools/artcnn_tool.py fetch --out "$RUNNER_TEMP/artcnn"
          cmake -S vsplugin -B build -DCMAKE_BUILD_TYPE=Release -DPUSHMPC_APPLE=OFF
          cmake --build build --target artcnn_ref apple_test --parallel
          ./build/apple_test
          for m in C4F16 C4F32; do
            python3 vsplugin/tools/artcnn_tool.py pmnn "$RUNNER_TEMP/artcnn/ArtCNN_$m.onnx" "$RUNNER_TEMP/ArtCNN_$m.pmnn"
            python3 vsplugin/tools/artcnn_tool.py glsl "$RUNNER_TEMP/artcnn/ArtCNN_$m.onnx" "$RUNNER_TEMP/ArtCNN_${m}_fragment.glsl"
            python3 vsplugin/tests/ci/artcnn_parity.py "$RUNNER_TEMP/artcnn/ArtCNN_$m.onnx" "$RUNNER_TEMP/ArtCNN_$m.pmnn" ./build/artcnn_ref
          done
      - name: Fragment shaders in mpv (OpenGL, llvmpipe) against the reference
        timeout-minutes: 6
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq mpv xvfb > /dev/null
          python3 -m pip install --quiet numpy pillow
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x1024x24" python3 vsplugin/tests/ci/artcnn_mpv_check.py "$RUNNER_TEMP/ArtCNN_C4F16_fragment.glsl" "$RUNNER_TEMP/ArtCNN_C4F16.pmnn" ./build/artcnn_ref
      - uses: actions/upload-artifact@v4
        with:
          name: artcnn-fragment-shaders
          path: ${{ runner.temp }}/ArtCNN_*_fragment.glsl

  vt:
    if: inputs.jobs == 'all' || contains(inputs.jobs, 'vt')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            xcode: /Applications/Xcode_26.3.app/Contents/Developer   # the macOS 26 SDK (low-latency effects) on a macOS 15 VM
          - os: macos-26
            xcode: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Machine, toolchain and GPU
        timeout-minutes: 3
        shell: bash
        run: |
          echo "PUSHMPC_VS_LOG_DIR=$RUNNER_TEMP/vslogs" >> "$GITHUB_ENV"
          [ -n "${{ matrix.xcode }}" ] && [ -d "${{ matrix.xcode }}" ] && echo "DEVELOPER_DIR=${{ matrix.xcode }}" >> "$GITHUB_ENV" && export DEVELOPER_DIR="${{ matrix.xcode }}"
          sw_vers; uname -m; sysctl -n machdep.cpu.brand_string hw.model
          xcodebuild -version; echo "SDK $(xcrun --sdk macosx --show-sdk-version) at $(xcrun --sdk macosx --show-sdk-path)"
          ls -d /Applications/Xcode*.app | tr '\n' ' '; echo
          system_profiler SPDisplaysDataType | sed -n 1,20p || true
          echo "--- VTFrameProcessor error codes in this SDK"
          grep -rn -A16 "VTFrameProcessorError" "$(xcrun --sdk macosx --show-sdk-path)/System/Library/Frameworks/VideoToolbox.framework/Headers/VTErrors.h" | grep -E "= *-?[0-9]+|VTFrameProcessorError" | sed 's/^ *//' | head -40 || true

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/artcnn
          key: artcnn-${{ hashFiles('vsplugin/models/artcnn.lock.json') }}

      - name: Build (VideoToolbox engine, Metal stages, unit tests, pushmpc-apple)
        timeout-minutes: 8
        shell: bash
        run: |
          cmake -S vsplugin -B build -DCMAKE_BUILD_TYPE=Release -DPUSHMPC_APPLE=ON
          cmake --build build --target apple_test portable_test apple_vt_test pushmpc_apple artcnn_ref --parallel
          python3 vsplugin/tools/artcnn_tool.py fetch --out "$RUNNER_TEMP/artcnn"
          mkdir -p "$RUNNER_TEMP/models"
          for m in C4F16 C4F32; do python3 vsplugin/tools/artcnn_tool.py pmnn "$RUNNER_TEMP/artcnn/ArtCNN_$m.onnx" "$RUNNER_TEMP/models/ArtCNN_$m.pmnn"; done

      - name: Metal stages against their references; probe; engine benchmark (VM numbers)
        timeout-minutes: 6
        shell: bash
        env:
          PUSHMPC_MODELS: ${{ runner.temp }}/models
        run: |
          ./build/pushmpc-apple probe
          ./build/pushmpc-apple model-status || true
          ./build/pushmpc-apple parity "$PUSHMPC_MODELS"
          # Configure's choices with ArtCNN available (VideoToolbox fails every call in the VM; ArtCNN runs on its GPU)
          PUSHMPC_BENCH_SR=artcnn ./build/pushmpc-apple bench 1280 720 1 23.976 || echo "::warning::bench: not available here"

      - name: Unit tests
        timeout-minutes: 5
        run: ctest --test-dir build -R "apple_test|portable_test" --output-on-failure

      - name: VideoToolbox probe and engine on synthetic clips
        timeout-minutes: 8
        shell: bash
        run: |
          set -o pipefail
          # ArtCNN chains run with the weights; they do not count as "VideoToolbox works here"
          PUSHMPC_MODELS="$RUNNER_TEMP/models" ./build/apple_vt_test | tee "$RUNNER_TEMP/apple_vt_test.txt"
          r=$(grep -o 'APPLE_VT_RESULT=[a-z]*' "$RUNNER_TEMP/apple_vt_test.txt" | cut -d= -f2)
          echo "APPLE_VT=$r" >> "$GITHUB_ENV"
          echo "::notice title=VideoToolbox on ${{ matrix.os }}::$(grep '^apple probe' "$RUNNER_TEMP/apple_vt_test.txt" | head -1 | cut -c1-900)"

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Pinned VapourSynth wheel, then pushmpc_vs.dylib with the apple backend
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          url=$(python -c "import json; print(json.load(open('scripts/vapoursynth-pin.json'))['portableCi']['macos']['url'])")
          sha=$(python -c "import json; print(json.load(open('scripts/vapoursynth-pin.json'))['portableCi']['macos']['sha256'])")
          whl="$RUNNER_TEMP/$(basename "$url")"
          curl -fsSL --retry 3 --max-time 120 -o "$whl" "$url"
          got=$(python -c "import hashlib,sys; print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest().upper())" "$whl")
          [ "$got" = "$(echo "$sha" | tr a-f A-F)" ] || { echo "::error::SHA-256 mismatch for $url: $got"; exit 1; }
          python -m pip install --no-deps "$whl"
          pkg=$(python -c "import os, vapoursynth; print(os.path.dirname(vapoursynth.__file__))")
          mkdir -p vsplugin/third_party/vapoursynth
          cp "$pkg"/include/VapourSynth4.h "$pkg"/include/VSHelper4.h vsplugin/third_party/vapoursynth/
          cmake -S vsplugin -B build -DCMAKE_BUILD_TYPE=Release -DPUSHMPC_APPLE=ON
          cmake --build build --target pushmpc_vs --parallel
          otool -L vsplugin/bin/pushmpc_vs.dylib
          nm -gU vsplugin/bin/pushmpc_vs.dylib | grep -i VapourSynthPluginInit2
          vsp=$(command -v vspipe || true); [ -n "$vsp" ] || vsp="$pkg/vspipe"
          echo "PUSHMPC_VS_PLUGIN=$PWD/vsplugin/bin/pushmpc_vs.dylib" >> "$GITHUB_ENV"; echo "VSPIPE=$vsp" >> "$GITHUB_ENV"

      - name: pushmpc.Enhance(backend=apple) through VapourSynth
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PUSHMPC_VS_LOG_DIR"
          cat > "$RUNNER_TEMP/check.py" <<'PY'
          import os, glob, runpy, vapoursynth as vs
          k = int(os.environ["PUSHMPC_TEST_K"]); sr = os.environ.get("PUSHMPC_TEST_SR", "off")
          runpy.run_path("vsplugin/tests/ci/apple_clip.vpy")
          clip = vs.get_output(0)
          clip = clip.clip if hasattr(clip, "clip") else clip
          print("frames", clip.num_frames, "fps", clip.fps, "size", clip.width, "x", clip.height, clip.format.name)
          assert clip.num_frames == 48 * k, clip.num_frames
          assert clip.fps.numerator * 1001 == 24000 * k * clip.fps.denominator, clip.fps
          kinds = {}
          for i in range(clip.num_frames):
              f = clip.get_frame(i)
              assert "_DurationNum" in f.props, (i, dict(f.props))
              kinds[f.props.get("PushMPCFrameKind", -1)] = kinds.get(f.props.get("PushMPCFrameKind", -1), 0) + 1
          print("frame kinds (0 real, 1 generated, 2 repeated):", kinds)
          log = "".join(open(p).read() for p in sorted(glob.glob(os.path.join(os.environ["PUSHMPC_VS_LOG_DIR"], "*.log"))))
          ran = "apple" if "apple: output YUV" in log else ("portable" if "portable: output YUV" in log else "none")
          print("backend that ran:", ran)
          with open(os.environ["GITHUB_ENV"], "a") as e: e.write(f"RAN_{k}_{os.environ.get('PUSHMPC_TEST_BITS','8')}_{sr}={ran}\n")
          if ran == "apple":
              want_w = 1280 * (int(sr) if sr in ("2", "4") else 2 if sr == "artcnn" else 1)
              if sr in ("2", "4") and clip.width == 1280: print("super resolution was not offered: source size kept")
              else: assert clip.width == want_w, (clip.width, want_w)
              assert k == 1 or kinds.get(1, 0) > 0, "no generated frames"
          if os.environ.get("APPLE_VT") == "ok":
              assert ran == "apple", "VideoToolbox works on this runner (apple_vt_test) but the plugin did not use it"
          PY
          for cfg in "2 8 off" "4 8 off" "2 10 off" "2 8 2" "1 8 artcnn"; do
            set -- $cfg
            rm -f "$PUSHMPC_VS_LOG_DIR"/*.log
            echo "=== k=$1 bits=$2 sr=$3"
            models=""; [ "$3" = artcnn ] && models="$RUNNER_TEMP/models"
            PUSHMPC_MODELS="$models" PUSHMPC_TEST_K=$1 PUSHMPC_TEST_BITS=$2 PUSHMPC_TEST_SR=$3 python "$RUNNER_TEMP/check.py" | tee "$RUNNER_TEMP/ran-$1-$2-$3.txt"
            grep -h -E "backend|apple|portable:" "$PUSHMPC_VS_LOG_DIR"/*.log | cut -c1-400 | head -20
          done
          echo "=== vspipe --info (Auto backend)"
          PUSHMPC_TEST_K=2 PUSHMPC_TEST_BACKEND=auto "$VSPIPE" --info vsplugin/tests/ci/apple_clip.vpy
          PUSHMPC_TEST_K=2 PUSHMPC_TEST_BACKEND=auto "$VSPIPE" vsplugin/tests/ci/apple_clip.vpy -- > /dev/null
          echo "::notice title=apple backend on ${{ matrix.os }}::apple_vt_test=$APPLE_VT; backends that ran: $(grep -h -o 'backend that ran: [a-z]*' "$RUNNER_TEMP"/ran-*.txt 2>/dev/null | cut -d' ' -f4 | xargs)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-vt-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/apple_vt_test.txt
            ${{ runner.temp }}/vslogs
            vsplugin/bin/pushmpc_vs.dylib

  homebrew:
    if: inputs.jobs == 'all' || contains(inputs.jobs, 'homebrew')
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]   # Apple silicon and Intel (MoltenVK on both; VideoToolbox interpolation needs Apple silicon)
    runs-on: ${{ matrix.runner }}
    # a green run takes about 4 min (bottles 1.5, the formula's own build 1, tests 1); 25 leaves room for a cold cache
    timeout-minutes: 100
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
      # bottles only for every dependency (only pushmpc itself is built, from the local tap)
      HOMEBREW_NO_BOTTLE_SOURCE_FALLBACK: '1'
      # a public 10 s 720p H.264 clip (Big Buck Bunny, CC BY 3.0, Blender Foundation)
      CLIP_URL: https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/720/Big_Buck_Bunny_720_10s_1MB.mp4
      CLIP_SHA256: 18b99ec25f32f6bd2223aa54e4b5632533328bf5cc81c283eba7604c42649f75
    steps:
      - uses: actions/checkout@v4
      # macOS runs these with its own /bin/sh and /bin/bash (bash 3.2): a syntax error must fail here in seconds, not after
      # the long steps (an apostrophe inside "${x:+...}" parsed on bash 5 but broke bash 3.2: runs 45968573181 / 45968576973)
      - name: The macOS shell scripts parse with macOS's bash 3.2
        run: |
          /bin/bash --version | head -n 1
          bad=0
          for f in mpvnative/install/pushmpc-apps-mac.sh mpvnative/install/pushmpc-mac-players.sh mpvnative/install/pushmpc-plex-mac.sh \
                   mpvnative/install/test-apps-mac.sh mpvnative/plex-mac/*.sh scripts/pushmpc-capture.sh integrations/mpv/mpv-integration.sh \
                   integrations/linux/setup.sh; do
            [ -f "$f" ] || continue
            /bin/sh -n "$f" && /bin/bash -n "$f" || { echo "::error file=$f::does not parse with macOS's /bin/sh or /bin/bash (bash 3.2)"; bad=1; }
          done
          exit $bad
      # Homebrew's downloaded bottles and resources (ArtCNN files), the test clip; keyed on the formula, falling back to
      # the newest cache of any formula version
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew/downloads
            ~/Library/Caches/Homebrew/api
            ${{ runner.temp }}/clip
          key: brew-mpv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Formula/pushmpc.rb') }}
          restore-keys: brew-mpv-${{ runner.os }}-${{ runner.arch }}-

      - name: Homebrew mpv (bottles) and its VapourSynth
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          brew --version
          # everything the formula needs, as bottles, before the formula itself (so its build step only builds PushMPC)
          ffx=""; for f in ffmpeg@4 ffmpeg@6 ffmpeg@7 ffmpeg@8; do if brew info --formula "$f" >/dev/null 2>&1; then ffx="$ffx $f"; fi; done   # the ones this Homebrew knows (as the formula picks them)
          brew install mpv ffmpeg $ffx vapoursynth cmake pkgconf onnxruntime   # ffmpeg@N: the IINA bridge's other FFmpeg majors
          brew deps mpv | grep -x vapoursynth
          brew info --json=v2 vapoursynth | python3 -c "import json,sys; f=json.load(sys.stdin)['formulae'][0]; print('vapoursynth', f['versions']['stable'], 'deps', f['dependencies'])"
          mpv --version | head -2
          mpv --vf=help | grep -i vapoursynth
          "$(brew --prefix vapoursynth)/bin/vspipe" --version

      - name: Plex for Mac bundle (the formula's plex-mac resource, a release asset), built as mpv-native.yml does
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          bash mpvnative/plex-mac/build-plex-mac.sh "$RUNNER_TEMP/ffmpeg5" "$RUNNER_TEMP/plexmac" > "$RUNNER_TEMP/plexmac-build.log" 2>&1 || { tail -40 "$RUNNER_TEMP/plexmac-build.log"; exit 1; }
          python3 -I pmml/scripts/fetch_runtime.py --pin scripts/ml-runtime-pin.json --platform osx-arm64 --out "$RUNNER_TEMP/ortpin" --cache "$RUNNER_TEMP/ort-dl" --flavors core --headers >/dev/null 2>&1 && [ -f "$RUNNER_TEMP/ortpin/ort/core/include/onnxruntime_c_api.h" ] && export PUSHMPC_ORT_INCLUDE="$RUNNER_TEMP/ortpin/ort/core/include" || echo "::warning::ONNX Runtime headers not fetched: the VLC content library builds without the image model"
          bash mpvnative/plex-mac/build-mac-extras.sh "$RUNNER_TEMP/plexmac" > "$RUNNER_TEMP/macextras-build.log" 2>&1 || { tail -40 "$RUNNER_TEMP/macextras-build.log"; exit 1; }
          grep -E "^vlc/|iinaplgz" "$RUNNER_TEMP/macextras-build.log"
          grep -E "^master@|^proxy|minimum macOS|libMoltenVK" "$RUNNER_TEMP/plexmac-build.log"
          tar -czf "$RUNNER_TEMP/plexmac-ci.tar.gz" -C "$RUNNER_TEMP/plexmac" .

      - name: The tap route (this repository as the tap, as the README says), built from the checkout's archives
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          # the release's three archives, made here from the checkout: the source tarball, pmml's graphs, Plex for Mac
          tgz="$RUNNER_TEMP/pushmpc-ci-src.tar.gz"
          git archive --format=tar.gz --prefix=PushMPC-ci/ HEAD > "$tgz"
          python3 -m venv "$RUNNER_TEMP/g" && "$RUNNER_TEMP/g/bin/python" -m pip install --disable-pip-version-check -q onnx numpy
          "$RUNNER_TEMP/g/bin/python" -I pmml/scripts/make_graphs.py --out "$RUNNER_TEMP/pmml-graphs" >/dev/null
          gtgz="$RUNNER_TEMP/pmml-graphs-ci.tar.gz"; tar -czf "$gtgz" -C "$RUNNER_TEMP/pmml-graphs" .
          ptgz="$RUNNER_TEMP/plexmac-ci.tar.gz"
          # a clone of this repository, with Formula/pushmpc.rb pointed at them by the release's own script
          git clone -q "$GITHUB_WORKSPACE" "$RUNNER_TEMP/tap-src"
          python3 -I scripts/update-formula.py "$RUNNER_TEMP/tap-src/Formula/pushmpc.rb" --version 0.6.0-ci \
            --src "$tgz" --src-url "file://$tgz" --pmml "$gtgz" --pmml-url "file://$gtgz" --plex "$ptgz" --plex-url "file://$ptgz"
          git -C "$RUNNER_TEMP/tap-src" -c user.name=ci -c user.email=ci@localhost commit -q -am "formula for CI"
          grep -n -E '^  (url|version|sha256) |resource "' "$RUNNER_TEMP/tap-src/Formula/pushmpc.rb"
          # the README's commands, with the clone in place of the GitHub URL
          brew tap CptPakundo/pushmpc "$RUNNER_TEMP/tap-src"
          brew install --build-from-source --verbose CptPakundo/pushmpc/pushmpc   # the full name: Homebrew 6 trusts this formula
          brew info CptPakundo/pushmpc/pushmpc | sed -n 1,3p
          if ! brew test --verbose --keep-tmp CptPakundo/pushmpc/pushmpc; then
            # brew test keeps vspipe's stderr and the plugin's log to itself (run 45942725916, macos-15-intel: exit 250
            # and nothing else): the kept test folder's PushMPC logs (HOME is that folder), then the formula's test clip
            # again through the same vspipe outside brew, with stderr, then fail
            echo "::group::brew test failed: its kept test folder"
            for d in $(ls -td /private/tmp/pushmpc-test-* 2>/dev/null | head -n 1); do
              echo "== $d"; find "$d" -maxdepth 4 | head -40
              find "$d" -path '*Logs/PushMPC*' -type f -exec sh -c 'echo "== $1"; tail -n 60 "$1" | cut -c1-400' _ {} \;
            done
            echo "::endgroup::"
            echo "::group::brew test failed: the formula's vspipe test, run directly"
            printf '%s\n' 'import vapoursynth as vs' 'core = vs.core' \
              'clip = core.std.BlankClip(format=vs.YUV420P8, width=320, height=240, length=24, fpsnum=24000, fpsden=1001)' \
              'clip = core.pushmpc.Enhance(clip, backend="portable", smoother="2")' 'clip.set_output()' > "$RUNNER_TEMP/t.vpy"
            export PUSHMPC_VS_LOG_DIR="$RUNNER_TEMP/brewlogs"; mkdir -p "$PUSHMPC_VS_LOG_DIR"
            rc=0; "$(brew --prefix vapoursynth)/bin/vspipe" --info "$RUNNER_TEMP/t.vpy" 2>&1 || rc=$?
            echo "vspipe exit $rc"
            tail -n 60 "$PUSHMPC_VS_LOG_DIR"/*.log 2>/dev/null | cut -c1-400 || true
            find "$(brew --prefix pushmpc)/" -name '*.dylib' -path '*vapoursynth*' -exec file {} \; 2>/dev/null | head -5
            for f in $(ls -t ~/Library/Logs/DiagnosticReports/*vspipe* ~/Library/Logs/DiagnosticReports/*python* 2>/dev/null | head -n 2); do echo "== $f"; head -c 6000 "$f"; echo; done
            echo "::endgroup::"
            # run 45951785336 (macos-15-intel): exit 250, no output, no crash report, the plugin's log stops at "backend:
            # portable" (before the GPU engine's line): who ends the process, and MoltenVK's own account of the device
            echo "::group::who ends vspipe (lldb: exit / _exit / abort), MoltenVK at info level"
            sudo DevToolsSecurity -enable >/dev/null 2>&1 || true
            # Homebrew's bin/vspipe is not the Mach-O itself (run 45954913100: lldb "is not a valid executable"): a link
            # to Homebrew's environment wrapper script, which sets Python's paths and execs the real program. lldb goes
            # in front of that exec, so the program runs with the wrapper's environment.
            vs="$(brew --prefix vapoursynth)/bin/vspipe"; real=$(python3 -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' "$vs")
            echo "vspipe: $vs -> $real: $(file -b "$real")"
            printf '%s\n' 'breakpoint set -n exit' 'breakpoint set -n _exit' 'breakpoint set -n abort' 'breakpoint set -n abort_with_payload' \
              run 'bt 50' 'register read rdi' > "$RUNNER_TEMP/lldb.cmds"
            printf '%s\n' 'bt 50' quit > "$RUNNER_TEMP/lldb-crash.cmds"
            if file -b "$real" | grep -q Mach-O; then
              set -- lldb --batch --source "$RUNNER_TEMP/lldb.cmds" --source-on-crash "$RUNNER_TEMP/lldb-crash.cmds" -- "$real"
            else
              # VapourSynth R79's vspipe is a Python script (#!.../libexec/bin/python; sys.exit(vapoursynth.vspipe())):
              # lldb runs its interpreter with the script (run 45957116784)
              echo "the script:"; sed -n 1,20p "$real"
              interp=$(sed -n '1s/^#![[:space:]]*//p' "$real" | awk '{print $1}')
              echo "interpreter: $interp -> $(python3 -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' "$interp"): $(file -b "$(python3 -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' "$interp")")"
              # what vspipe() itself returns (exit 250 = a return of -6 or 250, or the process ended under it)
              perl -e 'alarm shift; exec @ARGV' 300 "$interp" -X faulthandler -c 'import sys; from vapoursynth import vspipe; sys.argv = ["vspipe", "--info", sys.argv[1]]; r = vspipe(); print("vspipe() returned", r, flush=True); sys.exit(0)' "$RUNNER_TEMP/t.vpy" 2>&1 | tail -n 20 || true
              set -- lldb --batch --source "$RUNNER_TEMP/lldb.cmds" --source-on-crash "$RUNNER_TEMP/lldb-crash.cmds" -- "$interp" "$real"
            fi
            MVK_CONFIG_LOG_LEVEL=3 perl -e 'alarm shift; exec @ARGV' 300 "$@" --info "$RUNNER_TEMP/t.vpy" 2>&1 | grep -v '^\s*$' | tail -n 150 | cut -c1-300 || true
            echo "::endgroup::"
            echo "::error::brew test failed (the formula's vspipe test; details above)"; exit 1
          fi
          # strict: the tap formula stays clean (0 problems; 28 were only warned about before, apple run 46004200809)
          brew audit --formula cptpakundo/pushmpc/pushmpc || { echo "::error::brew audit found problems in the formula (see above)"; exit 1; }
          brew list --verbose CptPakundo/pushmpc/pushmpc | sed -n 1,30p
          # without the Plex for Mac archive the script leaves the resource out (a release whose macOS asset is missing)
          cp Formula/pushmpc.rb "$RUNNER_TEMP/noplex.rb"
          python3 -I scripts/update-formula.py "$RUNNER_TEMP/noplex.rb" --version 0.6.0-ci --src "$tgz" --src-url "file://$tgz" --pmml "$gtgz" --pmml-url "file://$gtgz"
          ! grep -q 'resource "plex-mac"' "$RUNNER_TEMP/noplex.rb" && ruby -c "$RUNNER_TEMP/noplex.rb"

      - name: VapourSynth autoloads the plugin; the apple backend through Homebrew's vspipe
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          export PUSHMPC_VS_LOG_DIR="$RUNNER_TEMP/brewlogs"; mkdir -p "$PUSHMPC_VS_LOG_DIR"
          vspipe="$(brew --prefix vapoursynth)/bin/vspipe"
          PUSHMPC_TEST_K=2 PUSHMPC_TEST_BACKEND=auto "$vspipe" --info vsplugin/tests/ci/apple_clip.vpy
          grep -h -E "backend|apple" "$PUSHMPC_VS_LOG_DIR"/*.log | cut -c1-400 | head

      - name: Homebrew mpv in encode mode through pushmpc-setup's mpv.conf (public clip)
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          # on a failure, the end of the plugin's own log (its "portable (GPU): frame N: ..." lines, the instance's
          # "closed after N frames"): wherever this step's runs wrote it (PUSHMPC_VS_LOG_DIR when set, else the log
          # folder of the HOME in use, which the encode below moves), so a frame-count failure shows the plugin's side
          # (run 45971462911: 593 of 600 frames)
          plugin_log_tail() {
            [ "$1" = 0 ] && return 0
            echo "--- PushMPC VapourSynth plugin log (tail)"
            for f in "${PUSHMPC_VS_LOG_DIR:-/nonexistent}"/*.log "$RUNNER_TEMP"/home/Library/Logs/PushMPC/*.log "$HOME"/Library/Logs/PushMPC/*.log; do
              [ -f "$f" ] || continue; echo "== $f"; grep -E 'portable \(GPU\): frame [0-9]+:|closed after|error|failed' "$f" | tail -n 20 | cut -c1-400 || true; tail -n 15 "$f" | cut -c1-400 || true
            done; return 0
          }
          trap 'plugin_log_tail $?' EXIT
          mkdir -p "$RUNNER_TEMP/clip"; clip="$RUNNER_TEMP/clip/bbb.mp4"
          [ -f "$clip" ] || curl -fsSL --retry 3 --max-time 120 -o "$clip" "$CLIP_URL"
          got=$(shasum -a 256 "$clip" | cut -d' ' -f1 | tr A-F a-f)   # both sides lower case (the pin is)
          case "$CLIP_SHA256" in TODO*) echo "::warning::test clip not pinned yet: sha256 $got ($(wc -c < "$clip") bytes)";;
            *) [ "$got" = "$(printf '%s' "$CLIP_SHA256" | tr A-F a-f)" ] || { echo "::error::clip SHA-256 $got != $CLIP_SHA256"; exit 1; };; esac
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          unset VSSCRIPT_PATH
          PUSHMPC_NO_PROMPT=1 pushmpc-setup install
          cat "$HOME/.config/mpv/mpv.conf"
          helper="$(brew --prefix)/etc/mpv/scripts/pushmpc-vsscript.lua"
          [ -f "$helper" ] || { echo "::error::the global VSScript helper $helper is missing"; exit 1; }
          cat "$helper"
          # LuaJIT's FFI really is there, and the helper runs before the first file opens: a probe script prints the
          # variable from mpv's own environment at file-loaded (after every script's top level ran)
          mkdir -p "$RUNNER_TEMP/probe"
          printf '%s\n' 'local ok = pcall(require, "ffi")' \
            'mp.register_event("file-loaded", function() mp.msg.info("PUSHMPC_PROBE ffi=" .. tostring(ok) .. " VSSCRIPT_PATH=" .. tostring(os.getenv("VSSCRIPT_PATH"))); mp.command("quit") end)' \
            > "$RUNNER_TEMP/probe/probe.lua"
          mpv --vo=null --ao=null --idle=no --msg-level=all=info --script="$RUNNER_TEMP/probe/probe.lua" av://lavfi:testsrc=d=1 > "$RUNNER_TEMP/probe-all.txt" 2>&1 || true
          tail -25 "$RUNNER_TEMP/probe-all.txt"
          grep PUSHMPC_PROBE "$RUNNER_TEMP/probe-all.txt" > "$RUNNER_TEMP/probe.txt" || true
          grep -q "ffi=true VSSCRIPT_PATH=/" "$RUNNER_TEMP/probe.txt" || { echo "::error::the Lua helper did not set VSSCRIPT_PATH inside mpv"; exit 1; }
          ls "$(brew --prefix pushmpc)/share/pushmpc/shaders" "$(brew --prefix pushmpc)/share/pushmpc/mpv"
          src=$(ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames,r_frame_rate,width,height -of csv=p=0 "$clip")
          echo "source: $src"
          # the active filter chain is printed (PUSHMPC_VF) and must hold the block's vapoursynth filter. There is no
          # VSSCRIPT_PATH in the environment: the global Lua helper provides it inside mpv.
          # mpv's encode mode (--o) does not run scripts (its built-in "encoding" profile; --load-scripts=yes did not
          # change that in run 45611166441), so the Lua helper cannot act here: the probe above checks it in playback
          # mode, and this encode test takes the helper's own path
          export VSSCRIPT_PATH=$(sed -n 's/^local lib = "\(.*\)"$/\1/p' "$helper")
          echo "VSSCRIPT_PATH from the helper: $VSSCRIPT_PATH"
          # x2 fixed: Auto's CPU budget can pick x1 on a slow 3-core VM (the portable fallback runs here)
          mkdir -p "$HOME/.config/pushmpc"; printf 'Smoother=2\n' >> "$HOME/.config/pushmpc/settings.ini"
          # mpv's encode mode does not read mpv.conf from its config folder (run 45957116784 without --include: no
          # [pushmpc] line, PUSHMPC_VF empty; also run 45593276787): --include is the one read of the block here, as the
          # config folder is in playback (run 45951785336's two "filter added again" were ContentDetect's two reloads)
          rc=0; MPV_HOME="$HOME/.config/mpv" mpv "$clip" --include="$HOME/.config/mpv/mpv.conf" --no-audio --o="$RUNNER_TEMP/out.mkv" --ovc=ffv1 --of=matroska --term-playing-msg='PUSHMPC_VF=${vf}' --msg-level=all=info,vapoursynth=v > "$RUNNER_TEMP/encode.txt" 2>&1 || rc=$?
          tail -40 "$RUNNER_TEMP/encode.txt"
          echo "ContentDetect on this clip:"; grep -E 'why=|measured on the frames' "$RUNNER_TEMP/encode.txt" | cut -c1-600 || echo "  (no measurement line)"
          [ "${rc:-0}" = 0 ] || { echo "::error::mpv's encode exited ${rc}"; exit 1; }
          # that the filter ran: mpv's vapoursynth filter started its requests and the plugin closed an instance after some
          # frames (PUSHMPC_VF= from --term-playing-msg is a snapshot: pushmpc.lua may add the filter after it, run
          # 45998797243's Intel job printed it empty although the filter ran)
          log=$(cat "$HOME/Library/Logs/PushMPC/"*.log 2>/dev/null || true)
          grep -q '\[vapoursynth\] using [0-9]* concurrent requests' "$RUNNER_TEMP/encode.txt" && echo "$log" | grep -qE 'instance closed after [1-9]' \
            || { echo "::error::mpv's vapoursynth filter did not run PushMPC in encode mode"; exit 1; }
          # no frame is requested while the script loads: mpv answers that with a black dummy (it reached the output once)
          ! grep -q 'Frame requested during init' "$RUNNER_TEMP/encode.txt" || { echo "::error::PushMPC requested a frame while mpv loaded the script (mpv's black dummy)"; exit 1; }
          echo "$log" | grep -E "backend|apple|portable:|ml:|src_frames|failed: a source frame" | cut -c1-400 | head -24
          out=$(ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames,width,height -of csv=p=0 "$RUNNER_TEMP/out.mkv")
          echo "output: $out"
          srcn=$(echo "$src" | awk -F, '{print $NF}'); outn=$(echo "$out" | awk -F, '{print $NF}')
          # the first output frame is the source's first picture, not black: mpv answers a frame requested while the script
          # loads with a black dummy ("Frame requested during init", the ml backend reads frame 0's colour properties)
          y0() { ffprobe -v error -f lavfi "movie=$1,signalstats" -read_intervals '%+#1' -show_entries frame_tags=lavfi.signalstats.YAVG -of csv=p=0 | head -1; }
          ys=$(y0 "$clip"); yo=$(y0 "$RUNNER_TEMP/out.mkv"); echo "first frame mean luma: source $ys, output $yo"
          [ -n "$ys" ] && [ -n "$yo" ] && awk -v a="$ys" -v b="$yo" 'BEGIN { d = a - b; if (d < 0) d = -d; exit !(d <= 8) }' || { echo "::error::the first output frame differs from the source's first (mean luma $yo vs $ys)"; exit 1; }
          # control: the same encode by mpv alone (no config, no scripts, no PushMPC filter). The x2 count is judged against
          # what mpv itself puts out, so frames mpv drops on its own are not charged to PushMPC (Intel run 46011580160: the
          # stream ended at source frame 298 of ffprobe's 300)
          MPV_HOME="$RUNNER_TEMP/mpv-none" mpv "$clip" --no-config --load-scripts=no --no-audio --o="$RUNNER_TEMP/control.mkv" --ovc=ffv1 --of=matroska > "$RUNNER_TEMP/control.txt" 2>&1 || true
          ctrln=$(ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of csv=p=0 "$RUNNER_TEMP/control.mkv" 2>/dev/null | tr -d '\r')
          echo "control: mpv alone ${ctrln:-?} frames (source $srcn by ffprobe); PushMPC $outn"
          [ -n "$ctrln" ] && [ "$ctrln" -gt 0 ] || { echo "::error::the control encode (mpv alone) gave no frame count"; tail -20 "$RUNNER_TEMP/control.txt"; exit 1; }
          # exactly x2: the end guard (eof_guard.h) and buffered-frames 8 give an unknown-length stream the known-length count
          # (N x k) on every route; the old range allowed the last frames' loss (Intel ml: 599 of 600 with buffered-frames 4)
          [ "$outn" -eq $((2 * ctrln)) ] || { echo "::error::mpv output has $outn frames for $ctrln frames from mpv alone (want exactly $((2 * ctrln)))"; exit 1; }
          echo "::notice title=Homebrew mpv encode::$srcn source frames -> $outn output frames ($out)"
          # PushFlow through pmml (the ml backend) with Homebrew's ONNX Runtime (CoreML; the VM has no GPU for it, so the
          # CPU may run it): pushmpc-setup put the runtime in ~/.local/share/pushmpc/pmml
          pm="$HOME/.local/share/pushmpc/pmml"; ls -la "$pm" "$pm/ort/core" "$pm/models" | head -20
          for f in ort/core/libonnxruntime.dylib graphs/synth-yuv.onnx models/pushflow-fast.onnx; do [ -e "$pm/$f" ] || { echo "::error::the pmml runtime lacks $f"; exit 1; }; done
          export PUSHMPC_VS_LOG_DIR="$RUNNER_TEMP/brewlogs-ml"; mkdir -p "$PUSHMPC_VS_LOG_DIR"
          PUSHMPC_TEST_K=2 PUSHMPC_TEST_BACKEND=ml perl -e 'alarm 300; exec @ARGV' "$(brew --prefix vapoursynth)/bin/vspipe" vsplugin/tests/ci/apple_clip.vpy /dev/null --progress || true
          grep -h -E "backend|ml: |pmml" "$PUSHMPC_VS_LOG_DIR"/*.log 2>/dev/null | cut -c1-300 | head -20 || true
          echo "::notice title=ml backend on macOS (Auto's EP choice)::$(grep -h -E 'backend: |ml: ' "$PUSHMPC_VS_LOG_DIR"/*.log 2>/dev/null | head -3 | tr '\n' ' ' | cut -c1-600)"
          # Auto took CoreML (Homebrew's ONNX Runtime): the ml backend must have produced frames
          grep -q "ml: output YUV" "$PUSHMPC_VS_LOG_DIR"/*.log 2>/dev/null && grep -q -E "ml: instance closed after [1-9]" "$PUSHMPC_VS_LOG_DIR"/*.log || { echo "::error::the ml backend produced no frames"; exit 1; }
          pushmpc-setup uninstall
          [ ! -e "$HOME/.config/mpv/mpv.conf" ] || { echo "::error::mpv.conf left behind"; exit 1; }
          [ ! -e "$pm" ] || { echo "::error::the pmml runtime was left behind"; exit 1; }
          [ ! -e "$HOME/Library/LaunchAgents/com.pushmpc.vsscript.plist" ] || { echo "::error::a LaunchAgent is present"; exit 1; }
          if launchctl getenv VSSCRIPT_PATH | grep -q .; then echo "::error::a global VSSCRIPT_PATH is set"; exit 1; fi

      - name: Plex for Mac through pushmpc-setup (install, the reapply agent after a simulated update, uninstall bit-exact)
        timeout-minutes: 15
        shell: bash
        run: |
          set -uo pipefail
          u=$(curl -fsSL "https://plex.tv/api/downloads/6.json" | python3 -c "
          import json, sys
          def walk(o):
              if isinstance(o, dict):
                  for k, v in o.items():
                      if k.lower() in ('macos', 'mac') and isinstance(v, dict):
                          for r in v.get('releases', []):
                              if r.get('url', '').endswith('.zip'): print(r['url']); return True
                      if walk(v): return True
              return False
          walk(json.load(sys.stdin))")
          echo "Plex for Mac: $u"
          curl -fsSL -o "$RUNNER_TEMP/plex.zip" "$u" && ditto -x -k "$RUNNER_TEMP/plex.zip" /Applications
          app=/Applications/Plex.app; fw="$app/Contents/Frameworks"
          snap() { (cd "$app" && find . -type f -print0 | sort -z | xargs -0 shasum -a 256 | shasum -a 256); }
          before=$(snap); fails=0
          export HOME="$RUNNER_TEMP/home-plex"; mkdir -p "$HOME"
          PUSHMPC_NO_PROMPT=1 pushmpc-setup install --no-pmml --no-artcnn 2>&1 | tee "$RUNNER_TEMP/setup-plex.txt" | grep -A3 "Plex for Mac" | cut -c1-400
          grep -q '^desktop: installed' "$RUNNER_TEMP/setup-plex.txt" && grep -q ', x2' "$RUNNER_TEMP/setup-plex.txt" || { echo "::error::pushmpc-setup did not put PushMPC into Plex for Mac"; fails=$((fails + 1)); }
          grep -aq pushmpc_proxy_status "$fw/libavfilter.8.dylib" || { echo "::error::no proxy in Plex.app"; fails=$((fails + 1)); }
          agent="$HOME/Library/LaunchAgents/com.pushmpc.plex-reapply.plist"
          plutil -lint "$agent" || fails=$((fails + 1))
          launchctl print "gui/$(id -u)/com.pushmpc.plex-reapply" 2>&1 | grep -E "state|program|path =" | head -4
          pushmpc-setup status 2>&1 | grep -iE "plex|desktop" | cut -c1-300
          # a Plex update: the app's own libavfilter.8.dylib comes back and Info.plist changes; the agent puts the proxy back
          cp "$HOME/Library/Application Support/PushMPC/plex-native/desktop/libavfilter.8.dylib" "$fw/libavfilter.8.dylib"
          touch "$app/Contents/Info.plist"
          for i in $(seq 1 30); do grep -aq pushmpc_proxy_status "$fw/libavfilter.8.dylib" && break; sleep 2; done
          if grep -aq pushmpc_proxy_status "$fw/libavfilter.8.dylib"; then echo "reapply agent: the proxy is back after the simulated update"
          else echo "::error::the reapply agent did not put the proxy back"; cat "$HOME/Library/Logs/PushMPC/plex-reapply.log" 2>/dev/null | tail -5; fails=$((fails + 1)); fi
          pushmpc-setup uninstall 2>&1 | grep -A2 "Plex for Mac" | cut -c1-300
          [ "$(snap)" = "$before" ] && echo "Plex.app bit for bit stock after pushmpc-setup uninstall" || { echo "::error::Plex.app differs after uninstall"; fails=$((fails + 1)); }
          [ ! -e "$agent" ] || { echo "::error::the reapply agent is left behind"; fails=$((fails + 1)); }
          [ ! -e "$HOME/.local/share/pushmpc/plex-mac" ] || { echo "::error::the unpacked Plex bundle is left behind"; fails=$((fails + 1)); }
          [ "$fails" = 0 ] || exit 1

      - name: IINA and VLC through pushmpc-setup (official apps; self-tests with frames generated; uninstall bit-exact)
        timeout-minutes: 20
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          fails=0
          # the official apps: IINA's release DMG (github.com/iina/iina), VLC.app through Homebrew's cask (VideoLAN's DMG)
          mkdir -p "$RUNNER_TEMP/iina-dmg"
          gh release download --repo iina/iina --pattern '*.dmg' --dir "$RUNNER_TEMP/iina-dmg"
          dmg=$(ls "$RUNNER_TEMP"/iina-dmg/*.dmg | head -1); echo "IINA DMG: ${dmg##*/}"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/iina-mnt" "$dmg" > /dev/null
          ditto "$RUNNER_TEMP/iina-mnt/IINA.app" /Applications/IINA.app; hdiutil detach "$RUNNER_TEMP/iina-mnt" > /dev/null
          [ -d /Applications/VLC.app ] || brew install --cask vlc > /dev/null
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /Applications/IINA.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /Applications/VLC.app/Contents/Info.plist
          snap() { (cd "$1" && find . -type f -print0 | sort -z | xargs -0 shasum -a 256 | shasum -a 256); }
          iina0=$(snap /Applications/IINA.app); vlc0=$(snap /Applications/VLC.app)
          # IINA's PluginEnabled for PushMPC as a value, or "absent" (defaults' error text carries a timestamp and pid)
          iina_enabled() { defaults read com.colliderli.iina PluginEnabled.com.pushmpc.iina 2>/dev/null || echo absent; }
          enabled0=$(iina_enabled)
          export HOME="$RUNNER_TEMP/home-players"; mkdir -p "$HOME"
          # a user's own VLC settings before install: VLC's post-processing filter and an output of their choice; both
          # must come back after uninstall, also when VLC rewrote vlcrc in between (it does when it runs below)
          mkdir -p "$HOME/Library/Preferences/org.videolan.vlc"
          printf '[core]\nvout=caopengllayer\nvideo-filter=postproc\n' > "$HOME/Library/Preferences/org.videolan.vlc/vlcrc"
          PUSHMPC_NO_PROMPT=1 pushmpc-setup install --no-pmml --no-artcnn 2>&1 | tee "$RUNNER_TEMP/setup-players.txt" | sed -n '/IINA and VLC:/,$p' | cut -c1-400
          iina=$(grep -o 'IINA: self-test: .*' "$RUNNER_TEMP/setup-players.txt" | head -1)
          vlc=$(grep -o 'self-test (macos): .*' "$RUNNER_TEMP/setup-players.txt" | head -1)
          echo "::notice title=IINA::$iina"; echo "::notice title=VLC::$vlc"
          echo "$iina" | grep -qE '[0-9]+ frames in, [0-9]+ out \(engine: ' || { echo "::error::IINA: no frames generated through the bridge"; tail -20 "$HOME/Library/Logs/PushMPC/iina-bridge.log" 2>/dev/null; fails=$((fails + 1)); }
          echo "$vlc" | grep -qE 'generated [0-9]+ frames' || { echo "::error::VLC: no frames generated"; tail -30 "$HOME/Library/Application Support/PushMPC/vlc/pushmpc-selftest.log" 2>/dev/null | grep -i pushmpc; fails=$((fails + 1)); }
          plug="$HOME/Library/Application Support/com.colliderli.iina/plugins/com.pushmpc.iina.iinaplugin"
          [ -f "$plug/Info.json" ] && [ "$(defaults read com.colliderli.iina PluginEnabled.com.pushmpc.iina)" = 1 ] || { echo "::error::the IINA plugin is not installed and on"; fails=$((fails + 1)); }
          rc="$HOME/Library/Preferences/org.videolan.vlc/vlcrc"
          grep -E '^(video-filter|vout|pushmpc-smoother)=' "$rc" || { echo "::error::vlcrc has no PushMPC settings"; fails=$((fails + 1)); }
          ls "$HOME/Library/Application Support/PushMPC/vlc"
          # VLC with VideoToolbox decoding: which path ran for CVPX pictures (zero copy into the apple engine, or the
          # one-copy path and why); reported, not required (the hosted VMs cannot run VideoToolbox interpolation)
          ffmpeg -v error -y -f lavfi -i testsrc2=size=640x360:rate=24:duration=3 -c:v h264_videotoolbox -b:v 2M "$RUNNER_TEMP/vt.mp4" 2>/dev/null \
            || ffmpeg -v error -y -f lavfi -i testsrc2=size=640x360:rate=24:duration=3 -c:v libx264 -pix_fmt yuv420p "$RUNNER_TEMP/vt.mp4"
          env VLC_PLUGIN_PATH="$HOME/Library/Application Support/PushMPC/vlc" perl -e 'alarm 60; exec @ARGV' /Applications/VLC.app/Contents/MacOS/VLC \
            -I dummy --vout=dummy --no-audio --play-and-exit --codec=videotoolbox,avcodec --video-filter=postproc:pushmpc_out --pushmpc-smoother=2 \
            --file-logging --logfile="$RUNNER_TEMP/vlc-vt.log" --log-verbose=2 "$RUNNER_TEMP/vt.mp4" > /dev/null 2>&1 || true
          vtpath=$(grep -oE 'zero copy on CVPX|CVPX zero copy (not used|stopped) \([^)]*\)|[A-Za-z0-9]{4} converted to [A-Za-z0-9]{4} in front of the engine' "$RUNNER_TEMP/vlc-vt.log" | head -2 | tr '\n' ' ')
          echo "::notice title=VLC with VideoToolbox decoding::${vtpath:-no CVPX pictures reached PushMPC}; $(grep -o 'PushMPC: close, in=[0-9]* out=[0-9]* generated=[0-9]*' "$RUNNER_TEMP/vlc-vt.log" | tail -1)"
          pushmpc-setup uninstall 2>&1 | sed -n '/IINA and VLC:/,$p' | cut -c1-300
          [ "$(snap /Applications/IINA.app)" = "$iina0" ] && echo "IINA.app bit for bit as installed" || { echo "::error::IINA.app changed"; fails=$((fails + 1)); }
          [ "$(snap /Applications/VLC.app)" = "$vlc0" ] && echo "VLC.app bit for bit as installed" || { echo "::error::VLC.app changed"; fails=$((fails + 1)); }
          [ ! -e "$plug" ] || { echo "::error::the IINA plugin is left behind"; fails=$((fails + 1)); }
          enabled1=$(iina_enabled)
          [ "$enabled1" = "$enabled0" ] && echo "IINA's settings as they were" || { echo "::error::IINA's PluginEnabled setting not restored"; echo "  before: $enabled0"; echo "  after:  $enabled1"; defaults read com.colliderli.iina 2>&1 | head -n 12 | sed 's/^/  domain now: /'; fails=$((fails + 1)); }
          [ ! -e "$HOME/Library/LaunchAgents/io.github.pushmpc.vlc-env.plist" ] && [ ! -e "$HOME/Library/Application Support/PushMPC/vlc" ] \
            && echo "VLC: the LaunchAgent and the plugin folder gone" || { echo "::error::VLC: the LaunchAgent or the plugin folder is left behind"; fails=$((fails + 1)); }
          # vlcrc (the user's, seeded above): their vout and video-filter back, no active PushMPC key left (VLC may have
          # rewritten the file as its whole configuration; a leading BOM and "[core] # ..." headers handled)
          if [ -f "$rc" ]; then
            act=$(awk '{ l = $0; if (NR == 1) sub(/^\357\273\277/, "", l) } l !~ /^[ \t]*(#|;|\[|$)/ { print l }' "$rc")
            printf '%s\n' "$act" | sed '/^$/d; s/^/  vlcrc after uninstall, active line: /'
            if printf '%s\n' "$act" | grep -qE '^pushmpc-|^vout=.*pushmpc|^video-filter=.*pushmpc_out'; then
              echo "::error::VLC: vlcrc still holds PushMPC settings after uninstall"; fails=$((fails + 1))
            fi
            printf '%s\n' "$act" | grep -qx 'vout=caopengllayer' && printf '%s\n' "$act" | grep -qx 'video-filter=postproc' \
              && echo "VLC: the user's own vout and video-filter are back" \
              || { echo "::error::VLC: the user's own vout=caopengllayer / video-filter=postproc did not come back"; fails=$((fails + 1)); }
          else
            echo "::error::VLC: the user's vlcrc is gone after uninstall"; fails=$((fails + 1))
          fi
          [ -z "$(launchctl getenv VLC_PLUGIN_PATH)" ] || { echo "::error::VLC_PLUGIN_PATH is still set"; fails=$((fails + 1)); }
          [ "$fails" = 0 ] || exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homebrew-logs-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/brewlogs
            ${{ runner.temp }}/brewlogs-ml
            ${{ runner.temp }}/home/Library/Logs/PushMPC
            ${{ runner.temp }}/home-players/Library/Logs/PushMPC
            ${{ runner.temp }}/home-players/Library/Application Support/PushMPC/vlc/pushmpc-selftest.log
