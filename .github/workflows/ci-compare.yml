# Compares the release artifacts of two release.yml runs: the file lists inside every zip and tarball and the
# release.json component lists, with the run's version (x.y.z-ci.N) and sizes/hashes masked. By hand only.
name: ci-compare

on:
  push:   # registers the workflow on its branch (nothing runs without inputs)
    branches: ['track/ci-speed']
    paths: ['.github/workflows/ci-compare.yml']
  workflow_dispatch:
    inputs:
      base_run:
        description: 'run id of the reference release.yml run'
        required: true
      new_run:
        description: 'run id of the release.yml run to compare'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  compare:
    if: ${{ inputs.new_run != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with: { run-id: '${{ inputs.base_run }}', github-token: '${{ github.token }}', path: base, pattern: 'pushmpc-*' }
      - uses: actions/download-artifact@v4
        with: { run-id: '${{ inputs.new_run }}', github-token: '${{ github.token }}', path: new, pattern: 'pushmpc-*' }
      - name: Manifests
        run: |
          set -u
          manifest() {   # manifest <dir>: one line per file in the artifacts and inside every archive
            ( cd "$1"
              find . -type f | sort | while read -r f; do
                echo "FILE $f"
                case "$f" in
                  *.zip) unzip -Z1 "$f" | sort | sed "s|^|  $f: |" ;;
                  *.tar.gz) tar -tzf "$f" | sort | sed "s|^|  $f: |" ;;
                  *release.json) python3 -c "
          import json, sys
          d = json.load(open(sys.argv[1]))
          def walk(o, p=''):
              if isinstance(o, dict):
                  for k in sorted(o):
                      if k.lower() in ('sha256', 'size', 'length', 'date', 'published', 'built'): continue
                      walk(o[k], p + '/' + k)
              elif isinstance(o, list):
                  for i, x in enumerate(o): walk(x, p + '[' + str(i) + ']')
              else: print('  json' + p + ' = ' + str(o))
          walk(d)" "$f" ;;
                esac
              done ) | sed -E 's/[0-9]+\.[0-9]+\.[0-9]+-ci\.[0-9]+/VER/g; s/ci\.[0-9]+/ci.N/g'
          }
          manifest base > base.txt; manifest new > new.txt
          wc -l base.txt new.txt
          if diff -u base.txt new.txt > diff.txt; then echo "IDENTICAL (apart from versions, sizes and hashes)"; else echo "DIFFERENCES:"; cat diff.txt; fi
          { echo '## Artifact comparison'; echo; echo "base ${{ inputs.base_run }}: $(wc -l < base.txt) lines, new ${{ inputs.new_run }}: $(wc -l < new.txt) lines"; echo; echo '```diff'; head -200 diff.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: compare, path: '*.txt', retention-days: 5 }
