# Player integrations and packaging (track T4) on hosted runners, no GPU:
#   win-writers     every config writer against fake roots (mpv-integration, mpv/MPC-BE/PotPlayer steps of pushmpc-install)
#   win-players     real portable players with the plugin (portable backend): mpv (shinchiro), mpv.net, MPC-QT, Kodi
#                   (external player), a Jellyfin MPV Shim config; install, play, byte-exact uninstall
#   potplayer       a real PotPlayer: the filter entry pushmpc-install writes must make PotPlayer load the filter;
#                   registry before / after; uninstall restores the filter list exactly (layout research variants too)
#   linux-build     pushmpc_vs.so in manylinux_2_28 (x86_64, aarch64 on ubuntu-24.04-arm), static libstdc++, GLIBC
#                   check, unit tests, vspipe through the pinned VapourSynth wheel, the release tarball
#   linux-sh        install.sh and mpv-integration.sh tests (fake HOME, stub players) under sh and dash
#   linux-arch      Arch: install.sh into a fresh HOME, mpv encode mode through the installed block (frame count x2,
#                   plugin log), byte-exact uninstall; Celluloid, Haruna, SMPlayer, MPC-QT under Xvfb with the plugin log
#   linux-fedora    Fedora's mpv: VapourSynth or not, and install.sh's answer either way
#   linux-flatpak   Ubuntu: the distro mpv lacks VapourSynth -> Flathub io.mpv.Mpv (user), override, encode mode in
#                   the sandbox, byte-exact uninstall; Flatpak extension point check
#   aur             PKGBUILD built with makepkg as a normal user in archlinux, namcap, pacman -U, autoload check
#   win-packaging   winget validate (Setup's SHA-256 from the CI release), Scoop: schema + a real install/uninstall
#   setup-graph     the x64 Setup silently on windows-2025 and on windows-11-arm (Prism): structure, registration,
#                   MPC-HC x64 with MPC Video Renderer must create the filter (its log), uninstall
# win-build makes the filter and pushmpc_vs.dll from this commit; the Setup jobs take the newest release.yml dry run's
# artifact (skipped with a notice when there is none).
name: integrations

on:
  workflow_dispatch:
    inputs:
      release_run:
        description: 'run id of a release.yml dry run (artifact pushmpc-release); empty = the newest one that still has it'
        default: ''
  push:
    branches: ['track/integrations', 'track/integrations-2']
    paths:
      - 'integrations/**'
      - 'packaging/**'
      - 'scripts/pushmpc-install.ps1'
      - 'scripts/test-*-install.ps1'
      - '.github/workflows/integrations.yml'

concurrency:
  group: integrations-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:

  CLIP_URL: https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/720/Big_Buck_Bunny_720_10s_1MB.mp4

jobs:
  # ---------------------------------------------------------------------------------------------------- Windows
  # the filter and the VapourSynth plugin from this commit (the SDK headers are in the repository; MPC-VR's base
  # classes at the commit pinned in scripts/pushfps-pin.json), for the player jobs
  win-build:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults: { run: { shell: pwsh } }
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Filter (PushMpcFilter.ax, PushMpcExit.dll) and pushmpc_vs.dll
        timeout-minutes: 20
        run: |
          $pin = Get-Content scripts/pushfps-pin.json -Raw | ConvertFrom-Json
          git init -q MpcVideoRenderer
          git -C MpcVideoRenderer remote add origin "https://github.com/$($pin.mpcvr.repository).git"
          git -C MpcVideoRenderer fetch -q --depth 1 origin $pin.mpcvr.commit
          git -C MpcVideoRenderer checkout -q FETCH_HEAD
          git -C MpcVideoRenderer submodule update -q --init --depth 1 external/BaseClasses
          cmake -S filter -B "$env:RUNNER_TEMP\fb" -G Ninja -DCMAKE_BUILD_TYPE=Release "-DPUSHMPC_MPCVR_DIR=$PWD\MpcVideoRenderer"; if ($LASTEXITCODE) { exit 1 }
          cmake --build "$env:RUNNER_TEMP\fb" --parallel; if ($LASTEXITCODE) { exit 1 }
          cmake -S vsplugin -B "$env:RUNNER_TEMP\vb" -G Ninja -DCMAKE_BUILD_TYPE=Release; if ($LASTEXITCODE) { exit 1 }
          cmake --build "$env:RUNNER_TEMP\vb" --target pushmpc_vs --parallel; if ($LASTEXITCODE) { exit 1 }
          $o = "$env:RUNNER_TEMP\bits"; New-Item -ItemType Directory $o | Out-Null
          Copy-Item filter/bin/PushMpcFilter.ax, filter/bin/PushMpcExit.dll, vsplugin/bin/pushmpc_vs.dll $o
          Get-ChildItem $o | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with: { name: t4-windows-bits, path: '${{ runner.temp }}/bits' }

  # the newest release.yml dry run that still has its artifact (Setup and the release zips), or the given run
  release-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.r.outputs.run }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          GIVEN: ${{ inputs.release_run }}
        run: |
          run=$GIVEN
          [ -n "$run" ] || run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=pushmpc-release&per_page=20" --jq '[.artifacts[] | select(.expired == false)][0].workflow_run.id // empty')
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ -n "$run" ]; then echo "release artifact from run $run"; else echo "::notice title=no release artifact::no release.yml run with the pushmpc-release artifact: the Setup jobs are skipped (dispatch release.yml with dry_run)"; fi

  win-writers:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: mpv-integration.ps1 (fake roots)
        shell: pwsh
        run: pwsh -File integrations/mpv/tests/mpv-integration.tests.ps1

      - name: pushmpc-install.ps1 MPC-BE steps (fake registry root)
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-mpcbe-install.ps1; exit $LASTEXITCODE
      - name: pushmpc-install.ps1 PotPlayer steps (fake registry root)
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-potplayer-install.ps1; exit $LASTEXITCODE

  win-players:
    needs: win-build
    runs-on: windows-2025
    timeout-minutes: 40
    defaults: { run: { shell: pwsh } }
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: t4-windows-bits, path: '${{ runner.temp }}/vsdll' }
      - uses: actions/cache@v4
        with: { path: '${{ runner.temp }}/dl', key: "win-players-dl-v1-${{ hashFiles('scripts/vapoursynth-pin.json') }}" }
      - name: Plugin, pinned VapourSynth runtime, test clip (the layout PushMPC installs)
        timeout-minutes: 10
        run: |
          $dl = "$env:RUNNER_TEMP\dl"; New-Item -ItemType Directory $dl -Force | Out-Null
          $pin = Get-Content scripts/vapoursynth-pin.json -Raw | ConvertFrom-Json
          function Fetch($url, $sha) { $f = Join-Path $dl (Split-Path $url -Leaf); if (-not (Test-Path $f)) { Invoke-WebRequest $url -OutFile $f }
            if ($sha -and (Get-FileHash $f).Hash -ne $sha.ToUpper()) { throw "SHA-256 mismatch $url" }; return $f }
          $pm = "$env:LOCALAPPDATA\PushMPC"; $rt = "$pm\vapoursynth"; $vsp = "$pm\vsplugin"
          New-Item -ItemType Directory $rt, $vsp -Force | Out-Null
          tar -xf (Fetch $pin.python.url $pin.python.sha256) -C $rt; tar -xf (Fetch $pin.vapoursynth.url $pin.vapoursynth.sha256) -C $rt
          $sp = Join-Path $rt $pin.vapoursynth.wheelTo; New-Item -ItemType Directory $sp -Force | Out-Null
          foreach ($w in Get-ChildItem (Join-Path $rt $pin.vapoursynth.wheel)) { tar -xf $w.FullName -C $sp }
          foreach ($p in Get-ChildItem $rt -Filter 'python*._pth') { Add-Content $p.FullName $pin.vapoursynth.wheelTo.Replace('/', '\') }
          Copy-Item "$env:RUNNER_TEMP\vsdll\pushmpc_vs.dll" $vsp; Copy-Item vsplugin/scripts/pushmpc.vpy, integrations/mpv/pushmpc.lua $vsp
          $vss = (Get-ChildItem $rt -Recurse -Filter VSScript.dll | Select-Object -First 1).DirectoryName
          "VSSCRIPT_DIR=$vss" >> $env:GITHUB_ENV
          $clip = Fetch $env:CLIP_URL ''
          "CLIP=$clip" >> $env:GITHUB_ENV
          Write-Host "runtime $vss; clip $clip ($((Get-Item $clip).Length) bytes)"
      - name: Players (portable builds from their official releases)
        timeout-minutes: 10
        run: |
          $dl = "$env:RUNNER_TEMP\dl"; $pin = Get-Content scripts/vapoursynth-pin.json -Raw | ConvertFrom-Json
          $log = "$env:RUNNER_TEMP\players.txt"
          # shinchiro mpv (pinned) where PushMPC looks for it
          $f = Join-Path $dl (Split-Path $pin.mpvForCi.url -Leaf); if (-not (Test-Path $f)) { Invoke-WebRequest $pin.mpvForCi.url -OutFile $f }
          if ((Get-FileHash $f).Hash -ne $pin.mpvForCi.sha256) { throw 'mpv sha' }
          7z x $f "-o$env:LOCALAPPDATA\Programs\mpv" -y | Out-Null
          "mpv: $($pin.mpvForCi.tag)" | Tee-Object -Append $log
          # mpv.net (latest release, portable zip)
          $rel = gh api repos/mpvnet-player/mpv.net/releases/latest | ConvertFrom-Json
          $a = $rel.assets | Where-Object { $_.name -match 'portable.*x64.*\.zip$|x64.*portable.*\.zip$' } | Select-Object -First 1
          if (-not $a) { $a = $rel.assets | Where-Object { $_.name -match '\.zip$' -and $_.name -notmatch 'arm' } | Select-Object -First 1 }
          $f = Join-Path $dl $a.name; if (-not (Test-Path $f)) { Invoke-WebRequest $a.browser_download_url -OutFile $f }
          $d = "$env:LOCALAPPDATA\Programs\mpv.net"; 7z x $f "-o$d" -y | Out-Null
          $exe = Get-ChildItem $d -Recurse -Filter mpvnet.exe | Select-Object -First 1
          if ($exe.DirectoryName -ne $d) { Get-ChildItem $exe.DirectoryName | Move-Item -Destination $d -Force }
          "mpv.net: $($rel.tag_name) $($a.name) sha256 $((Get-FileHash $f).Hash)" | Tee-Object -Append $log
          Get-ChildItem $d -Filter '*mpv*.dll' | ForEach-Object { "  mpv.net libmpv: $($_.Name) $($_.Length)" | Tee-Object -Append $log }
          # MPC-QT (latest release, portable zip)
          $rel = gh api repos/mpc-qt/mpc-qt/releases/latest | ConvertFrom-Json
          $a = $rel.assets | Where-Object { $_.name -match 'win-x64.*\.zip$' } | Select-Object -First 1
          $f = Join-Path $dl $a.name; if (-not (Test-Path $f)) { Invoke-WebRequest $a.browser_download_url -OutFile $f }
          $d = "$env:LOCALAPPDATA\Programs\mpc-qt"; 7z x $f "-o$d" -y | Out-Null
          $exe = Get-ChildItem $d -Recurse -Filter mpc-qt.exe | Select-Object -First 1
          if ($exe.DirectoryName -ne $d) { Get-ChildItem $exe.DirectoryName | Move-Item -Destination $d -Force }
          Remove-Item "$d\portable.txt" -ErrorAction SilentlyContinue
          "MPC-QT: $($rel.tag_name) $($a.name) sha256 $((Get-FileHash $f).Hash)" | Tee-Object -Append $log
          # Kodi (latest stable Windows x64 installer from the official mirror, silent NSIS install)
          try {
            $all = (Invoke-WebRequest 'https://mirrors.kodi.tv/releases/windows/win64/' -UseBasicParsing).Links.href | Where-Object { $_ -match '^kodi-[\d.]+-\w+-x64\.exe$' }
            $stable = @($all | Where-Object { $_ -notmatch '(?i)rc\d|beta|alpha' }); if ($stable.Count) { $all = $stable }
            $idx = $all | Sort-Object { [version](($_ -replace '^kodi-([\d.]+)-.*', '$1')) } | Select-Object -Last 1
            $f = Join-Path $dl $idx; if (-not (Test-Path $f)) { Invoke-WebRequest "https://mirrors.kodi.tv/releases/windows/win64/$idx" -OutFile $f }
            $p = Start-Process $f -ArgumentList '/S' -PassThru; if (-not $p.WaitForExit(300000)) { $p.Kill(); throw 'Kodi installer timed out' }
            "Kodi: $idx sha256 $((Get-FileHash $f).Hash), installer exit $($p.ExitCode)" | Tee-Object -Append $log
          } catch { "Kodi: not installed ($_)" | Tee-Object -Append $log }
      - name: Seed user settings (to prove the exact restore)
        run: |
          $seed = @{
            "$env:APPDATA\mpv\mpv.conf" = "# mine`r`nvolume=70`r`n"
            "$env:APPDATA\mpv.net\mpv.conf" = "keep-open=no`r`n"
            "$env:APPDATA\mpc-qt\settings.json" = "{`n    `"playerOpenMode`": 0,`n    `"tweaksMpvOptionsFileChkBox`": false,`n    `"tweaksMpvOptionsFilePath`": `"`"`n}`n"
            "$env:APPDATA\jellyfin-mpv-shim\conf.json" = "{`n    `"mpv_ext`": false,`n    `"mpv_ext_path`": null`n}"
          }
          foreach ($k in $seed.Keys) { New-Item -ItemType Directory (Split-Path $k) -Force | Out-Null; [IO.File]::WriteAllText($k, $seed[$k]) }
          $files = @($seed.Keys) + @("$env:APPDATA\Kodi\userdata\playercorefactory.xml", "$env:APPDATA\jellyfin-mpv-shim\mpv.conf", "$env:LOCALAPPDATA\PushMPC\mpc-qt-mpv.conf")
          $snap = foreach ($f in $files) { if (Test-Path $f) { "$f=$((Get-FileHash $f).Hash)" } else { "$f=absent" } }
          $snap += "PATH=" + [Environment]::GetEnvironmentVariable('Path', 'User')
          $snap | Set-Content "$env:RUNNER_TEMP\before.txt"
          $files -join "`n" | Set-Content "$env:RUNNER_TEMP\files.txt"
      - name: VapourSynth self-test against the real mpv (with and without the runtime)
        run: |
          . ./integrations/mpv/mpv-integration.ps1
          $E = Get-PmEnv ''
          $mpv = "$env:LOCALAPPDATA\Programs\mpv\mpv.exe"
          $bad = Test-PmVapourSynth $E $mpv ''
          $script:PmVsTests.Clear()
          $good = Test-PmVapourSynth $E $mpv $env:VSSCRIPT_DIR
          "without the runtime: $($bad.Result) ($($bad.Message)); with it: $($good.Result) ($($good.Message))" | Tee-Object -Append "$env:RUNNER_TEMP\players.txt"
          Write-Host "::notice title=Windows VapourSynth self-test::without the runtime $($bad.Result) ($($bad.Message)); with it $($good.Result)"
          if ($good.Result -ne 0 -or $bad.Result -ne 1) { Write-Host '::error::self-test: expected 1 without the runtime and 0 with it'; exit 1 }
      - name: Install (mpv-integration.ps1, real profile of the runner)
        run: |
          . ./integrations/mpv/mpv-integration.ps1
          $rows = Invoke-PmMpvIntegration -Action Install -RuntimeOnPath
          $rows | Format-Table -AutoSize -Wrap | Out-String -Width 300 | Tee-Object "$env:RUNNER_TEMP\install.txt"
          $want = 'mpv (shinchiro build)', 'mpv.net', 'MPC-QT', 'Jellyfin MPV Shim'
          $fails = 0
          foreach ($w in $want) { $r = $rows | Where-Object Player -eq $w; if (-not $r -or $r.Result -ne 'installed') { Write-Host "::error::$w not installed: $($r.Result) $($r.Note)"; $fails++ } }
          if (Test-Path "$env:ProgramFiles\Kodi\kodi.exe") { if (($rows | Where-Object Player -eq 'Kodi').Result -ne 'installed') { Write-Host '::error::Kodi not installed'; $fails++ } }
          Get-Content "$env:APPDATA\mpv\mpv.conf"; Get-Content "$env:APPDATA\mpc-qt\settings.json"; Get-Content "$env:APPDATA\jellyfin-mpv-shim\conf.json"
          if (Test-Path "$env:APPDATA\Kodi\userdata\playercorefactory.xml") { Get-Content "$env:APPDATA\Kodi\userdata\playercorefactory.xml" }
          exit $fails
      - name: Play through the plugin in each player
        timeout-minutes: 8
        run: |
          $env:PATH = "$env:VSSCRIPT_DIR;$env:PATH"
          $res = [ordered]@{}
          # the plugin keeps its log open: read with shared access
          function Read-Logs([string]$dir) { (Get-ChildItem $dir -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object {
            try { $fs = [IO.File]::Open($_.FullName, 'Open', 'Read', 'ReadWrite, Delete'); try { (New-Object IO.StreamReader($fs)).ReadToEnd() } finally { $fs.Dispose() } } catch { "(log locked: $($_.Exception.Message))" } }) -join "`n" }
          function Test-Player([string]$name, [scriptblock]$start, [int]$wait = 30) {
            $logDir = "$env:RUNNER_TEMP\vslog-$($name -replace '\W', '')"; New-Item -ItemType Directory $logDir -Force | Out-Null
            $env:PUSHMPC_VS_LOG_DIR = $logDir
            $p = & $start
            # the plugin's log is locked while the player runs: wait, stop the player, then read it
            if ($p) { [void]$p.WaitForExit($wait * 1000) }
            if ($p -and -not $p.HasExited) { $p | Stop-Process -Force -ErrorAction SilentlyContinue }
            Get-Process mpv, mpvnet, mpc-qt, kodi -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep 3
            Get-Process mpv, mpvnet, mpc-qt, kodi -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            $t = Read-Logs $logDir
            $ok = $t -match 'backend: '
            $line = ($t -split "`n" | Where-Object { $_ -match 'backend: |portable: output|portable: x1|create failed' } | Select-Object -First 3) -join ' | '
            $script:res[$name] = "$(if ($ok) { 'PLUGIN RAN' } else { 'no plugin log' }): $line"
            Write-Host "== $name : $($script:res[$name])"
          }
          Test-Player 'mpv' { Start-Process "$env:LOCALAPPDATA\Programs\mpv\mpv.com" -ArgumentList '--vo=null', '--ao=null', '--length=4', "`"$env:CLIP`"" -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\mpv-out.txt" -RedirectStandardError "$env:RUNNER_TEMP\mpv-err.txt" }
          Get-Content "$env:RUNNER_TEMP\mpv-out.txt", "$env:RUNNER_TEMP\mpv-err.txt" -ErrorAction SilentlyContinue | Select-Object -Last 15
          Test-Player 'mpv.net' { Start-Process "$env:LOCALAPPDATA\Programs\mpv.net\mpvnet.exe" -ArgumentList '--ao=null', "`"$env:CLIP`"" -PassThru }
          Test-Player 'MPC-QT' { Start-Process "$env:LOCALAPPDATA\Programs\mpc-qt\mpc-qt.exe" -ArgumentList "`"$env:CLIP`"" -PassThru }
          if (Test-Path "$env:ProgramFiles\Kodi\kodi.exe") { Test-Player 'Kodi (external mpv)' { Start-Process "$env:ProgramFiles\Kodi\kodi.exe" -ArgumentList "`"$env:CLIP`"" -PassThru } 60 }
          $res.GetEnumerator() | ForEach-Object { "$($_.Key): $($_.Value)" } | Tee-Object "$env:RUNNER_TEMP\play.txt"
          @('## win-players', '', '```') + (Get-Content "$env:RUNNER_TEMP\players.txt") + @('') + (Get-Content "$env:RUNNER_TEMP\play.txt") + @('```') -join "`n" >> $env:GITHUB_STEP_SUMMARY
          if ($res['mpv'] -notmatch '^PLUGIN RAN') { Write-Host '::error::mpv did not run the plugin'; exit 1 }
      - name: Uninstall restores every file exactly
        if: always()
        run: |
          . ./integrations/mpv/mpv-integration.ps1
          Invoke-PmMpvIntegration -Action Uninstall | Format-Table -AutoSize -Wrap | Out-String -Width 300
          $files = Get-Content "$env:RUNNER_TEMP\files.txt"
          $snap = foreach ($f in $files) { if (Test-Path $f) { "$f=$((Get-FileHash $f).Hash)" } else { "$f=absent" } }
          $snap += "PATH=" + [Environment]::GetEnvironmentVariable('Path', 'User')
          $diff = Compare-Object (Get-Content "$env:RUNNER_TEMP\before.txt") $snap
          if ($diff) { $diff | Format-Table -AutoSize | Out-String -Width 300; Write-Host '::error::uninstall did not restore exactly'; exit 1 }
          Write-Host "all $($files.Count) files and the user PATH are as before"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: win-players-logs, path: "${{ runner.temp }}/vslog-*\n${{ runner.temp }}/*.txt" }

  # Stremio 5.0.28+ and Plex for Windows: their own libmpv-2.dll, loaded by libmpv-host.ps1 (their programs are not
  # run): which features it has, PushMPC's pushmpc.lua in it (VapourSynth route for Stremio, d3d11vpp VSR route for
  # Plex; soft failure on WARP), and the config writers' install/uninstall on the runner's profile
  stremio-plex:
    needs: win-build
    runs-on: windows-2025
    timeout-minutes: 35
    defaults: { run: { shell: pwsh } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: t4-windows-bits, path: '${{ runner.temp }}/bits' }
      - name: Stremio (official installer, per user, silent) and Plex for Windows (official installer, silent)
        timeout-minutes: 15
        run: |
          $out = "$env:RUNNER_TEMP\sp.txt"
          $v = (Invoke-RestMethod 'https://api.github.com/repos/Stremio/stremio-shell-ng/releases/latest' -Headers @{ Authorization = "Bearer ${{ github.token }}" }).tag_name.TrimStart('v')
          $file = "StremioSetup-v${v}_x64.exe"; $got = $null
          foreach ($u in @("https://dl.strem.io/stremio-shell-ng/v$v/$file", "https://dl.strem.io/shell-win/v$v/$file", "https://github.com/Stremio/stremio-shell-ng/releases/download/v$v/$file")) {
            try { Invoke-WebRequest $u -OutFile "$env:RUNNER_TEMP\$file"; $got = $u; break } catch { "  not at $u" | Tee-Object -Append $out }
          }
          if ($got) {
            $sig = Get-AuthenticodeSignature "$env:RUNNER_TEMP\$file"
            $p = Start-Process "$env:RUNNER_TEMP\$file" -ArgumentList '/VERYSILENT', '/CURRENTUSER', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru; $p.WaitForExit(300000) | Out-Null
            "Stremio $v from $got (signature $($sig.Status)), installer exit $($p.ExitCode)" | Tee-Object -Append $out
          } else { "Stremio ${v}: installer not found" | Tee-Object -Append $out }
          try {
            $j = Invoke-RestMethod 'https://plex.tv/api/downloads/6.json'
            $rel = @($j.computer.Windows.releases | Where-Object { $_.url -match 'x86_64|64' })[0]; if (-not $rel) { $rel = @($j.computer.Windows.releases)[0] }
            Invoke-WebRequest $rel.url -OutFile "$env:RUNNER_TEMP\plex.exe"
            $p = Start-Process "$env:RUNNER_TEMP\plex.exe" -ArgumentList '/S' -PassThru; $p.WaitForExit(300000) | Out-Null
            "Plex $($j.computer.Windows.version) from $($rel.url), installer exit $($p.ExitCode)" | Tee-Object -Append $out
          } catch { "Plex: not installed ($_)" | Tee-Object -Append $out }
          foreach ($d in @("$env:LOCALAPPDATA\Programs\Stremio", "$env:ProgramFiles\Plex\Plex", "$env:ProgramFiles\Plex\Plex HTPC")) {
            $dll = "$d\libmpv-2.dll"
            if (-not (Test-Path $dll)) { "${d}: no libmpv-2.dll" | Tee-Object -Append $out; continue }
            $t = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($dll))
            $f = foreach ($k in 'vapoursynth', 'mp.options', 'd3d11vpp', 'scaling-mode', 'mpv 0.') { "${k}=$($t.Contains($k))" }
            $mv = [regex]::Match($t, 'mpv v?0\.\d+\.\d+[^\x00]{0,30}').Value
            "${d}\libmpv-2.dll: $($f -join ' '); $mv; $((Get-Item $dll).Length) bytes" | Tee-Object -Append $out
            Write-Host "::notice title=libmpv in $(Split-Path $d -Leaf)::$($f -join ' '); $mv"
          }
      - name: Plugin and the pinned VapourSynth runtime (the layout PushMPC installs)
        timeout-minutes: 10
        run: |
          $pin = Get-Content scripts/vapoursynth-pin.json -Raw | ConvertFrom-Json
          $pm = "$env:LOCALAPPDATA\PushMPC"; $rt = "$pm\vapoursynth"; $vsp = "$pm\vsplugin"
          New-Item -ItemType Directory $rt, $vsp -Force | Out-Null
          foreach ($e in $pin.python, $pin.vapoursynth) { $f = "$env:RUNNER_TEMP\$(Split-Path $e.url -Leaf)"; Invoke-WebRequest $e.url -OutFile $f; if ((Get-FileHash $f).Hash -ne $e.sha256.ToUpper()) { throw "sha $($e.url)" }; tar -xf $f -C $rt }
          $sp = Join-Path $rt $pin.vapoursynth.wheelTo; New-Item -ItemType Directory $sp -Force | Out-Null
          foreach ($w in Get-ChildItem (Join-Path $rt $pin.vapoursynth.wheel)) { tar -xf $w.FullName -C $sp }
          foreach ($p in Get-ChildItem $rt -Filter 'python*._pth') { Add-Content $p.FullName $pin.vapoursynth.wheelTo.Replace('/', '\') }
          Copy-Item "$env:RUNNER_TEMP\bits\pushmpc_vs.dll", vsplugin/scripts/pushmpc.vpy, integrations/mpv/pushmpc.lua $vsp
          "VSSCRIPT_DIR=$((Get-ChildItem $rt -Recurse -Filter VSScript.dll | Select-Object -First 1).DirectoryName)" >> $env:GITHUB_ENV
      - name: pushmpc.lua inside Stremio's and Plex's libmpv
        timeout-minutes: 8
        run: |
          $out = "$env:RUNNER_TEMP\sp.txt"
          $vsp = "$env:LOCALAPPDATA\PushMPC\vsplugin"; $lua = "$vsp\pushmpc.lua".Replace('\', '/'); $vpy = "$vsp\pushmpc.vpy".Replace('\', '/')
          $env:PATH = "$env:VSSCRIPT_DIR;$env:PATH"
          $sdll = "$env:LOCALAPPDATA\Programs\Stremio\libmpv-2.dll"
          if (Test-Path $sdll) {
            $env:PUSHMPC_VS_LOG_DIR = "$env:RUNNER_TEMP\vslog-stremio"; New-Item -ItemType Directory $env:PUSHMPC_VS_LOG_DIR -Force | Out-Null
            # our config with the script, in Stremio's libmpv (with the runtime on PATH, as -RuntimeOnPath sets it)
            $r = pwsh -NoProfile -File integrations/mpv/tests/libmpv-host.ps1 -Dll $sdll -Options "scripts=$lua|script-opts=pushmpc-vpy=$vpy|hwdec=auto-copy" 2>&1 | Out-String
            $rc = $LASTEXITCODE; Write-Host $r
            $plug = (Get-ChildItem $env:PUSHMPC_VS_LOG_DIR -Filter *.log -ErrorAction SilentlyContinue | Get-Content) -match 'backend: |portable: output'
            "Stremio libmpv + pushmpc.lua: host exit $rc; plugin log: $(($plug | Select-Object -First 2) -join ' | ')" | Tee-Object -Append $out
            Write-Host "::notice title=Stremio libmpv + pushmpc.lua::host exit $rc; plugin: $(($plug | Select-Object -First 2) -join ' | ')"
          }
          foreach ($d in @("$env:ProgramFiles\Plex\Plex", "$env:ProgramFiles\Plex\Plex HTPC")) {
            if (-not (Test-Path "$d\libmpv-2.dll")) { continue }
            # baseline: the same host without our script (does this libmpv play the generated source here at all?)
            $b = pwsh -NoProfile -File integrations/mpv/tests/libmpv-host.ps1 -Dll "$d\libmpv-2.dll" -Options "msg-level=all=info" 2>&1 | Out-String
            $brc = $LASTEXITCODE; Write-Host $b
            $r = pwsh -NoProfile -File integrations/mpv/tests/libmpv-host.ps1 -Dll "$d\libmpv-2.dll" -Options "scripts=$lua|script-opts=pushmpc-mode=vsr,pushmpc-scaling=nvidia" 2>&1 | Out-String
            $rc = $LASTEXITCODE; Write-Host $r
            if ($brc -ne 0) {
              Write-Host "::notice title=$(Split-Path $d -Leaf) libmpv baseline::the libmpv cannot play the generated source here either (baseline exit $brc): the vsr soft-failure check is not conclusive on this runner"
              continue
            }
            "$(Split-Path $d -Leaf) libmpv + pushmpc.lua (vsr): host exit $rc (0 = played to the end: a failing d3d11vpp on WARP must not stop playback)" | Tee-Object -Append $out
            Write-Host "::notice title=$(Split-Path $d -Leaf) libmpv + pushmpc.lua (vsr)::host exit $rc; $((($r -split "`n") -match 'd3d11vpp|super resolution|pushmpc') -join ' | ')"
            if ($rc -ne 0) { Write-Host "::error::playback in Plex's libmpv did not reach the end with pushmpc.lua in vsr mode"; exit 1 }
          }
      - name: Config writers on the runner's profile (install, uninstall restores exactly)
        run: |
          $out = "$env:RUNNER_TEMP\sp.txt"
          $files = @("$env:APPDATA\Stremio\mpv-config.txt", "$env:LOCALAPPDATA\PushMPC\stremio\mpv.conf", "$env:LOCALAPPDATA\Plex\mpv.conf", "$env:LOCALAPPDATA\Plex HTPC\mpv.conf")
          $snap = { foreach ($f in $files) { if (Test-Path $f) { "$f=$((Get-FileHash $f).Hash)" } else { "$f=absent" } } }
          $before = & $snap
          . ./integrations/mpv/mpv-integration.ps1
          $rows = Invoke-PmMpvIntegration -Action Install
          $rows | Format-Table -AutoSize -Wrap | Out-String -Width 300 | Tee-Object -Append $out
          foreach ($f in $files) { if (Test-Path $f) { "--- $f"; Get-Content $f } }
          Invoke-PmMpvIntegration -Action Uninstall | Format-Table -AutoSize -Wrap | Out-String -Width 300
          $diff = Compare-Object $before (& $snap)
          @('## stremio-plex', '', '```') + (Get-Content $out) + @('```') -join "`n" >> $env:GITHUB_STEP_SUMMARY
          if ($diff) { $diff | Format-Table | Out-String -Width 300; Write-Host '::error::uninstall did not restore exactly'; exit 1 }
          Write-Host "::notice title=Stremio/Plex writers::$((($rows | ForEach-Object { "$($_.Player): $($_.Result)" }) -join '; '))"
  potplayer:
    needs: win-build
    runs-on: windows-2025
    timeout-minutes: 30
    defaults: { run: { shell: pwsh } }
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: t4-windows-bits, path: '${{ runner.temp }}/bits' }
      - uses: actions/cache@v4
        with: { path: '${{ runner.temp }}/dl', key: potplayer-dl-v1 }
      - name: PotPlayer (official installer, silent), the filter (CI release), test clip
        timeout-minutes: 10
        run: |
          $dl = "$env:RUNNER_TEMP\dl"; New-Item -ItemType Directory $dl -Force | Out-Null
          $f = "$dl\PotPlayerSetup64.exe"; Invoke-WebRequest 'https://t1.daumcdn.net/potplayer/PotPlayer/Version/Latest/PotPlayerSetup64.exe' -OutFile $f
          $sig = Get-AuthenticodeSignature $f
          if ($sig.Status -ne 'Valid') { throw "PotPlayer installer signature: $($sig.Status)" }
          "PotPlayer installer sha256 $((Get-FileHash $f).Hash), signed by $($sig.SignerCertificate.Subject)" | Tee-Object -Append "$env:RUNNER_TEMP\pot.txt"
          $p = Start-Process $f -ArgumentList '/S' -PassThru; if (-not $p.WaitForExit(300000)) { $p.Kill(); throw 'installer timed out' }
          $exe = "$env:ProgramFiles\DAUM\PotPlayer\PotPlayerMini64.exe"; if (-not (Test-Path $exe)) { throw 'PotPlayerMini64.exe not found' }
          "POT_EXE=$exe" >> $env:GITHUB_ENV
          # LAV Filters (official installer, silent): pushmpc-install makes LAV Video PotPlayer's decoder when it is there
          $lr = gh api repos/Nevcairiel/LAVFilters/releases/latest | ConvertFrom-Json
          $la = $lr.assets | Where-Object { $_.name -match 'Installer\.exe$' } | Select-Object -First 1
          $lf = "$dl\$($la.name)"; if (-not (Test-Path $lf)) { Invoke-WebRequest $la.browser_download_url -OutFile $lf }
          $p = Start-Process $lf -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru; $p.WaitForExit(300000) | Out-Null
          "LAV Filters $($lr.tag_name): installer exit $($p.ExitCode), LAV Video at $((Get-ItemProperty 'Registry::HKEY_CLASSES_ROOT\CLSID\{EE30215D-164F-4A92-A4EB-9D4C13390F9F}\InprocServer32' -ErrorAction SilentlyContinue).'(default)')" | Tee-Object -Append "$env:RUNNER_TEMP\pot.txt"
          # the filter where PushMPC installs it, registered per user like Setup does
          $fd = "$env:LOCALAPPDATA\PushMPC\filter"; New-Item -ItemType Directory $fd -Force | Out-Null
          Copy-Item "$env:RUNNER_TEMP\bits\PushMpcFilter.ax", "$env:RUNNER_TEMP\bits\PushMpcExit.dll" $fd
          $fz = Get-Item "$fd\PushMpcFilter.ax"
          $r = Start-Process "$env:SystemRoot\System32\regsvr32.exe" -ArgumentList '/s', "`"$fd\PushMpcFilter.ax`"" -Wait -PassThru
          "filter $($fz.Name) registered: exit $($r.ExitCode)" | Tee-Object -Append "$env:RUNNER_TEMP\pot.txt"
          $c = "$dl\clip.mp4"; if (-not (Test-Path $c)) { Invoke-WebRequest $env:CLIP_URL -OutFile $c }; "CLIP=$c" >> $env:GITHUB_ENV
      - name: First run (PotPlayer writes its settings), then the filter list before PushMPC
        run: |
          $p = Start-Process $env:POT_EXE -PassThru; Start-Sleep 15
          if (-not $p.HasExited) { [void]$p.CloseMainWindow(); if (-not $p.WaitForExit(15000)) { $p.Kill() } }
          reg export 'HKCU\Software\DAUM\PotPlayerMini64' "$env:RUNNER_TEMP\pot-before.reg" /y | Out-Null
          if (Test-Path 'HKCU:\Software\DAUM\PotPlayerMini64\Override') { reg export 'HKCU\Software\DAUM\PotPlayerMini64\Override' "$env:RUNNER_TEMP\override-before.reg" /y | Out-Null } else { 'absent' | Set-Content "$env:RUNNER_TEMP\override-before.reg" }
          (Get-ChildItem 'HKCU:\Software\DAUM\PotPlayerMini64' | ForEach-Object PSChildName) -join ', ' | Tee-Object -Append "$env:RUNNER_TEMP\pot.txt"
      - name: Layout variants (research) and the product's entry, each played once
        timeout-minutes: 12
        run: |
          $ov = 'HKCU:\Software\DAUM\PotPlayerMini64\Override'
          $logs = "$env:LOCALAPPDATA\PushMPC\logs"
          function Reset-Override { Remove-Item $ov -Recurse -Force -ErrorAction SilentlyContinue; if ((Get-Content "$env:RUNNER_TEMP\override-before.reg" -Raw).Trim() -ne 'absent') { reg import "$env:RUNNER_TEMP\override-before.reg" 2>&1 | Out-Null } }
          function Play([string]$tag) {
            Remove-Item "$logs\filter-*.log" -ErrorAction SilentlyContinue
            $p = Start-Process $env:POT_EXE -ArgumentList "`"$env:CLIP`"" -PassThru; Start-Sleep 20
            $mods = try { (Get-Process -Id $p.Id).Modules | Where-Object { $_.ModuleName -like 'PushMpc*' -or $_.ModuleName -like 'LAV*' } | ForEach-Object ModuleName } catch { @("modules: $_") }
            $flog = Get-ChildItem $logs -Filter 'filter-*.log' -ErrorAction SilentlyContinue
            $first = if ($flog) { (Get-Content $flog[0].FullName -TotalCount 6) -join ' / ' } else { '' }
            if (-not $p.HasExited) { [void]$p.CloseMainWindow(); if (-not $p.WaitForExit(15000)) { $p.Kill() } }
            $ok = [bool]($mods -match 'PushMpcFilter') -or [bool]$flog
            $line = "$tag : $(if ($ok) { 'LOADED' } else { 'not loaded' }) (modules: $($mods -join ','); filter logs: $(@($flog).Count))"
            Write-Host "::notice title=PotPlayer $($tag.Substring(0, [Math]::Min(40, $tag.Length)))::$line"
            Add-Content "$env:RUNNER_TEMP\pot.txt" $line; Write-Host $line
            if ($flog) { $fl = Get-Content $flog[0].FullName | Select-String -Pattern 'created|connect|input|output|pass|renderer|upstream|downstream|D3D11' | Select-Object -First 12 | ForEach-Object { "    $($_.Line)" }; Add-Content "$env:RUNNER_TEMP\pot.txt" $fl; $fl | Write-Host }
            return [bool]$ok
          }
          # A: the product (pushmpc-install.ps1 potplayer-apply)
          Reset-Override
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/pushmpc-install.ps1 potplayer-apply 2>&1 | Tee-Object -Append "$env:RUNNER_TEMP\pot.txt"
          reg export 'HKCU\Software\DAUM\PotPlayerMini64\Override' "$env:RUNNER_TEMP\override-product.reg" /y | Out-Null
          [bool]$okA = (Play 'A product entry (PushMPC + LAV Video, Prefer)' | Select-Object -Last 1)
          reg export 'HKCU\Software\DAUM\PotPlayerMini64\Override' "$env:RUNNER_TEMP\override-after-potplayer-closed.reg" /y | Out-Null
          "OK_A=$okA" >> $env:GITHUB_ENV
          # research variants (only to learn the layout; the product uses A)
          $entry = (Get-ChildItem $ov | Where-Object { (Get-ItemProperty $_.PSPath).CLSID -eq '{798D4EC3-E59C-4A4E-A2EE-C804AEAE04CC}' } | Select-Object -First 1)
          if ($entry) {
            $n = $entry.PSChildName
            New-Item "HKCU:\Software\DAUM\PotPlayerMini64\Override_Settings" -Force | Out-Null
            Copy-Item $ov "HKCU:\Software\DAUM\PotPlayerMini64\Override_Settings_tmp" -Recurse -Force -ErrorAction SilentlyContinue
            reg copy 'HKCU\Software\DAUM\PotPlayerMini64\Override' 'HKCU\Software\DAUM\PotPlayerMini64\Override_Settings' /s /f | Out-Null
            Remove-Item "HKCU:\Software\DAUM\PotPlayerMini64\Override_Settings_tmp" -Recurse -Force -ErrorAction SilentlyContinue
            Play 'B entry in Override and Override_Settings' | Out-Null
            Remove-Item 'HKCU:\Software\DAUM\PotPlayerMini64\Override_Settings' -Recurse -Force -ErrorAction SilentlyContinue
            Set-ItemProperty "$ov\$n" -Name FilterType -Value 2; Play 'C FilterType 2' | Out-Null
            Set-ItemProperty "$ov\$n" -Name FilterType -Value 1; Play 'D FilterType 1 (expected: blocked)' | Out-Null
            Set-ItemProperty "$ov\$n" -Name FilterType -Value 0
          }
          # what PotPlayer itself writes for filters: names in its binaries
          $dir = Split-Path $env:POT_EXE
          $names = foreach ($bin in @(Get-ChildItem $dir -Filter 'PotPlayer*.dll') + @(Get-Item $env:POT_EXE)) {
            $t = [Text.Encoding]::Unicode.GetString([IO.File]::ReadAllBytes($bin.FullName))
            [regex]::Matches($t, '[A-Za-z0-9_\\]{4,40}') | ForEach-Object Value | Where-Object { $_ -match '^(Override|FilterType|MeritHi|VideoRen|VideoDec|DXVA|CopyBack|UseD3D11|HWDec|H264Dec|HEVCDec)' } }
          ($names | Sort-Object -Unique) -join ', ' | Tee-Object -Append "$env:RUNNER_TEMP\pot.txt"
      - name: Uninstall restores the filter list exactly
        if: always()
        run: |
          Get-Process PotPlayerMini64 -ErrorAction SilentlyContinue | Stop-Process -Force
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/pushmpc-install.ps1 potplayer-remove 2>&1
          if (Test-Path 'HKCU:\Software\DAUM\PotPlayerMini64\Override') { reg export 'HKCU\Software\DAUM\PotPlayerMini64\Override' "$env:RUNNER_TEMP\override-after.reg" /y | Out-Null } else { 'absent' | Set-Content "$env:RUNNER_TEMP\override-after.reg" }
          $same = (Get-Content "$env:RUNNER_TEMP\override-before.reg" -Raw) -eq (Get-Content "$env:RUNNER_TEMP\override-after.reg" -Raw)
          "filter list restored exactly: $same" | Tee-Object -Append "$env:RUNNER_TEMP\pot.txt"
          @('## potplayer', '', '```') + (Get-Content "$env:RUNNER_TEMP\pot.txt") + @('```') -join "`n" >> $env:GITHUB_STEP_SUMMARY
          Copy-Item "$env:LOCALAPPDATA\PushMPC\logs" "$env:RUNNER_TEMP\pushmpc-logs" -Recurse -ErrorAction SilentlyContinue
          if (-not $same) { Write-Host '::error::the Override key differs after uninstall'; exit 1 }
          if ($env:OK_A -ne 'True') { Write-Host '::error::PotPlayer did not load the filter from the product entry'; exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: potplayer-layout, path: "${{ runner.temp }}/*.reg\n${{ runner.temp }}/pot.txt\n${{ runner.temp }}/pushmpc-logs" }

  # ---------------------------------------------------------------------------------------------------- Linux
  linux-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04, image: 'quay.io/pypa/manylinux_2_28_x86_64', wheel: linux }
          - { arch: aarch64, runner: ubuntu-24.04-arm, image: 'quay.io/pypa/manylinux_2_28_aarch64', wheel: linuxArm64 }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Pinned VapourSynth wheel (SDK headers, libvapoursynth, vspipe)
        run: |
          set -eu
          PY=/opt/python/cp312-cp312/bin/python
          url=$($PY -c "import json; print(json.load(open('scripts/vapoursynth-pin.json'))['portableCi']['${{ matrix.wheel }}']['url'])")
          sha=$($PY -c "import json; print(json.load(open('scripts/vapoursynth-pin.json'))['portableCi']['${{ matrix.wheel }}']['sha256'])")
          whl=/tmp/$(basename "$url")
          curl -fsSL --retry 3 -o "$whl" "$url"
          echo "$(echo "$sha" | tr A-F a-f)  $whl" | sha256sum -c -
          $PY -m pip install --no-deps --no-cache-dir "$whl"
          pkg=$($PY -c "import os, vapoursynth; print(os.path.dirname(vapoursynth.__file__))")
          mkdir -p vsplugin/third_party/vapoursynth
          cp "$pkg"/include/VapourSynth4.h "$pkg"/include/VSHelper4.h vsplugin/third_party/vapoursynth/
          echo "VSPKG=$pkg" >> "$GITHUB_ENV"
      - name: Build (static libstdc++ / libgcc, so it loads on glibc >= 2.28 hosts and in the Flatpak runtime)
        run: |
          set -eu
          cmake -S vsplugin -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_SHARED_LINKER_FLAGS='-static-libstdc++ -static-libgcc' -DCMAKE_EXE_LINKER_FLAGS='-static-libstdc++ -static-libgcc'
          cmake --build build --target pushmpc_vs portable_test --parallel
          ./build/portable_test | tail -3
          so=vsplugin/bin/pushmpc_vs.so
          echo "--- dynamic dependencies"; objdump -p "$so" | grep NEEDED
          max=$(objdump -T "$so" | grep -o 'GLIBC_[0-9.]*' | sort -t. -k2,2n -k3,3n -u | tail -1)
          echo "highest GLIBC symbol version: $max"
          objdump -p "$so" | grep NEEDED | grep -q 'libstdc++' && { echo "::error::libstdc++ is linked dynamically"; exit 1; }
          case $max in GLIBC_2.2[0-8]|GLIBC_2.1*|GLIBC_2.[0-9]) ;; *) echo "::error::needs $max (> 2.28)"; exit 1 ;; esac
      - name: The plugin through VapourSynth's Python API (portable backend, x4; every frame rendered)
        run: |
          set -eu
          export PUSHMPC_VS_PLUGIN=$PWD/vsplugin/bin/pushmpc_vs.so PUSHMPC_TEST_K=4
          /opt/python/cp312-cp312/bin/python - <<'PY'
          import runpy, vapoursynth as vs
          runpy.run_path("vsplugin/tests/ci/portable_clip.vpy")
          c = vs.get_output(0); c = c.clip if hasattr(c, "clip") else c
          assert c.num_frames == 192 and c.fps.numerator == 96000 and c.fps.denominator == 1001, (c.num_frames, c.fps)
          for i in range(c.num_frames):
              assert "_DurationNum" in c.get_frame(i).props
          print("python API:", c.num_frames, "frames at", c.fps, "rendered, version", vs.core.version_number())
          PY
      - name: Release tarball
        run: |
          set -eu
          git config --global --add safe.directory "$PWD"
          sh packaging/linux/make-tarball.sh vsplugin/bin/pushmpc_vs.so dist ${{ matrix.arch }} 0.6.0
          tar -tzf dist/pushmpc-linux-${{ matrix.arch }}-0.6.0.tar.gz
      - uses: actions/upload-artifact@v4
        with: { name: 'pushmpc-linux-${{ matrix.arch }}', path: dist/ }

  linux-sh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq dash >/dev/null
      - name: install.sh (fake HOME, stub players) under sh and dash
        run: |
          sh integrations/linux/tests/install.tests.sh
          sed 's|sh "$pkg/install.sh"|dash "$pkg/install.sh"|' integrations/linux/tests/install.tests.sh > integrations/linux/tests/_dash.sh
          grep -q 'dash "$pkg/install.sh"' integrations/linux/tests/_dash.sh
          dash integrations/linux/tests/_dash.sh
      - name: mpv-integration.sh (fake HOME) under sh and dash
        run: |
          sh integrations/mpv/tests/mpv-integration.tests.sh
          sed 's|sh "$tool"|dash "$tool"|g' integrations/mpv/tests/mpv-integration.tests.sh > integrations/mpv/tests/_dash.sh && dash integrations/mpv/tests/_dash.sh

  linux-arch:
    needs: linux-build
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with: { path: /var/cache/pacman/pkg, key: arch-pkg-v1 }
      - uses: actions/download-artifact@v4
        with: { name: pushmpc-linux-x86_64, path: dist }
      - name: Packages (mpv requires vapoursynth on Arch), test clip
        timeout-minutes: 15
        run: |
          pacman -Syu --noconfirm --needed mpv vapoursynth ffmpeg diffutils xorg-server-xvfb mesa dbus celluloid haruna smplayer >/dev/null
          pacman -Si mpc-qt >/dev/null 2>&1 && pacman -S --noconfirm --needed mpc-qt >/dev/null || echo "mpc-qt: not in the Arch repositories (AUR only)"
          pacman -Q mpv vapoursynth celluloid haruna smplayer mpc-qt 2>&1 | tee /tmp/versions.txt
          curl -fsSL --retry 3 -o /tmp/clip.mp4 "$CLIP_URL"
      - name: install.sh into a fresh HOME, mpv encode mode through the installed block
        run: |
          set -eu
          export HOME=/tmp/home-arch; mkdir -p $HOME/.config/mpv; printf 'volume=70\n' > $HOME/.config/mpv/mpv.conf
          # dconf's cache (written when gsettings runs without a session bus) is not a setting: left out
          snap() { (cd $HOME && find . -type f ! -path './.cache/dconf/*' | LC_ALL=C sort | xargs -r sha256sum); }
          snap > /tmp/before.txt
          tar -xzf dist/pushmpc-linux-x86_64-0.6.0.tar.gz -C /tmp
          sh /tmp/pushmpc-linux-x86_64-0.6.0/install.sh --flatpak no | tee /tmp/install.txt
          head -n 8 $HOME/.config/mpv/mpv.conf || true
          echo "::notice title=arch VSScript::$(grep -i vapoursynth /tmp/install.txt | tr '\n' ' ') libs: $(find /usr/lib -maxdepth 4 \( -name 'libvsscript.so*' -o -name 'libvapoursynth-script.so*' \) 2>/dev/null | tr '\n' ' ') toml: $(head -c 600 $HOME/.config/vapoursynth/vapoursynth.toml 2>/dev/null | tr '\n' ' ')"
          mkdir -p $HOME/.config/pushmpc; printf 'Smoother=2\n' > $HOME/.config/pushmpc/settings.ini
          export PUSHMPC_VS_LOG_DIR=/tmp/vslog-arch
          echo "--- VSScript's Python link"
          cat $HOME/.config/vapoursynth/vapoursynth.toml 2>&1 || true
          python -c "import vapoursynth._utils as u; print('get_vsscript:', u.get_vsscript())" 2>&1 || true
          ldconfig -p | grep -i 'vapoursynth\|vsscript' || true
          pacman -Ql vapoursynth | grep -E '\.so|bin/' | head || true
          mpv -v /tmp/clip.mp4 --vo=null --ao=null --length=3 2>&1 | grep -iE 'config file|vapoursynth|pushmpc|\[vf\]|user filter|error' | head -30
          ls /tmp/vslog-arch/ 2>/dev/null || true; grep -h 'backend: \|portable: output\|portable: x' /tmp/vslog-arch/*.log 2>/dev/null | head -5
          echo "--- encode mode"
          mpv -v /tmp/clip.mp4 --length=4 --no-audio --o=/tmp/out.mkv --of=matroska --ovc=ffv1 2>&1 | grep -iE 'config file|vapoursynth|pushmpc|\[vf\]|user filter|error' | head -30
          cat /tmp/vslog-arch/*.log | head -20
          echo "::notice title=arch mpv + plugin::$(grep -h 'backend: \|portable: output\|instance closed' /tmp/vslog-arch/*.log 2>/dev/null | head -3 | tr '\n' ' ') $(mpv -v /tmp/clip.mp4 --vo=null --ao=null --frames=1 2>&1 | grep -i 'vapoursynth\]' | tail -1)"
          grep -q 'portable: output YUV.*(x2)' /tmp/vslog-arch/*.log
          n=$(grep -ho 'instance closed after [0-9]*' /tmp/vslog-arch/*.log | head -1 | grep -o '[0-9]*$')
          echo "frames out of the plugin in 3 s of a 30 fps clip: ${n:-?}"; [ "${n:-0}" -ge 150 ] || { echo "::error::expected about 180 frames out (x2), got ${n:-none}"; exit 1; }
          echo "ARCH_FRAMES=90 -> $n" >> "$GITHUB_ENV"
          rm $HOME/.config/pushmpc/settings.ini; rmdir $HOME/.config/pushmpc
          sh $HOME/.local/share/pushmpc/install.sh uninstall
          snap > /tmp/after.txt
          d=$(diff /tmp/before.txt /tmp/after.txt | tr '\n' ' '); [ -z "$d" ] || { echo "::error title=arch HOME not restored::$d"; exit 1; }
          echo "HOME restored byte for byte"
      - name: Frontends under Xvfb (Celluloid, Haruna, SMPlayer, MPC-QT) with the installed settings
        timeout-minutes: 8
        run: |
          set -u
          export HOME=/tmp/home-fe; mkdir -p $HOME/.config/smplayer
          printf '[advanced]\nmplayer_additional_options=\n' > $HOME/.config/smplayer/smplayer.ini
          export GSETTINGS_BACKEND=keyfile XDG_RUNTIME_DIR=/tmp/xdg-run; mkdir -p $XDG_RUNTIME_DIR; chmod 700 $XDG_RUNTIME_DIR
          useradd -m pmtest 2>/dev/null || true
          tar -xzf dist/pushmpc-linux-x86_64-0.6.0.tar.gz -C /tmp
          sh /tmp/pushmpc-linux-x86_64-0.6.0/install.sh --flatpak no | tee /tmp/install-fe.txt
          gsettings list-keys io.github.celluloid-player.Celluloid | grep mpv-config || echo "Celluloid schema keys not found"
          gsettings get io.github.celluloid-player.Celluloid mpv-config-enable; gsettings get io.github.celluloid-player.Celluloid mpv-config-file
          cat $HOME/.config/haruna/custom-commands.conf 2>/dev/null | head -8
          grep mplayer_additional_options $HOME/.config/smplayer/smplayer.ini
          mkdir -p $HOME/.config/pushmpc; printf 'Smoother=2\n' > $HOME/.config/pushmpc/settings.ini
          export QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 QTWEBENGINE_DISABLE_SANDBOX=1
          res=/tmp/frontends.txt; : > $res
          for p in celluloid haruna smplayer mpc-qt; do
            command -v $p >/dev/null || { echo "$p: not installed" >> $res; continue; }
            export PUSHMPC_VS_LOG_DIR=/tmp/vslog-$p; mkdir -p $PUSHMPC_VS_LOG_DIR
            timeout 40 dbus-run-session -- xvfb-run -a -s '-screen 0 1280x720x24' $p /tmp/clip.mp4 > /tmp/$p.out 2>&1 &
            pid=$!
            for i in $(seq 1 35); do sleep 1; grep -qs 'backend: ' $PUSHMPC_VS_LOG_DIR/*.log && break; done
            kill $pid 2>/dev/null || true; pkill -f "$p /tmp/clip.mp4" 2>/dev/null || true; pkill mpv 2>/dev/null || true; sleep 1
            if grep -qs 'backend: ' $PUSHMPC_VS_LOG_DIR/*.log; then echo "$p: PLUGIN RAN ($(grep -h -m1 'portable: output' $PUSHMPC_VS_LOG_DIR/*.log))" >> $res
            else echo "$p: no plugin log; last output: $(tail -n 3 /tmp/$p.out | tr '\n' ' ')" >> $res; fi
          done
          cat $res
          echo "::notice title=Linux frontends under Xvfb::$(tr '\n' ' ' < $res)"
          rm -r $HOME/.config/pushmpc
          sh $HOME/.local/share/pushmpc/install.sh uninstall
          { echo '## linux-arch'; echo; echo '```'; cat /tmp/versions.txt; echo "mpv encode: ${ARCH_FRAMES:-}"; cat $res; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: linux-arch-logs, path: "/tmp/vslog-*\n/tmp/*.txt\n/tmp/*.out" }

  linux-fedora:
    needs: linux-build
    runs-on: ubuntu-24.04
    container: fedora:latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with: { path: /var/cache/libdnf5, key: fedora-dnf-v1 }
      - uses: actions/download-artifact@v4
        with: { name: pushmpc-linux-x86_64, path: dist }
      - name: Fedora's mpv
        timeout-minutes: 12
        run: |
          echo keepcache=True >> /etc/dnf/dnf.conf
          dnf -y -q install mpv ffmpeg-free tar gzip findutils >/dev/null || dnf -y -q install mpv tar gzip findutils
          rpm -q mpv libmpv 2>&1 | tee /tmp/versions.txt
          if mpv --no-config --vf=help 2>/dev/null | grep -q vapoursynth; then echo "FEDORA_VS=1" >> "$GITHUB_ENV"; echo "Fedora mpv: VapourSynth yes" | tee -a /tmp/versions.txt
          else echo "FEDORA_VS=0" >> "$GITHUB_ENV"; echo "Fedora mpv: VapourSynth NO" | tee -a /tmp/versions.txt; fi
          curl -fsSL --retry 3 -o /tmp/clip.mp4 "$CLIP_URL"
      - name: install.sh (the answer for this mpv), then with the VapourSynth Python module, mpv through the plugin
        run: |
          set -eu
          export HOME=/tmp/home-fedora; mkdir -p $HOME
          tar -xzf dist/pushmpc-linux-x86_64-0.6.0.tar.gz -C /tmp
          sh /tmp/pushmpc-linux-x86_64-0.6.0/install.sh --flatpak no | tee /tmp/install.txt
          echo "::notice title=fedora install (mpv only)::$(grep -i 'VapourSynth\|python3-vapoursynth\|mpv.conf' /tmp/install.txt | tr '\n' ' ')"
          if [ "$FEDORA_VS" = 1 ]; then
            sh $HOME/.local/share/pushmpc/install.sh uninstall
            dnf -y -q install python3-vapoursynth >/dev/null 2>&1 || dnf -y -q install vapoursynth-python3 >/dev/null 2>&1 || true
            rpm -qa | grep -i vapoursynth | tee -a /tmp/versions.txt
            sh /tmp/pushmpc-linux-x86_64-0.6.0/install.sh --flatpak no | tee /tmp/install.txt
            mkdir -p $HOME/.config/pushmpc; printf 'Smoother=2\n' > $HOME/.config/pushmpc/settings.ini
            export PUSHMPC_VS_LOG_DIR=/tmp/vslog-fedora
            mpv -v /tmp/clip.mp4 --vo=null --ao=null --length=3 > /tmp/mpv-fedora.txt 2>&1 || true
            grep -iE 'config file|vapoursynth|pushmpc|\[vf\]|user filter|error|fail' /tmp/mpv-fedora.txt | head -30; tail -n 15 /tmp/mpv-fedora.txt
            find /usr/lib /usr/lib64 -maxdepth 4 \( -name 'libvsscript.so*' -o -name 'libvapoursynth-script.so*' \) 2>/dev/null | tee /tmp/vslibs.txt || true
            echo "::notice title=fedora libs::$(tr '\n' ' ' < /tmp/vslibs.txt)"
            echo "::notice title=fedora mpv::$(grep -i 'vapoursynth\]\|VapourSynth:' /tmp/mpv-fedora.txt /tmp/install.txt | tail -3 | tr '\n' ' ') toml: $(head -c 400 $HOME/.config/vapoursynth/vapoursynth.toml 2>/dev/null | tr '\n' ' ') mpv libs: $(ldd $(command -v mpv) | grep -i vapoursynth | tr '\n' ' ')"
            grep -h 'backend: \|portable: output\|portable: x' /tmp/vslog-fedora/*.log | tee -a /tmp/versions.txt
            grep -q 'portable: output YUV' /tmp/vslog-fedora/*.log
          else
            grep -q 'has no VapourSynth' /tmp/install.txt
            grep -q 'no player can use it yet' /tmp/install.txt
          fi
          sh $HOME/.local/share/pushmpc/install.sh uninstall
          { echo '## linux-fedora'; echo; echo '```'; cat /tmp/versions.txt; tail -n 4 /tmp/install.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  linux-flatpak:
    needs: linux-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: pushmpc-linux-x86_64, path: dist }
      - uses: actions/cache@v4
        with: { path: ~/.local/share/flatpak, key: flatpak-io.mpv.Mpv-v1 }
      - name: Ubuntu's mpv (no VapourSynth expected), flatpak, test clip
        timeout-minutes: 8
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mpv flatpak ffmpeg >/dev/null
          dpkg -s mpv | grep -E '^(Version|Depends)' | tee /tmp/versions.txt
          mpv --no-config --vf=help | grep -q vapoursynth && echo "Ubuntu mpv: VapourSynth yes" | tee -a /tmp/versions.txt || echo "Ubuntu mpv: VapourSynth NO" | tee -a /tmp/versions.txt
          curl -fsSL --retry 3 -o /tmp/clip.mp4 "$CLIP_URL"
      - name: An mpv without VapourSynth reading the PushMPC block (as legacy Emby Theater shares %APPDATA%\mpv) still plays
        timeout-minutes: 5
        run: |
          set -eu
          export HOME=/tmp/home-novs; mkdir -p $HOME/vs; unset XDG_CONFIG_HOME XDG_DATA_HOME
          cp integrations/mpv/pushmpc.lua vsplugin/scripts/pushmpc.vpy $HOME/vs/
          sh integrations/mpv/mpv-integration.sh install --script $HOME/vs/pushmpc.vpy
          cat $HOME/.config/mpv/mpv.conf
          rc=0; mpv /tmp/clip.mp4 --vo=null --ao=null --length=2 > /tmp/novs.txt 2>&1 || rc=$?
          tail -n 8 /tmp/novs.txt
          echo "::notice title=mpv without VapourSynth + PushMPC block::exit $rc; $(grep -i 'pushmpc' /tmp/novs.txt | head -2 | tr '\n' ' ')"
          [ "$rc" = 0 ] || { echo "::error::mpv without VapourSynth stopped playing with the PushMPC block"; exit 1; }
          grep -q "PushMPC's filter could not start" /tmp/novs.txt || { echo "::error::pushmpc.lua did not report the soft failure"; exit 1; }
          # the old vf= line on the same mpv, for the record: it refuses to play
          rc2=0; mpv /tmp/clip.mp4 --vo=null --ao=null --length=2 --no-config "--vf-append=@pushmpc:vapoursynth=file=[$HOME/vs/pushmpc.vpy]" > /tmp/novs-vf.txt 2>&1 || rc2=$?
          echo "::notice title=same mpv with a vf= line::exit $rc2 (non-zero = playback refused)"
          sh integrations/mpv/mpv-integration.sh uninstall
      - name: install.sh --flatpak yes (Flathub mpv for the user), encode mode inside the sandbox
        timeout-minutes: 15
        run: |
          set -eu
          snap() { (cd $HOME && find .config .var .local/share/flatpak/overrides -type f 2>/dev/null | LC_ALL=C sort | xargs -r sha256sum); }
          had=0; flatpak info --user io.mpv.Mpv >/dev/null 2>&1 && had=1
          snap > /tmp/before.txt
          tar -xzf dist/pushmpc-linux-x86_64-0.6.0.tar.gz -C /tmp
          sh /tmp/pushmpc-linux-x86_64-0.6.0/install.sh --flatpak yes | tee /tmp/install.txt
          flatpak info --user io.mpv.Mpv | grep -E 'Version|Runtime' | tee -a /tmp/versions.txt
          echo "--- extension points of io.mpv.Mpv:"; flatpak info --user --show-metadata io.mpv.Mpv | grep -A3 '^\[Extension' | tee -a /tmp/versions.txt || echo "none" | tee -a /tmp/versions.txt
          flatpak override --user --show io.mpv.Mpv
          cat ~/.var/app/io.mpv.Mpv/config/mpv/mpv.conf | head -6
          mkdir -p ~/.var/app/io.mpv.Mpv/config/pushmpc; printf 'Smoother=2\n' > ~/.var/app/io.mpv.Mpv/config/pushmpc/settings.ini
          mkdir -p /tmp/fpout
          echo "--- playback (vo=null) in the sandbox"
          flatpak run --filesystem=/tmp --env=PUSHMPC_VS_LOG_DIR=/tmp/vslog-flatpak io.mpv.Mpv -v /tmp/clip.mp4 --vo=null --ao=null --length=3 2>&1 | grep -iE 'config file|vapoursynth|pushmpc|\[vf\]|user filter|error|VSScript' | head -30 || true
          echo "--- encode mode in the sandbox"
          flatpak run --filesystem=/tmp --env=PUSHMPC_VS_LOG_DIR=/tmp/vslog-flatpak io.mpv.Mpv -v /tmp/clip.mp4 --length=4 --no-audio --o=/tmp/fpout/out.mkv --of=matroska --ovc=ffv1 2>&1 | grep -iE 'config file|vapoursynth|pushmpc|\[vf\]|user filter|error' | head -30 || true
          cat /tmp/vslog-flatpak/*.log 2>/dev/null | head -20 || true
          n=$(grep -ho 'instance closed after [0-9]*' /tmp/vslog-flatpak/*.log 2>/dev/null | head -1 | grep -o '[0-9]*$')
          echo "Flatpak mpv (vo=null, 3 s of 30 fps): ${n:-?} frames out of the plugin" | tee -a /tmp/versions.txt
          rm -r ~/.var/app/io.mpv.Mpv/config/pushmpc
          sh ~/.local/share/pushmpc/install.sh uninstall --keep-flatpak-mpv
          snap > /tmp/after.txt
          # the Flathub mpv was kept for the cache, so its own app folder (created on first run) is not compared
          grep -v '\.var/app/io.mpv.Mpv/\(cache\|data\|\.local\|\.ld\.so\)' /tmp/after.txt > /tmp/after2.txt || true
          grep -v '\.var/app/io.mpv.Mpv/\(cache\|data\|\.local\|\.ld\.so\)' /tmp/before.txt > /tmp/before2.txt || true
          diff /tmp/before2.txt /tmp/after2.txt && echo "config and override restored byte for byte" | tee -a /tmp/versions.txt
          { echo '## linux-flatpak'; echo; echo '```'; cat /tmp/versions.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -q 'portable: output YUV' /tmp/vslog-flatpak/*.log || { echo "::error::the plugin did not run inside the Flatpak mpv"; exit 1; }
          grep -q 'portable: output YUV.*(x2)' /tmp/vslog-flatpak/*.log || { echo "::error::no x2 output"; exit 1; }
          [ "${n:-0}" -ge 150 ] || { echo "::error::expected about 180 frames out (x2), got ${n:-none}"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: linux-flatpak-logs, path: "/tmp/vslog-flatpak\n/tmp/*.txt" }

  aur:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { path: src }
      - uses: actions/cache@v4
        with: { path: /var/cache/pacman/pkg, key: aur-pkg-v1 }
      - name: Build tools, a normal user for makepkg
        timeout-minutes: 10
        run: |
          pacman -Syu --noconfirm --needed base-devel cmake mpv vapoursynth namcap git >/dev/null
          useradd -m builder
      - name: makepkg (source tarball made from this commit, as the GitHub tag archive would be), namcap, install
        run: |
          set -eu
          ver=$(sed -n 's/^pkgver=//p' src/packaging/aur/PKGBUILD)
          b=/home/builder/pkg; mkdir -p $b
          cp src/packaging/aur/PKGBUILD src/packaging/aur/pushmpc.install $b/
          tar -czf "$b/pushmpc-$ver.tar.gz" --exclude=.git --transform "s,^src,PushMPC-$ver," src
          chown -R builder $b
          su builder -c "cd $b && makepkg --printsrcinfo > .SRCINFO && makepkg -f --noconfirm" 2>&1 | tail -25
          cat $b/.SRCINFO
          namcap $b/PKGBUILD || true
          namcap $b/pushmpc-$ver-*.pkg.tar.zst || true
          pacman -U --noconfirm $b/pushmpc-$ver-*.pkg.tar.zst
          pacman -Ql pushmpc
          python - <<'PY' 2>&1 | tee /tmp/aur.txt
          import vapoursynth as vs
          c = vs.core
          print("VapourSynth", c.version_number(), "autoloaded:", hasattr(c, "pushmpc"))
          if not hasattr(c, "pushmpc"):
              c.std.LoadPlugin("/usr/lib/pushmpc/pushmpc_vs.so")
          print("loaded:", hasattr(c, "pushmpc"), [f.name for f in c.pushmpc.functions()])
          PY
          grep -q 'loaded: True' /tmp/aur.txt
          export HOME=/tmp/home-aur; mkdir -p $HOME; unset XDG_CONFIG_HOME XDG_DATA_HOME
          pushmpc-setup install; grep -q '^scripts-append=/usr/lib/pushmpc/pushmpc.lua' $HOME/.config/mpv/mpv.conf; grep -q '^script-opts-append=pushmpc-vpy=/usr/lib/pushmpc/pushmpc.vpy' $HOME/.config/mpv/mpv.conf
          # mpv through the packaged setup (encode mode, x2)
          pacman -S --noconfirm --needed ffmpeg >/dev/null
          curl -fsSL --retry 3 -o /tmp/clip.mp4 "$CLIP_URL"
          mkdir -p $HOME/.config/pushmpc; printf 'Smoother=2\n' > $HOME/.config/pushmpc/settings.ini
          PUSHMPC_VS_LOG_DIR=/tmp/vslog-aur mpv /tmp/clip.mp4 --length=2 --vo=null --ao=null 2>&1 | tail -5
          grep -h 'portable: output' /tmp/vslog-aur/*.log | tee -a /tmp/aur.txt
          grep -q 'portable: output' /tmp/vslog-aur/*.log
          pushmpc-setup uninstall; test ! -e $HOME/.config/mpv/mpv.conf
          { echo '## aur'; echo; echo '```'; cat /tmp/aur.txt; pacman -Qi pushmpc | head -12; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------------- packaging, ARM64
  win-packaging:
    needs: release-artifact
    if: needs.release-artifact.outputs.run != ''
    runs-on: windows-2025
    timeout-minutes: 30
    defaults: { run: { shell: pwsh } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: pushmpc-release, path: '${{ runner.temp }}/release', run-id: '${{ needs.release-artifact.outputs.run }}', github-token: '${{ github.token }}' }
      - name: winget validate (Setup's SHA-256 from the CI release)
        timeout-minutes: 10
        run: |
          $m = "$env:RUNNER_TEMP\winget"; Copy-Item packaging/winget/PushMPC.PushMPC/0.6.0 $m -Recurse
          $sha = (Get-FileHash "$env:RUNNER_TEMP\release\PushMPC-Setup.exe").Hash
          (Get-Content "$m\PushMPC.PushMPC.installer.yaml" -Raw) -replace '0{64}', $sha | Set-Content "$m\PushMPC.PushMPC.installer.yaml" -NoNewline
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -Force -Scope CurrentUser | Out-Null
            Install-Module Microsoft.WinGet.Client -Force -Scope CurrentUser -Repository PSGallery
            Repair-WinGetPackageManager -AllUsers -Latest
          }
          winget --version
          winget validate --manifest $m --disable-interactivity; $rc = $LASTEXITCODE
          "winget validate exit $rc (Setup sha256 $sha)" | Tee-Object "$env:RUNNER_TEMP\pack.txt"
          if ($rc -ne 0 -and $rc -ne -1978335192) { exit 1 }   # 0x8A150068: validation succeeded with warnings
      - name: Scoop - schema, then a real install / uninstall from a local copy of the release
        timeout-minutes: 20
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod -Uri https://get.scoop.sh -OutFile "$env:RUNNER_TEMP\install-scoop.ps1"
          & "$env:RUNNER_TEMP\install-scoop.ps1" -RunAsAdmin | Out-Null
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          $schema = "$env:USERPROFILE\scoop\apps\scoop\current\schema.json"
          $ok = Test-Json -Json (Get-Content packaging/scoop/pushmpc.json -Raw) -SchemaFile $schema
          "scoop schema: $ok" | Tee-Object -Append "$env:RUNNER_TEMP\pack.txt"
          if (-not $ok) { exit 1 }
          # serve the CI release on localhost and point the manifest at it
          $zip = Get-ChildItem "$env:RUNNER_TEMP\release" -Filter 'PushMPC-?.*.zip' | Where-Object Name -notmatch '-(filter|core|vsplugin)-' | Select-Object -First 1
          $job = Start-Job { param($d) python -m http.server 8765 --directory $d } -ArgumentList $zip.DirectoryName
          Start-Sleep 3
          $j = Get-Content packaging/scoop/pushmpc.json -Raw | ConvertFrom-Json
          $j.architecture.'64bit'.url = "http://127.0.0.1:8765/$($zip.Name)"; $j.architecture.'64bit'.hash = (Get-FileHash $zip.FullName).Hash.ToLower()
          $j | ConvertTo-Json -Depth 10 | Set-Content "$env:RUNNER_TEMP\pushmpc.json"
          scoop install "$env:RUNNER_TEMP\pushmpc.json" 2>&1 | Tee-Object -Append "$env:RUNNER_TEMP\pack.txt"
          $installed = Test-Path "$env:LOCALAPPDATA\PushMPC\filter\PushMpcFilter.ax"
          $reg = Test-Path 'HKCU:\Software\Classes\CLSID\{798D4EC3-E59C-4A4E-A2EE-C804AEAE04CC}\InprocServer32'
          "scoop install: filter installed $installed, registered $reg" | Tee-Object -Append "$env:RUNNER_TEMP\pack.txt"
          scoop uninstall pushmpc 2>&1 | Tee-Object -Append "$env:RUNNER_TEMP\pack.txt"
          $gone = -not (Test-Path 'HKCU:\Software\Classes\CLSID\{798D4EC3-E59C-4A4E-A2EE-C804AEAE04CC}')
          "scoop uninstall: registration removed $gone" | Tee-Object -Append "$env:RUNNER_TEMP\pack.txt"
          Stop-Job $job -ErrorAction SilentlyContinue
          @('## win-packaging', '', '```') + (Get-Content "$env:RUNNER_TEMP\pack.txt" | Select-Object -Last 40) + @('```') -join "`n" >> $env:GITHUB_STEP_SUMMARY
          if (-not ($installed -and $reg -and $gone)) { exit 1 }

  # the x64 Setup silently on x64 (baseline) and on ARM64 under Prism, then MPC-HC x64 with MPC Video Renderer on WARP
  setup-graph:
    needs: release-artifact
    if: needs.release-artifact.outputs.run != ''
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults: { run: { shell: pwsh } }
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: pushmpc-release, path: '${{ runner.temp }}/release', run-id: '${{ needs.release-artifact.outputs.run }}', github-token: '${{ github.token }}' }
      - name: MPC-HC x64 (official installer, silent) for the graph check
        timeout-minutes: 10
        run: |
          "OS arch: $env:PROCESSOR_ARCHITECTURE; $((Get-CimInstance Win32_OperatingSystem).Caption) $((Get-CimInstance Win32_OperatingSystem).Version)" | Tee-Object "$env:RUNNER_TEMP\arm.txt"
          $rel = gh api repos/clsid2/mpc-hc/releases/latest | ConvertFrom-Json
          $a = $rel.assets | Where-Object { $_.name -match '\.x64\.exe$' } | Select-Object -First 1
          $f = "$env:RUNNER_TEMP\$($a.name)"; Invoke-WebRequest $a.browser_download_url -OutFile $f
          $p = Start-Process $f -ArgumentList '/VERYSILENT', '/NORESTART', '/SUPPRESSMSGBOXES' -PassThru; $p.WaitForExit(300000) | Out-Null
          "MPC-HC $($rel.tag_name) ($($a.name)), installer exit $($p.ExitCode)" | Tee-Object -Append "$env:RUNNER_TEMP\arm.txt"
          $exe = "$env:ProgramFiles\MPC-HC\mpc-hc64.exe"; if (-not (Test-Path $exe)) { throw 'mpc-hc64.exe missing' }
          # MPC Video Renderer (PushMPC needs it downstream; MPC-HC's installer does not register one)
          $vr = gh api repos/Aleksoid1978/VideoRenderer/releases/latest | ConvertFrom-Json
          $va = $vr.assets | Where-Object { $_.name -match '\.zip$' } | Select-Object -First 1
          $vz = "$env:RUNNER_TEMP\$($va.name)"; Invoke-WebRequest $va.browser_download_url -OutFile $vz
          $vd = "$env:ProgramFiles\MpcVideoRenderer"; New-Item -ItemType Directory $vd -Force | Out-Null; Expand-Archive $vz $vd -Force
          $vax = Get-ChildItem $vd -Recurse -Filter 'MpcVideoRenderer64.ax' | Select-Object -First 1
          $r = Start-Process "$env:SystemRoot\System32\regsvr32.exe" -ArgumentList '/s', "`"$($vax.FullName)`"" -Wait -PassThru
          "MPC Video Renderer $($vr.tag_name): regsvr32 exit $($r.ExitCode)" | Tee-Object -Append "$env:RUNNER_TEMP\arm.txt"
          # no update question on the first start (it blocks the window), then the first start writes the settings
          New-Item 'HKCU:\Software\MPC-HC\MPC-HC\Settings' -Force | Out-Null
          Set-ItemProperty 'HKCU:\Software\MPC-HC\MPC-HC\Settings' -Name UpdaterAutoCheck -Value 0 -Type DWord
          # first start writes its registry settings (Setup adds PushMPC to them)
          $m = Start-Process $exe -PassThru; Start-Sleep 12; if (-not $m.HasExited) { [void]$m.CloseMainWindow(); if (-not $m.WaitForExit(15000)) { $m.Kill() } }
          Invoke-WebRequest $env:CLIP_URL -OutFile "$env:RUNNER_TEMP\clip.mp4"
      - name: PushMPC-Setup.exe /S (x64 under Prism)
        timeout-minutes: 20
        run: |
          # Windows PowerShell 5.1 next to this pwsh step: PowerShell 7's PSModulePath breaks 5.1's built-in modules, so
          # probe both and run Setup with the variable removed, as from Explorer
          $wps = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          "powershell.exe 5.1 with pwsh's PSModulePath: $(& $wps -NoProfile -Command '(Get-AuthenticodeSignature $env:SystemRoot\explorer.exe).Status' 2>&1)" | Tee-Object -Append "$env:RUNNER_TEMP\arm.txt"
          $keep = $env:PSModulePath; Remove-Item Env:PSModulePath
          "powershell.exe 5.1 without PSModulePath: $(& $wps -NoProfile -Command '(Get-AuthenticodeSignature $env:SystemRoot\explorer.exe).Status' 2>&1)" | Tee-Object -Append "$env:RUNNER_TEMP\arm.txt"
          "powershell.exe architecture: $(& $wps -NoProfile -Command '$env:PROCESSOR_ARCHITECTURE')" | Tee-Object -Append "$env:RUNNER_TEMP\arm.txt"
          $setup = "$env:RUNNER_TEMP\release\PushMPC-Setup.exe"
          $p = Start-Process $setup -ArgumentList '/S' -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\setup-out.txt"; if (-not $p.WaitForExit(1100000)) { $p.Kill(); throw 'Setup timed out' }
          Get-Content "$env:RUNNER_TEMP\setup-out.txt" | Select-Object -Last 40
          "Setup exit $($p.ExitCode)" | Tee-Object -Append "$env:RUNNER_TEMP\arm.txt"
          Get-ChildItem "$env:LOCALAPPDATA\PushMPC\logs" -Filter 'setup*.log' -ErrorAction SilentlyContinue | Get-Content | Select-Object -Last 40
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:LOCALAPPDATA\PushMPC\filter\pushmpc-install.ps1" status -Verify 2>&1 | Tee-Object -Append "$env:RUNNER_TEMP\arm.txt"
          $reg = (Get-ItemProperty 'HKCU:\Software\Classes\CLSID\{798D4EC3-E59C-4A4E-A2EE-C804AEAE04CC}\InprocServer32' -ErrorAction SilentlyContinue).'(default)'
          "filter registered: $reg" | Tee-Object -Append "$env:RUNNER_TEMP\arm.txt"
          "regsvr32 in System32 is $(if ((Get-Item "$env:SystemRoot\System32\regsvr32.exe").VersionInfo) { 'present' })" | Out-Null
      - name: MPC-HC x64 plays the clip; the filter must be created (its log)
        timeout-minutes: 5
        run: |
          $logs = "$env:LOCALAPPDATA\PushMPC\logs"
          Get-ChildItem 'HKCU:\Software\MPC-HC\MPC-HC\Filters\x64' -ErrorAction SilentlyContinue | ForEach-Object { $q = Get-ItemProperty $_.PSPath; "MPC-HC filter entry $($_.PSChildName): $($q.Name) enabled $($q.Enabled)" } | Tee-Object -Append "$env:RUNNER_TEMP\arm.txt"
          # MPC Video Renderer (DSVidRen 14), which PushMPC needs downstream
          Set-ItemProperty 'HKCU:\Software\MPC-HC\MPC-HC\Settings' -Name DSVidRen -Value 14 -Type DWord
          # hosted runners have no audio device: the null audio renderer, else MPC-HC cannot render the file
          Set-ItemProperty 'HKCU:\Software\MPC-HC\MPC-HC\Settings' -Name AudioRendererType -Value 'Null Audio Renderer (Any)' -Type String
          "MPC Video Renderer registered: $((Get-ItemProperty 'Registry::HKEY_CLASSES_ROOT\CLSID\{71F080AA-8661-4093-B15E-4F6903E77D0A}\InprocServer32' -ErrorAction SilentlyContinue).'(default)')" | Tee-Object -Append "$env:RUNNER_TEMP\arm.txt"
          Add-Type -Namespace W -Name U -MemberDefinition '[DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc f, System.IntPtr l); public delegate bool EnumProc(System.IntPtr h, System.IntPtr l); [DllImport("user32.dll")] public static extern int GetWindowThreadProcessId(System.IntPtr h, out int pid); [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetWindowText(System.IntPtr h, System.Text.StringBuilder s, int n); [DllImport("user32.dll")] public static extern bool IsWindowVisible(System.IntPtr h); [DllImport("user32.dll")] public static extern bool EnumChildWindows(System.IntPtr p, EnumProc f, System.IntPtr l);'
          # madVR (x64 runner only): with EVR and madVR downstream the filter cannot hand over D3D11 textures; what it does
          # there decides KMPlayer 64X / GOM (they have no MPC Video Renderer)
          if ($env:RUNNER_ARCH -eq 'X64') {
            try {
              Invoke-WebRequest 'https://www.madshi.net/madVR.zip' -OutFile "$env:RUNNER_TEMP\madVR.zip"
              Expand-Archive "$env:RUNNER_TEMP\madVR.zip" "$env:ProgramFiles\madVR" -Force
              $mx = Get-ChildItem "$env:ProgramFiles\madVR" -Recurse -Filter 'madVR64.ax' | Select-Object -First 1
              $r = Start-Process "$env:SystemRoot\System32\regsvr32.exe" -ArgumentList '/s', "`"$($mx.FullName)`"" -Wait -PassThru
              "madVR: regsvr32 exit $($r.ExitCode) ($((Get-FileHash "$env:RUNNER_TEMP\madVR.zip").Hash))" | Tee-Object -Append "$env:RUNNER_TEMP\arm.txt"
            } catch { "madVR: not installed ($_)" | Tee-Object -Append "$env:RUNNER_TEMP\arm.txt" }
          }
          $variants = [ordered]@{ 'MPC Video Renderer' = 14 }
          if ($env:RUNNER_ARCH -eq 'X64') { $variants['EVR'] = 10; $variants['EVR-CP'] = 11; $variants['madVR'] = 12 }
          $mpcvrOk = $false
          foreach ($v in $variants.GetEnumerator()) {
            Remove-Item "$logs\filter-*.log" -ErrorAction SilentlyContinue
            Set-ItemProperty 'HKCU:\Software\MPC-HC\MPC-HC\Settings' -Name DSVidRen -Value $v.Value -Type DWord
            $m = Start-Process "$env:ProgramFiles\MPC-HC\mpc-hc64.exe" -ArgumentList "`"$env:RUNNER_TEMP\clip.mp4`"", '/play' -PassThru; Start-Sleep 20
            $titles = [Collections.Generic.List[string]]::new()
            [W.U]::EnumWindows({ param($h, $l) $id = 0; [void][W.U]::GetWindowThreadProcessId($h, [ref]$id); if ($id -eq $m.Id -and [W.U]::IsWindowVisible($h)) { $sb = [Text.StringBuilder]::new(512); [void][W.U]::GetWindowText($h, $sb, 512); if ($sb.Length) { $titles.Add($sb.ToString()) }
                if ($sb.ToString() -eq 'MPC-HC') { [W.U]::EnumChildWindows($h, { param($c, $x) $cb = [Text.StringBuilder]::new(1024); [void][W.U]::GetWindowText($c, $cb, 1024); if ($cb.Length) { $titles.Add("  dialog: $($cb.ToString())") }; $true }, [IntPtr]::Zero) | Out-Null } }; $true }, [IntPtr]::Zero) | Out-Null
            if (-not $m.HasExited) { [void]$m.CloseMainWindow(); if (-not $m.WaitForExit(15000)) { $m.Kill() } }
            Start-Sleep 2
            $f = @(Get-ChildItem $logs -Filter 'filter-*.log' -ErrorAction SilentlyContinue)
            $key = if ($f.Count) { (Get-Content $f[0].FullName | Select-String -Pattern 'input type|output type|status:|pass-through|D3D11|downstream|renderer' | Select-Object -First 6 | ForEach-Object { ($_.Line -replace '^\S+ \[\d+\] qpc [\d.]+ ', '') }) -join ' / ' } else { 'no filter log' }
            $line = "$($v.Key) (DSVidRen $($v.Value)): windows [$($titles -join ' | ')]; filter: $key"
            $line | Tee-Object -Append "$env:RUNNER_TEMP\arm.txt"
            Write-Host "::notice title=MPC-HC + $($v.Key)::$($line.Substring(0, [Math]::Min(900, $line.Length)))"
            if ($v.Value -eq 14 -and $f.Count) { $mpcvrOk = $true }
          }
          "ARM_FILTER=$mpcvrOk" >> $env:GITHUB_ENV
      - name: Uninstall (Setup --uninstall --quiet)
        if: always()
        run: |
          # as Windows Settings > Apps does it: the QuietUninstallString Setup registered
          $q = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\PushMPC' -ErrorAction SilentlyContinue).QuietUninstallString
          "QuietUninstallString: $q" | Tee-Object -Append "$env:RUNNER_TEMP\arm.txt"
          if ($q) { $p = Start-Process cmd.exe -ArgumentList '/c', "`"$q`"" -PassThru; $p.WaitForExit(300000) | Out-Null; "uninstall exit $($p.ExitCode)" | Tee-Object -Append "$env:RUNNER_TEMP\arm.txt" }
          "install folder left: $(Test-Path "$env:LOCALAPPDATA\PushMPC\filter"); MPC-HC entry left: $([bool](Get-ChildItem 'HKCU:\Software\MPC-HC\MPC-HC\Filters\x64' -ErrorAction SilentlyContinue | Where-Object { (Get-ItemProperty $_.PSPath).CLSID -eq '{798D4EC3-E59C-4A4E-A2EE-C804AEAE04CC}' }))" | Tee-Object -Append "$env:RUNNER_TEMP\arm.txt"
          "registration left: $(Test-Path 'HKCU:\Software\Classes\CLSID\{798D4EC3-E59C-4A4E-A2EE-C804AEAE04CC}')" | Tee-Object -Append "$env:RUNNER_TEMP\arm.txt"
          @('## setup-graph ${{ matrix.os }}', '', '```') + (Get-Content "$env:RUNNER_TEMP\arm.txt") + @('```') -join "`n" >> $env:GITHUB_STEP_SUMMARY
          Copy-Item "$env:LOCALAPPDATA\PushMPC\logs" "$env:RUNNER_TEMP\pushmpc-logs" -Recurse -ErrorAction SilentlyContinue
          if (Test-Path 'HKCU:\Software\Classes\CLSID\{798D4EC3-E59C-4A4E-A2EE-C804AEAE04CC}') { Write-Host '::error::uninstall left the filter registered'; exit 1 }
          if ($env:ARM_FILTER -ne 'True') { Write-Host '::error::MPC-HC x64 did not create the filter'; exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'setup-graph-logs-${{ matrix.os }}', path: "${{ runner.temp }}/*.txt\n${{ runner.temp }}/pushmpc-logs" }
