# Intel methods in pushcore (G10: Intel Video Super Resolution, Intel VPL AI frame interpolation, XeSS frame generation,
# XeSS SR): build and the checks a hosted runner can do (it has no Intel GPU; its only adapter is WARP, Windows' software GPU):
#   - libvpl (Intel's MIT dispatcher), pinned by tag + SHA-256, built static with the static CRT, linked into pushcore;
#   - pushcore.dll + pushcore_selftest.exe with it, the XeSS SDK headers (PushFPS's pin) and the XeSS slot patch;
#   - scripts/xess-fetch.ps1 as Setup runs it: Intel's XeSS DLLs from Intel's repository, pins, versions, Intel signature;
#   - on WARP: the D3D11 <-> D3D12 bridge round trip (D3D12 frame -> D3D11 video processor blit -> D3D12, pixels
#     compared; NV12 upscale opened in D3D12), Intel VSR's self-test (the VPE extension must be refused cleanly ->
#     capability reason), VPL frame interpolation's self-test (no Intel runtime -> a clean refusal), the procedural
#     material's 50/50 blend baseline (calibration of the VPL quality gate), XeSS FG's self-test (its square test through
#     pushcore's XefgStage on the headless swap chain, as xefg-spike proved on WARP), XeSS SR's self-test (runs or a clean
#     refusal);
#   - auto_test (the Auto rules, Intel rows included); the tester scripts parse;
#   - Live HUD Lock on WARP: PushFPS's pass tests (veyra_push_gpu_tests, VEYRA_PUSH_GPU_TESTS=hud: the lock, the still
#     rule, PushMPC's count and compose gate), then the real pushcore graph with PushFlow (Fast) on WARP over synthetic
#     scenes with static overlays, lock off / on / Auto, scored against a ground truth rendered at twice the rate
#     (tests/hud-lock-score.py; fidelity only, never speed: WARP is a software adapter).
# Uploaded (7 days): libvpl's install (its MIT licence included) and, for Arc testers, pushcore.dll + pushcore_selftest.exe
# with FFmpeg's DLLs (tests/intel-selftest-manual.ps1). Nothing of Intel's is uploaded.
name: intel-video
on:
  push:
    branches: ['track/vendor-intelvp', 'track/vendor-xess']
    paths: ['.github/workflows/intel-video.yml', 'pushmpc/src/PushCoreD3D11Bridge.*', 'pushmpc/src/PushCoreIntelVsr.*', 'pushmpc/src/PushCoreVplFi.*',
            'pushmpc/src/PushCoreIntel.*', 'pushmpc/src/PushCoreXe*', 'pushmpc/src/PushCoreSelfTest.*', 'pushmpc/tools/pushcore_selftest.cpp',
            'patches/pushfps-4.5.8-pushmpc.patch', 'scripts/xess-fetch.ps1', 'filter/src/PushMpcAuto.h', 'filter/tools/auto_test.cpp',
            'tests/intel-*-manual.ps1', 'tests/xess-fg-manual.ps1']
  workflow_dispatch:
# a push whose commit message contains [libvpl only] builds and uploads only libvpl's install (a developer convenience)

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LIBVPL_TAG: v2.17.0
  LIBVPL_COMMIT: d77f9195cf495b937631607333288fd917ae8939
  LIBVPL_SHA256: 4DE3E2FAF1E8307FB282E4A43F443191810F6A6B0A484FFFA7995BA1C814C6EC

jobs:
  libvpl:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Fetch, verify and build libvpl (static, static CRT)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $d = "$env:RUNNER_TEMP\dl"; New-Item -ItemType Directory -Force $d | Out-Null
          Invoke-WebRequest -Uri "https://github.com/intel/libvpl/archive/refs/tags/$env:LIBVPL_TAG.tar.gz" -OutFile "$d\libvpl.tar.gz"
          $h = (Get-FileHash "$d\libvpl.tar.gz" -Algorithm SHA256).Hash
          if ($h -ne $env:LIBVPL_SHA256) { throw "libvpl SHA-256 mismatch: $h" }
          tar -xzf "$d\libvpl.tar.gz" -C $d
          $src = (Get-ChildItem $d -Directory -Filter 'libvpl-*' | Select-Object -First 1).FullName
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/intel/libvpl/$env:LIBVPL_COMMIT/api/vpl/mfxdefs.h" -OutFile "$d\mfxdefs.h"
          if ((Get-FileHash "$d\mfxdefs.h").Hash -ne (Get-FileHash "$src\api\vpl\mfxdefs.h").Hash) { throw "libvpl archive does not match commit $env:LIBVPL_COMMIT" }
          cmake -S $src -B "$env:RUNNER_TEMP\vplb" -A x64 -DBUILD_SHARED_LIBS=OFF -DUSE_MSVC_STATIC_RUNTIME=ON -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF -DINSTALL_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX="$env:RUNNER_TEMP\vpl"
          if ($LASTEXITCODE) { throw "libvpl configure failed" }
          cmake --build "$env:RUNNER_TEMP\vplb" --config Release --target install
          if ($LASTEXITCODE) { throw "libvpl build failed" }
          Copy-Item "$src\LICENSE" "$env:RUNNER_TEMP\vpl\LICENSE.libvpl.txt"
          Get-ChildItem "$env:RUNNER_TEMP\vpl" -Recurse -Include *.lib | ForEach-Object { "$($_.Name) $($_.Length)" }
      - uses: actions/upload-artifact@v4
        with:
          name: libvpl-install
          path: ${{ runner.temp }}/vpl
          retention-days: 7

  core:
    needs: libvpl
    if: ${{ !contains(github.event.head_commit.message, '[libvpl only]') }}
    runs-on: windows-2025
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { path: repo, persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { name: libvpl-install, path: '${{ runner.temp }}/vpl' }

      - name: Paths and pins
        run: |
          $deps = Join-Path $env:RUNNER_TEMP 'deps'; New-Item -ItemType Directory -Force $deps | Out-Null
          $pin = Get-Content repo/scripts/pushfps-pin.json -Raw | ConvertFrom-Json
          @("DEPS=$deps", "BUILD=$(Join-Path $env:RUNNER_TEMP 'b')", "PUSHFPS_REPO=$($pin.pushfps.repository)", "PUSHFPS_TAG=$($pin.pushfps.tag)",
            "PUSHFPS_COMMIT=$($pin.pushfps.commit)", "PUSHFPS_PATCH=$($pin.pushfps.patch)", "PUSHFPS_DISPLAY_VERSION=$($pin.pushfps.displayVersion)") | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756   # v1, pinned by commit
        with: { arch: x64 }

      - name: auto_test (Auto rules, Intel rows)
        timeout-minutes: 5
        run: |
          cl /nologo /std:c++20 /O2 /EHsc /W3 /utf-8 /DUNICODE /D_UNICODE /DNOMINMAX repo\filter\tools\auto_test.cpp /Fe:auto_test.exe /link user32.lib advapi32.lib shell32.lib
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $out = .\auto_test.exe 2>&1 | Out-String; $rc = $LASTEXITCODE
          $out -split "`n" | Select-String -Pattern 'intel video|vendor paths|FAIL' | ForEach-Object { $_.Line }
          if ($out -notmatch 'intel video: 0 failed' -or $out -notmatch 'vendor paths: 0 failed') { Write-Host '::error::auto_test failed'; exit 1 }
          # stated, not left to the step's implicit last exit code: any failing auto_test row fails the step, as before
          if ($rc -ne 0) { Write-Host "::error::auto_test exit $rc (a failing row outside the Intel ones; see FAIL above)"; exit 1 }
          exit 0

      - name: Tester scripts parse
        run: |
          foreach ($f in 'repo/tests/intel-selftest-manual.ps1', 'repo/tests/intel-vpl-manual.ps1', 'repo/tests/xess-fg-manual.ps1', 'repo/scripts/xess-fetch.ps1') {
            $e = $null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$e) | Out-Null
            if ($e) { $e | ForEach-Object { Write-Host "::error::$f $_" }; exit 1 }
            "$f parses"
          }

      - name: PushFPS source with the PushMPC patches
        timeout-minutes: 10
        run: |
          git config --global advice.detachedHead false; git config --global core.autocrlf false
          git clone -q --depth 1 --branch $env:PUSHFPS_TAG https://github.com/$env:PUSHFPS_REPO.git PushFPS
          if ((git -C PushFPS rev-parse HEAD) -ne $env:PUSHFPS_COMMIT) { Write-Host "::error::tag moved"; exit 1 }
          git -C PushFPS apply --whitespace=nowarn "$env:GITHUB_WORKSPACE/repo/$env:PUSHFPS_PATCH"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # the combined patch carries XeSS SR's slot (FsrSrBackend provider) and the other PushMPC hunks
          $wf = Get-Content PushFPS/.github/workflows/build-windows.yml -Raw
          foreach ($n in 'VCPKG_COMMIT', 'DLSS_TAG', 'NVCODEC_TAG', 'CUDART_ZIP', 'XESS_TAG', 'FFX1_TAG', 'FFX2_TAG', 'AMF_COMMIT') {
            $m = [regex]::Match($wf, "(?m)^\s+$($n):\s*(\S+)"); if (-not $m.Success) { exit 1 }
            "$n=$($m.Groups[1].Value)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          }

      - name: SDK headers (as release.yml)
        timeout-minutes: 15
        working-directory: ${{ env.DEPS }}
        shell: bash
        run: |
          set -e
          GIT_LFS_SKIP_SMUDGE=1 git clone -q --depth 1 --branch "$DLSS_TAG" --filter=blob:none --sparse https://github.com/NVIDIA/DLSS.git dlss
          git -C dlss sparse-checkout set include lib/Windows_x86_64/x64
          git clone -q --depth 1 --branch "$NVCODEC_TAG" https://github.com/FFmpeg/nv-codec-headers.git nv-codec-headers
          curl -sSfL "$CUDART_ZIP" -o cudart.zip && unzip -q cudart.zip -d cudart && mv cudart/*/ cudart-root
          gh release download "$XESS_TAG" -R intel/xess -p '*.zip' -O xess.zip && unzip -q xess.zip -d xess
          GIT_LFS_SKIP_SMUDGE=1 git clone -q --depth 1 --branch "$FFX2_TAG" --filter=blob:none --sparse https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK.git ffx2
          git -C ffx2 sparse-checkout set Kits/FidelityFX/api/include Kits/FidelityFX/framegeneration/include Kits/FidelityFX/upscalers/include
          gh release download "$FFX1_TAG" -R GPUOpen-LibrariesAndSDKs/FidelityFX-SDK -p '*.zip' -O ffx1.zip && unzip -q ffx1.zip -d ffx1
          git init -q amf && git -C amf remote add origin https://github.com/GPUOpen-LibrariesAndSDKs/AMF.git
          git -C amf fetch -q --depth 1 --filter=blob:none origin "$AMF_COMMIT"
          git -C amf sparse-checkout set amf/public/include && git -C amf checkout -q FETCH_HEAD

      - name: FidelityFX 1.x optical flow (static, /MT)
        timeout-minutes: 20
        working-directory: ${{ env.DEPS }}/ffx1/sdk
        run: |
          cmake -S . -B build -A x64 -DFFX_API_BACKEND=DX12_X64 -DFFX_ALL=OFF -DFFX_OF=ON -DFFX_AUTO_COMPILE_SHADERS=1 -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Locate SDK roots
        shell: bash
        run: |
          deps=$(cygpath -u "$DEPS")
          xess=$(dirname "$(dirname "$(dirname "$(find "$deps/xess" -name xefg_swapchain_d3d12.h | head -1)")")")
          ffx1lib=$(find "$deps/ffx1/sdk/bin" -iname 'ffx_opticalflow_x64.lib' | head -1)
          ffx1=$(dirname "$(dirname "$(dirname "$ffx1lib")")")
          { echo "XESS_ROOT=$(cygpath -m "$xess")"; echo "FFX1_ROOT=$(cygpath -m "$ffx1")"; } >> "$GITHUB_ENV"

      - name: Restore vcpkg binaries
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DEPS }}/vcpkg-binary
          key: pushmpc-vcpkg-${{ env.VCPKG_COMMIT }}-${{ github.run_id }}
          restore-keys: pushmpc-vcpkg-${{ env.VCPKG_COMMIT }}-

      - name: FFmpeg (vcpkg at PushFPS's baseline)
        timeout-minutes: 50
        working-directory: ${{ env.DEPS }}
        run: |
          git init -q vcpkg; git -C vcpkg remote add origin https://github.com/microsoft/vcpkg.git
          git -C vcpkg fetch -q --depth 1 origin $env:VCPKG_COMMIT; git -C vcpkg checkout -q FETCH_HEAD
          & vcpkg\bootstrap-vcpkg.bat -disableMetrics
          New-Item -ItemType Directory -Force vcpkg-binary | Out-Null
          $env:VCPKG_DEFAULT_BINARY_CACHE = "$env:DEPS\vcpkg-binary"
          & vcpkg\vcpkg.exe install "ffmpeg[core,avcodec,avformat,avfilter,swresample,swscale]:x64-windows" --clean-after-build
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/setup-python@v5
        id: py
        with: { python-version: '3.12', update-environment: false }
      - name: Cache PushFlow inputs
        id: pushflow-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.DEPS }}/pushflow
          key: pushmpc-pushflow-${{ hashFiles('PushFPS/scripts/pushflow/prepare_runtime.py') }}
      - name: PushFlow build inputs
        if: steps.pushflow-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          $venv = Join-Path $env:RUNNER_TEMP 'pf-venv'; & '${{ steps.py.outputs.python-path }}' -m venv $venv
          $py = Join-Path $venv 'Scripts\python.exe'
          & $py -m pip install --disable-pip-version-check -q onnx==1.17.0 onnxconverter-common==1.14.0 onnxruntime==1.20.1 numpy==1.26.4
          Push-Location PushFPS; & $py -I scripts/pushflow/prepare_runtime.py --out "$env:DEPS\pushflow"; $rc = $LASTEXITCODE; Pop-Location
          if ($rc -ne 0) { exit $rc }
      - name: pmml headers
        run: |
          & '${{ steps.py.outputs.python-path }}' -I repo/pmml/scripts/fetch_runtime.py --pin repo/scripts/ml-runtime-pin.json --platform win-x64 --out "$env:DEPS\pmml" --cache "$env:DEPS\pmml-dl" --flavors core,directml --headers
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # pmml's DirectML path needs the DirectML flavor's factory header beside the core headers (pushmpc-core action)
          Copy-Item "$env:DEPS\pmml\ort\directml\include\dml_provider_factory.h" "$env:DEPS\pmml\ort\core\include\" -Force

      - name: Configure and build pushcore with libvpl
        timeout-minutes: 50
        run: |
          $ffmpeg = "$env:DEPS\vcpkg\installed\x64-windows"
          # Release with debug information (/Z7 in the objects, /DEBUG: PDBs beside pushcore.dll and pushcore_selftest.exe):
          # the self-test's crash report then names the function and line (run 45973619605 crashed in the FSR probe with
          # nothing but 0xC0000005); the code is the Release code (/O2 /Ob2, /OPT:REF /OPT:ICF as without /DEBUG)
          cmake -S PushFPS -B $env:BUILD -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$ffmpeg" `
            "-DCMAKE_CXX_FLAGS_RELEASE=/O2 /Ob2 /DNDEBUG /Z7" "-DCMAKE_C_FLAGS_RELEASE=/O2 /Ob2 /DNDEBUG /Z7" `
            "-DCMAKE_SHARED_LINKER_FLAGS_RELEASE=/DEBUG /OPT:REF /OPT:ICF" "-DCMAKE_EXE_LINKER_FLAGS_RELEASE=/DEBUG /OPT:REF /OPT:ICF" `
            -DVEYRA_BUILD_QML_UI=OFF -DVEYRA_BUILD_QT_PROBE=OFF -DVEYRA_ENABLE_EXPERIMENTAL_DLSSNR=ON -DVEYRA_ENABLE_D3D12_DEBUG=OFF `
            -DVEYRA_ENABLE_REMOTEPLAY=OFF -DVEYRA_ENABLE_MOONLIGHT=OFF -DVEYRA_ENABLE_XBOX=OFF -DVEYRA_ENABLE_LIBDOVI=OFF `
            "-DVEYRA_DISPLAY_VERSION=$env:PUSHFPS_DISPLAY_VERSION" "-DVEYRA_FFMPEG_ROOT=$ffmpeg" "-DVEYRA_DLSS_SDK_ROOT=$env:DEPS\dlss" `
            "-DVEYRA_NVENC_HEADERS_ROOT=$env:DEPS\nv-codec-headers" "-DVEYRA_CUDA_DRIVER_INCLUDE_DIR=$env:DEPS\cudart-root\include" `
            "-DVEYRA_XESS_ROOT=$env:XESS_ROOT" "-DVEYRA_FIDELITYFX_ROOT=$env:FFX1_ROOT" "-DVEYRA_FIDELITYFX2_ROOT=$env:DEPS\ffx2\Kits\FidelityFX" `
            "-DVEYRA_AMF_SDK_ROOT=$env:DEPS\amf\amf\public" "-DVEYRA_ONNXRUNTIME_ROOT=$env:DEPS\pushflow\ort" "-DVEYRA_DIRECTML_ROOT=$env:DEPS\pushflow\dml" `
            "-DPUSHMPC_SOURCE_DIR=$($env:GITHUB_WORKSPACE.Replace('\','/'))/repo/pushmpc" `
            "-DPUSHMPC_PMML_ORT_INCLUDE=$($env:DEPS.Replace('\','/'))/pmml/ort/core/include" `
            "-DPUSHMPC_VPL_ROOT=$($env:RUNNER_TEMP.Replace('\','/'))/vpl"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $shaders = @(cmake --build $env:BUILD --target help | ForEach-Object { ($_ -split ':')[0].Trim() } | Where-Object { $_ -match '^veyra_shader_[A-Za-z0-9_]+$' } | Sort-Object -Unique)
          cmake --build $env:BUILD --target @shaders pushcore_dll pushcore_selftest pushcore_gpu_harness --parallel
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item "$env:BUILD\pushmpc\pushcore.dll" | Format-List Name, Length

      - name: xess-fetch.ps1 (Setup's XeSS step) - Intel's repository, pins, versions, Intel signature
        if: hashFiles('repo/scripts/xess-fetch.ps1') != ''
        timeout-minutes: 10
        run: |
          $root = "$env:RUNNER_TEMP\core-root"
          ./repo/scripts/xess-fetch.ps1 -Dest "$root\runtime_local\intel\experimental" -Cache "$env:RUNNER_TEMP\xess-cache"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem "$root\runtime_local\intel\experimental" | Format-Table Name, Length

      - name: fidelityfx-fetch.ps1 (Setup's FSR step, pinned) for the FSR upscaler probe
        if: hashFiles('repo/scripts/fidelityfx-fetch.ps1') != ''
        timeout-minutes: 10
        run: |
          $root = "$env:RUNNER_TEMP\core-root"
          ./repo/scripts/fidelityfx-fetch.ps1 -Dest "$root\runtime_local\amd\fidelityfx" -Cache "$env:RUNNER_TEMP\ffx-cache"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem "$root\runtime_local\amd\fidelityfx" | Format-Table Name, Length

      - name: WARP checks (bridge round trip, Intel VSR and VPL refusals, XeSS FG and SR self-tests)
        timeout-minutes: 15
        run: |
          $env:PATH = "$env:DEPS\vcpkg\installed\x64-windows\bin;$env:BUILD\pushmpc;$env:PATH"
          $root = "$env:RUNNER_TEMP\core-root"; New-Item -ItemType Directory -Force "$root\shaders" | Out-Null
          Copy-Item "$env:BUILD\shaders\*.dxil" "$root\shaders" -ErrorAction SilentlyContinue
          # 48 frames: the upscaler probe reports frames 0, 1 and 36-47 (pan, still picture, still with a reset every frame)
          $env:PUSHMPC_SELFTEST_FRAMES = '48'
          & "$env:BUILD\pushmpc\pushcore_selftest.exe" --core "$env:BUILD\pushmpc\pushcore.dll" --root $root --warp --all --json "$env:RUNNER_TEMP\selftest.json" 2>&1 | Tee-Object -Variable log
          $code = $LASTEXITCODE
          # the self-test's own exit counts WARP's refusals (Intel VSR, VPL) as failures: informational here, the
          # checks below decide (a pwsh step otherwise ends with the last native exit code: run 45953530419 printed
          # WARP CHECKS PASS and failed with this exit 1)
          "pushcore_selftest exit $code (informational; the JSON checks below decide)"
          $j = Get-Content "$env:RUNNER_TEMP\selftest.json" -Raw | ConvertFrom-Json
          $j | ConvertTo-Json -Depth 5
          $fail = 0
          # the checks of the methods this checkout has (a track branch carries one half; the merge both)
          $vp = Test-Path repo/pushmpc/src/PushCoreVplFi.cpp; $xs = Test-Path repo/pushmpc/src/PushCoreXefg.cpp
          if ($vp) {
            if ($j.bridge -notmatch 'PASS$') { Write-Host "::error::bridge round trip: $($j.bridge)"; $fail++ }
            if ($j.ivsr -notmatch '^fail: ' -or $j.ivsr -notmatch 'VPE|extension|no video processor') { Write-Host "::error::Intel VSR on WARP must be refused cleanly (no video processor / no VPE extension): $($j.ivsr)"; $fail++ }
            if ($j.vplfi -notmatch '^(fail|unavailable): ') { Write-Host "::error::VPL on a runner must refuse cleanly: $($j.vplfi)"; $fail++ }
            if ($j.'vplfi.built' -ne 'true') { Write-Host "::error::this pushcore was built without libvpl"; $fail++ }
          }
          if ($xs) {
            if ($j.xefg -notmatch '^pass') { Write-Host "::error::XeSS FG self-test on WARP: $($j.xefg)"; $fail++ }
            if ($j.xesssr -match '^unavailable|exception' -or -not $j.xesssr) { Write-Host "::error::XeSS SR self-test did not run: $($j.xesssr)"; $fail++ }
            if ($j.'xesssr.providerSlot' -ne 'yes') { Write-Host "::error::XeSS SR has no slot in this build: $($j.'xesssr.providerSlot')"; $fail++ }
            # the probe's numbers (WARP-functional, never a quality claim): reported, not judged; they must be there
            foreach ($k in 'pan', 'static', 'staticReset') { if ($j."xesssr.$k" -notmatch '^f0 psnr') { Write-Host "::error::XeSS SR probe ($k) did not report: $($j."xesssr.$k")"; $fail++ } }
          }
          # the FSR upscaler probe (WARP-functional numbers, both modes): it must run or say why it cannot, never crash
          if ($j.fsrsr -match 'exception' -or -not $j.fsrsr) { Write-Host "::error::FSR SR probe: $($j.fsrsr)"; $fail++ }
          $want = $(if ($xs) { (1 -shl 20) -bor (1 -shl 22) } else { 0 }) -bor $(if ($vp) { (1 -shl 21) -bor (1 -shl 23) } else { 0 })
          if (([uint32]$j.features -band $want) -ne $want) { Write-Host "::error::pushcore_features lacks an Intel bit: $($j.features) (want $want)"; $fail++ }
          if ($j.capsNoDevice -notmatch 'no hardware adapter|ok') { Write-Host "::error::capabilities without a GPU: $($j.capsNoDevice)"; $fail++ }
          "| check | result |`n|---|---|`n| bridge | $($j.bridge) |`n| Intel VSR | $($j.ivsr) |`n| VPL FI | $($j.vplfi) |`n| material | $($j.'vplfi.material') |`n| XeSS FG | $($j.xefg) |`n| XeSS SR | $($j.xesssr) |`n| XeSS SR pan (WARP-functional) | $($j.'xesssr.pan') |`n| XeSS SR still, history | $($j.'xesssr.static') |`n| XeSS SR still, reset each frame | $($j.'xesssr.staticReset') |`n| FSR SR | $($j.fsrsr) |" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          foreach ($m in 'single', 'temporal') { foreach ($s in 'pan', 'static', 'static-reset') { "| FSR SR $m, $s | $($j."fsrsr.$m.$s") |" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY } }
          if ($fail) { exit 1 }
          "WARP CHECKS PASS"
          exit 0

      - name: Live HUD Lock on WARP (the pass, then the pushcore graph with PushFlow, scored against the ground truth)
        if: ${{ !cancelled() && hashFiles('repo/tests/hud-lock-score.py') != '' }}
        timeout-minutes: 100
        run: |
          $ErrorActionPreference = 'Continue'
          $ffbin = "$env:DEPS\vcpkg\installed\x64-windows\bin"
          $env:PATH = "$ffbin;$env:PATH"
          # a run folder laid out as an install: pushcore.dll + FFmpeg, shaders\, the PushFlow runtime in rt\pushflow
          $run = "$env:RUNNER_TEMP\hud-run"; $out = "$env:RUNNER_TEMP\hud-out"
          New-Item -ItemType Directory -Force "$run\shaders", "$run\rt", $out | Out-Null
          Copy-Item "$env:BUILD\shaders\*.dxil" "$run\shaders"
          Copy-Item "$env:BUILD\pushmpc\pushcore.dll", "$env:BUILD\pushmpc\pushcore_gpu_harness.exe" $run
          Copy-Item "$ffbin\*.dll" $run
          Copy-Item -Recurse "$env:DEPS\pushflow\runtime\pushflow" "$run\rt\pushflow"
          Get-ChildItem "$run\rt\pushflow" -Recurse | Select-Object -First 12 | ForEach-Object { $_.FullName.Substring($run.Length) }
          $fail = 0
          "| check | result |`n|---|---|" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          # 1. the pass on WARP (PushFPS's GPU tests, only HUD Lock's: the lock, the still rule, the count and the gate).
          #    Built on its own: this build has never made that target; a failure here is reported, the graph still runs.
          cmake --build $env:BUILD --target veyra_push_gpu_tests --parallel 2>&1 | Select-Object -Last 30
          $t = Get-ChildItem $env:BUILD -Recurse -Filter veyra_push_gpu_tests.exe | Select-Object -First 1
          if (-not $t) { Write-Host "::error::veyra_push_gpu_tests.exe was not built"; $fail++; $passText = 'not built' }
          else {
            Copy-Item $t.FullName $run
            $env:VEYRA_PUSH_GPU_TESTS = 'hud'
            & "$run\veyra_push_gpu_tests.exe" 2>&1 | Tee-Object -FilePath "$out\pass-tests.txt"
            $pc = $LASTEXITCODE
            Remove-Item Env:VEYRA_PUSH_GPU_TESTS
            if ($pc -ne 0) { Write-Host "::error::HUD Lock pass tests on WARP failed (exit $pc)"; $fail++; $passText = "FAIL (exit $pc)" } else { "HUD LOCK PASS TESTS OK"; $passText = 'pass' }
          }
          "| HUD Lock pass tests on WARP (lock, still rule, PushMPC's count and gate) | $passText |" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          # 2. the graph: synthetic scenes at 448x256, PushFlow Fast x2 on WARP; the ground truth at twice the rate
          $common = @('--pushfps', $run, '--shaders', "$run\shaders", '--runtime', "$run\rt", '--adapter', 'warp', '--srq', '0', '--deband', 'off',
                      '--paced', '0', '--warmup', '4', '--save', '70')
          function Invoke-Hud([string]$name, [string[]]$extra) {
            $dir = "$out\$name"; New-Item -ItemType Directory -Force $dir | Out-Null
            $sw = [Diagnostics.Stopwatch]::StartNew()
            & "$run\pushcore_gpu_harness.exe" synthetic:448x256 $dir @common @extra 2>&1 | Out-File -Encoding utf8 "$dir\harness.txt"
            $code = $LASTEXITCODE
            $lines = Get-Content "$dir\harness.txt"
            $lines | Select-String -Pattern '^(HUDSCENE|pushcore:|METHOD|HUD LOCK|GRAPH ran|RESULT|DUMP|PASS|FAIL|OPEN FAILED|SUBMIT FAILED)' | ForEach-Object { "  $name | $($_.Line)" } | Out-Host
            "  $name | exit $code, $([math]::Round($sw.Elapsed.TotalSeconds)) s" | Out-Host
            $h = $lines | Select-String -Pattern '^HUD LOCK .* state (\d+).*locked pixels last (\d+) max (\d+), moving (\d+)' | Select-Object -First 1
            if ($h) { "| HUD Lock stats, $name (final state; locked pixels max; moving last) | $($h.Matches[0].Groups[1].Value); $($h.Matches[0].Groups[3].Value); $($h.Matches[0].Groups[4].Value) |" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY }
            return @{ code = $code; lines = $lines; seconds = $sw.Elapsed.TotalSeconds; hud = $h }
          }
          $venv = Join-Path $env:RUNNER_TEMP 'hud-venv'; & '${{ steps.py.outputs.python-path }}' -m venv $venv
          & "$venv\Scripts\python.exe" -m pip install --disable-pip-version-check -q numpy==1.26.4
          function Invoke-Score([string]$tag) {
            "### Scores ($tag)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            & "$venv\Scripts\python.exe" -I repo/tests/hud-lock-score.py --root $out --mult 2 --summary $env:GITHUB_STEP_SUMMARY --json "$out\hud-lock-$tag.json" 2>&1 | Tee-Object -FilePath "$out\score-$tag.txt" | Out-Host
            return $LASTEXITCODE
          }
          # the ground truth first (no frame generation: cheap): the scenes at twice the rate, through the same colour path
          foreach ($sc in 'logo', 'null', 'slowpan', 'ticker', 'translucent', 'noise', 'startmove') {
            $null = Invoke-Hud "gt-$sc" @('--backend', 'none', '--multiplier', '1', '--fine', '2', '--frames', '280', '--dump', '110', '--scene', $sc)
          }
          $fg = @('--backend', 'pushflow', '--q', '0', '--multiplier', '2', '--frames', '84', '--dump', '56')
          $first = Invoke-Hud 'logo-on' ($fg + @('--scene', 'logo', '--hudlock', '1'))
          $g = $first.lines | Select-String -Pattern '^GRAPH ran on WARP: (.*)$' | Select-Object -First 1
          $graphRan = if ($g) { $g.Matches[0].Groups[1].Value } else { 'no (no GRAPH line: the harness did not get that far)' }
          "GRAPH RAN ON WARP: $graphRan"
          "| pushcore graph with frame generation on WARP | $graphRan |" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if ($graphRan -notmatch '^yes \(frame generation 2,') {
            Write-Host "::error::the pushcore graph did not run PushFlow on WARP: $graphRan"
            Get-Content "$out\logo-on\harness.txt" -Tail 40
            if (Test-Path "$out\logo-on\pushcore.log") { Get-Content "$out\logo-on\pushcore.log" -Tail 80 }
            $fail++
          } else {
            $per = $first.seconds
            "PushFlow on WARP: one 84-frame run took $([math]::Round($per)) s; the rest: 6 more for rules R1-R5 (~$([math]::Round(6 * $per / 60)) min), then 8 secondary and 2 Auto runs (~$([math]::Round((8 + 2 * 140 / 84) * $per / 60)) min)" | Out-Host
            "| one 84-frame PushFlow run on WARP (s; fidelity only, never speed) | $([math]::Round($per)) |" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            # what rules R1-R5 need, then a first score (a timeout after it still leaves a verdict)
            $plan = @(
              @('logo-off', @('--scene', 'logo', '--hudlock', '0')),
              @('null-off', @('--scene', 'null', '--hudlock', '0')), @('null-on', @('--scene', 'null', '--hudlock', '1')),
              @('slowpan-off', @('--scene', 'slowpan', '--hudlock', '0')), @('slowpan-on', @('--scene', 'slowpan', '--hudlock', '1')),
              @('logo-off-r2', @('--scene', 'logo', '--hudlock', '0')), @('null-off-r2', @('--scene', 'null', '--hudlock', '0')))
            foreach ($p in $plan) { $null = Invoke-Hud $p[0] ($fg + $p[1]) }
            if ((Invoke-Score 'rules') -ne 0) { Write-Host "::error::the HUD Lock scorer failed"; $fail++ }
            # the other scenes
            $plan = @(
              @('ticker-off', @('--scene', 'ticker', '--hudlock', '0')), @('ticker-on', @('--scene', 'ticker', '--hudlock', '1')),
              @('translucent-off', @('--scene', 'translucent', '--hudlock', '0')), @('translucent-on', @('--scene', 'translucent', '--hudlock', '1')),
              @('noise-off', @('--scene', 'noise', '--hudlock', '0')), @('noise-on', @('--scene', 'noise', '--hudlock', '1')),
              @('startmove-off', @('--scene', 'startmove', '--hudlock', '0')), @('startmove-on', @('--scene', 'startmove', '--hudlock', '1')))
            foreach ($p in $plan) { $null = Invoke-Hud $p[0] ($fg + $p[1]) }
            # Auto: long enough for the gate (locked after ~49 frames, then 3 polls of 12 frames), scored from frame 112
            $fgAuto = @('--backend', 'pushflow', '--q', '0', '--multiplier', '2', '--frames', '140', '--dump', '112')
            foreach ($sc in 'logo', 'null') {
              $r = Invoke-Hud "$sc-auto" ($fgAuto + @('--scene', $sc, '--hudlock', '2'))
              $state = if ($r.hud) { $r.hud.Matches[0].Groups[1].Value } else { '?' }
              $want = if ($sc -eq 'logo') { '1' } else { '4' }
              "| HUD Lock Auto, $sc scene: final state (want $want; 1 composing, 4 counting only) | $state |" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
              if ($state -ne $want) { Write-Host "::error::HUD Lock Auto on the $sc scene ended in state $state (want $want)"; $fail++ }
            }
            if ((Invoke-Score 'all') -ne 0) { Write-Host "::error::the HUD Lock scorer failed"; $fail++ }
          }
          if ($fail) { exit 1 }
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hud-lock-warp
          # logs, scores, the frame-70 PNGs; the dumps (hundreds of MB) stay on the runner
          path: |
            ${{ runner.temp }}/hud-out
            !${{ runner.temp }}/hud-out/**/dump.raw
          retention-days: 7
          if-no-files-found: ignore

      - name: Tester bundle (pushcore + pushcore_selftest + FFmpeg)
        if: always()
        run: |
          $o = "$env:RUNNER_TEMP\intel-selftest"; New-Item -ItemType Directory -Force $o | Out-Null
          Copy-Item "$env:BUILD\pushmpc\pushcore.dll", "$env:BUILD\pushmpc\pushcore_selftest.exe", repo/tests/intel-selftest-manual.ps1 $o -ErrorAction SilentlyContinue
          Copy-Item "$env:DEPS\vcpkg\installed\x64-windows\bin\*.dll" $o -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intel-selftest
          path: ${{ runner.temp }}/intel-selftest
          retention-days: 7
          if-no-files-found: ignore
