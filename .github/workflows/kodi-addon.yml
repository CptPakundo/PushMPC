# inputstream.pushmpc (PushMPC inside Kodi's own VideoPlayer) on hosted runners:
#   build    the add-on for Kodi 21 Omega and 22 Piers (each against that release's kodi-dev-kit), Linux and Windows;
#            cadence_test (timestamps + engine glue, no Kodi)
#   kodi-*   the real Kodi plays synthetic clips with the add-on installed and analyze.py judges every case from Kodi's
#            debug log (LOGVIDEO + LOGAVTIMING) and JSON-RPC: Linux = Flathub Kodi (21.3 stable, 22 beta) under Xvfb
#            with Mesa's software GL; Windows = the official 21.3 / 22.0 RC2 builds, portable mode, on WARP.
# macOS builds run on manual dispatch only (private-repo minutes).
name: kodi-addon

on:
  push:
    paths: ['kodiaddon/**', 'vsplugin/engines/**', 'vsplugin/third_party/pushfps-portable/**', '.github/workflows/kodi-addon.yml']
  # release.yml builds the release's Kodi add-on through this workflow (artifacts pushmpc-kodi-Windows / -Linux)
  workflow_call:
    inputs:
      wayland:
        description: 'also run the Kodi-on-Wayland test job (it builds no artifact)'
        type: boolean
        default: true
      tests:
        description: 'run the unit tests and the playback test jobs (release.yml: false, build + package + installer round trip only)'
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      macos:
        description: 'also build on macOS'
        type: boolean
        default: false
      cases:
        description: 'comma-separated case names (empty = all)'
        type: string
        default: ''

concurrency:
  group: kodi-addon-${{ github.workflow }}-${{ github.ref }}   # called from release.yml: its own group (github.workflow is the caller's)
  cancel-in-progress: ${{ github.workflow == 'kodi-addon' }}   # a release run's builds are never cancelled midway

env:
  FFMPEG_VERSION: '8.1'
  KODI21_TAG: '21.3-Omega'
  KODI22_TAG: '22.0rc2-Piers'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        kodi: [21, 22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Kodi dev kit (sparse checkout of the release tag)
        id: devkit
        shell: bash
        run: |
          tag=$([ "${{ matrix.kodi }}" = 21 ] && echo "$KODI21_TAG" || echo "$KODI22_TAG")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git clone -q --depth 1 --filter=blob:none --sparse -b "$tag" https://github.com/xbmc/xbmc.git "$RUNNER_TEMP/xbmc"
          git -C "$RUNNER_TEMP/xbmc" sparse-checkout set xbmc/addons/kodi-dev-kit/include
          grep -E 'INSTANCE_VERSION_(INPUTSTREAM|VIDEOCODEC) ' "$RUNNER_TEMP/xbmc/xbmc/addons/kodi-dev-kit/include/kodi/versions.h"

      - name: FFmpeg cache
        id: ffcache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_VERSION }}-${{ runner.os }}-v1

      - name: FFmpeg static (Linux)
        if: runner.os == 'Linux' && steps.ffcache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nasm
          bash kodiaddon/ci/build-ffmpeg.sh "$FFMPEG_VERSION" "$RUNNER_TEMP/ffmpeg"

      - name: FFmpeg shared (Windows, BtbN build)
        if: runner.os == 'Windows' && steps.ffcache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          z="ffmpeg-n${FFMPEG_VERSION}-latest-win64-gpl-shared-${FFMPEG_VERSION}"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ff.zip" "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$z.zip"
          sha256sum "$RUNNER_TEMP/ff.zip"
          7z x -y -o"$RUNNER_TEMP" "$RUNNER_TEMP/ff.zip" > /dev/null
          mv "$RUNNER_TEMP/$z" "$RUNNER_TEMP/ffmpeg"
          ls "$RUNNER_TEMP/ffmpeg/bin" "$RUNNER_TEMP/ffmpeg/lib" | head -40

      - name: FFmpeg cache save (right away, so a later failure does not lose it)
        if: steps.ffcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_VERSION }}-${{ runner.os }}-v1

      - name: Configure and build
        shell: bash
        run: |
          cmake -S kodiaddon -B build -DCMAKE_BUILD_TYPE=Release \
            -DKODI_DEVKIT="$RUNNER_TEMP/xbmc/xbmc/addons/kodi-dev-kit/include" -DFFMPEG_ROOT="$RUNNER_TEMP/ffmpeg"
          cmake --build build --config Release --parallel
          ls -la build/addon/inputstream.pushmpc
          cat build/addon/inputstream.pushmpc/addon.xml
          if [ "$RUNNER_OS" = Linux ]; then
            f=$(ls build/addon/inputstream.pushmpc/inputstream.pushmpc.so.*)
            echo "dynamic dependencies:"; readelf -d "$f" | grep NEEDED
            echo "exported av* symbols (must be 0): $(nm -D --defined-only "$f" | grep -c ' av' || true)"
          fi

      - name: Unit tests (on Linux the GPU engine runs on lavapipe and is required)
        if: ${{ format('{0}', inputs.tests) != 'false' }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq mesa-vulkan-drivers > /dev/null
            # zero copy test: udmabuf stands in for Kodi's dma-buf frame buffers
            sudo modprobe udmabuf 2>/dev/null || echo "no udmabuf module"; sudo modprobe vgem 2>/dev/null || echo "no vgem module"
            sudo udevadm settle || true; sudo chmod 666 /dev/udmabuf /dev/dri/card* 2>/dev/null || true; ls -l /dev/udmabuf /dev/dri 2>&1 | head -5
            export PUSHMPC_VK_ALLOW_CPU=1 PM_REQUIRE_GPU=1
          fi
          ctest --test-dir build -C Release --output-on-failure -V | grep -E "kodi engine|zero copy|host import|semi-planar|tone map|platform:|cadence_test|FAIL|Passed|Failed" || true
          ctest --test-dir build -C Release --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: addon-${{ runner.os }}-kodi${{ matrix.kodi }}
          path: build/addon

  package:
    # one folder per OS: kodi21/ and kodi22/ builds plus the installer (what the PushMPC Setup ships and passes as
    # PUSHMPC_KODI_DIR); the installer's round trip runs on it
    needs: build
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: Linux }
          - { os: windows-latest, name: Windows }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: 'addon-${{ matrix.name }}-kodi21', path: pkg/kodi21 }
      - uses: actions/download-artifact@v4
        with: { name: 'addon-${{ matrix.name }}-kodi22', path: pkg/kodi22 }
      - name: Assemble
        shell: bash
        run: |
          cp kodiaddon/install/install.sh kodiaddon/install/install.ps1 pkg/
          find pkg -maxdepth 3 | sort
      - name: Installer round trip (Linux)
        if: runner.os == 'Linux'
        run: sh kodiaddon/tests/install-test.sh "$PWD/pkg"
      - name: Installer round trip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./kodiaddon/tests/install-test.ps1 -Package "$PWD\pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: pushmpc-kodi-${{ matrix.name }}
          path: pkg

  kodi-wayland:
    # Kodi 22 on Wayland (headless Weston, Mesa) with a dma-buf allocator (udmabuf) and its DRM-PRIME renderer on: the
    # add-on hands out dma-bufs where the renderer shows them (zero copy: the GPU engine writes into them in place).
    # The _noalloc cases take the allocator away: Kodi's thumbnail and stream-detail probes must keep working
    needs: build
    # push and dispatch always; a caller (release.yml) may turn it off with wayland: false
    if: ${{ !cancelled() && format('{0}', inputs.wayland) != 'false' }}   # inputs.wayland is empty on push and dispatch
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: addon-Linux-kodi22, path: addon }
      - uses: LABSN/sound-ci-helpers@v1
      - name: Flatpak, Weston, ffmpeg, udmabuf
        id: udmabuf
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak weston ffmpeg dbus-x11 > /dev/null
          # udmabuf is built into some runner kernels (the node exists, modprobe finds no module: azure 6.x has it as
          # a module, aws 7.x builds it in) and missing from others' base modules (linux-modules-extra has it)
          echo "kernel $(uname -r)"
          echo 'KERNEL=="udmabuf", MODE="0666"' | sudo tee /etc/udev/rules.d/99-pushmpc-udmabuf.rules > /dev/null
          sudo udevadm control --reload || true
          if [ ! -e /dev/udmabuf ]; then
            sudo modprobe udmabuf 2>/dev/null || {
              echo "udmabuf: no module in the base set, trying linux-modules-extra-$(uname -r)"
              sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" > /dev/null 2>&1 && sudo modprobe udmabuf || true
            }
          else
            echo "udmabuf: present (built in or loaded)"
          fi
          # udev sets the node's mode after it appears (root:kvm 0660): wait for udev, then make it writable
          sudo udevadm settle || true
          sudo chmod 666 /dev/udmabuf 2>/dev/null || true
          ls -l /dev/udmabuf /dev/dma_heap 2>&1 || true
          if [ -w /dev/udmabuf ]; then echo "have=1" >> "$GITHUB_OUTPUT"; echo "udmabuf writable"
          else echo "have=0" >> "$GITHUB_OUTPUT"; echo "::notice title=kodi-wayland::skipped: no udmabuf on this runner (kernel $(uname -r)); the dma-buf cases do not run"; fi
          flatpak remote-add --user --if-not-exists flathub-beta https://flathub.org/beta-repo/flathub-beta.flatpakrepo
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Kodi 22 from Flathub beta
        timeout-minutes: 20
        run: flatpak install --user -y --noninteractive flathub-beta tv.kodi.Kodi//beta > /dev/null
      - name: Clips
        run: python3 kodiaddon/ci/gen_clips.py ffmpeg "$RUNNER_TEMP/clips"
      - name: Play on Wayland
        run: |
          export XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg; mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --renderer=gl --socket=wayland-pm --width=1280 --height=720 > "$RUNNER_TEMP/weston.log" 2>&1 &
          sleep 3; cat "$RUNNER_TEMP/weston.log" | tail -5
          export WAYLAND_DISPLAY=wayland-pm
          home="$HOME/.var/app/tv.kodi.Kodi/data"; mkdir -p "$home"
          # without udmabuf the dma-buf cases are skipped (reported in the summary); the rest still runs
          cases="zerocopy,zerocopy10,h264_x2,hdr10_x2,hdr10_kodi,hdr10_noalloc,browse_noalloc"
          if [ "${{ steps.udmabuf.outputs.have }}" != 1 ]; then
            cases="h264_x2,hdr10_x2,hdr10_kodi,hdr10_noalloc,browse_noalloc"
            mkdir -p out; printf '**skipped: no udmabuf** on this runner (kernel %s): zerocopy, zerocopy10\n\n' "$(uname -r)" > out/summary.md
          fi
          dbus-run-session -- python3 kodiaddon/ci/run_cases.py \
            --kodi "flatpak run --user --branch=beta --device=all --env=PUSHMPC_VK_ALLOW_CPU=1 --filesystem=$RUNNER_TEMP/clips:ro tv.kodi.Kodi --windowing=wayland" --gpu --prime \
            --alloc-off "sudo chmod 600 /dev/udmabuf" --alloc-on "sudo chmod 666 /dev/udmabuf" \
            --kill "flatpak kill tv.kodi.Kodi" --home "$home" --addon addon/inputstream.pushmpc \
            --clips "$RUNNER_TEMP/clips" --major 22 --out out --cases "$cases"
      - name: Summary
        if: always()
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kodi-wayland-logs
          path: out

  kodi-linux:
    needs: build
    if: ${{ !cancelled() && format('{0}', inputs.tests) != 'false' }}   # each OS runs with its own build even if the other OS's build failed; release.yml: off
    strategy:
      fail-fast: false
      matrix:
        kodi: [21, 22]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: addon-Linux-kodi${{ matrix.kodi }}
          path: addon
      - uses: LABSN/sound-ci-helpers@v1
      - name: Flatpak, Xvfb, ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak xvfb ffmpeg dbus-x11 > /dev/null
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak remote-add --user --if-not-exists flathub-beta https://flathub.org/beta-repo/flathub-beta.flatpakrepo
      - name: Kodi from Flathub
        timeout-minutes: 20
        run: |
          if [ "${{ matrix.kodi }}" = 21 ]; then flatpak install --user -y --noninteractive flathub tv.kodi.Kodi//stable > /dev/null; br=stable
          else flatpak install --user -y --noninteractive flathub-beta tv.kodi.Kodi//beta > /dev/null; br=beta; fi
          echo "BRANCH=$br" >> "$GITHUB_ENV"
          flatpak info --user tv.kodi.Kodi//$br
      - name: Clips
        run: python3 kodiaddon/ci/gen_clips.py ffmpeg "$RUNNER_TEMP/clips"
      - name: Play the cases in Kodi
        run: |
          home="$HOME/.var/app/tv.kodi.Kodi/data"
          mkdir -p "$home"
          xvfb-run -a -s "-screen 0 1280x720x24" dbus-run-session -- python3 kodiaddon/ci/run_cases.py \
            --kodi "flatpak run --user --branch=$BRANCH --env=PUSHMPC_VK_ALLOW_CPU=1 --filesystem=$RUNNER_TEMP/clips:ro tv.kodi.Kodi --windowing=x11" --gpu \
            --kill "flatpak kill tv.kodi.Kodi" --home "$home" --addon addon/inputstream.pushmpc \
            --clips "$RUNNER_TEMP/clips" --major ${{ matrix.kodi }} --out out --cases "${{ inputs.cases }}"
      - name: Summary
        if: always()
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kodi-linux-${{ matrix.kodi }}-logs
          path: out

  kodi-windows:
    needs: build
    if: ${{ !cancelled() && format('{0}', inputs.tests) != 'false' }}   # release.yml: off
    strategy:
      fail-fast: false
      matrix:
        kodi: [21, 22]
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: addon-Windows-kodi${{ matrix.kodi }}
          path: addon
      - uses: LABSN/sound-ci-helpers@v1
      - name: Kodi (official build, unpacked; portable mode)
        shell: bash
        run: |
          exe=$([ "${{ matrix.kodi }}" = 21 ] && echo kodi-21.3-Omega-x64.exe || echo kodi-22.0-Piers_rc2-x64.exe)
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/kodi.exe" "https://mirrors.kodi.tv/releases/windows/win64/$exe"
          sha256sum "$RUNNER_TEMP/kodi.exe"
          7z x -y -o/c/kodi "$RUNNER_TEMP/kodi.exe" > /dev/null
          rm -rf '/c/kodi/$PLUGINSDIR' '/c/kodi/uninstall.exe'
          ls /c/kodi | head -50
          ls /c/kodi/*.dll | head -40
          mkdir -p /c/kodi/portable_data
      - name: Clips (BtbN ffmpeg)
        shell: bash
        run: |
          z="ffmpeg-n${FFMPEG_VERSION}-latest-win64-gpl-shared-${FFMPEG_VERSION}"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ff.zip" "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$z.zip"
          7z x -y -o"$RUNNER_TEMP" "$RUNNER_TEMP/ff.zip" > /dev/null
          python kodiaddon/ci/gen_clips.py "$RUNNER_TEMP/$z/bin/ffmpeg.exe" "C:/clips"
      - name: Play the cases in Kodi
        shell: pwsh
        run: |
          python kodiaddon/ci/run_cases.py --kodi "C:\kodi\kodi.exe -p" --kill "taskkill /F /IM kodi.exe" `
            --home C:\kodi\portable_data --addon addon\inputstream.pushmpc --clips C:\clips --major ${{ matrix.kodi }} `
            --out out --cases "${{ inputs.cases }}"
      - name: Summary
        if: always()
        shell: bash
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kodi-windows-${{ matrix.kodi }}-logs
          path: out

  build-android:
    # Android TV / Fire TV / Shield (arm64-v8a): build and package only. Kodi has no headless Android test path on a
    # hosted runner yet; the engine is the GPU one (Vulkan, loaded at run time) with the CPU fallback.
    strategy:
      fail-fast: false
      matrix:
        kodi: [21, 22]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Kodi dev kit
        run: |
          tag=$([ "${{ matrix.kodi }}" = 21 ] && echo "$KODI21_TAG" || echo "$KODI22_TAG")
          git clone -q --depth 1 --filter=blob:none --sparse -b "$tag" https://github.com/xbmc/xbmc.git "$RUNNER_TEMP/xbmc"
          git -C "$RUNNER_TEMP/xbmc" sparse-checkout set xbmc/addons/kodi-dev-kit/include
      - uses: actions/cache/restore@v4
        id: ffcache
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_VERSION }}-android-arm64-v2
      - name: FFmpeg static (NDK)
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nasm > /dev/null
          bash kodiaddon/ci/build-ffmpeg-android.sh "$FFMPEG_VERSION" "$RUNNER_TEMP/ffmpeg" "$ANDROID_NDK_LATEST_HOME"
      - uses: actions/cache/save@v4
        if: steps.ffcache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_VERSION }}-android-arm64-v2
      - name: glslang (pinned; the Android conversion shader)
        run: |
          d=$RUNNER_TEMP/glslang; mkdir -p "$d"
          j() { python3 -c "import json,sys; v=json.load(open('vsplugin/engines/gpu/gpu-pins.json')); [v:=v[k] for k in sys.argv[1:]]; print(v)" "$@"; }
          curl -fsSL --retry 3 -o "$d/g.tar.gz" "$(j glslang linux url)"
          echo "$(j glslang linux sha256)  $d/g.tar.gz" | sha256sum -c -
          tar -xzf "$d/g.tar.gz" -C "$d"
          g=$(find "$d" -path "*bin/glslangValidator" | head -1); [ -n "$g" ] || g=$(find "$d" -path "*bin/glslang" | head -1)
          chmod +x "$g"; echo "GLSLANG=$g" >> "$GITHUB_ENV"
      - name: Build
        run: |
          cmake -S kodiaddon -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DANDROID_STL=c++_static \
            -DKODI_DEVKIT="$RUNNER_TEMP/xbmc/xbmc/addons/kodi-dev-kit/include" -DFFMPEG_ROOT="$RUNNER_TEMP/ffmpeg" -DPM_GLSLANG="$GLSLANG"
          cmake --build build --parallel
          ls -la build/addon/inputstream.pushmpc
          "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d build/addon/inputstream.pushmpc/libinputstream.pushmpc.so | grep NEEDED
          grep library_android build/addon/inputstream.pushmpc/addon.xml
      - uses: actions/upload-artifact@v4
        with:
          name: addon-Android-arm64-kodi${{ matrix.kodi }}
          path: build/addon

  build-macos:
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    strategy:
      fail-fast: false
      matrix:
        kodi: [21, 22]
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Kodi dev kit
        run: |
          tag=$([ "${{ matrix.kodi }}" = 21 ] && echo "$KODI21_TAG" || echo "$KODI22_TAG")
          git clone -q --depth 1 --filter=blob:none --sparse -b "$tag" https://github.com/xbmc/xbmc.git "$RUNNER_TEMP/xbmc"
          git -C "$RUNNER_TEMP/xbmc" sparse-checkout set xbmc/addons/kodi-dev-kit/include
      - uses: actions/cache@v4
        id: ffcache
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_VERSION }}-macOS-v1
      - name: FFmpeg static
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: |
          brew install nasm
          bash kodiaddon/ci/build-ffmpeg.sh "$FFMPEG_VERSION" "$RUNNER_TEMP/ffmpeg" --enable-videotoolbox
      - name: Build and test
        run: |
          cmake -S kodiaddon -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DKODI_DEVKIT="$RUNNER_TEMP/xbmc/xbmc/addons/kodi-dev-kit/include" -DFFMPEG_ROOT="$RUNNER_TEMP/ffmpeg"
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          otool -L build/addon/inputstream.pushmpc/inputstream.pushmpc.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: addon-macOS-kodi${{ matrix.kodi }}
          path: build/addon
