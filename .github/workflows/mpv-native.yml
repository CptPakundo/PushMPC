# The native mpv route: FFmpeg 9.1 + vf_pushmpc + mpv 0.42 built on the runners, the engine module
# (pushmpc_engine), and headless checks (mpvnative/tests/run-tests.sh):
#   linux    ubuntu-24.04: Vulkan-Headers, libplacebo, FFmpeg (+ fruc_vulkan), mpv; engine_test; ffmpeg CPU / 10-bit /
#            Vulkan (lavapipe, copy fallback) / pass-through; mpv encode mode, lavfi graph, display-resample on vo=null;
#            the portable folder as an artifact
#   windows  windows-2022: engine + stub pushcore with MSVC, engine_test (D3D11 on WARP); FFmpeg (D3D11VA, Vulkan) and
#            mpv in MSYS2 UCRT64; the same checks plus D3D11 frames into the stub pushcore; the portable mpv folder
#   macos    dispatch only (input macos=true): engine + FFmpeg + mpv, CPU checks
# ccache and the prefixes are cached, so a run that only touches the filter rebuilds one object file.
name: mpv-native

on:
  push:
    branches: ['track/mpv-native', 'track/mpv-native-*', 'track/linuxgpu']
    paths: ['mpvnative/**', 'vsplugin/engines/**', 'vsplugin/src/**', 'vsplugin/stub/**', 'pmml/**', '.github/workflows/mpv-native.yml', '.github/workflows/nvl-kernels.yml']
  # release.yml builds the release's native hook, mpv and the Plex proxy through this workflow (artifacts
  # mpvnative-hook-<runner>, mpvnative-windows, plexnative)
  workflow_call:
    inputs:
      release:
        description: 'a release build (release.yml): also the Plex for Mac bundle (artifact plexmac)'
        type: boolean
        default: true
      tests:
        description: 'run the test suites (release.yml: false, builds + one smoke test per artifact; push and dispatch always test)'
        type: boolean
        default: true
      part:
        description: 'release.yml: "release" = what its build and linux jobs take (Windows mpv, the hook, the Plex proxy); "extra" = what only its publish job takes (the AppImage, Plex for Mac); empty = everything'
        type: string
        default: ''
      fresh:
        description: 'a tag build: no build output and no FFmpeg build tree from the cache, everything compiled fresh'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      macos:
        description: 'also run the macOS job'
        type: boolean
        default: false
      plex_linux:
        description: 'also run the Plex on Linux Flatpak job (Flathub installs; the tarball job runs on every push)'
        type: boolean
        default: false
      plex_macos:
        description: 'also run the Plex for Mac job (build, install into both apps, self-test, launch)'
        type: boolean
        default: false

concurrency:
  # never cancelled midway: its jobs fill the FFmpeg / mpv caches (a newer run waits, an older waiting one is dropped)
  # (release.yml calls this workflow twice, part release and part extra: one group each)
  group: mpv-native-${{ github.workflow }}-${{ github.ref }}-${{ inputs.part }}
  cancel-in-progress: false

# Caches are keyed by what goes into them (pins, build scripts, our FFmpeg filter sources), not by run: a build with
# the same inputs restores the previous output and skips the build; each cache is saved right after its build.
jobs:
  linux:
    if: ${{ inputs.part != 'release' }}   # release.yml: part extra (the AppImage is a release asset)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PREFIX: /home/runner/pm-prefix
      SRC: /home/runner/pm-src
      CCACHE_DIR: /home/runner/pm-ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo rm -f /var/lib/man-db/auto-update; sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends build-essential nasm pkg-config meson ninja-build cmake ccache \
            glslang-tools spirv-headers libvulkan-dev mesa-vulkan-drivers vulkan-tools libshaderc-dev glslang-dev \
            libass-dev liblua5.2-dev libx11-dev libxext-dev libxrandr-dev libxpresent-dev libxss-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libegl-dev libgl-dev libdrm-dev zlib1g-dev python3-jinja2 bc squashfs-tools patchelf
      - uses: actions/cache/restore@v4
        id: build-cache
        with:
          path: |
            /home/runner/pm-ccache
            /home/runner/pm-src
            /home/runner/pm-prefix
          key: mpvnative-linux-${{ hashFiles('mpvnative/pins.json', 'mpvnative/ci/build-unix.sh') }}-built
          restore-keys: mpvnative-linux-${{ hashFiles('mpvnative/pins.json', 'mpvnative/ci/build-unix.sh') }}-
      - name: Build Vulkan-Headers, libplacebo, FFmpeg + vf_pushmpc, mpv
        timeout-minutes: 60
        run: |
          ccache -z || true
          bash mpvnative/ci/build-unix.sh "$PREFIX" "$SRC" linux
          ccache -s | head -12 || true
      - uses: actions/cache/save@v4
        if: steps.build-cache.outputs.cache-hit != 'true'
        with:
          path: |
            /home/runner/pm-ccache
            /home/runner/pm-src
            /home/runner/pm-prefix
          key: mpvnative-linux-${{ hashFiles('mpvnative/pins.json', 'mpvnative/ci/build-unix.sh') }}-built
      - name: Engine module and engine_test
        run: |
          # ContentDetect's image model: pmml with the pinned ONNX Runtime C API headers (ONNX Runtime itself loads at run time)
          ort=""; python3 -I pmml/scripts/fetch_runtime.py --pin scripts/ml-runtime-pin.json --platform linux-x64 --out /tmp/cd-ort --cache ~/pmml-dl --flavors core --headers >/dev/null 2>&1 && ort="-DPME_CONTENT_ORT_INCLUDE=/tmp/cd-ort/ort/core/include" || echo "::warning::ONNX Runtime headers not fetched: the engine builds without the image model"
          cmake -S mpvnative/engine -B build-engine -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DPME_FETCH_GPU_DEPS=ON $ort
          cmake --build build-engine --parallel
          ./build-engine/out/engine_test
          # the portable Vulkan engine with frames in host memory on Mesa's lavapipe (Dedup's lookahead, real frames exact)
          if command -v vulkaninfo >/dev/null 2>&1 || ls /usr/share/vulkan/icd.d/lvp_icd*.json >/dev/null 2>&1; then PUSHMPC_TEST_VULKAN=1 ./build-engine/out/engine_test; fi
      - name: Public clip (pinned)
        run: |
          url=$(python3 -c "import json;print(json.load(open('mpvnative/pins.json'))['clip']['url'])")
          sha=$(python3 -c "import json;print(json.load(open('mpvnative/pins.json'))['clip']['sha256'])")
          mkdir -p "$RUNNER_TEMP/t"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/clip.mp4" "$url" || { echo "::warning::clip download failed"; exit 0; }
          got=$(sha256sum "$RUNNER_TEMP/clip.mp4" | cut -d' ' -f1 | tr a-f A-F)
          echo "clip sha256 $got"
          if [ "$sha" = TODO ]; then echo "::notice::clip not pinned yet (sha256 $got): not used"; exit 0; fi
          [ "$got" = "$(echo "$sha" | tr a-f A-F)" ] || { echo "::error::clip SHA-256 mismatch: $got"; exit 1; }
          cp "$RUNNER_TEMP/clip.mp4" "$RUNNER_TEMP/t/public.mp4"
      - name: Headless checks
        if: ${{ format('{0}', inputs.tests) != 'false' }}   # release.yml: build + the AppImage smoke test
        timeout-minutes: 15
        run: |
          ls /usr/share/vulkan/icd.d/ || true
          lvp=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1); [ -n "$lvp" ] && export VK_DRIVER_FILES="$lvp" VK_ICD_FILENAMES="$lvp"
          export PUSHMPC_ENGINE="$PWD/build-engine/out/libpushmpc_engine.so" PUSHMPC_ENGINE_LOG="$RUNNER_TEMP/t/engine.log"
          export LD_LIBRARY_PATH="$PREFIX/lib"
          vulkaninfo --summary 2>&1 | grep -iE "deviceName|apiVersion|error" | head -6 || true
          bash mpvnative/tests/run-tests.sh "$PREFIX" "$RUNNER_TEMP/t" linux
      - name: Portable folder (mpv + FFmpeg with vf_pushmpc + engine)
        if: always()
        run: |
          d="$RUNNER_TEMP/PushMPC-mpv-linux"; mkdir -p "$d/bin" "$d/lib"
          cp "$PREFIX/bin/mpv" "$PREFIX/bin/ffmpeg" "$PREFIX/bin/ffprobe" "$d/bin/" 2>/dev/null || true
          cp -P "$PREFIX"/lib/lib{avcodec,avdevice,avfilter,avformat,avutil,swresample,swscale,placebo,mpv}*.so* "$d/lib/" 2>/dev/null || true
          cp build-engine/out/libpushmpc_engine.so "$d/lib/" 2>/dev/null || true
          cp mpvnative/ci/SOURCES.txt LICENSE "$d/" 2>/dev/null || true
          ls -la "$d/bin" "$d/lib"
      - name: AppImage (and a check that it plays through vf_pushmpc)
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash mpvnative/ci/make-appimage.sh "$PREFIX" build-engine/out/libpushmpc_engine.so "$SRC" "$RUNNER_TEMP/appimage"
          t="$RUNNER_TEMP/t"
          # the synthetic clip of the headless checks (made here when they did not run)
          [ -f "$t/clip.mkv" ] || { mkdir -p "$t"; LD_LIBRARY_PATH="$PREFIX/lib" "$PREFIX/bin/ffmpeg" -v error -y -f lavfi -i "testsrc2=size=640x360:rate=24000/1001:duration=4" -pix_fmt yuv420p -c:v ffv1 "$t/clip.mkv"; }
          n=$(LD_LIBRARY_PATH="$PREFIX/lib" "$PREFIX/bin/ffprobe" -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 "$t/clip.mkv")
          env -u LD_LIBRARY_PATH -u PUSHMPC_ENGINE APPIMAGE_EXTRACT_AND_RUN=1 "$RUNNER_TEMP/appimage/PushMPC-mpv-x86_64.AppImage" --no-config "$t/clip.mkv" \
            --vf=pushmpc=smoother=2 --o="$t/appimage.mkv" --of=matroska --ovc=ffv1 --no-audio > "$t/appimage.log" 2>&1 || { tail -20 "$t/appimage.log"; exit 1; }
          grep -i pushmpc "$t/appimage.log" | head -3
          LD_LIBRARY_PATH="$PREFIX/lib" python3 mpvnative/tests/check_frames.py "$t/appimage.mkv" $((1 + (n - 1) * 2)) 48000/1001 --ffprobe "$PREFIX/bin/ffprobe" --tolerance 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mpvnative-linux
          path: |
            ${{ runner.temp }}/PushMPC-mpv-linux
            ${{ runner.temp }}/appimage
            ${{ runner.temp }}/t/*.log
            ${{ runner.temp }}/t/*.txt
            ${{ runner.temp }}/t/*.png
          retention-days: 7
      # the release asset (release.yml publishes it as PushMPC-mpv-linux-x86_64-<version>.AppImage)
      - uses: actions/upload-artifact@v4
        with: { name: mpvnative-appimage, path: '${{ runner.temp }}/appimage/*.AppImage', if-no-files-found: error, retention-days: 7 }

  windows:
    if: ${{ inputs.part != 'extra' }}
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Engine module, stub pushcore and engine_test (MSVC, D3D11 on WARP)
        shell: pwsh
        run: |
          # the pinned glslang (gpu-pins.json) for the Vulkan engine's two shaders
          $pins = Get-Content vsplugin/engines/gpu/gpu-pins.json -Raw | ConvertFrom-Json
          $zip = Join-Path $env:RUNNER_TEMP 'glslang.zip'
          Invoke-WebRequest -Uri $pins.glslang.windows.url -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $pins.glslang.windows.sha256.ToUpperInvariant()) { throw 'glslang SHA-256 mismatch' }
          Expand-Archive $zip (Join-Path $env:RUNNER_TEMP 'glslang') -Force
          $g = (Get-ChildItem (Join-Path $env:RUNNER_TEMP 'glslang') -Recurse -Filter glslang*.exe | Where-Object { $_.Name -match '^glslang(Validator)?\.exe$' } | Select-Object -First 1).FullName
          # ContentDetect's image model: pmml with the pinned ONNX Runtime C API headers (ONNX Runtime itself loads at run time)
          $ort = @()
          python -I pmml/scripts/fetch_runtime.py --pin scripts/ml-runtime-pin.json --platform win-x64 --out "$env:RUNNER_TEMP\cd-ort" --cache "$env:RUNNER_TEMP\cd-ort-dl" --flavors core --headers | Out-Null
          if (Test-Path "$env:RUNNER_TEMP\cd-ort\ort\core\include\onnxruntime_c_api.h") { $ort = @("-DPME_CONTENT_ORT_INCLUDE=$($env:RUNNER_TEMP.Replace('\','/'))/cd-ort/ort/core/include") } else { Write-Warning 'ONNX Runtime headers not fetched: the engine builds without the image model' }
          cmake -S mpvnative/engine -B build-engine -A x64 -DPME_FETCH_GPU_DEPS=ON "-DPME_GLSLANG=$g" @ort
          if ($LASTEXITCODE) { throw 'configure' }
          cmake --build build-engine --config Release --parallel
          if ($LASTEXITCODE) { throw 'build' }
          ./build-engine/out/engine_test.exe
          if ($LASTEXITCODE) { throw 'engine_test failed' }
          ./build-engine/out/content_gpu_test.exe   # ContentDetect's D3D11 GPU tap = the CPU reference (WARP)
          if ($LASTEXITCODE) { throw 'content_gpu_test failed' }
          # the libmpv forwarder for players with their own libmpv (scripts/pushmpc-libmpv.ps1)
          cmake -S mpvnative/libmpv-swap -B build-fwd -A x64
          cmake --build build-fwd --config Release
          if ($LASTEXITCODE) { throw 'libmpv forwarder build' }
      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c   # v2, pinned by commit
        with:
          msystem: UCRT64
          update: false
          cache: true
          install: >-
            make git diffutils bc
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-nasm mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ccache mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-jinja mingw-w64-ucrt-x86_64-vulkan-loader mingw-w64-ucrt-x86_64-shaderc
            mingw-w64-ucrt-x86_64-spirv-cross mingw-w64-ucrt-x86_64-spirv-headers mingw-w64-ucrt-x86_64-glslang
            mingw-w64-ucrt-x86_64-libplacebo mingw-w64-ucrt-x86_64-libass mingw-w64-ucrt-x86_64-luajit
            mingw-w64-ucrt-x86_64-lcms2 mingw-w64-ucrt-x86_64-libjpeg-turbo mingw-w64-ucrt-x86_64-uchardet mingw-w64-ucrt-x86_64-zlib
      - uses: actions/cache/restore@v4
        id: build-cache
        with:
          path: |
            ${{ runner.temp }}/pm-ccache
            ${{ runner.temp }}/pm-src
            ${{ runner.temp }}/pm-prefix
          key: mpvnative-win-${{ hashFiles('mpvnative/pins.json', 'mpvnative/ci/build-unix.sh') }}-built
          restore-keys: mpvnative-win-${{ hashFiles('mpvnative/pins.json', 'mpvnative/ci/build-unix.sh') }}-
      - name: Build FFmpeg + vf_pushmpc and mpv (MSYS2 UCRT64)
        shell: msys2 {0}
        timeout-minutes: 80
        env:
          CCACHE_DIR: ${{ runner.temp }}/pm-ccache
          CCACHE_MAXSIZE: 2G
        run: |
          R=$(cygpath -u "$RUNNER_TEMP")
          ccache -z || true
          bash mpvnative/ci/build-unix.sh $R/pm-prefix $R/pm-src msys2
          ccache -s | head -12 || true
      # right after the build, so a later failure or a cancel does not lose it
      - uses: actions/cache/save@v4
        if: steps.build-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ runner.temp }}/pm-ccache
            ${{ runner.temp }}/pm-src
            ${{ runner.temp }}/pm-prefix
          key: mpvnative-win-${{ hashFiles('mpvnative/pins.json', 'mpvnative/ci/build-unix.sh') }}-built
      - name: Portable mpv folder (mpv + our FFmpeg + engine + MinGW runtime DLLs)
        shell: msys2 {0}
        run: |
          R=$(cygpath -u "$RUNNER_TEMP")
          d=$R/PushMPC-mpv-windows; rm -rf "$d"; mkdir -p "$d"
          cp $R/pm-prefix/bin/mpv.exe $R/pm-prefix/bin/mpv.com $R/pm-prefix/bin/ffmpeg.exe $R/pm-prefix/bin/ffprobe.exe $R/pm-prefix/bin/*.dll "$d/"
          for f in "$d"/*.exe "$d"/*.dll; do ldd "$f" | awk '/\/ucrt64\// {print $3}'; done | sort -u | while read -r dll; do cp -n "$dll" "$d/"; done
          cp build-engine/out/pushmpc_engine.dll "$d/"
          # players with their own libmpv: the forwarder and pushmpc.lua (scripts/pushmpc-libmpv.ps1)
          cp build-fwd/out/pushmpc-libmpv-forward.dll integrations/mpv/pushmpc.lua "$d/"
          cp mpvnative/ci/SOURCES.txt LICENSE "$d/"
          ls "$d" | head -100; du -sh "$d"
      - name: Headless checks
        if: ${{ format('{0}', inputs.tests) != 'false' }}
        shell: msys2 {0}
        timeout-minutes: 20
        run: |
          R=$(cygpath -u "$RUNNER_TEMP")
          t="$(cygpath -u "$RUNNER_TEMP")/t"; mkdir -p "$t"
          export PUSHMPC_ENGINE="$(cygpath -m "$PWD/build-engine/out/pushmpc_engine.dll")" PME_STUB_DIR="$PWD/build-engine/stub"
          export PUSHMPC_ENGINE_LOG="$(cygpath -m "$t")/engine.log"
          # run from the portable folder (its DLLs), as a user would
          rm -rf $R/pm-portable-prefix; mkdir -p $R/pm-portable-prefix; cp -r $R/PushMPC-mpv-windows $R/pm-portable-prefix/bin
          bash mpvnative/tests/run-tests.sh $R/pm-portable-prefix "$t" msys2
      - name: D3D11 zero-copy filter path on WARP (harness, stub pushcore)
        if: ${{ format('{0}', inputs.tests) != 'false' }}
        shell: msys2 {0}
        timeout-minutes: 5
        run: |
          R=$(cygpath -u "$RUNNER_TEMP")
          export PKG_CONFIG_PATH="$R/pm-prefix/lib/pkgconfig"
          gcc -O2 -Wall mpvnative/tests/d3d11_warp_harness.c -o "$R/d3d11_warp_harness.exe" $(pkg-config --cflags --libs libavfilter libavutil) -ld3d11 -ldxgi -ldxguid -luuid
          export PATH="$R/PushMPC-mpv-windows:$PATH" PUSHMPC_ENGINE="$(cygpath -m "$PWD/build-engine/out/pushmpc_engine.dll")"
          "$R/d3d11_warp_harness.exe" "$(cygpath -m "$PWD/build-engine/stub")"
      - name: Setup's entry point (pushmpc-native.ps1) into a temporary folder
        shell: pwsh
        timeout-minutes: 5
        run: |
          $from = Join-Path $env:RUNNER_TEMP 'PushMPC-mpv-windows'; $dest = Join-Path $env:RUNNER_TEMP 'native-install'
          Copy-Item mpvnative/install/pushmpc-native.ps1 $from
          $env:PUSHMPC_ENGINE = ''
          $r = & pwsh -File (Join-Path $from 'pushmpc-native.ps1') install -From $from -Dest $dest -Opts 'smoother=2' -Hwdec no -Json | ConvertFrom-Json
          Write-Host "install: $($r | ConvertTo-Json -Compress)"
          if ($r.state -ne 'installed') { throw 'install failed' }
          # playback through the installed config (encode mode ignores it): mpv must see the x2 rate
          New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 't') | Out-Null
          $clip = Join-Path $env:RUNNER_TEMP 't\clip12.mkv'
          & (Join-Path $from 'ffmpeg.exe') -v error -y -f lavfi -i "testsrc2=size=640x360:rate=24000/1001:duration=12" -pix_fmt yuv420p -c:v ffv1 $clip
          Get-Content (Join-Path $dest 'portable_config/mpv.conf') | Write-Host
          $log = & (Join-Path $dest 'mpv.com') --vo=null --ao=null --vo-null-fps=47.952 "--script=$((Resolve-Path mpvnative/tests/sync.lua).Path)" $clip 2>&1 | Out-String
          $log -split "`n" | Select-String 'pushmpc' | Select-Object -First 4 | Write-Host
          if ($log -notmatch 'after-seek: estimated-vf-fps=4[78]\.') { throw 'the installed config did not double the frame rate' }
          $s = & pwsh -File (Join-Path $from 'pushmpc-native.ps1') status -Dest $dest -Json | ConvertFrom-Json
          Write-Host "status: $($s | ConvertTo-Json -Compress)"
          & pwsh -File (Join-Path $from 'pushmpc-native.ps1') uninstall -Dest $dest -Json
          if (Test-Path $dest) { Get-ChildItem $dest -Recurse | Select-Object -First 10 | Out-String | Write-Host; throw 'uninstall left files behind' }
      - name: mpv on a window (d3d11 on WARP, hwupload -> pushmpc -> d3d11 interop), best effort
        if: ${{ format('{0}', inputs.tests) != 'false' }}
        shell: msys2 {0}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          R=$(cygpath -u "$RUNNER_TEMP")
          stub=$(cygpath -m "$PWD/build-engine/stub"); t="$(cygpath -u "$RUNNER_TEMP")/t"
          export PUSHMPC_ENGINE="$(cygpath -m "$PWD/build-engine/out/pushmpc_engine.dll")"
          timeout 60 $R/PushMPC-mpv-windows/mpv.com --no-config --vo=gpu-next --gpu-api=d3d11 --d3d11-warp=yes --hwdec=no \
            "--vf=format=nv12,hwupload,pushmpc=smoother=2:core_dir=[$stub]:display_fps=48" --script="$(cygpath -m mpvnative/tests/sync.lua)" \
            --msg-level=all=v --loop-file=inf "$t/clip.mkv" > "$t/mpv-window.log" 2>&1
          grep -iE "pushmpc|pushcore|hwupload|pushmpc-ci|d3d11" "$t/mpv-window.log" | head -30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mpvnative-windows
          path: |
            ${{ runner.temp }}/PushMPC-mpv-windows
            ${{ runner.temp }}/t/*.log
            ${{ runner.temp }}/t/*.txt
          retention-days: 7

  macos:
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    runs-on: macos-15
    timeout-minutes: 90
    env:
      PREFIX: /Users/runner/pm-prefix
      SRC: /Users/runner/pm-src
      CCACHE_DIR: /Users/runner/pm-ccache
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: brew install nasm pkgconf meson ninja ccache glslang shaderc spirv-headers molten-vk vulkan-loader libass luajit || true
      - uses: actions/cache@v4
        with:
          path: |
            /Users/runner/pm-ccache
            /Users/runner/pm-src
            /Users/runner/pm-prefix
          key: mpvnative-mac-${{ hashFiles('mpvnative/pins.json', 'mpvnative/ci/build-unix.sh') }}-${{ github.run_id }}
          restore-keys: mpvnative-mac-${{ hashFiles('mpvnative/pins.json', 'mpvnative/ci/build-unix.sh') }}-
      - name: Build
        timeout-minutes: 60
        run: bash mpvnative/ci/build-unix.sh "$PREFIX" "$SRC" macos
      - name: Engine and checks
        timeout-minutes: 15
        run: |
          ort=""; python3 -I pmml/scripts/fetch_runtime.py --pin scripts/ml-runtime-pin.json --platform osx-arm64 --out "$RUNNER_TEMP/cd-ort" --cache "$RUNNER_TEMP/cd-ort-dl" --flavors core --headers >/dev/null 2>&1 && ort="-DPME_CONTENT_ORT_INCLUDE=$RUNNER_TEMP/cd-ort/ort/core/include" || echo "::warning::ONNX Runtime headers not fetched: the engine builds without the image model"
          cmake -S mpvnative/engine -B build-engine -DCMAKE_BUILD_TYPE=Release -DPME_FETCH_GPU_DEPS=ON $ort && cmake --build build-engine --parallel
          ./build-engine/out/engine_test
          export PUSHMPC_ENGINE="$PWD/build-engine/out/libpushmpc_engine.dylib" DYLD_LIBRARY_PATH="$PREFIX/lib"
          bash mpvnative/tests/run-tests.sh "$PREFIX" "$RUNNER_TEMP/t" macos

  # (b) the runtime hook into an EXISTING mpv: one private libavfilter per FFmpeg branch (6.0 .. 9.1) and architecture,
  # picked at run time by the system's avfilter_version(); then the distros' own mpv: Ubuntu 24.04 (FFmpeg 6.1),
  # Debian 13 (7.1), Arch (current).
  #
  # The builds below depend only on the pins and the filter sources: hook-cache looks their output up first (one
  # entry per architecture) and when both are there the builds are skipped and the hook job restores them instead.
  # A tag build (fresh) always builds them.
  hook-cache:
    if: ${{ inputs.part != 'extra' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      key: ${{ steps.key.outputs.key }}
      # plex-linux (dispatch only) takes the build artifacts themselves
      hit: ${{ steps.x64.outputs.cache-hit == 'true' && steps.arm64.outputs.cache-hit == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.plex_linux) && inputs.fresh != true }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            mpvnative
            vsplugin/engines/gpu
      - name: Key (the pins, the build scripts, the filter sources, the branch list)
        id: key
        run: echo "key=mpvnative-hooklibs-out-v2-${{ hashFiles('mpvnative/pins.json', 'vsplugin/engines/gpu/gpu-pins.json', 'mpvnative/ci/fetch-commit.sh', 'mpvnative/ci/ffbuild-cache.sh', 'mpvnative/hook/build-hook-branch.sh', 'mpvnative/hook/build-hook.sh', 'mpvnative/hook/pushmpc_hook_glue.c', 'mpvnative/ffmpeg/**', 'mpvnative/include/**') }}-n50-n51-snap-n60-n61-n70-n71-n80-n81-n90-n91" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: x64
        with: { path: '${{ runner.temp }}/hooklibs', key: '${{ steps.key.outputs.key }}-x64', lookup-only: true }
      - uses: actions/cache/restore@v4
        id: arm64
        with: { path: '${{ runner.temp }}/hooklibs', key: '${{ steps.key.outputs.key }}-arm64', lookup-only: true }

  hook-libs:
    needs: hook-cache
    if: ${{ needs.hook-cache.outputs.hit != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        # every pinned tag of each branch (point releases can bump the micro version: 7.1 is 10.4.100, 7.1.5 is
        # 10.5.100), three groups per architecture: 6 jobs, not 22 (each tag's built tree is cached, so a filter change
        # only recompiles vf_pushmpc.o and relinks). A branch added here goes into the hook-cache key's list too.
        group: ['n5.0 n5.1 snapshots n6.0', 'n6.1 n7.0 n7.1', 'n8.0 n8.1 n9.0 n9.1']
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      ARCH: ${{ matrix.runner == 'ubuntu-24.04-arm' && 'arm64' || 'x64' }}
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo rm -f /var/lib/man-db/auto-update; sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends build-essential pkg-config patchelf
      - name: Group name and tree cache key
        id: g
        run: |
          g=$(echo "${{ matrix.group }}" | tr -d '.' | tr ' ' '-')
          echo "name=$g" >> "$GITHUB_OUTPUT"
          echo "key=mpvnative-ffbuild-hook-$ARCH-$g-${{ hashFiles('mpvnative/pins.json', 'vsplugin/engines/gpu/gpu-pins.json', 'mpvnative/hook/build-hook.sh', 'mpvnative/ci/ffbuild-cache.sh', 'mpvnative/ffmpeg/**', 'mpvnative/include/**', 'mpvnative/hook/pushmpc_hook_glue.c') }}" >> "$GITHUB_OUTPUT"
      # every tag's configured and built tree (ffbuild-cache.sh): the newest entry of this group, whatever changed since
      - uses: actions/cache/restore@v4
        if: ${{ !inputs.fresh }}
        id: trees
        with:
          path: ${{ runner.temp }}/ffb
          key: ${{ steps.g.outputs.key }}
          restore-keys: mpvnative-ffbuild-hook-${{ env.ARCH }}-${{ steps.g.outputs.name }}-
      - name: Vulkan-Headers (pinned in gpu-pins.json; Vulkan frames into the engine for FFmpeg 7.1 and newer)
        run: |
          set -eu
          url=$(python3 -c "import json; print(json.load(open('vsplugin/engines/gpu/gpu-pins.json'))['vulkanHeaders']['url'])")
          sha=$(python3 -c "import json; print(json.load(open('vsplugin/engines/gpu/gpu-pins.json'))['vulkanHeaders']['sha256'])")
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/vh.tgz" "$url"
          echo "$sha  $RUNNER_TEMP/vh.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/vh" && tar -xzf "$RUNNER_TEMP/vh.tgz" -C "$RUNNER_TEMP/vh" --strip-components=1
          echo "PUSHMPC_VULKAN_HEADERS=$RUNNER_TEMP/vh" >> "$GITHUB_ENV"
      - name: Every tag of FFmpeg ${{ matrix.group }} (pinned) and its private libavfilter
        id: build
        run: |
          [ "${{ inputs.fresh }}" = true ] || export FFB_CACHE="$RUNNER_TEMP/ffb"
          for b in ${{ matrix.group }}; do bash mpvnative/hook/build-hook-branch.sh "$b" "$RUNNER_TEMP/ffmpeg" "$RUNNER_TEMP/hooklib"; done
      - uses: actions/cache/save@v4
        if: ${{ !inputs.fresh && steps.trees.outputs.cache-hit != 'true' && steps.build.outcome == 'success' }}
        with: { path: '${{ runner.temp }}/ffb', key: '${{ steps.g.outputs.key }}' }
      - uses: actions/upload-artifact@v4
        with:
          name: hooklib-${{ env.ARCH }}-${{ steps.g.outputs.name }}
          path: ${{ runner.temp }}/hooklib/*.so
          retention-days: 7

  hook:
    needs: [hook-cache, hook-libs]
    if: ${{ !cancelled() && needs.hook-cache.result == 'success' && (needs.hook-libs.result == 'success' || (needs.hook-libs.result == 'skipped' && needs.hook-cache.outputs.hit == 'true')) }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      HOOKLIBS_KEY: ${{ needs.hook-cache.outputs.key }}-${{ matrix.runner == 'ubuntu-24.04-arm' && 'arm64' || 'x64' }}
    steps:
      - uses: actions/checkout@v4
      - name: Packages (the distro mpv and FFmpeg)
        run: |
          sudo rm -f /var/lib/man-db/auto-update; sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mpv libmpv-dev ffmpeg build-essential cmake patchelf glslang-tools pkg-config gdb mesa-vulkan-drivers vulkan-tools
          mpv --version | head -1; dpkg -s libavfilter9 | grep -E '^Version'
      - uses: actions/download-artifact@v4
        if: needs.hook-libs.result == 'success'
        with:
          pattern: hooklib-${{ matrix.runner == 'ubuntu-24.04-arm' && 'arm64' || 'x64' }}-*
          path: ${{ runner.temp }}/hooklibs
      - uses: actions/cache/save@v4
        if: needs.hook-libs.result == 'success'
        with: { path: '${{ runner.temp }}/hooklibs', key: '${{ env.HOOKLIBS_KEY }}' }
      - uses: actions/cache/restore@v4
        if: needs.hook-libs.result != 'success'
        with: { path: '${{ runner.temp }}/hooklibs', key: '${{ env.HOOKLIBS_KEY }}', fail-on-cache-miss: true }
      - name: The hook and the engine module
        run: |
          # one file per libavfilter version (two tags of one version give the same build; copied one after another)
          mkdir -p "$RUNNER_TEMP/hook"
          for d in $(ls -d "$RUNNER_TEMP"/hooklibs/*/ | sort -V); do cp "$d"*.so "$RUNNER_TEMP/hook/"; done
          # the hook on Debian 12 too (build-hook-c.sh; a runner build needed GLIBC_2.38 and Snap's Plex refused it)
          sh mpvnative/hook/build-hook-c.sh "$RUNNER_TEMP/hookc"
          cp "$RUNNER_TEMP/hookc/pushmpc_hook.so" "$RUNNER_TEMP/hook/"
          cp mpvnative/ci/SOURCES.txt "$RUNNER_TEMP/hook/"
          ls -la "$RUNNER_TEMP/hook"
          # the engine for distro mpv is built on Debian 12 (glibc 2.36, the oldest system the hook targets), so it loads
          # on every distro from there on (a build on the runner's glibc 2.39 does not load on Debian 12)
          docker run --rm -v "$PWD:/w" -w /w debian:bookworm sh -c 'apt-get update -qq >/dev/null && apt-get install -y -qq --no-install-recommends cmake g++ make glslang-tools ca-certificates >/dev/null && cmake -S mpvnative/engine -B build-engine-bookworm -DCMAKE_BUILD_TYPE=Release -DPME_FETCH_GPU_DEPS=ON >/dev/null && cmake --build build-engine-bookworm --parallel --target pushmpc_engine > /tmp/b.log 2>&1 || { tail -30 /tmp/b.log; exit 1; }'
          cp build-engine-bookworm/out/libpushmpc_engine.so "$RUNNER_TEMP/hook/"
          # everything this folder ships (the hook, the engine, every libavfilter glue build): at most GLIBC_2.35
          sh mpvnative/hook/glibc-ceiling.sh "$RUNNER_TEMP"/hook/*.so
      - name: Ubuntu 24.04's mpv (FFmpeg 6.1)
        run: sh mpvnative/hook/test-hook.sh "$RUNNER_TEMP/hook" "$RUNNER_TEMP/hook/libpushmpc_engine.so" "$RUNNER_TEMP/t-ubuntu"
      - name: The engines Auto picks in the hook (software frames; the Vulkan engine on lavapipe)
        if: ${{ !inputs.release }}
        run: sh mpvnative/hook/test-hook-engines.sh "$RUNNER_TEMP/hook" "$RUNNER_TEMP/t-engines"
      - name: Setup's entry point (pushmpc-native.sh) in a fake HOME
        run: sh mpvnative/install/test-install.sh "$RUNNER_TEMP/hook" "$RUNNER_TEMP/t-install"
      - name: Debian 13's mpv (FFmpeg 7.1)
        if: ${{ format('{0}', inputs.tests) != 'false' }}
        timeout-minutes: 15
        run: |
          docker run --rm -v "$PWD:/w" -v "$RUNNER_TEMP/hook:/hook" debian:trixie sh -c \
            'apt-get update -qq >/dev/null && apt-get install -y -qq --no-install-recommends mpv ffmpeg python3 >/dev/null && sh /w/mpvnative/hook/test-hook.sh /hook /hook/libpushmpc_engine.so /tmp/t'
      - name: Debian 12's mpv (FFmpeg 5.1, libavfilter 8)
        if: ${{ format('{0}', inputs.tests) != 'false' }}
        timeout-minutes: 15
        run: |
          docker run --rm -v "$PWD:/w" -v "$RUNNER_TEMP/hook:/hook" debian:bookworm sh -c \
            'apt-get update -qq >/dev/null && apt-get install -y -qq --no-install-recommends mpv ffmpeg python3 >/dev/null && sh /w/mpvnative/hook/test-hook.sh /hook /hook/libpushmpc_engine.so /tmp/t'
      - name: Arch's mpv (current FFmpeg)
        if: ${{ matrix.runner == 'ubuntu-24.04' && format('{0}', inputs.tests) != 'false' }}
        timeout-minutes: 15
        run: |
          docker run --rm -v "$PWD:/w" -v "$RUNNER_TEMP/hook:/hook" archlinux:latest sh -c \
            'pacman -Syu --noconfirm --needed mpv ffmpeg python >/dev/null 2>&1 && sh /w/mpvnative/hook/test-hook.sh /hook /hook/libpushmpc_engine.so /tmp/t'
      - name: Arch's mpv with Vulkan frames (FFV1 Vulkan decoding on lavapipe, gpu-next under Xvfb) into the zero-copy engine
        if: ${{ matrix.runner == 'ubuntu-24.04' && !inputs.release }}
        timeout-minutes: 15
        run: |
          docker run --rm -v "$PWD:/w" -v "$RUNNER_TEMP/hook:/hook" archlinux:latest sh -c \
            'pacman -Syu --noconfirm --needed mpv ffmpeg python vulkan-swrast xorg-server-xvfb xorg-xauth >/dev/null 2>&1 && sh /w/mpvnative/hook/test-hook-engines.sh /hook /tmp/t --vulkan-frames'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mpvnative-hook-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/hook
            ${{ runner.temp }}/t-*/*.log
          retention-days: 7

  # the Linux NVIDIA engine's kernels (nvl-kernels.yml), for the hook's NVIDIA sidecar below
  nvl-kernels:
    if: ${{ !inputs.release && inputs.part != 'extra' && format('{0}', inputs.tests) != 'false' }}
    uses: ./.github/workflows/nvl-kernels.yml

  # the hook's sidecar engines on the runner: libpushmpc_engine_nvl.so (no NVIDIA GPU here: it must load, refuse with
  # the reason and leave the next engine to run; the self-test helper refuses too) and libpushmpc_engine_ml.so (PushFlow
  # through pmml: ncnn on lavapipe and ONNX Runtime's WebGPU EP, the runtime installed by setup.sh's own pmml step), each
  # in Ubuntu's mpv through the hook; Auto's ml-versus-Vulkan choice. A real NVIDIA GPU: not on hosted runners.
  hook-sidecars:
    if: ${{ !cancelled() && needs.nvl-kernels.result == 'success' && !inputs.release && inputs.part != 'extra' && format('{0}', inputs.tests) != 'false' && needs.hook-cache.result == 'success' && (needs.hook-libs.result == 'success' || (needs.hook-libs.result == 'skipped' && needs.hook-cache.outputs.hit == 'true')) }}
    needs: [hook-cache, hook-libs, nvl-kernels]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MESA_SHADER_CACHE_DISABLE: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mpv libmpv-dev ffmpeg build-essential cmake glslang-tools pkg-config mesa-vulkan-drivers vulkan-tools python3-venv
          vulkaninfo --summary 2>/dev/null | grep -E "deviceName|driverInfo" | head -4 || true
      - uses: actions/download-artifact@v4
        if: needs.hook-libs.result == 'success'
        with: { pattern: hooklib-x64-*, path: '${{ runner.temp }}/hooklibs' }
      - uses: actions/cache/restore@v4   # hook-libs skipped (its output cached): the libraries the hook job took
        if: needs.hook-libs.result != 'success'
        with: { path: '${{ runner.temp }}/hooklibs', key: '${{ needs.hook-cache.outputs.key }}-x64', fail-on-cache-miss: true }
      - uses: actions/download-artifact@v4
        with: { name: nvl-kernels, path: nvl-kernels }
      - uses: actions/cache@v4
        with:
          path: ~/pmml-dl
          key: hook-sidecars-pmml-${{ hashFiles('scripts/ml-runtime-pin.json', 'integrations/linux/setup.sh') }}
      - name: The pmml runtime's headers, ncnn (prebuilt, Vulkan) and pmml's graphs
        run: |
          set -eu
          python3 -I pmml/scripts/fetch_runtime.py --pin scripts/ml-runtime-pin.json --platform linux-x64 --out /tmp/pmml-rt --cache ~/pmml-dl --flavors core --ncnn --headers
          python3 -m venv /tmp/g && /tmp/g/bin/python -m pip install --disable-pip-version-check -q onnx==1.17.0 numpy==1.26.4
          /tmp/g/bin/python -I pmml/scripts/make_graphs.py --out /tmp/pmml-graphs
      - name: The engine and its sidecars (NVIDIA with the prebuilt kernels, PushFlow with pmml + ncnn)
        run: |
          set -eu
          cmake -S mpvnative/engine -B build-engine -DCMAKE_BUILD_TYPE=Release -DPME_FETCH_GPU_DEPS=ON \
            -DPME_NVL_FATBIN=$PWD/nvl-kernels/nvl_kernels.fatbin -DPME_NVL_GUARD_DIR=$PWD/nvl-kernels \
            -DPMML_ORT_INCLUDE=/tmp/pmml-rt/ort/core/include -DPMML_NCNN_DIR=/tmp/pmml-rt/ncnn 2>&1 | tee /tmp/cfg.log
          if grep -E "no NVIDIA sidecar|no PushFlow sidecar|GPU cut guard OFF|no ncnn package|no Vulkan engine" /tmp/cfg.log; then echo "::error::an engine is not built"; exit 1; fi
          cmake --build build-engine --parallel
          ./build-engine/out/engine_test
          d="$RUNNER_TEMP/hook"; mkdir -p "$d"
          for x in $(ls -d "$RUNNER_TEMP"/hooklibs/*/ | sort -V); do cp "$x"*.so "$d/"; done
          sh mpvnative/hook/build-hook-c.sh "$RUNNER_TEMP/hookc" && cp "$RUNNER_TEMP/hookc/pushmpc_hook.so" "$d/"   # as shipped (Debian 12)
          cp build-engine/out/libpushmpc_engine*.so build-engine/out/pushmpc-nvvfx-selftest build-engine/out/pmml_cli "$d/"
          ls -la "$d"
          for f in "$d"/libpushmpc_engine_*.so; do readelf -d "$f" | grep -E "NEEDED.*(cuda|VideoFX|NVCV|onnxruntime)" && { echo "::error::$f links CUDA / NVIDIA / ONNX Runtime"; exit 1; }; nm -D --defined-only "$f" | grep -E " T pmeng_"; done
          # no GPU: the self-test helper refuses (exit 2)
          set +e; "$d/pushmpc-nvvfx-selftest" --gpu --runtime /nonexistent; rc=$?; set -e
          [ "$rc" = 2 ] || { echo "::error::pushmpc-nvvfx-selftest without a GPU: exit $rc (want 2)"; exit 1; }
      - name: "PushFlow runtime through setup.sh (a Radeon without ROCm: ONNX Runtime + WebGPU EP, ncnn, models)"
        env:
          PUSHMPC_TEST_GPU: '1002:744c:AMD Radeon RX 7900 XTX'
          PUSHMPC_TEST_UNAME: Linux
          PUSHMPC_NO_AUTOBENCH: '1'
        run: |
          set -eu
          t=/tmp/su; mkdir -p "$t/pmml/graphs" "$HOME/su-home"
          cp integrations/linux/setup.sh "$t/"; cp pmml/scripts/fetch_runtime.py scripts/ml-runtime-pin.json "$t/pmml/"
          cp /tmp/pmml-graphs/*.onnx "$t/pmml/graphs/"; cp build-engine/out/pmml_cli "$t/pmml/"
          HOME=$HOME/su-home XDG_DATA_HOME= sh "$t/setup.sh" pmml | tee /tmp/pmml-setup.txt
          p=$HOME/su-home/.local/share/pushmpc/pmml
          ls "$p" "$p/eps" 2>/dev/null
          for f in graphs/synth-yuv.onnx pmml_cli eps/webgpu/ep.json ncnn-models/rife-v4.25-lite_ensembleFalse/flownet.param; do [ -e "$p/$f" ] || { echo "::error::the pmml runtime lacks $f"; exit 1; }; done
          echo "PMML_RT=$p" >> "$GITHUB_ENV"
          "$p/pmml_cli" list --runtime "$p" | tee /tmp/pmml-list.txt || true
      - name: The sidecars in Ubuntu's mpv through the hook
        env:
          PUSHMPC_NO_AUTOBENCH: '1'
        run: sh mpvnative/hook/test-hook-engines.sh "$RUNNER_TEMP/hook" "$RUNNER_TEMP/t-sidecars" --sidecars "$PMML_RT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hook-sidecars-logs
          path: |
            ${{ runner.temp }}/t-sidecars
            /tmp/*.txt
            /tmp/cfg.log
          retention-days: 7

  # Plex HTPC / Plex for Windows: their libmpv-2.dll imports FFmpeg 5.x DLLs (avfilter-8.dll ...). A proxy avfilter-8.dll
  # (exports forwarded to the renamed original) adds vf_pushmpc from a matching FFmpeg 5.x build; no libmpv swap.
  # One job: the FFmpeg 5.x builds (output cached by its inputs; a hit skips MSYS2 and the build), the engine, the
  # component and its tests.
  plex:
    if: ${{ inputs.part != 'extra' }}
    runs-on: windows-2025
    timeout-minutes: 90
    defaults: { run: { shell: pwsh } }
    steps:
      - uses: actions/checkout@v4
      # the builds' output depends only on these (every FFmpeg tree is pinned by commit)
      - name: Output key
        shell: bash
        run: echo "PLEXLIBS_KEY=mpvnative-plexlibs-out-v2-${{ hashFiles('mpvnative/pins.json', 'mpvnative/ci/fetch-commit.sh', 'mpvnative/ci/ffbuild-cache.sh', 'mpvnative/plex/**', 'mpvnative/ffmpeg/**', 'mpvnative/include/**') }}" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        if: ${{ !inputs.fresh }}
        id: out-cache
        with: { path: '${{ runner.temp }}/plexlibs', key: '${{ env.PLEXLIBS_KEY }}' }
      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c   # v2, pinned by commit
        if: steps.out-cache.outputs.cache-hit != 'true'
        with:
          msystem: UCRT64
          update: false
          cache: true
          install: >-
            make git diffutils mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-tools-git
      # every tag's configured and built tree (ffbuild-cache.sh): the newest entry, whatever changed since; a filter
      # change then recompiles vf_pushmpc.o and relinks per tag instead of configuring and building each tag
      - uses: actions/cache/restore@v4
        if: ${{ steps.out-cache.outputs.cache-hit != 'true' && !inputs.fresh }}
        id: trees
        with:
          path: ${{ runner.temp }}/ffb
          key: mpvnative-ffbuild-plex-${{ hashFiles('mpvnative/pins.json', 'mpvnative/ci/ffbuild-cache.sh', 'mpvnative/plex/**', 'mpvnative/ffmpeg/**', 'mpvnative/include/**') }}
          restore-keys: mpvnative-ffbuild-plex-
      - name: FFmpeg 5.0 / 5.1 builds (every pinned tag) and the proxy avfilter-8.dll
        id: plexbuild
        if: steps.out-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        timeout-minutes: 60
        run: |
          R=$(cygpath -u "$RUNNER_TEMP")
          [ "${{ inputs.fresh }}" = true ] || export FFB_CACHE="$R/ffb"
          bash mpvnative/plex/build-plex-libs.sh "$R/ffmpeg5" "$R/plexlibs"
      # right after the build: a later cancel keeps them
      - uses: actions/cache/save@v4
        if: ${{ steps.plexbuild.outcome == 'success' && !inputs.fresh }}
        with: { path: '${{ runner.temp }}/plexlibs', key: '${{ env.PLEXLIBS_KEY }}' }
      - uses: actions/cache/save@v4
        if: ${{ steps.plexbuild.outcome == 'success' && steps.trees.outputs.cache-hit != 'true' && !inputs.fresh }}
        with:
          path: ${{ runner.temp }}/ffb
          key: mpvnative-ffbuild-plex-${{ hashFiles('mpvnative/pins.json', 'mpvnative/ci/ffbuild-cache.sh', 'mpvnative/plex/**', 'mpvnative/ffmpeg/**', 'mpvnative/include/**') }}
      - name: Engine module (MSVC) next to the proxy
        run: |
          cmake -S mpvnative/engine -B build-engine -A x64 -DPME_VULKAN=OFF
          if ($LASTEXITCODE) { throw 'configure' }
          cmake --build build-engine --config Release --target pushmpc_engine --parallel
          if ($LASTEXITCODE) { throw 'build' }
          $p = "$env:RUNNER_TEMP\plexlibs"
          Copy-Item build-engine/out/pushmpc_engine.dll, mpvnative/install/pushmpc-plex-native.ps1, mpvnative/ci/SOURCES.txt $p
          Get-ChildItem $p | ForEach-Object { "{0,10:N0}  {1}" -f $_.Length, $_.Name }
      # what release.yml stages as Setup's plexnative component (Setup self-tests it on the user's Plex)
      - uses: actions/upload-artifact@v4
        with:
          name: plexnative
          path: ${{ runner.temp }}/plexlibs/
          retention-days: 7
      - name: Plex HTPC and Plex for Windows (winget)
        if: ${{ format('{0}', inputs.tests) != 'false' }}
        timeout-minutes: 20
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -Force -Scope CurrentUser | Out-Null
            Install-Module Microsoft.WinGet.Client -Force -Scope CurrentUser -Repository PSGallery
            Repair-WinGetPackageManager -AllUsers -Latest
          }
          foreach ($id in 'Plex.PlexHTPC', 'Plex.Plex') {
            winget install --id $id -e --silent --accept-package-agreements --accept-source-agreements --disable-interactivity 2>&1 | Select-Object -Last 2
            "winget $id`: exit $LASTEXITCODE"
          }
          Start-Sleep -Seconds 5
          Get-Process -Name 'Plex', 'Plex HTPC' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Add-Type -TypeDefinition @'
          using System; using System.Runtime.InteropServices;
          public static class FF {
            [DllImport("kernel32", CharSet = CharSet.Unicode, SetLastError = true)] public static extern bool SetDllDirectory(string p);
            [DllImport("kernel32", CharSet = CharSet.Unicode, SetLastError = true)] public static extern IntPtr LoadLibrary(string p);
            [DllImport("kernel32", CharSet = CharSet.Ansi)] public static extern IntPtr GetProcAddress(IntPtr m, string n);
            [UnmanagedFunctionPointer(CallingConvention.Cdecl)] public delegate uint U();
            [UnmanagedFunctionPointer(CallingConvention.Cdecl)] public delegate IntPtr S();
          }
          '@
          foreach ($d in "$env:ProgramFiles\Plex\Plex HTPC", "$env:ProgramFiles\Plex\Plex") {
            if (-not (Test-Path "$d\avfilter-8.dll")) { "$d`: no avfilter-8.dll"; continue }
            $exe = Get-ChildItem $d -Filter 'Plex*.exe' | Select-Object -First 1
            [FF]::SetDllDirectory($d) | Out-Null
            $m = [FF]::LoadLibrary("$d\avfilter-8.dll")
            $v = [Runtime.InteropServices.Marshal]::GetDelegateForFunctionPointer([FF]::GetProcAddress($m, 'avfilter_version'), [FF+U]).Invoke()
            $cfg = [Runtime.InteropServices.Marshal]::PtrToStringAnsi([Runtime.InteropServices.Marshal]::GetDelegateForFunctionPointer([FF]::GetProcAddress($m, 'avfilter_configuration'), [FF+S]).Invoke())
            "== $d ($($exe.Name) $($exe.VersionInfo.ProductVersion)): libavfilter $($v -shr 16).$(($v -shr 8) -band 255).$($v -band 255); configure: $($cfg.Substring(0, [Math]::Min(300, $cfg.Length)))"
          }
          exit 0
      - name: Proxy install, self-test through Plex's own libmpv, uninstall bit-exact (Windows PowerShell 5.1 and PowerShell 7)
        if: ${{ format('{0}', inputs.tests) != 'false' }}
        timeout-minutes: 20
        run: |
          $p = "$env:RUNNER_TEMP\plexlibs"
          Copy-Item mpvnative/install/test-plex-conf.ps1 $p
          $dirs = @("$env:ProgramFiles\Plex\Plex HTPC", "$env:ProgramFiles\Plex\Plex") | Where-Object { Test-Path "$_\libmpv-2.dll" }
          if (-not $dirs) { Write-Host '::error::no Plex app installed on the runner'; exit 1 }
          $confs = "$env:LOCALAPPDATA\Plex HTPC\mpv.conf", "$env:LOCALAPPDATA\Plex\mpv.conf"
          # a user's own mpv.conf for HTPC (UTF-8 with BOM, LF line ends); none for the desktop app
          New-Item -ItemType Directory -Force (Split-Path $confs[0]) | Out-Null
          [IO.File]::WriteAllBytes($confs[0], [byte[]](0xEF, 0xBB, 0xBF) + [Text.Encoding]::UTF8.GetBytes("hwdec=auto`nvolume=70`n"))
          Remove-Item $confs[1] -ErrorAction SilentlyContinue
          function Snap { foreach ($d in $dirs) { Get-ChildItem $d -Recurse -File | Sort-Object FullName | ForEach-Object { "$((Get-FileHash $_.FullName).Hash) $($_.FullName)" } }; foreach ($c in $confs) { "$c $(if (Test-Path $c) { (Get-FileHash $c).Hash } else { 'absent' })" } }
          $fails = 0
          $env:PUSHMPC_PROXY_LOG = "$env:RUNNER_TEMP\proxy.log"
          foreach ($hostExe in 'powershell.exe', 'pwsh.exe') {
            Write-Host "===== $hostExe"
            & $hostExe -NoProfile -ExecutionPolicy Bypass -File "$p\test-plex-conf.ps1" | ForEach-Object { Write-Host "conf test: $_" }
            if ($LASTEXITCODE) { Write-Host "::error::$hostExe`: mpv.conf edit test failed"; $fails++ }
            $before = Snap
            # -NoConf first, then a plain install on the installed proxy: must still write the conf block (idempotent)
            $o1 = & $hostExe -NoProfile -ExecutionPolicy Bypass -File "$p\pushmpc-plex-native.ps1" install -From $p -NoConf -Json; $o1 | ForEach-Object { Write-Host "install -NoConf: $_" }
            $out = & $hostExe -NoProfile -ExecutionPolicy Bypass -File "$p\pushmpc-plex-native.ps1" install -From $p -Opts 'smoother=2' -Json; $rc = $LASTEXITCODE
            $out | ForEach-Object { Write-Host "install again: $_" }
            foreach ($c in $confs) {
              $n = if (Test-Path $c) { ([regex]::Matches([IO.File]::ReadAllText($c), 'PushMPC native \(Plex\): do not edit')).Count } else { 0 }
              if ($n -ne 1) { Write-Host "::error::$hostExe`: $c holds $n PushMPC blocks after the second install"; $fails++ }
            }
            $st = & $hostExe -NoProfile -ExecutionPolicy Bypass -File "$p\pushmpc-plex-native.ps1" status -From $p -Json; $st | ForEach-Object { Write-Host "status: $_" }
            $un = & $hostExe -NoProfile -ExecutionPolicy Bypass -File "$p\pushmpc-plex-native.ps1" uninstall -From $p -Json; $un | ForEach-Object { Write-Host "uninstall: $_" }
            $diff = Compare-Object $before (Snap)
            if ($diff) { $diff | Select-Object -First 20 | Out-String | Write-Host; Write-Host "::error::$hostExe`: uninstall did not restore the Plex folders and mpv.conf files bit for bit"; $fails++ }
            else { Write-Host "$hostExe`: Plex folders and mpv.conf files (one with a BOM, one absent) restored bit for bit" }
            $ok = @($out | ConvertFrom-Json | Where-Object { $_.state -eq 'installed' -and $_.detail -match ', x2' }).Count
            if ($rc -ne 0 -or $ok -ne @($dirs).Count) { Write-Host "::error::$hostExe`: install/self-test failed (exit $rc, $ok of $(@($dirs).Count) apps active)"; $fails++ }
          }
          # after a Plex update (Plex writes its own avfilter-8.dll again; our builds and engine stay in the folder) and
          # after a PushMPC upgrade (an older proxy of ours in place): reapply / install, then uninstall must give the
          # stock folder back bit for bit (powershell.exe 5.1, as Setup runs it)
          foreach ($case in 'plex-update', 'pushmpc-upgrade') {
            Write-Host "===== $case"
            $before = Snap
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$p\pushmpc-plex-native.ps1" install -From $p -NoConf -Json | Out-Null
            foreach ($d in $dirs) {
              $key = if ($d -like '*HTPC') { 'htpc' } else { 'desktop' }
              if ($case -eq 'plex-update') { Copy-Item "$env:ProgramData\PushMPC\plex-native\$key\avfilter-8.dll" "$d\avfilter-8.dll" -Force }
              else { [IO.File]::AppendAllText("$d\avfilter-8.dll", 'older-proxy') }   # still our proxy, another version
            }
            $verb = if ($case -eq 'plex-update') { 'reapply' } else { 'install' }
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$p\pushmpc-plex-native.ps1" $verb -From $p -NoConf -Json | ForEach-Object { Write-Host "$verb`: $_" }
            foreach ($d in $dirs) {
              $key = if ($d -like '*HTPC') { 'htpc' } else { 'desktop' }
              $listed = @(Get-Content "$env:ProgramData\PushMPC\plex-native\$key\added.txt")
              foreach ($f in @(Get-ChildItem $p -Filter 'pushmpc-avfilter-8.*.dll').Name + 'pushmpc_engine.dll') {
                if ($listed -notcontains $f) { Write-Host "::error::$case`: $key added.txt lacks $f"; $fails++ }
              }
            }
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$p\pushmpc-plex-native.ps1" uninstall -From $p -Json | ForEach-Object { Write-Host "uninstall: $_" }
            $diff = Compare-Object $before (Snap)
            if ($diff) { $diff | Select-Object -First 20 | Out-String | Write-Host; Write-Host "::error::$case`: the Plex folders are not stock after uninstall"; $fails++ }
            else { Write-Host "$case`: Plex folders bit for bit stock after uninstall" }
          }
          if (Test-Path $env:PUSHMPC_PROXY_LOG) { Get-Content $env:PUSHMPC_PROXY_LOG | Select-Object -First 4 | ForEach-Object { Write-Host "proxy log: $_" } }
          if ($fails) { exit 1 }
          Write-Host 'plex: all checks passed under Windows PowerShell 5.1 and PowerShell 7'

  # Plex desktop / HTPC on Linux (Flathub): Plex bundles libmpv + FFmpeg 5.x (libavfilter.so.8); pushmpc_preload.so via
  # `flatpak override --env=LD_PRELOAD` adds vf_pushmpc. Self-test inside the sandbox with Plex's own libmpv.
  plex-linux:
    if: github.event_name == 'workflow_dispatch' && inputs.plex_linux
    needs: hook-libs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hooklib-x64-*
          path: ${{ runner.temp }}/hooklibs
      - name: The preload, the engine (Debian 12 build), the self-test host
        run: |
          d="$RUNNER_TEMP/plexlin"; mkdir -p "$d"
          for x in $(ls -d "$RUNNER_TEMP"/hooklibs/*/ | sort -V); do cp "$x"*.so "$d/"; done
          # the preload, the self-test host and the hook (Plex's C plugin) as shipped: built on Debian 12 (build-hook-c.sh)
          sudo apt-get install -y -q --no-install-recommends libmpv-dev >/dev/null
          sh mpvnative/hook/build-hook-c.sh "$d"
          docker run --rm -v "$PWD:/w" -w /w debian:bookworm sh -c 'apt-get update -qq >/dev/null && apt-get install -y -qq --no-install-recommends cmake g++ make glslang-tools ca-certificates >/dev/null && cmake -S mpvnative/engine -B build-engine-bookworm -DCMAKE_BUILD_TYPE=Release -DPME_FETCH_GPU_DEPS=ON >/dev/null && cmake --build build-engine-bookworm --parallel --target pushmpc_engine > /tmp/b.log 2>&1 || { tail -30 /tmp/b.log; exit 1; }'
          cp build-engine-bookworm/out/libpushmpc_engine.so mpvnative/ci/SOURCES.txt "$d/"
          ls "$d" | tr '\n' ' '
      - name: Flathub Plex (tv.plex.PlexDesktop, tv.plex.PlexHTPC)
        timeout-minutes: 25
        run: |
          sudo rm -f /var/lib/man-db/auto-update; sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends flatpak xvfb xauth >/dev/null
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          for id in tv.plex.PlexDesktop tv.plex.PlexHTPC; do
            flatpak install --user -y --noninteractive flathub "$id" > /dev/null 2>&1 && echo "$id: installed $(flatpak info --user "$id" | sed -n 's/^ *Version: //p')" || echo "$id: not installed"
          done
          for id in tv.plex.PlexDesktop tv.plex.PlexHTPC; do
            flatpak info --user "$id" >/dev/null 2>&1 || continue
            echo "== $id: libmpv / libav* in the app"
            flatpak run --user --command=sh "$id" -c 'find /app -name "libmpv*.so*" -o -name "libavfilter*.so*" -o -name "libavutil*.so*" 2>/dev/null | head -8' || true
            echo "== $id: a 25 s start under Xvfb, then the data folders it made (where mpv.conf goes)"
            timeout 25 xvfb-run -a flatpak run --user "$id" > /dev/null 2>&1 || true
            flatpak kill "$id" 2>/dev/null || true
            (cd "$HOME/.var/app/$id" && find . -maxdepth 3 -type d | grep -v '/cache' | sort | head -30)
          done
      - name: Install (self-test through Plex's libmpv in its sandbox), status, uninstall bit-exact
        timeout-minutes: 15
        run: |
          set +e; d="$RUNNER_TEMP/plexlin"; fails=0; tested=0
          for id in tv.plex.PlexDesktop tv.plex.PlexHTPC; do
            flatpak info --user "$id" >/dev/null 2>&1 || continue
            tested=$((tested + 1))
            n=$( [ "$id" = tv.plex.PlexDesktop ] && echo desktop || echo htpc )
            snap() { (cd "$HOME/.var/app" && find "$id" \( -path '*/cache' -o -path '*/Plex Media Server' -o -path '*/Logs' -o -path '*/.local/state' -o -path '*/.ld.so' \) -prune -o -type f -print0 | sort -z | xargs -0r sha256sum); flatpak override --user --show "$id" 2>/dev/null; }
            before=$(snap)
            out=$(sh mpvnative/install/pushmpc-plex-linux.sh install --from "$d" --target "$n" --json); rc=$?; echo "install: $out"
            echo "$out" | grep -q '"state":"installed"' && echo "$out" | grep -q 'selftest: .*x2' && [ "$rc" = 0 ] \
              && echo "$id: vf_pushmpc active through Plex's libmpv" || { echo "::error::$id: install/self-test failed (exit $rc)"; fails=$((fails + 1)); }
            flatpak override --user --show "$id"
            echo "status: $(sh mpvnative/install/pushmpc-plex-linux.sh status --target "$n" --json)"
            echo "uninstall: $(sh mpvnative/install/pushmpc-plex-linux.sh uninstall --target "$n" --json)"
            after=$(snap); [ "$after" = "$before" ] && echo "$id: uninstall restored the files and overrides exactly" || { diff <(echo "$before") <(echo "$after") | head -20; echo "::error::$id: files or overrides differ after uninstall"; fails=$((fails + 1)); }
          done
          [ "$tested" -gt 0 ] || { echo "::error::no Plex Flatpak installed"; exit 1; }
          [ "$fails" = 0 ] && echo "plex-linux: all checks passed" || exit 1

  # Plex HTPC / Plex desktop as plain files (the tarball target): Plex ships no Linux tarball any more (its downloads
  # list Windows and macOS only), so the distros' packages (the AUR's) unpack Plex's own Snap into a folder. The same
  # here: `snap download` + unsquashfs, a Plex.sh where the Snap has none, then pushmpc-plex-linux.sh --target tarball:
  # the self-test through Plex's libmpv with the preload (x2), status, uninstall bit-exact (folder and fake HOME).
  plex-linux-tarball:
    if: ${{ !cancelled() && !inputs.release && inputs.part != 'extra' && format('{0}', inputs.tests) != 'false' && needs.hook-cache.result == 'success' && (needs.hook-libs.result == 'success' || (needs.hook-libs.result == 'skipped' && needs.hook-cache.outputs.hit == 'true')) }}
    needs: [hook-cache, hook-libs]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.hook-libs.result == 'success'
        with:
          pattern: hooklib-x64-*
          path: ${{ runner.temp }}/hooklibs
      - uses: actions/cache/restore@v4   # hook-libs skipped (its output cached): the libraries the hook job took
        if: needs.hook-libs.result != 'success'
        with: { path: '${{ runner.temp }}/hooklibs', key: '${{ needs.hook-cache.outputs.key }}-x64', fail-on-cache-miss: true }
      - name: The preload, the engine (Debian 12 build), the self-test host
        run: |
          d="$RUNNER_TEMP/plexlin"; mkdir -p "$d"
          for x in $(ls -d "$RUNNER_TEMP"/hooklibs/*/ | sort -V); do cp "$x"*.so "$d/"; done
          # the preload, the self-test host and the hook (Plex's C plugin) as shipped: built on Debian 12 (build-hook-c.sh)
          sudo apt-get install -y -q --no-install-recommends libmpv-dev >/dev/null
          sh mpvnative/hook/build-hook-c.sh "$d"
          docker run --rm -v "$PWD:/w" -w /w debian:bookworm sh -c 'apt-get update -qq >/dev/null && apt-get install -y -qq --no-install-recommends cmake g++ make glslang-tools ca-certificates >/dev/null && cmake -S mpvnative/engine -B build-engine-bookworm -DCMAKE_BUILD_TYPE=Release -DPME_FETCH_GPU_DEPS=ON >/dev/null && cmake --build build-engine-bookworm --parallel --target pushmpc_engine > /tmp/b.log 2>&1 || { tail -30 /tmp/b.log; exit 1; }'
          cp build-engine-bookworm/out/libpushmpc_engine.so mpvnative/ci/SOURCES.txt "$d/"
          ls "$d" | tr '\n' ' '
      - name: Plex's Snaps unpacked into folders (the AUR's route)
        timeout-minutes: 10
        run: |
          sudo apt-get install -y -q --no-install-recommends squashfs-tools >/dev/null
          cd "$RUNNER_TEMP"
          for s in plex-htpc plex-desktop; do
            snap download "$s" > "$s.dl.txt" 2>&1 || { echo "$s: no Snap ($(tail -1 "$s.dl.txt"))"; continue; }
            f=$(ls "$s"_*.snap | head -1); t="$RUNNER_TEMP/tar-$s"
            unsquashfs -q -d "$t" "$f" >/dev/null && rm -f "$s"_*.snap "$s"_*.assert
            echo "$s: $(sed -n 's/^version: *//p' "$t/meta/snap.yaml" | head -1)"
            find "$t" -maxdepth 2 \( -name 'Plex*' -o -name '*.sh' \) | head -10
            find "$t" -name 'libmpv.so*' -o -name 'libavfilter.so*' | head -4
            if [ ! -f "$t/Plex.sh" ]; then
              # the Snap starts Plex through its own command chain: a plain launcher with the bundled libraries first
              bin=$(find "$t" -type f -name Plex -perm -u+x | head -1)
              [ -n "$bin" ] || { echo "::error::$s: no Plex binary in the Snap"; exit 1; }
              libs=$(find "$t" -name '*.so*' -type f -printf '%h\n' | sort -u | tr '\n' ':')
              printf '#!/bin/sh\nLD_LIBRARY_PATH="%s${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" exec "%s" "$@"\n' "$libs" "$bin" > "$t/Plex.sh"
              chmod +x "$t/Plex.sh"
            fi
          done
          ls -d "$RUNNER_TEMP"/tar-* >/dev/null 2>&1 || { echo "::error::no Plex Snap could be downloaded"; exit 1; }
      - name: Install (self-test through Plex's libmpv with the preload), status, uninstall bit-exact
        timeout-minutes: 10
        run: |
          set +e; d="$RUNNER_TEMP/plexlin"; fails=0
          for t in "$RUNNER_TEMP"/tar-*; do
            export HOME="$RUNNER_TEMP/home-$(basename "$t")"; mkdir -p "$HOME"
            # the libraries Plex's libmpv needs from its own folders (what Plex.sh / the Snap's launcher sets)
            export LD_LIBRARY_PATH=$(find "$t" -name '*.so*' -type f -printf '%h\n' | sort -u | tr '\n' ':' | sed 's/:$//')
            snap() { (cd "$t" && find . -type f -print0 | sort -z | xargs -0r sha256sum); (cd "$HOME" && find . -type f -print0 | sort -z | xargs -0r sha256sum); }
            before=$(snap)
            out=$(sh mpvnative/install/pushmpc-plex-linux.sh install --from "$d" --target tarball --tarball-dir "$t" --json); rc=$?; echo "install: $out"
            echo "$out" | grep -q '"state":"installed"' && echo "$out" | grep -q 'selftest: .*x2' && [ "$rc" = 0 ] \
              && echo "$t: vf_pushmpc active through Plex's libmpv" || { echo "::error::$(basename "$t"): install/self-test failed (exit $rc)"; fails=$((fails + 1)); }
            # which route this Plex got: hook (its libmpv runs C plugins) or the static line
            echo "$(basename "$t"): libmpv C plugins: $(grep -q -a mpv_open_cplugin "$(find "$t" -name 'libmpv.so*' | sort | head -1)" && echo yes || echo no); $(echo "$out" | grep -o 'route: [a-z0-9]*' | head -1); $(echo "$out" | grep -o 'C plugin: [a-z ]*' | head -1)"
            cat "$HOME/.local/share/plex/mpv.conf"
            [ -x "$HOME/.local/bin/plex-pushmpc" ] && cat "$HOME/.local/bin/plex-pushmpc" || { echo "::error::no launcher"; fails=$((fails + 1)); }
            echo "status: $(sh mpvnative/install/pushmpc-plex-linux.sh status --target tarball --tarball-dir "$t" --json)"
            echo "uninstall: $(sh mpvnative/install/pushmpc-plex-linux.sh uninstall --target tarball --tarball-dir "$t" --json)"
            after=$(snap); [ "$after" = "$before" ] && echo "$t: uninstall restored the folder and HOME exactly" || { diff <(echo "$before") <(echo "$after") | head -20; echo "::error::$(basename "$t"): files differ after uninstall"; fails=$((fails + 1)); }
            # the fallback where a libmpv runs no C plugins: the static 10-bit line (as with RTX Video HDR asked for and
            # NVIDIA's engine installed), self-test, uninstall bit-exact
            out=$(PUSHMPC_TEST_NO_HOOK=1 PUSHMPC_TEST_HDR10=1 sh mpvnative/install/pushmpc-plex-linux.sh install --from "$d" --target tarball --tarball-dir "$t" --json); rc=$?; echo "install (hdr10): $out"
            if echo "$out" | grep -q 'route: hdr10' && echo "$out" | grep -q 'selftest: .*x2' && [ "$rc" = 0 ] && grep -qF 'vf-append=@pushmpcdepth:lavfi=[format=yuv420p10le]' "$HOME/.local/share/plex/mpv.conf" && grep -q 'source_depth=-1' "$HOME/.local/share/plex/mpv.conf"; then
              echo "$(basename "$t"): the hdr10 fallback line is written and the filter runs"
            else
              echo "::error::$(basename "$t"): the hdr10 fallback route failed (exit $rc)"; fails=$((fails + 1))
            fi
            sh mpvnative/install/pushmpc-plex-linux.sh uninstall --target tarball --tarball-dir "$t" --json >/dev/null
            after=$(snap); [ "$after" = "$before" ] || { echo "::error::$(basename "$t"): files differ after the hdr10 uninstall"; fails=$((fails + 1)); }
          done
          [ "$fails" = 0 ] && echo "plex-linux-tarball: all checks passed" || exit 1

  # Plex for Mac / Plex HTPC for Mac: hardened runtime with disable-library-validation, FFmpeg 5.x as separate universal
  # dylibs (libavfilter.8.dylib = 8.29.100). Proxy libavfilter.8.dylib in Contents/Frameworks; self-test through Plex's
  # libmpv, a real launch of the modified app, uninstall bit-exact. Dispatch only (plex_macos input).
  #
  # release.yml (tests off): the bundle is cached under a hash of everything it is built from. plexmac-cache looks it up
  # on Linux and, on a hit, hands it on as the plexmac artifact: no macOS runner at all. On a miss plex-macos builds it
  # (the FFmpeg build folders cached per snapshot, ffbuild-cache.sh) and saves it. A tag build (fresh) always builds it.
  plexmac-cache:
    if: ${{ inputs.part != 'release' && (inputs.release || (github.event_name == 'workflow_dispatch' && inputs.plex_macos)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      key: ${{ steps.key.outputs.key }}
      hit: ${{ steps.lookup.outputs.cache-hit == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            mpvnative
            vsplugin
            pushmpc/include
            filter/src
            vlcplugin
            integrations/iina
          persist-credentials: false
      - name: Key (everything the bundle is built from)
        id: key
        run: echo "key=mpvnative-plexmac-out-v2-${{ hashFiles('mpvnative/pins.json', 'mpvnative/ci/fetch-commit.sh', 'mpvnative/ci/ffbuild-cache.sh', 'mpvnative/ci/SOURCES.txt', 'mpvnative/plex-mac/**', 'mpvnative/ffmpeg/**', 'mpvnative/include/**', 'mpvnative/engine/**', 'mpvnative/hook/libmpv_host.c', 'mpvnative/install/pushmpc-plex-mac.sh', 'vsplugin/engines/**', 'vsplugin/third_party/pushfps-portable/**', 'vsplugin/third_party/nis/**', 'vsplugin/src/**', 'vsplugin/stub/**', 'pushmpc/include/**', 'filter/src/*.h', 'vlcplugin/**', 'integrations/iina/**', 'mpvnative/install/pushmpc-mac-players.sh') }}" >> "$GITHUB_OUTPUT"
      # only with tests off (a test run always builds and tests on macOS) and never for a tag build
      - uses: actions/cache/restore@v4
        if: ${{ format('{0}', inputs.tests) == 'false' && !inputs.fresh }}
        id: lookup
        with: { path: plexmac-out, key: '${{ steps.key.outputs.key }}', enableCrossOsArchive: true }
      - uses: actions/upload-artifact@v4
        if: steps.lookup.outputs.cache-hit == 'true'
        with: { name: plexmac, path: plexmac-out/, if-no-files-found: error, retention-days: 7 }

  plex-macos:
    needs: plexmac-cache
    if: ${{ needs.plexmac-cache.result == 'success' && needs.plexmac-cache.outputs.hit != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # release.yml: macOS 15 only (its bundle is the release's); Intel: MoltenVK on an Intel Mac
        runner: ${{ fromJSON(format('{0}', inputs.tests) != 'false' && '["macos-15", "macos-26", "macos-15-intel"]' || '["macos-15"]') }}   # macOS 15: no VideoToolbox interpolator in the VM; macOS 26: low-latency interpolation
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        if: ${{ !inputs.fresh }}
        id: trees
        with:
          path: ${{ runner.temp }}/ffb
          key: mpvnative-ffbuild-mac-${{ hashFiles('mpvnative/pins.json', 'mpvnative/ci/ffbuild-cache.sh', 'mpvnative/plex-mac/**', 'mpvnative/ffmpeg/**', 'mpvnative/include/**') }}
          restore-keys: mpvnative-ffbuild-mac-
      - name: Build the Mac pieces (8.29.100 filter build, proxy, engine, self-test host)
        id: build
        run: |
          [ "${{ inputs.fresh }}" = true ] || export FFB_CACHE="$RUNNER_TEMP/ffb"
          bash mpvnative/plex-mac/build-plex-mac.sh "$RUNNER_TEMP/ffmpeg5" "$RUNNER_TEMP/plexmac"
          # IINA and VLC (the plugin, the VLC module with FSR) into the same Mac bundle: the release's copy comes from macos-15
          if [ "${{ matrix.runner }}" = macos-15 ]; then
            python3 -I pmml/scripts/fetch_runtime.py --pin scripts/ml-runtime-pin.json --platform osx-arm64 --out "$RUNNER_TEMP/ortpin" --cache "$RUNNER_TEMP/ort-dl" --flavors core --headers >/dev/null 2>&1 && [ -f "$RUNNER_TEMP/ortpin/ort/core/include/onnxruntime_c_api.h" ] && export PUSHMPC_ORT_INCLUDE="$RUNNER_TEMP/ortpin/ort/core/include" || echo "::warning::ONNX Runtime headers not fetched: the VLC content library builds without the image model"
            bash mpvnative/plex-mac/build-mac-extras.sh "$RUNNER_TEMP/plexmac"
          fi
          rm -rf plexmac-out && cp -R "$RUNNER_TEMP/plexmac" plexmac-out
      - uses: actions/cache/save@v4
        if: ${{ !inputs.fresh && steps.trees.outputs.cache-hit != 'true' && matrix.runner == 'macos-15' }}
        with:
          path: ${{ runner.temp }}/ffb
          key: mpvnative-ffbuild-mac-${{ hashFiles('mpvnative/pins.json', 'mpvnative/ci/ffbuild-cache.sh', 'mpvnative/plex-mac/**', 'mpvnative/ffmpeg/**', 'mpvnative/include/**') }}
      # the bundle for plexmac-cache (Linux restores it; the path is relative so it is the same on both OSes)
      - uses: actions/cache/save@v4
        if: ${{ !inputs.fresh && matrix.runner == 'macos-15' }}
        with: { path: plexmac-out, key: '${{ needs.plexmac-cache.outputs.key }}', enableCrossOsArchive: true }
      - name: Plex for Mac and Plex HTPC for Mac (plex.tv downloads)
        if: ${{ format('{0}', inputs.tests) != 'false' }}   # release.yml: build only (the tests run on push and dispatch)
        run: |
          mkdir -p "$RUNNER_TEMP/apps"
          for n in 6 7; do
            u=$(curl -fsSL "https://plex.tv/api/downloads/$n.json" | python3 -c "
          import json, sys
          def walk(o):
              if isinstance(o, dict):
                  for k, v in o.items():
                      if k.lower() in ('macos', 'mac') and isinstance(v, dict):
                          for r in v.get('releases', []):
                              if r.get('url', '').endswith('.zip'): print(r['url']); return True
                      if walk(v): return True
              return False
          walk(json.load(sys.stdin))")
            echo "downloads/$n.json: $u"
            curl -fsSL -o "$RUNNER_TEMP/p$n.zip" "$u" && ditto -x -k "$RUNNER_TEMP/p$n.zip" "$RUNNER_TEMP/apps"
          done
          ls "$RUNNER_TEMP/apps"
      - name: Install, self-test, launch the modified app, uninstall bit-exact
        if: ${{ format('{0}', inputs.tests) != 'false' }}
        timeout-minutes: 20
        run: |
          set +e; p="$RUNNER_TEMP/plexmac"; fails=0
          export PUSHMPC_ENGINE_LOG="$RUNNER_TEMP/engine.log"
          cp mpvnative/install/pushmpc-plex-mac.sh "$p/"
          sw_vers | tr '\n' ' '; sysctl -n machdep.cpu.brand_string; system_profiler SPDisplaysDataType 2>/dev/null | grep -E 'Chipset|Metal' | head -3
          for t in 'desktop:Plex.app:Plex' 'htpc:Plex HTPC.app:Plex HTPC'; do
            n=${t%%:*}; r=${t#*:}; a="$RUNNER_TEMP/apps/${r%%:*}"; exe=${r##*:}
            [ -d "$a" ] || { echo "::error::$a missing"; fails=$((fails + 1)); continue; }
            snap() { (cd "$a" && find . -type f -print0 | sort -z | xargs -0 shasum -a 256 | shasum -a 256); ls -la "$HOME/Library/Application Support/$exe/mpv.conf" 2>&1 | awk '{print $5, $NF}'; }
            echo "$n: libmpv symbols left to the host (flat namespace):"; nm -m "$a/Contents/Frameworks/libmpv.2.dylib" | grep "dynamically looked up" | awk '{print $NF}' | sort -u | tr '\n' ' '; echo
            before=$(snap)
            out=$(sh "$p/pushmpc-plex-mac.sh" install --app $n --app-path "$a" --from "$p" --no-conf --json); echo "install -NoConf: $out"
            out=$(sh "$p/pushmpc-plex-mac.sh" install --app $n --app-path "$a" --from "$p" --opts smoother=2 --json); rc=$?; echo "install again: $out"
            echo "$out" | grep -q '"state":"installed"' && echo "$out" | grep -q ', x2' && [ $rc = 0 ] && echo "$n: vf_pushmpc active through Plex's libmpv" \
              || { echo "::error::$n: install/self-test failed (exit $rc)"; fails=$((fails + 1)); }
            grep -c 'PushMPC native (Plex): do not edit' "$HOME/Library/Application Support/$exe/mpv.conf"
            echo "status: $(sh "$p/pushmpc-plex-mac.sh" status --app $n --app-path "$a" --from "$p" --json)"
            # each engine on its own through Plex's libmpv (Auto above picked the best that runs here)
            for be in apple portable-vulkan portable-cpu; do
              # MoltenVK's warnings and the engine's own log per backend: where a run that never ends (or aborts) stops
              raw="$RUNNER_TEMP/probe-$n-$be.txt"; elog="$RUNNER_TEMP/probe-$n-$be-engine.log"
              PUSHMPC_ENGINE_LOG="$elog" MVK_CONFIG_LOG_LEVEL=2 PUSHMPC_HOST_VF="pushmpc=smoother=2:backend=$be" DYLD_LIBRARY_PATH="$a/Contents/Frameworks"                 "$p/pushmpc-plex-selftest" "$a/Contents/Frameworks/libmpv.2.dylib" > "$raw" 2>&1; rc=$?
              grep -E '^host: .*(filter:|end of file|tail:)' "$raw" | sed "s/^/  backend=$be: /" | cut -c1-400
              if [ "$rc" != 0 ] || ! grep -q 'end of file reason 0' "$raw"; then
                echo "  backend=$be: exit $rc; the self-test's last raw lines:"; tail -n 25 "$raw" | sed "s/^/  backend=$be:   raw: /" | cut -c1-300
                echo "  backend=$be: the engine log's last lines:"; tail -n 25 "$elog" 2>/dev/null | sed "s/^/  backend=$be:   engine: /" | cut -c1-300
              fi
            done
            echo "engine log (why an engine was not used):"; grep -E 'not used|open:' "$PUSHMPC_ENGINE_LOG" 2>/dev/null | sort | uniq -c | cut -c1-400
            # the real app with the proxy in place: it must start and load the proxy chain
            open -n "$a"; sleep 25
            pid=$(pgrep -x "$exe" | head -1)
            if [ -n "$pid" ]; then
              echo "$n: $exe running (pid $pid) with the proxy:"; lsof -p "$pid" 2>/dev/null | grep -E 'libavfilter|pushmpc|libmpv' | awk '{print $NF}'
              lsof -p "$pid" 2>/dev/null | grep -q 'libavfilter.8-plex.dylib' || echo "::warning::$n: libavfilter.8-plex.dylib not mapped (libmpv may load on first playback)"
            else
              echo "::error::$n: $exe did not stay running with the proxy in place"; fails=$((fails + 1))
              log show --last 2m --predicate 'process == "kernel" OR process == "amfid" OR process == "syspolicyd"' 2>/dev/null | grep -iE "$exe|plex|library validation|code signature" | tail -15
            fi
            ls -d "$HOME/Library/Application Support/"*lex* 2>/dev/null
            pkill -x "$exe"; sleep 3
            echo "uninstall: $(sh "$p/pushmpc-plex-mac.sh" uninstall --app $n --app-path "$a" --from "$p" --json)"
            after=$(snap)
            [ "$after" = "$before" ] && echo "$n: bundle and mpv.conf restored bit for bit" || { echo "$before"; echo "$after"; echo "::error::$n: bundle or mpv.conf differ after uninstall"; fails=$((fails + 1)); }
            # a Plex update writing its own libavfilter.8.dylib again, and a PushMPC upgrade over an older proxy of ours:
            # install again, then uninstall must give the stock bundle back bit for bit
            for case in plex-update pushmpc-upgrade; do
              fw="$a/Contents/Frameworks"; bk="$HOME/Library/Application Support/PushMPC/plex-native/$n"
              before=$(snap)
              sh "$p/pushmpc-plex-mac.sh" install --app $n --app-path "$a" --from "$p" --no-conf --json > /dev/null
              if [ $case = plex-update ]; then cp "$bk/libavfilter.8.dylib" "$fw/libavfilter.8.dylib"; else printf 'older-proxy' >> "$fw/libavfilter.8.dylib"; fi
              echo "$case install: $(sh "$p/pushmpc-plex-mac.sh" install --app $n --app-path "$a" --from "$p" --no-conf --json | cut -c1-200)"
              for f in "$p"/pushmpc-avfilter-8.*.dylib "$p/libpushmpc_engine.dylib" "$p/libpushmpc_engine_apple.dylib" "$p/libMoltenVK.dylib"; do
                [ -f "$f" ] || continue
                grep -qxF "${f##*/}" "$bk/added.txt" || { echo "::error::$n $case: added.txt lacks ${f##*/}"; fails=$((fails + 1)); }
              done
              sh "$p/pushmpc-plex-mac.sh" uninstall --app $n --app-path "$a" --from "$p" --json > /dev/null
              [ "$(snap)" = "$before" ] && echo "$n $case: bundle bit for bit stock after uninstall" || { echo "::error::$n $case: bundle not stock after uninstall"; fails=$((fails + 1)); }
            done
          done
          [ "$fails" = 0 ] && echo "plex-macos: all checks passed" || exit 1
      # the release's Plex for Mac bundle (release.yml: pushmpc-plex-mac-<version>.tar.gz; the Homebrew formula's
      # plex-mac resource): what was just tested on this runner
      - uses: actions/upload-artifact@v4
        if: matrix.runner == 'macos-15'
        with: { name: plexmac, path: '${{ runner.temp }}/plexmac/', if-no-files-found: error, retention-days: 7 }

  # Players with their own libmpv (mpv.net, MPC-QT, Jellyfin Desktop, Stremio): scripts/pushmpc-libmpv.ps1 swaps in
  # PushMPC's libmpv (the forwarder in the player's folder, PushMPC's mpv build behind it), self-tests it there, and
  # restores each player bit-exact. Each player's own release; mpv.net is started for real on WARP, the others (OpenGL
  # players: no OpenGL on hosted runners) through their own folder's libmpv in a host.
  libmpv-players:
    needs: windows
    if: ${{ inputs.part != 'extra' && format('{0}', inputs.tests) != 'false' }}
    runs-on: windows-2025
    timeout-minutes: 40
    defaults: { run: { shell: pwsh } }
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: mpvnative-windows, path: '${{ runner.temp }}/mpvwin' }
      - name: PushMPC's mpv where Setup puts it, and the players (their own releases)
        timeout-minutes: 15
        run: |
          $pm = "$env:LOCALAPPDATA\PushMPC"; New-Item -ItemType Directory "$pm\mpv-native" -Force | Out-Null
          Copy-Item "$env:RUNNER_TEMP\mpvwin\PushMPC-mpv-windows\*" "$pm\mpv-native" -Recurse
          foreach ($f in 'libmpv-2.dll', 'pushmpc-libmpv-forward.dll', 'pushmpc.lua') { if (-not (Test-Path "$pm\mpv-native\$f")) { throw "$f missing from the mpv build" } }
          $log = "$env:RUNNER_TEMP\players.txt"; $dl = "$env:RUNNER_TEMP\dl"; New-Item -ItemType Directory $dl -Force | Out-Null
          function Get-Zip([string]$repo, [string]$rx, [string]$dest, [string]$exe) {
            try {
              $rel = gh api "repos/$repo/releases/latest" | ConvertFrom-Json
              $a = $rel.assets | Where-Object { $_.name -match $rx } | Select-Object -First 1
              $f = Join-Path $dl $a.name; Invoke-WebRequest $a.browser_download_url -OutFile $f
              7z x $f "-o$dest" -y | Out-Null
              $e = Get-ChildItem $dest -Recurse -Filter $exe | Select-Object -First 1
              if ($e.DirectoryName -ne $dest) { Get-ChildItem $e.DirectoryName | Move-Item -Destination $dest -Force }
              "$repo $($rel.tag_name) $($a.name)" | Tee-Object -Append $log
            } catch { "${repo}: not installed ($_)" | Tee-Object -Append $log }
          }
          Get-Zip 'mpvnet-player/mpv.net' 'portable.*x64.*\.zip$|x64.*portable.*\.zip$' "$env:LOCALAPPDATA\Programs\mpv.net" 'mpvnet.exe'
          Get-Zip 'mpc-qt/mpc-qt' 'win-x64.*\.zip$' "$env:LOCALAPPDATA\Programs\mpc-qt" 'mpc-qt.exe'
          Remove-Item "$env:LOCALAPPDATA\Programs\mpc-qt\portable.txt" -ErrorAction SilentlyContinue
          # Jellyfin Desktop: its Inno Setup installer, per user
          try {
            $rel = gh api repos/jellyfin/jellyfin-desktop/releases/latest | ConvertFrom-Json
            $a = $rel.assets | Where-Object { $_.name -match 'windows-x64\.exe$' } | Select-Object -First 1
            Invoke-WebRequest $a.browser_download_url -OutFile "$dl\$($a.name)"
            $p = Start-Process "$dl\$($a.name)" -ArgumentList '/VERYSILENT', '/CURRENTUSER', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru; $p.WaitForExit(300000) | Out-Null
            "Jellyfin Desktop $($rel.tag_name) $($a.name), installer exit $($p.ExitCode)" | Tee-Object -Append $log
          } catch { "Jellyfin Desktop: not installed ($_)" | Tee-Object -Append $log }
          # Stremio: its official installer, per user
          try {
            $v = (gh api repos/Stremio/stremio-shell-ng/releases/latest | ConvertFrom-Json).tag_name.TrimStart('v')
            $file = "StremioSetup-v${v}_x64.exe"; $got = $null
            foreach ($u in @("https://dl.strem.io/stremio-shell-ng/v$v/$file", "https://dl.strem.io/shell-win/v$v/$file", "https://github.com/Stremio/stremio-shell-ng/releases/download/v$v/$file")) {
              try { Invoke-WebRequest $u -OutFile "$dl\$file"; $got = $u; break } catch { }
            }
            if ($got) { $p = Start-Process "$dl\$file" -ArgumentList '/VERYSILENT', '/CURRENTUSER', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru; $p.WaitForExit(300000) | Out-Null; "Stremio $v, installer exit $($p.ExitCode)" | Tee-Object -Append $log }
            else { "Stremio ${v}: installer not found" | Tee-Object -Append $log }
          } catch { "Stremio: not installed ($_)" | Tee-Object -Append $log }
          Get-Process 'Jellyfin Desktop', 'stremio-shell-ng', 'stremio-runtime' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: Swap (self-test in each player's folder), play through it, restore bit-exact (Windows PowerShell 5.1 and PowerShell 7)
        timeout-minutes: 20
        run: |
          $pm = "$env:LOCALAPPDATA\PushMPC"; $fails = 0
          $dirs = [ordered]@{ 'mpv.net' = "$env:LOCALAPPDATA\Programs\mpv.net"; 'MPC-QT' = "$env:LOCALAPPDATA\Programs\mpc-qt"
                              'Jellyfin Desktop' = "$env:LOCALAPPDATA\Programs\Jellyfin Desktop"; 'Stremio' = "$env:LOCALAPPDATA\Programs\Stremio" }
          $have = [ordered]@{}
          foreach ($k in $dirs.Keys) { $d = $dirs[$k]; $dll = @('libmpv-2.dll', 'mpv-2.dll') | Where-Object { Test-Path "$d\$_" } | Select-Object -First 1; if ($dll) { $have[$k] = "$d\$dll" } }
          $have.GetEnumerator() | ForEach-Object { "$($_.Key): $($_.Value)" }
          foreach ($need in 'mpv.net', 'MPC-QT') { if (-not $have[$need]) { Write-Host "::error::$need was not installed"; $fails++ } }
          $snap = { foreach ($v in $have.Values) { Get-ChildItem (Split-Path $v) -File | Where-Object { $_.Name -match 'mpv|pushmpc' } | ForEach-Object { "$($_.FullName)=$((Get-FileHash $_.FullName).Hash)" } } }
          $before = @(& $snap)
          $clip = "$env:RUNNER_TEMP\clip.mkv"
          & "$pm\mpv-native\ffmpeg.exe" -v error -y -f lavfi -i 'testsrc2=size=640x360:rate=24000/1001:duration=6' -pix_fmt yuv420p -c:v ffv1 $clip
          foreach ($sh in 'powershell', 'pwsh') {
            Write-Host "== $sh"
            & $sh -NoProfile -ExecutionPolicy Bypass -File scripts/pushmpc-libmpv.ps1 apply -NoTask 2>&1 | ForEach-Object { "  $_" }
            & $sh -NoProfile -ExecutionPolicy Bypass -File scripts/pushmpc-libmpv.ps1 status 2>&1 | ForEach-Object { "  $_" }
            foreach ($k in $have.Keys) {
              $d = Split-Path $have[$k]
              if (-not (Test-Path "$d\pushmpc-libmpv.txt")) { Write-Host "::error::$k was not swapped"; $fails++; continue }
              # the player's own folder in a host, with the block the forwarder loads (pushmpc.lua: the native filter)
              $hl = "$env:RUNNER_TEMP\host-$($k -replace '\W', '')-$sh.log"
              $out = & pwsh -NoProfile -File integrations/mpv/tests/libmpv-host.ps1 -Dll $have[$k] -Seconds 3 -Log $hl 2>&1 | Out-String
              $t = Get-Content $hl -Raw -ErrorAction SilentlyContinue
              $okNative = $t -match "PushMPC's native filter added" -and $t -match 'filter: [^\r\n]*x\d'
              Write-Host "$k host: $(($out -split "`n")[0]); native filter $(if ($okNative) { 'ran' } else { 'NOT seen' })"
              if (-not $okNative) { ($t -split "`n" | Select-String 'pushmpc|filter:|\]\[e\]' | Select-Object -First 12) | ForEach-Object { "    $_" }; Write-Host "::error::$k : PushMPC's libmpv did not run the native filter"; $fails++ }
            }
            # mpv.net itself on WARP: its own window, PushMPC's libmpv behind its libmpv-2.dll
            $ml = "$env:RUNNER_TEMP\mpvnet-$sh.log"
            $p = Start-Process "$($dirs['mpv.net'])\mpvnet.exe" -ArgumentList '--ao=null', '--d3d11-warp=yes', "--log-file=$ml", '--end=4', '--keep-open=no', "`"$clip`"" -PassThru
            if (-not $p.WaitForExit(60000)) { $p | Stop-Process -Force }
            Get-Process mpvnet -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue; Start-Sleep 2
            $t = Get-Content $ml -Raw -ErrorAction SilentlyContinue
            $line = ($t -split "`n" | Where-Object { $_ -match "native filter added|filter: .*x\d|hwdec" } | Select-Object -First 4) -join ' | '
            Write-Host "::notice title=mpv.net with PushMPC's libmpv ($sh)::$line"
            if ($t -notmatch "PushMPC's native filter added") { Write-Host "::error::mpv.net did not run PushMPC's native filter"; $fails++ }
            & $sh -NoProfile -ExecutionPolicy Bypass -File scripts/pushmpc-libmpv.ps1 restore 2>&1 | ForEach-Object { "  $_" }
            $diff = Compare-Object $before @(& $snap)
            if ($diff) { $diff | Format-Table -AutoSize | Out-String -Width 300; Write-Host "::error::restore is not bit-exact ($sh)"; $fails++ }
            if (Test-Path "$pm\libmpv-swap") { Write-Host "::error::the state folder was left behind ($sh)"; $fails++ }
          }
          exit $fails
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: libmpv-players-logs, path: "${{ runner.temp }}/*.log\n${{ runner.temp }}/players.txt", retention-days: 7 }
