# pmml, PushMPC's ML runtime layer (pmml/), on hosted runners (no GPU):
#   models   PushFlow's models exactly as PushFPS ships them (PushFPS's own prepare_runtime.py at the pinned tag),
#            pmml's graphs (make_graphs.py), the public test clips (Xiph derf 720p50), and the CPU reference
#            (reference.py): the graphs against numpy, the rebuild against the model's own picture, quality on the
#            clips (2x / 4x held-out frames, per t against flow once) and the reference planes pmml_cli is checked with.
#   linux    pmml with gcc on ubuntu-24.04: unit tests; ONNX Runtime CPU EP against the reference (>= 45 dB);
#            ncnn on Mesa lavapipe (Vulkan on the CPU) against the reference; the plugin EPs (TensorRT-RTX,
#            OpenVINO) and the MIGraphX flavor fetched by their pins and loaded (structure: no GPU here).
#   arm      ubuntu-24.04-arm: build, unit tests, CPU EP against the reference.
#   windows  MSVC on windows-2022: unit tests; CPU EP and DirectML on WARP against the reference; the plugin EPs
#            (TensorRT-RTX, OpenVINO, QNN x64) fetched and loaded; pmml_cli auto end to end (every probe in its own
#            process) on WARP.
#   macos    (workflow_dispatch with macos = true only) CPU and CoreML against the reference.
# Timings on these runners mean nothing (the CPU pretends to be a GPU); only correctness and quality are checked.
# Pins: scripts/ml-runtime-pin.json (SHA-256 checked by pmml/scripts/fetch_runtime.py), scripts/pushfps-pin.json.
name: pmml

on:
  push:
    paths: ['pmml/**', 'scripts/ml-runtime-pin.json', '.github/workflows/pmml.yml']
  workflow_dispatch:
    inputs:
      macos:
        description: 'also run the macOS job (10x minutes)'
        type: boolean
        default: false
      frames:
        description: 'frames per clip in the quality check'
        default: '17'

concurrency:
  group: pmml-${{ github.ref }}
  cancel-in-progress: true

env:
  PIN: scripts/ml-runtime-pin.json
  FRAMES: ${{ inputs.frames || '17' }}

jobs:
  models:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        id: models-cache
        with:
          path: ~/pmml-models
          key: pmml-models-${{ hashFiles('scripts/pushfps-pin.json', 'scripts/ml-runtime-pin.json') }}
      - name: Python packages (PushFPS's model preparation pins)
        timeout-minutes: 5
        run: |
          python -m venv ~/pf && ~/pf/bin/python -m pip install --disable-pip-version-check -q onnx==1.17.0 onnxconverter-common==1.14.0 onnxruntime==1.20.1 numpy==1.26.4
      - name: PushFlow models (PushFPS's prepare_runtime.py at the pinned tag)
        if: steps.models-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          repo=$(jq -r .pushfps.repository scripts/pushfps-pin.json); tag=$(jq -r .pushfps.tag scripts/pushfps-pin.json); commit=$(jq -r .pushfps.commit scripts/pushfps-pin.json)
          git clone -q --depth 1 --branch "$tag" "https://github.com/$repo.git" "$RUNNER_TEMP/PushFPS"
          [ "$(git -C "$RUNNER_TEMP/PushFPS" rev-parse HEAD)" = "$commit" ] || { echo "::error::PushFPS $tag is not $commit"; exit 1; }
          ~/pf/bin/python -I "$RUNNER_TEMP/PushFPS/scripts/pushflow/prepare_runtime.py" --out "$RUNNER_TEMP/pf" > "$RUNNER_TEMP/prepare.log" 2>&1 || { tail -50 "$RUNNER_TEMP/prepare.log"; exit 1; }
          grep -E '^(sha256|check|exposed|fp16|split) ' "$RUNNER_TEMP/prepare.log" | head -40
          mkdir -p ~/pmml-models
          cp -r "$RUNNER_TEMP/pf/runtime/pushflow/models/." ~/pmml-models/
          cp "$RUNNER_TEMP/pf/runtime/pushflow/models.json" ~/pmml-models/
          cp -r "$RUNNER_TEMP/pf/runtime/pushflow/licenses" ~/pmml-models/
      - name: Models match the pins
        run: |
          set -euo pipefail
          for role in fast quality; do
            want=$(jq -r ".models.pushflow.$role.sha256" "$PIN"); file=$(jq -r ".models.pushflow.$role.file" "$PIN")
            got=$(sha256sum ~/pmml-models/$file | cut -d' ' -f1)
            echo "$file $got"; [ "$got" = "$want" ] || { echo "::error::$file SHA-256 $got, pinned $want"; exit 1; }
          done
          ls -la ~/pmml-models
      - name: pmml graphs
        run: ~/pf/bin/python -I pmml/scripts/make_graphs.py --out ~/pmml-graphs
      - uses: actions/cache@v4
        with:
          path: ~/pmml-clips
          key: pmml-clips-v1-${{ env.FRAMES }}
      - name: Public clips (Xiph derf 720p50, the first frames by an HTTP range)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p ~/pmml-clips
          for n in $(jq -r '.clips.names[]' "$PIN"); do
            f=~/pmml-clips/$n.y4m
            [ -s "$f" ] || curl -fsSL --retry 3 -r 0-$((FRAMES * 1382406 + 200)) -o "$f" "https://media.xiph.org/video/derf/y4m/${n}_420_720p50.y4m"
            echo "$(sha256sum "$f")"
          done
      - name: CPU reference and quality (per t / flow once)
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p ~/pmml-ref
          for n in $(jq -r '.clips.names[]' "$PIN"); do
            for tier in fast balanced; do
              ~/pf/bin/python -I pmml/scripts/reference.py --models ~/pmml-models --graphs ~/pmml-graphs --clip ~/pmml-clips/$n.y4m --frames "$FRAMES" --tier $tier \
                --dump ~/pmml-ref/$n-$tier --json ~/pmml-ref/$n-$tier.json | tee -a ~/pmml-ref/quality.log
            done
          done
          echo '| clip | tier | network | 2x per t | 4x per t | 4x flow once | 4x blend | 4x repeat |' >> $GITHUB_STEP_SUMMARY
          echo '|---|---|---|---|---|---|---|---|' >> $GITHUB_STEP_SUMMARY
          for j in ~/pmml-ref/*.json; do jq -r '.clip | "| \(.name) | \(.tier) | \(.network[0])x\(.network[1]) | \(.["2x_per_t"]) | \(.["4x_per_t"]) | \(.["4x_flow_once"]) | \(.["4x_blend"]) | \(.["4x_repeat"]) |"' "$j" >> $GITHUB_STEP_SUMMARY; done
      - name: ncnn models (pnnx from the same PushFlow ONNX models, fixed shapes)
        timeout-minutes: 15
        continue-on-error: true
        run: |
          set -euo pipefail
          ~/pf/bin/python -m pip install --disable-pip-version-check -q "pnnx==$(jq -r .ncnn.pnnx.version "$PIN")" "ncnn==1.0.$(jq -r .ncnn.version "$PIN")"
          ~/pf/bin/python -I pmml/scripts/ncnn_models.py --models ~/pmml-models --out ~/pmml-ncnn --sizes 640x384,1280x768 2>&1 | tail -40
      - uses: actions/upload-artifact@v4
        with:
          name: pmml-models
          path: |
            ~/pmml-models
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: pmml-test-data
          path: |
            ~/pmml-graphs
            ~/pmml-clips
            ~/pmml-ref
            ~/pmml-ncnn
          retention-days: 3

  linux:
    needs: models
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { name: pmml-models, path: data/models }
      - uses: actions/download-artifact@v4
        with: { name: pmml-test-data, path: data }
      - name: Packages (Mesa lavapipe, ninja)
        timeout-minutes: 8
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mesa-vulkan-drivers libvulkan-dev vulkan-tools ninja-build >/dev/null
          vulkaninfo --summary 2>/dev/null | sed -n '1,30p' || true
      - uses: actions/cache@v4
        with:
          path: ~/pmml-dl
          key: pmml-dl-linux-x64-${{ hashFiles('scripts/ml-runtime-pin.json') }}
      - name: Runtimes by their pins (ORT core + MIGraphX flavor, TensorRT-RTX and OpenVINO plugin EPs, ncnn)
        timeout-minutes: 15
        run: |
          python3 -I pmml/scripts/fetch_runtime.py --pin "$PIN" --platform linux-x64 --out rt --cache ~/pmml-dl --flavors core,migraphx --eps trt-rtx,openvino --ncnn --headers --list --allow-unpinned
          find rt -maxdepth 3 -type d | head -30
      - name: Build
        run: |
          set -euo pipefail
          ncnn=""; [ -f pmml/src/ncnn_backend.cpp ] && ncnn=$(dirname "$(find "$PWD/rt/ncnn" -name ncnnConfig.cmake | head -1)" 2>/dev/null || true)
          cmake -S pmml -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPMML_ORT_INCLUDE="$PWD/rt/ort/core/include" -DPMML_NCNN_DIR="$ncnn"
          cmake --build build --parallel
      - name: Unit tests
        run: build/pmml_unit
      - name: Devices (core flavor with the plugin EPs; the MIGraphX flavor)
        run: |
          build/pmml_cli list --runtime rt --flavor core || true
          build/pmml_cli list --runtime rt --flavor migraphx || echo "::notice::the MIGraphX flavor needs ROCm (absent on the runner): load result above"
      - name: CPU EP against the reference
        run: |
          set -euo pipefail
          for n in $(jq -r '.clips.names[]' "$PIN"); do
            for tier in fast balanced; do
              for once in "" --flow-once; do
                build/pmml_cli run --runtime rt --models data/models --graphs data/pmml-graphs --backend ort:core:cpu:0 --tier $tier --clip data/pmml-clips/$n.y4m \
                  --frames "$FRAMES" --mult 4 $once --compare data/pmml-ref/$n-$tier --min-db 45 | tee -a run.log
              done
            done
          done
      - name: ncnn on lavapipe against the reference
        if: hashFiles('data/pmml-ncnn/**') != '' && hashFiles('pmml/src/ncnn_backend.cpp') != ''
        env: { PMML_VK_ALLOW_CPU: '1' }
        run: |
          set -euo pipefail
          ls data/pmml-ncnn
          for n in $(jq -r '.clips.names[]' "$PIN"); do
            build/pmml_cli run --runtime rt --models data/models --graphs data/pmml-graphs --ncnn-models data/pmml-ncnn --backend ncnn --tier fast \
              --clip data/pmml-clips/$n.y4m --frames 9 --mult 4 --compare data/pmml-ref/$n-fast --min-db 35 | tee -a run.log
          done
      - run: grep PMML_RUN run.log | sed 's/^PMML_RUN //' >> $GITHUB_STEP_SUMMARY || true

  arm:
    needs: models
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { name: pmml-models, path: data/models }
      - uses: actions/download-artifact@v4
        with: { name: pmml-test-data, path: data }
      - uses: actions/cache@v4
        with:
          path: ~/pmml-dl
          key: pmml-dl-linux-arm64-${{ hashFiles('scripts/ml-runtime-pin.json') }}
      - name: Runtimes by their pins (ORT core, TensorRT-RTX plugin EP for ARM64)
        timeout-minutes: 15
        run: python3 -I pmml/scripts/fetch_runtime.py --pin "$PIN" --platform linux-arm64 --out rt --cache ~/pmml-dl --flavors core --eps trt-rtx --headers --allow-unpinned
      - name: Build and unit tests
        run: |
          sudo apt-get install -y -qq ninja-build >/dev/null
          cmake -S pmml -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPMML_ORT_INCLUDE="$PWD/rt/ort/core/include"
          cmake --build build --parallel
          build/pmml_unit
          build/pmml_cli list --runtime rt --flavor core || true
      - name: CPU EP against the reference
        run: |
          n=$(jq -r '.clips.names[0]' "$PIN")
          build/pmml_cli run --runtime rt --models data/models --graphs data/pmml-graphs --backend ort:core:cpu:0 --tier fast --clip data/pmml-clips/$n.y4m --frames 9 --mult 4 --compare data/pmml-ref/$n-fast --min-db 45

  windows:
    needs: models
    runs-on: windows-2022
    timeout-minutes: 50
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { name: pmml-models, path: data/models }
      - uses: actions/download-artifact@v4
        with: { name: pmml-test-data, path: data }
      - uses: actions/cache@v4
        with:
          path: ~/pmml-dl
          key: pmml-dl-win-x64-${{ hashFiles('scripts/ml-runtime-pin.json') }}
      - name: Runtimes by their pins (ORT core + DirectML flavor, TensorRT-RTX / OpenVINO / QNN plugin EPs, ncnn)
        timeout-minutes: 15
        run: |
          python -I pmml/scripts/fetch_runtime.py --pin "$PIN" --platform win-x64 --out rt --cache ~/pmml-dl --flavors core,directml --eps trt-rtx,openvino,qnn --ncnn --headers --list --allow-unpinned
          cp rt/ort/directml/include/dml_provider_factory.h rt/ort/directml/include/DirectML*.h rt/ort/core/include/ 2>/dev/null || true
          ls rt/ort/core/include rt/ort/directml
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        run: |
          ncnn=""; [ -f pmml/src/ncnn_backend.cpp ] && ncnn=$(dirname "$(find "$PWD/rt/ncnn" -name ncnnConfig.cmake | head -1)" 2>/dev/null || true)
          cmake -S pmml -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPMML_ORT_INCLUDE="$PWD/rt/ort/core/include" -DPMML_NCNN_DIR="$ncnn"
          cmake --build build --parallel
      - name: Unit tests
        run: build/pmml_unit.exe
      - name: Devices
        env: { PMML_DML_WARP: '1' }
        run: |
          build/pmml_cli.exe list --runtime rt --flavor core || true
          build/pmml_cli.exe list --runtime rt --flavor directml
      - name: CPU EP and DirectML on WARP against the reference
        env: { PMML_DML_WARP: '1' }
        run: |
          set -euo pipefail
          n=$(python -c "import json; print(json.load(open('$PIN'))['clips']['names'][0])")
          for tier in fast balanced; do
            for once in "" --flow-once; do
              build/pmml_cli.exe run --runtime rt --models data/models --graphs data/pmml-graphs --backend ort:core:cpu:0 --tier $tier --clip data/pmml-clips/$n.y4m --frames 9 --mult 4 $once --compare data/pmml-ref/$n-$tier --min-db 45 | tee -a run.log
              build/pmml_cli.exe run --runtime rt --models data/models --graphs data/pmml-graphs --backend ort:directml:dml:0 --tier $tier --clip data/pmml-clips/$n.y4m --frames 9 --mult 4 $once --compare data/pmml-ref/$n-$tier --min-db 40 | tee -a run.log
            done
          done
          build/pmml_cli.exe run --runtime rt --models data/models --graphs data/pmml-graphs --backend ort:directml:dml:0 --tier fast --clip data/pmml-clips/$n.y4m --frames 9 --mult 4 --host-intermediates --compare data/pmml-ref/$n-fast --min-db 40 | tee -a run.log
      - name: Auto end to end on WARP (each probe in its own process)
        env: { PMML_DML_WARP: '1' }
        timeout-minutes: 15
        run: |
          build/pmml_cli.exe auto --runtime rt --models data/models --graphs data/pmml-graphs --size 640x360 --fps 25 --mult 2 --pairs 3 --cache "$RUNNER_TEMP" | tee auto.log || true
          grep -q PMML_CHOICE auto.log
          cat "$RUNNER_TEMP/pmml-autobench.json" | head -40
      - run: grep PMML_RUN run.log | sed 's/^PMML_RUN //' >> $GITHUB_STEP_SUMMARY || true
      - uses: actions/upload-artifact@v4
        with:
          name: pmml-windows-x64
          path: |
            build/pmml_cli.exe
            build/pmml_unit.exe
          retention-days: 7

  macos:
    if: ${{ inputs.macos }}
    needs: models
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { name: pmml-models, path: data/models }
      - uses: actions/download-artifact@v4
        with: { name: pmml-test-data, path: data }
      - name: Runtimes (ORT core osx-arm64 with CoreML)
        run: python3 -I pmml/scripts/fetch_runtime.py --pin "$PIN" --platform osx-arm64 --out rt --flavors core --headers --allow-unpinned
      - name: Build, unit tests, CPU and CoreML against the reference
        run: |
          cmake -S pmml -B build -DCMAKE_BUILD_TYPE=Release -DPMML_ORT_INCLUDE="$PWD/rt/ort/core/include"
          cmake --build build --parallel
          build/pmml_unit
          build/pmml_cli list --runtime rt --flavor core
          n=$(jq -r '.clips.names[0]' "$PIN")
          build/pmml_cli run --runtime rt --models data/models --graphs data/pmml-graphs --backend ort:core:cpu:0 --tier fast --clip data/pmml-clips/$n.y4m --frames 9 --mult 4 --compare data/pmml-ref/$n-fast --min-db 45
          build/pmml_cli run --runtime rt --models data/models --graphs data/pmml-graphs --backend ort:core:coreml:0 --tier fast --clip data/pmml-clips/$n.y4m --frames 9 --mult 4 --compare data/pmml-ref/$n-fast --min-db 35
