# The one-step Setup per OS on hosted runners (no GPU):
#   autoplan      Setup's Auto plan and capture mode against simulated GPUs (scripts/test-autoplan.ps1), Windows
#                 PowerShell 5.1 and PowerShell 7; setup.sh's plan per GPU under sh and dash
#   release       (dispatch with build_release) the release.yml build of this commit, which makes PushMPC-Setup.exe
#   win-setup     PushMPC-Setup.exe /S on windows-2025 with players installed from their packages (MPC-HC, VLC, KMPlayer):
#                 detection, the engine choice in the log, auto-plan.json, pmml.txt from a simulated RTX 4090 with the
#                 TensorRT-RTX EP, capture mode for the players without a native route, a sandbox dry run of Repair and
#                 Update that writes nothing (U-1), then the uninstall leaves
#                 nothing behind (registry, Start menu, files) and the players' settings as they were
#   linux-setup   setup.sh in Arch with mpv, VLC, Kodi, Celluloid, SMPlayer from pacman: the plugin built from this
#                 commit, detection, the engine choice, auto-plan.txt, mpv playing through the installed block, then
#                 the uninstall restores HOME byte for byte
name: release-ux

on:
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build PushMPC-Setup.exe from this commit (release.yml, about 25 min) for the Windows Setup run'
        type: boolean
        default: true
      release_run:
        description: 'Or: the run id of an earlier release.yml / release-ux run of this branch with the pushmpc-release artifact'
        default: ''
  push:
    branches: ['track/release-ux']
    paths:
      - 'scripts/pushmpc-install.ps1'
      - 'scripts/pushmpc-capture.ps1'
      - 'scripts/test-autoplan.ps1'
      - 'integrations/linux/setup.sh'
      - 'integrations/linux/tests/setup.tests.sh'
      - '.github/workflows/release-ux.yml'

concurrency:
  # not "release-ux-<ref>": the workflows this one calls (release.yml, vlc-plugin.yml) take the caller's name in their
  # own groups
  group: release-ux-run-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  CLIP_URL: https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/720/Big_Buck_Bunny_720_10s_1MB.mp4

jobs:
  autoplan:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Auto plan and capture mode (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-autoplan.ps1
      - name: Auto plan and capture mode (PowerShell 7)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-autoplan.ps1
      - name: The runner's own adapter
        shell: pwsh
        run: |
          $d = "$env:RUNNER_TEMP\ap"; New-Item -ItemType Directory $d -Force | Out-Null
          pwsh -NoProfile -File scripts/pushmpc-install.ps1 autoplan -InstallDir $d | Tee-Object "$env:RUNNER_TEMP\ap.txt"
          @('## autoplan (runner adapter)', '', '```') + (Get-Content "$env:RUNNER_TEMP\ap.txt") + @('```') -join "`n" >> $env:GITHUB_STEP_SUMMARY

  setup-sh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq dash >/dev/null
      - name: setup.sh plan per GPU (sh and dash)
        run: |
          sh integrations/linux/tests/setup.tests.sh
          sed 's|^SH=sh$|SH=dash|' integrations/linux/tests/setup.tests.sh > /tmp/setup-dash.sh && grep -q '^SH=dash$' /tmp/setup-dash.sh && dash /tmp/setup-dash.sh

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.build_release && inputs.release_run == ''
    uses: ./.github/workflows/release.yml
    with:
      source_ref: ${{ github.sha }}
    secrets: inherit
    permissions:
      contents: write

  win-setup:
    needs: [autoplan, release]
    if: always() && github.event_name == 'workflow_dispatch' && needs.autoplan.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'failure' || inputs.release_run != '')
    runs-on: windows-2025
    timeout-minutes: 70
    defaults: { run: { shell: pwsh } }
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pushmpc-release
          path: '${{ runner.temp }}/release'
          run-id: '${{ inputs.release_run || github.run_id }}'
          github-token: '${{ github.token }}'
      - name: Players from their packages (MPC-HC's installer, VLC and KMPlayer from Chocolatey)
        timeout-minutes: 15
        run: |
          $log = "$env:RUNNER_TEMP\ux.txt"
          $rel = gh api repos/clsid2/mpc-hc/releases/latest | ConvertFrom-Json
          $a = $rel.assets | Where-Object { $_.name -match '\.x64\.exe$' } | Select-Object -First 1
          $f = "$env:RUNNER_TEMP\$($a.name)"; Invoke-WebRequest $a.browser_download_url -OutFile $f
          $p = Start-Process $f -ArgumentList '/VERYSILENT', '/NORESTART', '/SUPPRESSMSGBOXES' -PassThru; $p.WaitForExit(300000) | Out-Null
          "MPC-HC $($rel.tag_name): installer exit $($p.ExitCode)" | Tee-Object -Append $log
          New-Item 'HKCU:\Software\MPC-HC\MPC-HC\Settings' -Force | Out-Null
          Set-ItemProperty 'HKCU:\Software\MPC-HC\MPC-HC\Settings' -Name UpdaterAutoCheck -Value 0 -Type DWord
          $m = Start-Process "$env:ProgramFiles\MPC-HC\mpc-hc64.exe" -PassThru; Start-Sleep 12; if (-not $m.HasExited) { [void]$m.CloseMainWindow(); if (-not $m.WaitForExit(15000)) { $m.Kill() } }
          choco install vlc -y --no-progress --limit-output | Select-Object -Last 3
          "VLC (Chocolatey): exit $LASTEXITCODE; vlc.exe $(Test-Path "$env:ProgramFiles\VideoLAN\VLC\vlc.exe")" | Tee-Object -Append $log
          choco install kodi -y --no-progress --limit-output | Select-Object -Last 3
          $kx = @("$env:ProgramFiles\Kodi\kodi.exe", "${env:ProgramFiles(x86)}\Kodi\kodi.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          "Kodi (Chocolatey): exit $LASTEXITCODE; $(if ($kx) { "$kx $((Get-Item $kx).VersionInfo.ProductVersion)" } else { 'not found' })" | Tee-Object -Append $log
          choco install kmplayer -y --no-progress --limit-output | Select-Object -Last 3
          $km = @("$env:ProgramFiles\KMPlayer 64X\KMPlayer64.exe", "${env:ProgramFiles(x86)}\KMPlayer\KMPlayer.exe") | Where-Object { Test-Path $_ }
          "KMPlayer (Chocolatey): exit $LASTEXITCODE; $(if ($km) { $km -join ', ' } else { 'not found' })" | Tee-Object -Append $log
          if (-not $km) {
            # the package can lag the vendor's download; a stand-in executable keeps the capture-mode check meaningful
            New-Item -ItemType Directory "$env:ProgramFiles\KMPlayer 64X" -Force | Out-Null
            Copy-Item "$env:SystemRoot\System32\notepad.exe" "$env:ProgramFiles\KMPlayer 64X\KMPlayer64.exe"
            "KMPlayer: stand-in executable (Chocolatey package not installed)" | Tee-Object -Append $log
            Write-Host '::warning title=KMPlayer::the Chocolatey package did not install; a stand-in executable is used for the capture-mode check'
          }
          exit 0   # a failed optional package (exit code of the last choco) is handled above
      # Plex HTPC and Plex for Windows (winget): what their folder holds and what libmpv-2.dll imports (separate FFmpeg
      # DLLs or not), then Setup swaps in the VapourSynth-enabled libmpv where the version is tested
      - name: Plex HTPC and Plex for Windows (winget), their libmpv imports
        timeout-minutes: 20
        run: |
          $log = "$env:RUNNER_TEMP\plex.txt"
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -Force -Scope CurrentUser | Out-Null
            Install-Module Microsoft.WinGet.Client -Force -Scope CurrentUser -Repository PSGallery
            Repair-WinGetPackageManager -AllUsers -Latest
          }
          foreach ($id in 'Plex.PlexHTPC', 'Plex.Plex') {
            winget install --id $id -e --silent --accept-package-agreements --accept-source-agreements --disable-interactivity 2>&1 | Select-Object -Last 3
            "winget $id`: exit $LASTEXITCODE" | Tee-Object -Append $log
          }
          Get-Process -Name 'Plex', 'Plex HTPC' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue | Where-Object FullName -match 'Hostx64\\x64' | Select-Object -First 1
          foreach ($d in "$env:ProgramFiles\Plex\Plex HTPC", "$env:ProgramFiles\Plex\Plex") {
            if (-not (Test-Path $d)) { "$d`: not installed" | Tee-Object -Append $log; continue }
            $exe = Get-ChildItem $d -Filter 'Plex*.exe' | Select-Object -First 1
            "== $d ($($exe.Name) $($exe.VersionInfo.ProductVersion))" | Tee-Object -Append $log
            Get-ChildItem $d -File | Sort-Object Name | ForEach-Object { "  {0,12:N0}  {1}" -f $_.Length, $_.Name } | Tee-Object -Append $log
            $dll = Get-ChildItem $d -Filter '*mpv*.dll' | Select-Object -First 1
            if ($dll -and $dumpbin) {
              "  -- dumpbin /imports $($dll.Name):" | Tee-Object -Append $log
              & $dumpbin.FullName /nologo /imports $dll.FullName | Select-String -Pattern '^\s+\S+\.dll\s*$' | ForEach-Object { "    $($_.Line.Trim())" } | Tee-Object -Append $log
            }
            if ($dll) { "  $($dll.Name) SHA-256 $((Get-FileHash $dll.FullName).Hash)" | Tee-Object -Append $log }
          }
          Get-ChildItem 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue | ForEach-Object { Get-ItemProperty $_.PSPath } | Where-Object { "$($_.DisplayName)" -like 'Plex*' } | ForEach-Object { "Apps entry: $($_.DisplayName) $($_.DisplayVersion) [$(([int[]][char[]]"$($_.DisplayVersion)") -join ",")] ($($_.InstallLocation)) icon $($_.DisplayIcon)" } | Tee-Object -Append $log
          pwsh -NoProfile -File scripts/pushmpc-plex.ps1 status -InstallDir "$env:RUNNER_TEMP\plex-probe" 2>&1 | Tee-Object -Append $log
          @('## Plex on the runner', '', '```') + (Get-Content $log) + @('```') -join "`n" >> $env:GITHUB_STEP_SUMMARY
          exit 0
      - name: Snapshot before Setup
        run: |
          $s = "$env:RUNNER_TEMP\snap"; New-Item -ItemType Directory $s -Force | Out-Null
          foreach ($k in 'MPC-HC', 'VideoLAN') { reg export "HKCU\Software\$k" "$s\before-$k.reg" /y 2>$null | Out-Null }
          (Get-ItemProperty HKCU:\Environment -ErrorAction SilentlyContinue).PSObject.Properties | Where-Object Name -notlike 'PS*' | ForEach-Object { "$($_.Name)=$($_.Value)" } | Sort-Object | Set-Content "$s\before-env.txt"
          Get-ChildItem "$env:APPDATA\vlc" -Recurse -File -ErrorAction SilentlyContinue | Get-FileHash | ForEach-Object { "$($_.Hash) $($_.Path)" } | Set-Content "$s\before-vlc.txt"
          "PushMPC folder before: $(Test-Path "$env:LOCALAPPDATA\PushMPC"); Start menu PushMPC: $(Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\PushMPC")" | Tee-Object -Append "$env:RUNNER_TEMP\ux.txt"
          function PlexSnap([string]$f) { @(foreach ($d in "$env:ProgramFiles\Plex\Plex HTPC", "$env:ProgramFiles\Plex\Plex") { Get-ChildItem $d -Recurse -File -ErrorAction SilentlyContinue | Sort-Object FullName | ForEach-Object { "$((Get-FileHash $_.FullName).Hash) $($_.FullName)" } }) + @(foreach ($c in "$env:LOCALAPPDATA\Plex HTPC\mpv.conf", "$env:LOCALAPPDATA\Plex\mpv.conf") { "$c $(if (Test-Path $c) { (Get-FileHash $c).Hash } else { 'absent' })" }) | Set-Content $f }
          PlexSnap "$s\before-plex.txt"
          exit 0   # reg export of a key the runner does not have returns 1
      # R-REG1: an existing HKCU\Software\PushMPC (the user's settings, Learned costs, the updater's state, MPC-VR's
      # backup) must come through a fresh install and a repair value for value. Also leftovers of older builds that
      # Setup must clean up (U-1): the old capture-mode shortcut name and an old MPC-VR backup file.
      - name: An earlier PushMPC's settings and leftovers
        run: |
          $k = 'HKCU:\Software\PushMPC'
          if (-not (Test-Path $k)) { New-Item $k | Out-Null }
          Set-ItemProperty $k Smoother '3x'; Set-ItemProperty $k Osd 'Always'; Set-ItemProperty $k SubtitleHold 'Off'
          New-ItemProperty $k -Name FrameLog -PropertyType DWord -Value 1 | Out-Null
          foreach ($sub in 'Learned', 'Update', 'MpcVrBackup', 'Unlocks') { New-Item "$k\$sub" | Out-Null }
          Set-ItemProperty "$k\Learned" Gpu 'Test GPU (CI)'; Set-ItemProperty "$k\Learned" FgScale1 '1.234'
          Set-ItemProperty "$k\Update" CiMarker 'kept'
          foreach ($n in 'HdrLocalToneMapping', 'HdrLocalToneMappingType', 'HdrDisplayNits') { Set-ItemProperty "$k\MpcVrBackup" $n 'absent' }
          New-ItemProperty "$k\Unlocks" -Name NvofWarp -PropertyType DWord -Value 1 | Out-Null
          reg export 'HKCU\Software\PushMPC' "$env:RUNNER_TEMP\snap\pushmpc-seeded.reg" /y | Out-Null
          $sm = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\PushMPC"; New-Item -ItemType Directory $sm -Force | Out-Null
          Set-Content "$sm\PushMPC Capture (fallback).lnk" 'an older build''s shortcut'
          $bk = "$env:LOCALAPPDATA\PushMPC\backup"; New-Item -ItemType Directory $bk -Force | Out-Null
          Set-Content "$bk\MpcVideoRenderer64.0.11.2.2638.ax" 'an older build''s MPC-VR backup'
      - name: PushMPC-Setup.exe /S (simulated RTX 4090; the TensorRT-RTX pmml runtime fetched by its pins)
        timeout-minutes: 30
        env:
          PUSHMPC_TEST_GPU: '10DE:2684:NVIDIA GeForce RTX 4090'
        run: |
          $log = "$env:RUNNER_TEMP\ux.txt"
          # Setup's Windows PowerShell 5.1 must not inherit pwsh's module path (as from Explorer); this step keeps its own
          $keep = $env:PSModulePath; Remove-Item Env:PSModulePath
          # PushMPC's own mpv too (--mpv-build); its zip is the release artifact's (the download URL exists only for a published release)
          $env:PUSHMPC_MPVBUILD_ZIP = (Get-ChildItem "$env:RUNNER_TEMP\release" -Filter 'PushMPC-mpv-windows-*.zip' | Select-Object -First 1).FullName
          $p = Start-Process "$env:RUNNER_TEMP\release\PushMPC-Setup.exe" -ArgumentList '/S', '--mpv-build' -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\setup-out.txt"
          $env:PSModulePath = $keep
          if (-not $p.WaitForExit(1400000)) { $p.Kill(); throw 'Setup timed out' }
          "Setup exit $($p.ExitCode)" | Tee-Object -Append $log
          $sl = Get-ChildItem "$env:LOCALAPPDATA\PushMPC\logs" -Filter 'setup*.log' | Sort-Object LastWriteTime | Select-Object -Last 1
          $text = Get-Content $sl.FullName -Raw
          ($text -split "`r?`n" | Select-String -Pattern 'GPU:|Engine for|PushFlow|pmml|AMD FSR SDK|found|Capture mode|Players without|VLC|KMPlayer|MPC-HC|Auto''s starting|Plex|libmpv|self-test|logon check' | ForEach-Object Line) | Tee-Object -Append $log
          $pm = "$env:LOCALAPPDATA\PushMPC\pmml"
          $fetched = Get-Content "$pm\fetched.json" -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json
          $epj = Get-Content "$pm\eps\trt-rtx\ep.json" -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json
          "pmml runtime: onnxruntime.dll $(Test-Path "$pm\ort\core\onnxruntime.dll"); trt-rtx library $($epj.library) (present $(if ($epj) { Test-Path (Join-Path "$pm\eps\trt-rtx" $epj.library) }))" | Tee-Object -Append $log
          # Plex: the proxy route (Plex's own libmpv, a proxy avfilter-8.dll), never the libmpv swap as well
          $plexState = Get-Content "$env:LOCALAPPDATA\PushMPC\plex\plex.json" -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json
          foreach ($r in @($plexState)) { if ($r) { "Plex swapped: $($r.Name) $($r.Version): libmpv now $((Get-FileHash $r.Dll).Hash) (ours $($r.OursSha)); backup $(Test-Path $r.Backup)" | Tee-Object -Append $log } }
          $plexDirs = @("$env:ProgramFiles\Plex\Plex HTPC", "$env:ProgramFiles\Plex\Plex") | Where-Object { Test-Path "$_\libmpv-2.dll" }
          foreach ($d in $plexDirs) { "Plex proxy in ${d}: renamed original $(Test-Path "$d\avfilter-8-plex.dll"); builds $(@(Get-ChildItem $d -Filter 'pushmpc-avfilter-8.*.dll').Count); engine $(Test-Path "$d\pushmpc_engine.dll")" | Tee-Object -Append $log }
          @(foreach ($c in "$env:LOCALAPPDATA\Plex HTPC\mpv.conf", "$env:LOCALAPPDATA\Plex\mpv.conf") { if (Test-Path $c) { "$c`:"; Get-Content $c | ForEach-Object { "    $_" } } }) | Tee-Object -Append $log
          "Plex logon check task: $([bool](Get-ScheduledTask -TaskPath '\PushMPC\' -TaskName 'Plex libmpv check' -ErrorAction SilentlyContinue))" | Tee-Object -Append $log
          $plan = Get-Content "$env:LOCALAPPDATA\PushMPC\auto-plan.json" -Raw | ConvertFrom-Json
          $pmml = [string](Get-Content "$env:LOCALAPPDATA\PushMPC\runtime\runtime\experimental\pushflow\pmml.txt" -Raw -ErrorAction SilentlyContinue)
          $cap = Get-Content "$env:LOCALAPPDATA\PushMPC\capture\capture.json" -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json
          $lnk = Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\PushMPC\PushMPC Capture.lnk"
          $mpc = [bool](Get-ChildItem 'HKCU:\Software\MPC-HC\MPC-HC\Filters\x64' -ErrorAction SilentlyContinue | Where-Object { (Get-ItemProperty $_.PSPath).CLSID -eq '{798D4EC3-E59C-4A4E-A2EE-C804AEAE04CC}' })
          "auto-plan.json: family $($plan.family); directshow: $($plan.directshow)" | Tee-Object -Append $log
          "pmml.txt: $(($pmml -split "`r?`n" | Where-Object { $_ -match '^(runtime|backend)=' }) -join ' | ')" | Tee-Object -Append $log
          "capture mode: $(if ($cap) { 'on for ' + (@($cap.players) -join ', ') } else { 'off' }); Start menu entry: $lnk; MPC-HC entry: $mpc" | Tee-Object -Append $log
          $bad = @()
          if ($p.ExitCode -ne 0) { $bad += "Setup exit $($p.ExitCode)" }
          if ($text -notmatch 'Engine for MPC-HC / MPC-BE / PotPlayer: pushcore: NVIDIA VFG') { $bad += 'no engine choice in the Setup log' }
          if ($plan.family -ne 'RTX 40') { $bad += "auto-plan.json family $($plan.family)" }
          if (-not ($pmml -match '(?m)^backend=ort:core:trt-rtx:0')) { $bad += 'pmml.txt not written with the TensorRT-RTX EP' }
          if (-not ($pmml -match [regex]::Escape("runtime=$pm"))) { $bad += 'pmml.txt does not name the installed pmml runtime' }
          if (-not (Test-Path "$pm\ort\core\onnxruntime.dll") -or -not $epj -or -not (Test-Path (Join-Path "$pm\eps\trt-rtx" $epj.library))) { $bad += 'the pmml runtime (ONNX Runtime + TensorRT-RTX EP) is not installed' }
          if (@($plexState | Where-Object { $_ }).Count -or (Test-Path "$env:LOCALAPPDATA\PushMPC\plex")) { $bad += 'Plex got the libmpv swap: the proxy route should have been taken (its self-test failed? see the log)' }
          if (-not $plexDirs) { $bad += 'no Plex app on the runner' }
          foreach ($d in $plexDirs) {
            if (-not (Test-Path "$d\avfilter-8-plex.dll") -or -not (Test-Path "$d\pushmpc_engine.dll")) { $bad += "${d}: the Plex proxy is not in place" }
            $c = if ($d -like '*HTPC') { "$env:LOCALAPPDATA\Plex HTPC\mpv.conf" } else { "$env:LOCALAPPDATA\Plex\mpv.conf" }
            if (-not ((Get-Content $c -Raw -ErrorAction SilentlyContinue) -match 'vf-append=@pushmpc:pushmpc')) { $bad += "${c}: no PushMPC filter line" }
            if ((Get-Content $c -Raw -ErrorAction SilentlyContinue) -match '# >>> PushMPC managed') { $bad += "${c}: the mpv route's block is there as well" }
          }
          # VLC: PushMPC's module (the release's vlc component) through its installer, so not in capture mode
          $vlcrc = Get-Content "$env:APPDATA\vlc\vlcrc" -Raw -ErrorAction SilentlyContinue
          "VLC: plugin $(Test-Path "$env:LOCALAPPDATA\PushMPC\vlc\libpushmpc_plugin.dll"); vlcrc video-filter $([regex]::Match("$vlcrc", '(?m)^video-filter=.*$').Value); VLC_PLUGIN_PATH $([Environment]::GetEnvironmentVariable('VLC_PLUGIN_PATH', 'User'))" | Tee-Object -Append $log
          if (-not $cap -or -not (@($cap.players) -match 'KMPlayer')) { $bad += 'capture mode not on for KMPlayer' }
          if (@($cap.players) -match '^VLC') { $bad += 'VLC went to capture mode: its PushMPC module was not installed' }
          if (-not (Test-Path "$env:LOCALAPPDATA\PushMPC\vlc\libpushmpc_plugin.dll") -or "$vlcrc" -notmatch 'pushmpc') { $bad += 'the VLC module is not set up (plugin and vlcrc)' }
          if (-not $lnk) { $bad += 'no Start menu entry for capture mode' }
          if (-not $mpc) { $bad += 'no MPC-HC filter entry' }
          # the Kodi add-on (the release's kodi component) in the Chocolatey Kodi: its installer's marker
          $km = "$env:APPDATA\PushMPC\kodi-addon.installed"
          "Kodi add-on: marker $(Test-Path $km) $(if (Test-Path $km) { (Get-Content $km) -join ' | ' }); add-on folder $(Test-Path "$env:APPDATA\Kodi\addons\inputstream.pushmpc")" | Tee-Object -Append $log
          if ((Test-Path "$env:ProgramFiles\Kodi\kodi.exe") -and -not (Test-Path $km)) { $bad += 'the Kodi add-on was not installed' }
          $mpvb = Test-Path "$env:LOCALAPPDATA\PushMPC\mpv-native\mpv.exe"; $mpvl = Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\PushMPC\PushMPC mpv.lnk"
          "PushMPC's mpv: mpv.exe $mpvb, Start menu entry $mpvl (zip $env:PUSHMPC_MPVBUILD_ZIP)" | Tee-Object -Append $log
          if ($env:PUSHMPC_MPVBUILD_ZIP -and -not ($mpvb -and $mpvl)) { $bad += "PushMPC's mpv was not installed" }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\PushMPC\PushMPC Capture (fallback).lnk") { $bad += 'the old capture shortcut name is still there' }
          if ($bad) { foreach ($b in $bad) { Write-Host "::error::$b" }; exit 1 }
          exit 0
      # the release's VLC component: pushcore through pm_pushcore.dll and PushMPC's Direct3D 11 output, as Setup installed
      # them; the module runs once on the stub core (vlc-plugin.yml's bridge-win64, this run) in place of the real core
      # on WARP, which must say "pushcore" in its log line; the real core goes back right after
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: bridge-win64, path: '${{ runner.temp }}/bridge', run-id: '${{ inputs.release_run || github.run_id }}' }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: clips, path: '${{ runner.temp }}/vlcclips', run-id: '${{ inputs.release_run || github.run_id }}' }
      - name: VLC on pushcore (stub core, WARP) and PushMPC's Direct3D 11 output, from Setup's install
        timeout-minutes: 10
        run: |
          $log = "$env:RUNNER_TEMP\ux.txt"; $bad = @()
          $pd = "$env:LOCALAPPDATA\PushMPC\vlc"; $vlcrc = Get-Content "$env:APPDATA\vlc\vlcrc" -Raw -ErrorAction SilentlyContinue
          foreach ($x in 'libpushmpc_plugin.dll', 'pm_pushcore.dll', 'libpushmpc_d3d11_plugin.dll') { if (-not (Test-Path "$pd\$x")) { $bad += "VLC: $x not installed" } }
          if ("$vlcrc" -notmatch '(?m)^vout=pushmpc_d3d11\r?$') { $bad += 'VLC: vout=pushmpc_d3d11 not set in vlcrc' }
          "VLC files: $((Get-ChildItem $pd -File -ErrorAction SilentlyContinue).Name -join ', '); vlcrc vout $([regex]::Match("$vlcrc", '(?m)^vout=.*$').Value)" | Tee-Object -Append $log
          $stub = Get-ChildItem "$env:RUNNER_TEMP\bridge" -Recurse -Filter pushcore.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          $clip = Get-ChildItem "$env:RUNNER_TEMP\vlcclips" -Recurse -Filter clip720.mkv -ErrorAction SilentlyContinue | Select-Object -First 1
          $core = "$env:LOCALAPPDATA\PushMPC\core\pushcore.dll"
          if (-not $stub -or -not $clip) { $bad += 'no bridge-win64 / clips artifact for the pushcore run' }
          elseif (-not (Test-Path $core)) { $bad += 'no installed core' }
          else {
            Copy-Item $core "$env:RUNNER_TEMP\pushcore.real.dll" -Force; Copy-Item $stub.FullName $core -Force
            try {
              $env:VLC_PLUGIN_PATH = [Environment]::GetEnvironmentVariable('VLC_PLUGIN_PATH', 'User')
              $vl = "$env:RUNNER_TEMP\vlc-pushcore.log"
              # what this VLC run itself writes into VLC's profile (the uninstall check compares that profile with the
              # one before Setup)
              function VlcProfile { @(Get-ChildItem "$env:APPDATA\vlc" -Recurse -File -Force -ErrorAction SilentlyContinue | Sort-Object FullName | ForEach-Object { "$((Get-FileHash $_.FullName).Hash.Substring(0, 12)) $($_.Length) $($_.FullName.Substring($env:APPDATA.Length))" }) }
              $prof0 = VlcProfile
              $p = Start-Process "$env:ProgramFiles\VideoLAN\VLC\vlc.exe" -PassThru -ArgumentList @('-I', 'dummy', '--no-audio', '--play-and-exit', '--avcodec-hw=none',
                     '--pushmpc-engine=2', '--pushmpc-warp', '--pushmpc-smoother=2', '--file-logging', "--logfile=$vl", '--log-verbose=2', "`"$($clip.FullName)`"")
              if (-not $p.WaitForExit(90000)) { $p.Kill() }
              $pdiff = @(Compare-Object @($prof0 + '') @((VlcProfile) + '') | Where-Object { $_.InputObject })
              "VLC's profile, written by this VLC run: $(if ($pdiff.Count) { ($pdiff | ForEach-Object { "$($_.SideIndicator) $($_.InputObject)" }) -join ' ; ' } else { 'nothing' })" | Tee-Object -Append $log
              $lines = @(Select-String -Path $vl -Pattern 'PushMPC 0|using vout display module|PushMPC: close' -ErrorAction SilentlyContinue | ForEach-Object Line)
              $lines | Select-Object -First 6 | Tee-Object -Append $log
              if (-not ($lines -match 'PushMPC 0.*-> x2 \(pushcore: ')) { $bad += 'VLC: the installed module did not run on pushcore' }
              if (-not ($lines -match 'using vout display module "pushmpc_d3d11"')) { $bad += 'VLC: PushMPC''s Direct3D 11 output did not open' }
            } finally { Copy-Item "$env:RUNNER_TEMP\pushcore.real.dll" $core -Force }
          }
          if ($bad) { foreach ($b in $bad) { Write-Host "::error::$b" }; exit 1 }
          'VLC: pushcore and the Direct3D 11 output from Setup''s install' | Tee-Object -Append $log
          exit 0
      - name: The earlier settings survive the install and a repair (R-REG1)
        run: |
          $log = "$env:RUNNER_TEMP\ux.txt"
          # every value of the seeded key, by key and name: Setup may add values (MlRuntime), never drop or change one
          function Values([string]$file) {
            $o = @{}; $cur = ''
            foreach ($l in Get-Content $file) { if ($l -match '^\[(.+)\]$') { $cur = $Matches[1] } elseif ($l -match '^"([^"]+)"=(.*)$') { $o["$cur|$($Matches[1])"] = $Matches[2] } }
            $o
          }
          function Check([string]$when) {
            $f = "$env:RUNNER_TEMP\snap\pushmpc-$when.reg"
            reg export 'HKCU\Software\PushMPC' $f /y | Out-Null
            $s = Values "$env:RUNNER_TEMP\snap\pushmpc-seeded.reg"; $now = if (Test-Path $f) { Values $f } else { @{} }
            $lost = @($s.Keys | Where-Object { $now[$_] -ne $s[$_] } | Sort-Object)
            "after the $when`: $($s.Count) seeded values, $($lost.Count) lost or changed$(if ($lost) { ': ' + ($lost -join ', ') })" | Tee-Object -Append $log | Out-Host
            $lost.Count
          }
          $bad = Check 'install'
          $keep = $env:PSModulePath; Remove-Item Env:PSModulePath
          $p = Start-Process "$env:LOCALAPPDATA\PushMPC\PushMpcSetup.exe" -ArgumentList '--repair', '--quiet' -PassThru
          $env:PSModulePath = $keep
          if (-not $p.WaitForExit(900000)) { $p.Kill(); throw 'repair timed out' }
          "repair exit $($p.ExitCode)" | Tee-Object -Append $log
          $bad += Check 'repair'
          if ($p.ExitCode -ne 0) { Write-Host "::error::repair exit $($p.ExitCode)"; exit 1 }
          if ($bad) { Write-Host "::error::Setup dropped or changed $bad of the earlier PushMPC settings (R-REG1)"; exit 1 }
          exit 0
      # U-1: a sandbox dry run of Repair and of Update over the real install writes nothing: no
      # HKCU\Software\PushMPC-Sandbox (a dry run once left Update\Enabled=1 there), no updater run, no logs\setup.log
      # entry; its log goes to %TEMP%\PushMPC-Setup-dry-run.log. The quiet command line, not the maintenance page's
      # checkbox (a GUI path), which the same fix (setup.cpp OnNext) guards.
      - name: Setup's sandbox dry run (Repair, Update) changes nothing (U-1)
        timeout-minutes: 10
        run: |
          $log = "$env:RUNNER_TEMP\ux.txt"; $bad = @()
          $inst = "$env:LOCALAPPDATA\PushMPC"; $sk = 'HKCU:\Software\PushMPC-Sandbox'; $dl = "$env:TEMP\PushMPC-Setup-dry-run.log"
          # every file and folder of the install, with size and write time
          function Snap { Get-ChildItem $inst -Recurse -Force | ForEach-Object { '{0}|{1}|{2}' -f $_.FullName.Substring($inst.Length), $(if ($_.PSIsContainer) { 'dir' } else { $_.Length }), $_.LastWriteTimeUtc.Ticks } | Sort-Object }
          if (Test-Path $sk) { Write-Host "::error::precondition: $sk exists before the dry runs"; exit 1 }
          $before = @(Snap)
          foreach ($op in '--repair', '--update') {
            Remove-Item $dl -Force -ErrorAction SilentlyContinue
            $keep = $env:PSModulePath; Remove-Item Env:PSModulePath
            $p = Start-Process "$inst\PushMpcSetup.exe" -ArgumentList '--sandbox', '--dry-run', '--quiet', $op -PassThru
            $env:PSModulePath = $keep
            if (-not $p.WaitForExit(600000)) { $p.Kill(); $bad += "$op dry run timed out"; continue }
            "dry run $op`: exit $($p.ExitCode); its log in %TEMP%: $(Test-Path $dl)" | Tee-Object -Append $log
            Get-Content $dl -ErrorAction SilentlyContinue | Select-Object -Last 6 | Tee-Object -Append $log
            if ($p.ExitCode -ne 0) { $bad += "$op dry run exit $($p.ExitCode)" }
            if (-not (Test-Path $dl)) { $bad += "$op dry run: no $dl (did it run, and where did it log?)" }
            if (Test-Path $sk) { $bad += "$op dry run left $sk behind: $((reg query 'HKCU\Software\PushMPC-Sandbox' /s) -join ' | ')" }
          }
          $diff = @(Compare-Object $before @(Snap) | ForEach-Object { "$($_.SideIndicator) $($_.InputObject)" })
          "install folder: $($before.Count) entries, $($diff.Count) changed by the dry runs" | Tee-Object -Append $log
          if ($diff) { $diff | Select-Object -First 20 | Tee-Object -Append $log; $bad += "the dry runs changed the install folder ($($diff.Count) entries; logs\setup.log among them: $([bool]($diff -match '\\logs\\setup')))" }
          if ($bad) { foreach ($b in $bad) { Write-Host "::error::$b" }; exit 1 }
          exit 0
      - name: A Plex update simulated (Plex's own avfilter-8.dll back), then the logon check sets the proxy up again
        timeout-minutes: 10
        run: |
          $log = "$env:RUNNER_TEMP\ux.txt"; $bad = @()
          if (-not (Get-ScheduledTask -TaskPath '\PushMPC\' -TaskName 'Plex proxy check' -ErrorAction SilentlyContinue)) { $bad += 'no Plex proxy logon check task' }
          $dirs = @("$env:ProgramFiles\Plex\Plex HTPC", "$env:ProgramFiles\Plex\Plex") | Where-Object { Test-Path "$_\avfilter-8-plex.dll" }
          foreach ($d in $dirs) { Copy-Item "$d\avfilter-8-plex.dll" "$d\avfilter-8.dll" -Force }
          $t = Get-ScheduledTask -TaskPath '\PushMPC\' -TaskName 'Plex proxy check' -ErrorAction SilentlyContinue
          # a run on an earlier release build (release_run): this commit's installer script runs the logon check
          if ('${{ inputs.release_run }}') { Copy-Item scripts/pushmpc-install.ps1 "$env:LOCALAPPDATA\PushMPC\filter\pushmpc-install.ps1" -Force; 'logon check: this commit''s pushmpc-install.ps1 (release_run)' | Tee-Object -Append $log }
          # as at a sign-in: Windows PowerShell 5.1 without pwsh's module path (5.1 would load 7's modules and fail)
          if ($t) { $a = $t.Actions[0]; "logon check: $($a.Execute) $($a.Arguments)" | Tee-Object -Append $log; $keep = $env:PSModulePath; Remove-Item Env:PSModulePath; $p = Start-Process $a.Execute -ArgumentList $a.Arguments -Wait -PassThru; $env:PSModulePath = $keep; "logon check exit $($p.ExitCode)" | Tee-Object -Append $log }
          Get-Content "$env:LOCALAPPDATA\PushMPC\logs\plex-check.log" -ErrorAction SilentlyContinue | Select-Object -Last 25 | Tee-Object -Append $log
          foreach ($d in $dirs) {
            $k = if ($d -like '*HTPC') { 'htpc' } else { 'desktop' }
            $want = (Get-Content "$env:ProgramData\PushMPC\plex-native\$k\proxy.sha256" -Raw -ErrorAction SilentlyContinue).Trim()
            $now = (Get-FileHash "$d\avfilter-8.dll").Hash
            "$d after the logon check: avfilter-8.dll $now (proxy $want)" | Tee-Object -Append $log
            if ($now -ne $want) { $bad += "${d}: the logon check did not put the proxy back" }
          }
          if (-not $dirs) { $bad += 'no Plex proxy to test the logon check with' }
          if ($bad) { foreach ($b in $bad) { Write-Host "::error::$b" }; exit 1 }
      - name: Auto plan on the runner's own adapter (the installed script)
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:LOCALAPPDATA\PushMPC\filter\pushmpc-install.ps1" autoplan 2>&1 | Tee-Object -Append "$env:RUNNER_TEMP\ux.txt"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:LOCALAPPDATA\PushMPC\filter\pushmpc-capture.ps1" status 2>&1 | Tee-Object -Append "$env:RUNNER_TEMP\ux.txt"
      - name: Uninstall (Setup --uninstall --quiet), then nothing left and the players as before
        if: always()
        run: |
          $log = "$env:RUNNER_TEMP\ux.txt"; $s = "$env:RUNNER_TEMP\snap"
          $q = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\PushMPC' -ErrorAction SilentlyContinue).QuietUninstallString
          if ($q) { $p = Start-Process cmd.exe -ArgumentList '/c', "`"$q`"" -PassThru; $p.WaitForExit(300000) | Out-Null; "uninstall exit $($p.ExitCode)" | Tee-Object -Append $log }
          $bad = @()
          foreach ($k in 'MPC-HC', 'VideoLAN') {
            reg export "HKCU\Software\$k" "$s\after-$k.reg" /y 2>$null | Out-Null
            $b = if (Test-Path "$s\before-$k.reg") { Get-Content "$s\before-$k.reg" } else { @() }; $a = if (Test-Path "$s\after-$k.reg") { Get-Content "$s\after-$k.reg" } else { @() }
            if (($b -join "`n") -ne ($a -join "`n")) { $d = Compare-Object @($b + '') @($a + ''); $bad += "HKCU\Software\$k differs: $(($d | Select-Object -First 6 | ForEach-Object { "$($_.SideIndicator) $($_.InputObject)" }) -join ' ; ')" }
          }
          (Get-ItemProperty HKCU:\Environment -ErrorAction SilentlyContinue).PSObject.Properties | Where-Object Name -notlike 'PS*' | ForEach-Object { "$($_.Name)=$($_.Value)" } | Sort-Object | Set-Content "$s\after-env.txt"
          if ((@(Get-Content "$s\before-env.txt" -ErrorAction SilentlyContinue) -join "`n") -ne (@(Get-Content "$s\after-env.txt" -ErrorAction SilentlyContinue) -join "`n")) { $bad += 'HKCU\Environment differs' }
          Get-ChildItem "$env:APPDATA\vlc" -Recurse -File -ErrorAction SilentlyContinue | Get-FileHash | ForEach-Object { "$($_.Hash) $($_.Path)" } | Set-Content "$s\after-vlc.txt"
          if ((@(Get-Content "$s\before-vlc.txt" -ErrorAction SilentlyContinue) -join "`n") -ne (@(Get-Content "$s\after-vlc.txt" -ErrorAction SilentlyContinue) -join "`n")) {
            $vd = Compare-Object @(@(Get-Content "$s\before-vlc.txt" -ErrorAction SilentlyContinue) + '') @(@(Get-Content "$s\after-vlc.txt" -ErrorAction SilentlyContinue) + '') | Where-Object { $_.InputObject }
            $rcNow = @(Get-Content "$env:APPDATA\vlc\vlcrc" -ErrorAction SilentlyContinue | Where-Object { $_.Trim() -and $_ -notmatch '^\s*#' })
            $bad += "VLC settings differ: $(($vd | Select-Object -First 8 | ForEach-Object { "$($_.SideIndicator) $($_.InputObject)" }) -join ' ; ')$(if ($rcNow.Count) { '; vlcrc now: ' + ($rcNow -join ' | ') })"
          }
          foreach ($k in 'HKCU:\Software\PushMPC', 'HKCU:\Software\Classes\CLSID\{798D4EC3-E59C-4A4E-A2EE-C804AEAE04CC}', 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\PushMPC') { if (Test-Path $k) { $bad += "left: $k" } }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\PushMPC") { $bad += 'left: Start menu folder PushMPC' }
          if (Test-Path "$env:APPDATA\PushMPC\kodi-addon.installed") { $bad += 'left: the Kodi add-on marker' }
          if (Test-Path "$env:APPDATA\Kodi\addons\inputstream.pushmpc") { $bad += 'left: the Kodi add-on' }
          function PlexSnap([string]$f) { @(foreach ($d in "$env:ProgramFiles\Plex\Plex HTPC", "$env:ProgramFiles\Plex\Plex") { Get-ChildItem $d -Recurse -File -ErrorAction SilentlyContinue | Sort-Object FullName | ForEach-Object { "$((Get-FileHash $_.FullName).Hash) $($_.FullName)" } }) + @(foreach ($c in "$env:LOCALAPPDATA\Plex HTPC\mpv.conf", "$env:LOCALAPPDATA\Plex\mpv.conf") { "$c $(if (Test-Path $c) { (Get-FileHash $c).Hash } else { 'absent' })" }) | Set-Content $f }
          PlexSnap "$s\after-plex.txt"
          $pd = Compare-Object @(Get-Content "$s\before-plex.txt") @(Get-Content "$s\after-plex.txt")
          if ($pd) { $bad += "Plex's folders or mpv.conf not as before: $(($pd | Select-Object -First 6 | ForEach-Object { "$($_.SideIndicator) $($_.InputObject)" }) -join ' ; ')" }
          if (Test-Path "$env:ProgramData\PushMPC\plex-native") { $bad += 'left: the Plex proxy backup folder' }
          if (Get-ScheduledTask -TaskPath '\PushMPC\' -TaskName 'Plex libmpv check' -ErrorAction SilentlyContinue) { $bad += 'left: the Plex logon check task' }
          if (Get-ScheduledTask -TaskPath '\PushMPC\' -TaskName 'Plex proxy check' -ErrorAction SilentlyContinue) { $bad += 'left: the Plex proxy logon check task' }
          $left = @(Get-ChildItem "$env:LOCALAPPDATA\PushMPC" -Force -ErrorAction SilentlyContinue | Where-Object { $_.Name -notin 'logs', 'PushMpcSetup.exe' } | ForEach-Object Name)
          if ($left) { $bad += "left in the install folder: $($left -join ', ')" }
          "after uninstall: $(if ($bad) { $bad -join ' / ' } else { 'nothing left; MPC-HC, VLC, Plex and the environment as before' })" | Tee-Object -Append $log
          @('## win-setup', '', '```') + (Get-Content $log) + @('```') -join "`n" >> $env:GITHUB_STEP_SUMMARY
          Copy-Item "$env:LOCALAPPDATA\PushMPC\logs" "$env:RUNNER_TEMP\pushmpc-logs" -Recurse -ErrorAction SilentlyContinue
          if ($bad) { foreach ($b in $bad) { Write-Host "::error::$b" }; exit 1 }
          exit 0
      - name: Plex fallback (proxy self-test failing), then uninstall restores Plex again
        if: always()
        timeout-minutes: 20
        env:
          PUSHMPC_TEST_PLEX_PROXY: fail
        run: |
          $log = "$env:RUNNER_TEMP\ux.txt"; $s = "$env:RUNNER_TEMP\snap"
          function PlexSnap([string]$f) { @(foreach ($d in "$env:ProgramFiles\Plex\Plex HTPC", "$env:ProgramFiles\Plex\Plex") { Get-ChildItem $d -Recurse -File -ErrorAction SilentlyContinue | Sort-Object FullName | ForEach-Object { "$((Get-FileHash $_.FullName).Hash) $($_.FullName)" } }) + @(foreach ($c in "$env:LOCALAPPDATA\Plex HTPC\mpv.conf", "$env:LOCALAPPDATA\Plex\mpv.conf") { "$c $(if (Test-Path $c) { (Get-FileHash $c).Hash } else { 'absent' })" }) | Set-Content $f }
          $keep = $env:PSModulePath; Remove-Item Env:PSModulePath
          $p = Start-Process "$env:RUNNER_TEMP\release\PushMPC-Setup.exe" -ArgumentList '/S' -PassThru
          $env:PSModulePath = $keep
          if (-not $p.WaitForExit(900000)) { $p.Kill(); throw 'Setup timed out' }
          $sl = Get-ChildItem "$env:LOCALAPPDATA\PushMPC\logs" -Filter 'setup*.log' | Sort-Object LastWriteTime | Select-Object -Last 1
          "fallback Setup exit $($p.ExitCode)" | Tee-Object -Append $log
          (Get-Content $sl.FullName | Select-String -Pattern 'Plex' | ForEach-Object Line) | Tee-Object -Append $log
          $bad = @()
          $plexState = @(Get-Content "$env:LOCALAPPDATA\PushMPC\plex\plex.json" -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json | Where-Object { $_ })
          foreach ($d in @("$env:ProgramFiles\Plex\Plex HTPC", "$env:ProgramFiles\Plex\Plex") | Where-Object { Test-Path "$_\libmpv-2.dll" }) {
            if (Test-Path "$d\avfilter-8-plex.dll") { $bad += "${d}: the proxy stayed although the swap was tried (both)" }
            if (-not @($plexState | Where-Object { $_.Dir -eq $d }).Count) { $bad += "${d}: no libmpv swap after the proxy failed" }
          }
          if (Test-Path "$env:LOCALAPPDATA\PushMPC\plexnative") { $bad += 'the proxy folder stayed after the fallback' }
          $q = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\PushMPC' -ErrorAction SilentlyContinue).QuietUninstallString
          if ($q) { $u = Start-Process cmd.exe -ArgumentList '/c', "`"$q`"" -PassThru; $u.WaitForExit(300000) | Out-Null; "fallback uninstall exit $($u.ExitCode)" | Tee-Object -Append $log }
          PlexSnap "$s\after2-plex.txt"
          if (Get-ScheduledTask -TaskPath '\PushMPC\' -TaskName 'Plex libmpv check' -ErrorAction SilentlyContinue) { $bad += 'left after the fallback: the Plex logon check task' }
          if (Get-ScheduledTask -TaskPath '\PushMPC\' -TaskName 'Plex proxy check' -ErrorAction SilentlyContinue) { $bad += 'left after the fallback: the Plex proxy logon check task' }
          if (Test-Path "$env:ProgramData\PushMPC\plex-native") { $bad += 'left after the fallback: the Plex proxy backup folder' }
          $pd = Compare-Object @(Get-Content "$s\before-plex.txt") @(Get-Content "$s\after2-plex.txt")
          if ($pd) { $bad += "after the fallback's uninstall, Plex's folders or mpv.conf not as before: $(($pd | Select-Object -First 6 | ForEach-Object { "$($_.SideIndicator) $($_.InputObject)" }) -join ' ; ')" }
          "Plex fallback: $(if ($bad) { $bad -join ' / ' } else { 'proxy out, libmpv swap in; uninstall put Plex back bit for bit' })" | Tee-Object -Append $log
          @('## Plex fallback', '', '```') + (Get-Content $log | Select-Object -Last 30) + @('```') -join "`n" >> $env:GITHUB_STEP_SUMMARY
          Copy-Item "$env:LOCALAPPDATA\PushMPC\logs" "$env:RUNNER_TEMP\pushmpc-logs2" -Recurse -ErrorAction SilentlyContinue
          if ($bad) { foreach ($b in $bad) { Write-Host "::error::$b" }; exit 1 }
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: win-setup-logs, path: "${{ runner.temp }}/*.txt\n${{ runner.temp }}/pushmpc-logs\n${{ runner.temp }}/pushmpc-logs2\n${{ runner.temp }}/snap" }

  # with the release build (dispatch) its native hook goes into the tarball: Arch's mpv then takes the hook route; a
  # push run tests the VapourSynth route
  linux-setup:
    needs: [release]
    if: always() && needs.release.result != 'cancelled'
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 80   # ncnn from source on a cold machine
    env:
      MESA_SHADER_CACHE_DISABLE: 'true'   # lavapipe's shader cache in HOME would fail the HOME check (it is the test's, not PushMPC's)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        with:
          name: pushmpc-kodi-Linux
          path: /tmp/kodi-art
          run-id: '${{ inputs.release_run || github.run_id }}'
          github-token: '${{ github.token }}'
      - uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        with:
          name: mpvnative-hook-ubuntu-24.04
          path: /tmp/mpvnative-art
          run-id: '${{ inputs.release_run || github.run_id }}'
          github-token: '${{ github.token }}'
      - uses: actions/cache@v4
        with: { path: /var/cache/pacman/pkg, key: arch-pkg-ux-v1 }
      - name: Players and build tools from pacman (mpv requires vapoursynth on Arch)
        timeout-minutes: 15
        run: |
          pacman -Syu --noconfirm --needed mpv vapoursynth vlc kodi celluloid smplayer ffmpeg cmake gcc make python python-pip git diffutils pciutils unzip vulkan-icd-loader vulkan-swrast vulkan-tools pkgconf libx11 libxcomposite libxdamage libxext libxrandr dbus libpipewire wayland wayland-protocols >/dev/null
          pacman -Q mpv vapoursynth vlc kodi celluloid smplayer | tee /tmp/versions.txt
          curl -fsSL --retry 3 -o /tmp/clip.mp4 "$CLIP_URL"
      - uses: actions/cache@v4
        with:
          path: /tmp/ncnn
          key: ncnn-static-arch-${{ hashFiles('scripts/ml-runtime-pin.json', 'scripts/build-ncnn-static.sh') }}
      - name: The plugin from this commit and the release tarball
        run: |
          set -eu
          mkdir -p vsplugin/third_party/vapoursynth
          cp /usr/include/vapoursynth/VapourSynth4.h /usr/include/vapoursynth/VSHelper4.h vsplugin/third_party/vapoursynth/
          # the ml backend (pmml): ONNX Runtime's headers by their pin; pmml's graphs for the tarball
          python -I pmml/scripts/fetch_runtime.py --pin scripts/ml-runtime-pin.json --platform linux-x64 --out /tmp/pmml-rt --cache /tmp/pmml-dl --flavors core --headers >/dev/null
          # Arch's Python is newer than the pinned onnx wheels: the current ones (the graphs are plain opset-16 ONNX)
          python -m venv /tmp/g && /tmp/g/bin/python -m pip install --disable-pip-version-check -q onnx numpy
          /tmp/g/bin/python -I pmml/scripts/make_graphs.py --out /tmp/pmml-graphs >/dev/null
          # ncnn (Vulkan) from its pinned full source, static and PIC, as release.yml builds it: the ml backend's ncnn path
          [ -d /tmp/ncnn/lib/cmake/ncnn ] || sh scripts/build-ncnn-static.sh /tmp/ncnn /tmp/ncnn-dl
          cmake -S vsplugin -B build -DCMAKE_BUILD_TYPE=Release -DPMML_ORT_INCLUDE=/tmp/pmml-rt/ort/core/include -DPMML_NCNN_DIR=/tmp/ncnn >/dev/null
          cmake --build build --target pushmpc_vs --parallel >/dev/null
          # capture mode, as release.yml builds it (the shipped tarball has capture/; release.yml fails without it)
          cmake -S vsplugin -B build-capture -DCMAKE_BUILD_TYPE=Release -DPMVS_FETCH_GPU_DEPS=ON >/dev/null
          cmake --build build-capture --target pushmpc_capture --parallel >/dev/null
          export PUSHMPC_CAPTURE_BIN=$PWD/build-capture/pushmpc-capture
          git config --global --add safe.directory "$PWD"
          [ -f /tmp/mpvnative-art/hook/pushmpc_hook.so ] && export PUSHMPC_MPVNATIVE_DIR=/tmp/mpvnative-art/hook && echo "native hook: $(ls /tmp/mpvnative-art/hook | tr '\n' ' ')"
          [ -f /tmp/kodi-art/install.sh ] && export PUSHMPC_KODI_DIR=/tmp/kodi-art && echo "Kodi add-on: $(ls /tmp/kodi-art | tr '\n' ' ')"
          # Plex (Flathub) as release.yml packs it: the preload and the self-test host next to the hook's builds
          if [ -n "${PUSHMPC_MPVNATIVE_DIR:-}" ]; then
            mkdir -p /tmp/plexlin
            cc -shared -fPIC -O2 -Wall mpvnative/hook/pushmpc_preload.c -o /tmp/plexlin/pushmpc_preload.so -ldl -lpthread
            cc -O2 -Wall mpvnative/hook/libmpv_host.c -o /tmp/plexlin/pushmpc-plex-selftest -ldl
            export PUSHMPC_PLEX_DIR=/tmp/plexlin
          fi
          PUSHMPC_PMML_GRAPHS=/tmp/pmml-graphs sh packaging/linux/make-tarball.sh vsplugin/bin/pushmpc_vs.so dist x86_64 "$(sed -n 's/.*PUSHMPC_VERSION_STR "\([^"]*\)".*/\1/p' filter/src/version.h)"
          if [ -n "${PUSHMPC_PLEX_DIR:-}" ]; then tar -tzvf dist/pushmpc-linux-x86_64-*.tar.gz | grep '/plex/'; tar -tzf dist/pushmpc-linux-x86_64-*.tar.gz | grep -q '/plex/pushmpc-plex-linux.sh$'; fi
          tar -tzf dist/pushmpc-linux-x86_64-*.tar.gz | grep -E '/setup.sh$|/pmml/' | head
          tar -tzf dist/pushmpc-linux-x86_64-*.tar.gz | grep -q '/pmml/graphs/synth-yuv.onnx$'
          tar -tzf dist/pushmpc-linux-x86_64-*.tar.gz | grep -q '/capture/pushmpc-capture$'
      - name: setup.sh into a fresh HOME (detection, engine choice, players, the pmml runtime), mpv through the installed block, uninstall
        env:
          # a Radeon without ROCm: PushFlow on ncnn (Vulkan); the runner's Vulkan device is lavapipe (Mesa, CPU)
          PUSHMPC_TEST_GPU: '1002:744c:AMD Radeon RX 7900 XTX'
        run: |
          set -eu
          export HOME=/tmp/home-ux; mkdir -p $HOME/.config/mpv $HOME/.kodi/userdata; printf 'volume=70\n' > $HOME/.config/mpv/mpv.conf
          snap() { (cd $HOME && find . -type f ! -path './.cache/dconf/*' | LC_ALL=C sort | xargs -r sha256sum); }
          snap > /tmp/before.txt
          tar -xzf dist/pushmpc-linux-x86_64-*.tar.gz -C /tmp
          sh /tmp/pushmpc-linux-x86_64-*/setup.sh --flatpak no --nvidia-vfx no | tee /tmp/setup.txt
          for want in 'Graphics card: AMD' 'Players found: mpv' 'vlc' 'kodi' 'PushFlow runtime installed' 'Auto starts with: ml' 'Capture mode: available for players with no other route'; do
            grep -q "$want" /tmp/setup.txt || { echo "::error::setup.sh output lacks '$want'"; exit 1; }
          done
          cat $HOME/.local/share/pushmpc/auto-plan.txt
          grep -q '^mpv=ml' $HOME/.local/share/pushmpc/auto-plan.txt
          p=$HOME/.local/share/pushmpc/pmml; ls -R $p | head -40
          for f in graphs/synth-yuv.onnx ncnn-models/rife-v4.25-lite_ensembleFalse/flownet.param ncnn-models/rife-v4.26_ensembleFalse/flownet.bin; do [ -f "$p/$f" ] || { echo "::error::the pmml runtime lacks $f"; exit 1; }; done
          # one route in mpv.conf, never both: the native hook's block when it activated, else the VapourSynth block
          native=0; grep -q -x 'native' $HOME/.local/share/pushmpc/setup-state 2>/dev/null && native=1
          vsb=0; grep -q 'PushMPC managed' $HOME/.config/mpv/mpv.conf && vsb=1
          nb=0; grep -q 'PushMPC native' $HOME/.config/mpv/mpv.conf && nb=1
          echo "route: native hook $native (block $nb), VapourSynth block $vsb"; echo "::notice title=Arch mpv route::native hook $native, VapourSynth block $vsb"
          [ "$((vsb + nb))" = 1 ] || { echo '::error::mpv.conf must hold exactly one PushMPC route'; exit 1; }
          [ "$native" = "$nb" ] || { echo '::error::setup.sh and mpv.conf disagree on the route'; exit 1; }
          # Kodi: the PushMPC add-on when this download has it (no mpv external player then), else mpv as its player
          kmark=$HOME/.config/pushmpc/kodi-addon.installed
          if grep -q -x 'kodi-addon' $HOME/.local/share/pushmpc/setup-state 2>/dev/null; then
            echo "Kodi add-on installed: $(cat "$kmark" 2>/dev/null)"; echo "::notice title=Kodi::the PushMPC add-on is installed ($(cat "$kmark" 2>/dev/null | tr '\t\n' ' '))"
            [ -f "$kmark" ] || { echo '::error::the Kodi add-on has no marker'; exit 1; }
            ! grep -q 'PushMPC mpv' $HOME/.kodi/userdata/playercorefactory.xml 2>/dev/null || { echo '::error::Kodi has both the add-on and the mpv external player'; exit 1; }
          else
            grep -q 'PushMPC mpv' $HOME/.kodi/userdata/playercorefactory.xml || { echo '::error::Kodi has no PushMPC external player'; exit 1; }
          fi
          # the ml backend through the installed runtime: ncnn on lavapipe (Vulkan on the CPU)
          vulkaninfo --summary 2>/dev/null | grep -E 'deviceName|driverName' | head -4 || true
          mkdir -p $HOME/.config/pushmpc
          export PUSHMPC_VS_LOG_DIR=/tmp/vslog-ml
          ffmpeg -v error -i /tmp/clip.mp4 -frames:v 9 -vf scale=640:360 -pix_fmt yuv420p -y /tmp/ml.y4m
          # VSScript writes its Python registration (vapoursynth.toml) on first use: kept out of the checked HOME
          XDG_CONFIG_HOME=/tmp/vs-cfg PUSHMPC_VS_PLUGIN=$PWD/vsplugin/bin/pushmpc_vs.so PMML_RUNTIME=$p PMML_TEST_CLIP=/tmp/ml.y4m PMML_TEST_W=640 PMML_TEST_H=360 PMML_TEST_BACKEND=ncnn:ncnn:vulkan:0 PUSHMPC_TEST_K=2 \
            timeout 300 vspipe vsplugin/tests/ci/ml_clip.vpy /dev/null > /tmp/vspipe-ml.txt 2>&1 || true
          tail -5 /tmp/vspipe-ml.txt
          echo "--- ml backend:"; grep -h 'backend: \|ml: \|pmml' /tmp/vslog-ml/*.log 2>/dev/null | head -12 || true
          echo "::notice title=ml backend on the runner::$(grep -h 'backend: \|ml: ' /tmp/vslog-ml/*.log 2>/dev/null | head -4 | tr '\n' ' ')"
          grep -qi 'ml: .*ncnn' /tmp/vslog-ml/*.log || { echo '::error::the ml backend did not run on ncnn'; exit 1; }
          grep -q 'ml: output YUV' /tmp/vslog-ml/*.log || { echo '::error::the ml backend produced no output'; exit 1; }
          printf '[PushMPC]\nSmoother=2\nBackend=portable\n' > $HOME/.config/pushmpc/settings.ini
          export PUSHMPC_VS_LOG_DIR=/tmp/vslog-ux
          mpv -v /tmp/clip.mp4 --vo=null --ao=null --length=3 > /tmp/mpv.txt 2>&1 || true
          grep -iE "config file|vapoursynth|pushmpc|user filter|error" /tmp/mpv.txt | head -30
          if [ "$native" = 1 ]; then
            grep -qi 'pushmpc' /tmp/mpv.txt || { echo '::error::mpv did not load the native hook'; exit 1; }
          else
            grep -h 'backend: ' /tmp/vslog-ux/*.log 2>/dev/null | head -2 || true
            grep -q 'portable: output YUV.*(x2)' /tmp/vslog-ux/*.log || { echo '::error::mpv did not run the plugin'; exit 1; }
          fi
          rm -r $HOME/.config/pushmpc
          sh $HOME/.local/share/pushmpc/setup.sh uninstall | tee /tmp/uninstall.txt
          snap > /tmp/after.txt
          d=$(diff /tmp/before.txt /tmp/after.txt | tr '\n' ' '); [ -z "$d" ] || { echo "::error title=HOME not restored::$d"; exit 1; }
          echo "HOME restored byte for byte"
          { echo '## linux-setup'; echo; echo '```'; cat /tmp/versions.txt; cat /tmp/setup.txt | grep -E 'Graphics|Vulkan|Engine|Players|No PushMPC|Capture|VLC|Kodi|Auto starts'; echo 'uninstall: HOME restored byte for byte'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: linux-setup-logs, path: "/tmp/*.txt\n/tmp/vslog-ux\n/tmp/vslog-ml" }
