# Builds a PushMPC release on a hosted Windows runner and publishes it on GitHub.
#
#   PushFPS (the pinned tag from scripts/pushfps-pin.json, plus patches/<patch>) -> pushcore.dll, the shaders and
#   pushcore_hip_preflight.exe; MPC Video Renderer's DirectShow base classes (pinned commit) -> PushMpcFilter.ax and
#   PushMpcExit.dll; PushMpcUpdater.exe (release build: unsigned feeds refused); then
#   "pushmpc-install.ps1 stage" and "package": PushMPC-Setup.exe, the component zips, release.json and release.json.sig.
#   Nothing of NVIDIA's is built into or shipped with a release (package refuses NVIDIA files).
#
# Triggers: a tag vX.Y.Z (stable) or vX.Y.Z-beta.N (pre-release, the updater's Beta channel); "Run workflow" by hand;
# or a call from pushfps-watch.yml (a PushFPS bump on a branch, built as a beta).
#
# Secrets (Settings > Secrets and variables > Actions):
#   PUSHMPC_SIGNING_KEY  the RSA private key XML that signs release.json (scripts/new-signing-key.ps1); required to publish
#   NVOF_SDK_HEADERS     required for a release, as in PushFPS's own CI: base64 of a zip with NVIDIA's Optical Flow SDK
#                        headers (nvOpticalFlowCommon.h, nvOpticalFlowD3D12.h). Without it the core has no NVIDIA optical
#                        flow and NVIDIA VFG cannot start: a release run fails; a dry run builds on with a loud warning.
#   CODESIGN_PFX_BASE64, CODESIGN_PFX_PASSWORD   optional Authenticode certificate for the exes (see docs/release-model.md)
# Variables:
#   PUSHMPC_GPU_RUNNER = true   run the GPU smoke test on a self-hosted runner labelled "gpu" (docs/building.md)
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish as this tag (vX.Y.Z or vX.Y.Z-beta.N). Empty: build only, no release.'
        required: false
        default: ''
      dry_run:
        description: 'Dry run: build and package only; the publish job is skipped, no release and no tag (default on)'
        type: boolean
        required: false
        default: true
  workflow_call:
    inputs:
      source_ref:
        description: 'Branch or commit of this repository to build'
        type: string
        required: true
      release_tag:
        description: 'Publish as this tag (empty: build only)'
        type: string
        required: false
        default: ''
      beta:
        description: 'Publish as v<filter version>-beta.<run number> (a pre-release for the Beta channel)'
        type: boolean
        required: false
        default: false
      dry_run:
        description: 'Dry run: no NVOF requirement, never published (dev-build.yml)'
        type: boolean
        required: false
        default: false
      components:
        description: 'Also build the VLC, mpv, Plex, Kodi and Linux/macOS pieces (false: Windows filter + core + Setup only, dev-build.yml)'
        type: boolean
        required: false
        default: true
    secrets:
      PUSHMPC_SIGNING_KEY:
        required: false
      NVOF_SDK_HEADERS:
        required: false
      CODESIGN_PFX_BASE64:
        required: false
      CODESIGN_PFX_PASSWORD:
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.source_ref || 'self' }}
  cancel-in-progress: false

jobs:
  # The component workflows run with tests: false here: only their build and package jobs plus a smoke test per
  # artifact (their full test suites run on push and dispatch of those workflows). Each is called twice:
  #   part release: what the build and linux jobs take (they wait only for these);
  #   part extra:   the pieces that are separate release assets (macOS VLC module, the mpv AppImage, Plex for Mac,
  #                 Kodi for Android): only the extras, macos and publish jobs wait for them.
  # All of them start at once, in parallel with the core build.
  #
  # the VLC module for the release (vlc-plugin.yml); the build and Linux jobs take its artifacts. A failure there
  # leaves VLC out of the release (Setup then covers VLC with capture mode), nothing else.
  vlc:
    if: ${{ format('{0}', inputs.components) != 'false' }}
    uses: ./.github/workflows/vlc-plugin.yml
    with: { tests: false, part: release }
  vlc-extra:
    if: ${{ format('{0}', inputs.components) != 'false' }}
    uses: ./.github/workflows/vlc-plugin.yml
    with: { tests: false, part: extra }

  # the native mpv route (mpv-native.yml): the runtime hook for distro mpv (Linux tarballs), PushMPC's own mpv build
  # for Windows (a release asset) and the Plex proxy; extra: the Linux AppImage and the Plex for Mac bundle
  mpvnative:
    if: ${{ format('{0}', inputs.components) != 'false' }}
    uses: ./.github/workflows/mpv-native.yml
    with:
      tests: false
      part: release
      fresh: ${{ (inputs.release_tag != '' || inputs.beta == true || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) && inputs.dry_run != true }}
  mpvnative-extra:
    if: ${{ format('{0}', inputs.components) != 'false' }}
    uses: ./.github/workflows/mpv-native.yml
    with:
      tests: false
      part: extra
      fresh: ${{ (inputs.release_tag != '' || inputs.beta == true || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) && inputs.dry_run != true }}

  # the Kodi add-on (kodi-addon.yml): Kodi 21 and 22 builds with their installer, for Setup (Windows) and the Linux
  # tarballs; extra: the Android builds. A failure leaves the add-on out (Kodi then plays through mpv), nothing else
  kodi:
    if: ${{ format('{0}', inputs.components) != 'false' }}
    uses: ./.github/workflows/kodi-addon.yml
    with: { wayland: false, tests: false, part: release }   # the playback tests build nothing for the release
  kodi-extra:
    if: ${{ format('{0}', inputs.components) != 'false' }}
    uses: ./.github/workflows/kodi-addon.yml
    with: { wayland: false, tests: false, part: extra }

  # PushFPS's pushcore, the filter, the updater and the VapourSynth plugin (core.yml): skipped when nothing that goes
  # into it changed since a run that built it (its output is cached under a hash of its inputs); a release (tag or
  # beta, not a dry run) always builds it fresh
  core:
    uses: ./.github/workflows/core.yml
    with:
      source_ref: ${{ inputs.source_ref || github.sha }}
      dry_run: ${{ inputs.dry_run == true }}
      fresh: ${{ (inputs.release_tag != '' || inputs.beta == true || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) && inputs.dry_run != true }}
    secrets: inherit

  # Setup, the component zips and the signed release.json from the core build and the components' artifacts
  # (the pushmpc-package action, shared with dev-build)
  build:
    needs: [core, vlc, mpvnative, kodi]
    if: ${{ !cancelled() && needs.core.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      GIT_TERMINAL_PROMPT: 0
      GCM_INTERACTIVE: never
    outputs:
      tag: ${{ steps.package.outputs.tag }}
      prerelease: ${{ steps.package.outputs.prerelease }}
      version: ${{ steps.package.outputs.version }}
      sha: ${{ steps.package.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          path: repo
          persist-credentials: false

      - uses: actions/download-artifact@v4
        if: needs.core.outputs.built == 'true'
        with: { name: core-build, path: '${{ github.workspace }}/core-out' }
      # core skipped (nothing in it changed): the outputs of the run that built it, and its GPU harness for gpu-smoke
      - uses: actions/cache/restore@v4
        if: needs.core.outputs.built != 'true'
        with: { path: core-out, key: '${{ needs.core.outputs.key }}', enableCrossOsArchive: true, fail-on-cache-miss: true }
      - uses: actions/upload-artifact@v4
        if: needs.core.outputs.built != 'true'
        with: { name: pushmpc-gpu-harness, path: '${{ github.workspace }}/core-out/harness/pushcore_gpu_harness.exe', if-no-files-found: error }

      - uses: ./repo/.github/actions/pushmpc-package
        id: package
        with:
          release_tag: ${{ inputs.release_tag }}
          beta: ${{ inputs.beta == true }}
          dry_run: ${{ inputs.dry_run == true }}
          signing_key: ${{ secrets.PUSHMPC_SIGNING_KEY }}
          codesign_pfx: ${{ secrets.CODESIGN_PFX_BASE64 }}
          codesign_password: ${{ secrets.CODESIGN_PFX_PASSWORD }}

  # Hosted runners have no GPU. With the repository variable PUSHMPC_GPU_RUNNER = true, a self-hosted Windows runner
  # labelled "gpu" (an NVIDIA RTX card) runs pushcore through the headless harness on a small public test clip.
  gpu-smoke:
    needs: build
    if: ${{ vars.PUSHMPC_GPU_RUNNER == 'true' }}
    runs-on: [self-hosted, windows, gpu]
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          path: repo
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: pushmpc-release
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@v4
        with:
          name: pushmpc-gpu-harness
          path: ${{ runner.temp }}/harness
      - name: Install into a scratch folder (runtime from Veyra's package, cached on the runner)
        run: |
          $cache = Join-Path $env:RUNNER_TOOL_CACHE 'pushmpc-veyra'
          New-Item -ItemType Directory -Force $cache | Out-Null
          $stage = "$env:RUNNER_TEMP\stage"; $inst = "$env:RUNNER_TEMP\pushmpc"
          Remove-Item $stage, $inst -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive (Get-ChildItem "$env:RUNNER_TEMP\release" -Filter 'PushMPC-?.*.zip' | Where-Object Name -notmatch '-(filter|core)-' | Select-Object -First 1).FullName $stage
          $root = (Get-ChildItem $stage -Directory | Select-Object -First 1).FullName
          ./repo/scripts/pushmpc-install.ps1 install -StageDir $root -InstallDir $inst -PackageCache $cache -NoExisting -NoMpcHc -NoRegister -NoTask -Gpu NVIDIA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem "$inst\download" -Filter 'Veyra-*.zip' -ErrorAction SilentlyContinue | Move-Item -Destination $cache -Force
          # the harness takes a PushFPS-style root: the runtime files, pushcore.dll and shaders\ in one folder
          $h = "$env:RUNNER_TEMP\harness-root"
          Remove-Item $h -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item "$inst\runtime" $h -Recurse
          Copy-Item "$inst\core\pushcore.dll", "$inst\core\shaders" $h -Recurse -Force
          "HARNESS_ROOT=$h" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Public test clip (Big Buck Bunny, CC BY 3.0 Blender Foundation; 10 s, 1080p H.264)
        run: |
          $clip = Join-Path $env:RUNNER_TOOL_CACHE 'pushmpc-clips\bbb-1080p-10s.mp4'
          if (-not (Test-Path $clip)) {
            New-Item -ItemType Directory -Force (Split-Path $clip) | Out-Null
            Invoke-WebRequest 'https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/1080/Big_Buck_Bunny_1080_10s_5MB.mp4' -OutFile $clip
          }
          "CLIP=$clip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: pushcore smoke test (VFG 2x and 4x, VSR, cut guard)
        run: |
          nvidia-smi --query-gpu=name,driver_version,utilization.gpu --format=csv
          $fail = 0
          foreach ($m in 2, 4) {
            $out = "$env:RUNNER_TEMP\harness-out-$m"
            & "$env:RUNNER_TEMP\harness\pushcore_gpu_harness.exe" $env:CLIP $out --pushfps $env:HARNESS_ROOT --start 1 --frames 90 --save 0 --backend vfg --multiplier $m 2>&1 | Tee-Object -Variable log | Select-Object -Last 15
            $r = ($log | Select-String '^RESULT ' | Select-Object -Last 1).Line
            if (-not $r -or $r -notmatch 'countMismatches=0 orderErrors=0 ptsErrors=0 sizeErrors=0') { Write-Host "::error::harness x$m failed: $r"; $fail++ }
            elseif ($r -cnotmatch ' generated=[1-9]') { Write-Host "::error::harness x$m generated no frames: $r"; $fail++ }
            else { Write-Host "x$m OK: $r" }
          }
          exit $fail

  # The Linux downloads: pushmpc-linux-<arch>-<version>.tar.gz (setup.sh, install.sh, the VapourSynth plugin built in
  # manylinux_2_28 with static libstdc++, as integrations.yml builds and tests it), attached to the release
  linux:
    needs: [vlc, mpvnative, kodi]
    if: ${{ !cancelled() && format('{0}', inputs.components) != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04, image: 'quay.io/pypa/manylinux_2_28_x86_64', wheel: linux }
          - { arch: aarch64, runner: ubuntu-24.04-arm, image: 'quay.io/pypa/manylinux_2_28_aarch64', wheel: linuxArm64 }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 75   # ncnn from source takes about 30 min on a cold cache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
      - name: Pinned VapourSynth wheel (SDK headers)
        run: |
          set -eu
          PY=/opt/python/cp312-cp312/bin/python
          url=$($PY -c "import json; print(json.load(open('scripts/vapoursynth-pin.json'))['portableCi']['${{ matrix.wheel }}']['url'])")
          sha=$($PY -c "import json; print(json.load(open('scripts/vapoursynth-pin.json'))['portableCi']['${{ matrix.wheel }}']['sha256'])")
          whl=/tmp/$(basename "$url")
          curl -fsSL --retry 3 -o "$whl" "$url"
          echo "$(echo "$sha" | tr A-F a-f)  $whl" | sha256sum -c -
          $PY -m pip install --no-deps --no-cache-dir "$whl"
          pkg=$($PY -c "import os, vapoursynth; print(os.path.dirname(vapoursynth.__file__))")
          mkdir -p vsplugin/third_party/vapoursynth
          cp "$pkg"/include/VapourSynth4.h "$pkg"/include/VSHelper4.h vsplugin/third_party/vapoursynth/
      # the VLC module and its hardware-decoding self-test clip (vlc-plugin.yml, this run; x86_64 builds only)
      - uses: actions/download-artifact@v4
        if: matrix.arch == 'x86_64'
        continue-on-error: true
        with: { name: plugin-linux, path: vlc-linux }
      - uses: actions/download-artifact@v4
        if: matrix.arch == 'x86_64'
        continue-on-error: true
        with: { name: clips, path: vlc-clips }
      # the Kodi add-on with its installer (kodi-addon.yml, this run; x86_64)
      - uses: actions/download-artifact@v4
        if: matrix.arch == 'x86_64'
        continue-on-error: true
        with: { name: pushmpc-kodi-Linux, path: kodi-linux }
      # the native hook for distro mpv (mpv-native.yml, this run, the same runner type)
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: 'mpvnative-hook-${{ matrix.runner }}', path: mpvnative-art }
      # the ml backend (PushFlow through pmml): ONNX Runtime's C API headers (pinned) for the build, pmml's graphs for setup.sh
      - name: pmml headers and graphs
        run: |
          set -eu
          PY=/opt/python/cp312-cp312/bin/python
          arch=x64; [ "${{ matrix.arch }}" = aarch64 ] && arch=arm64
          $PY -I pmml/scripts/fetch_runtime.py --pin scripts/ml-runtime-pin.json --platform linux-$arch --out /tmp/pmml-rt --cache /tmp/pmml-dl --flavors core --headers
          $PY -m venv /tmp/g && /tmp/g/bin/python -m pip install --disable-pip-version-check -q onnx==1.17.0 numpy==1.26.4
          /tmp/g/bin/python -I pmml/scripts/make_graphs.py --out /tmp/pmml-graphs
          ls /tmp/pmml-graphs
      # ncnn (Vulkan) from its pinned full source, static and PIC: pmml's ncnn backend for GPUs without an ONNX Runtime
      # EP (Linux AMD without ROCm, any Vulkan GPU); no prebuilt ncnn package fits glibc 2.28
      - uses: actions/cache/restore@v4
        id: ncnn-cache
        with:
          path: /tmp/ncnn
          key: ncnn-static-${{ matrix.arch }}-${{ hashFiles('scripts/ml-runtime-pin.json', 'scripts/build-ncnn-static.sh') }}
      - name: ncnn (static, PIC, Vulkan)
        run: |
          set -eu
          [ -d /tmp/ncnn/lib/cmake/ncnn ] || PY=/opt/python/cp312-cp312/bin/python sh scripts/build-ncnn-static.sh /tmp/ncnn /tmp/ncnn-dl
          ls /tmp/ncnn/lib
      - uses: actions/cache/save@v4
        if: steps.ncnn-cache.outputs.cache-hit != 'true'
        with:
          path: /tmp/ncnn
          key: ncnn-static-${{ matrix.arch }}-${{ hashFiles('scripts/ml-runtime-pin.json', 'scripts/build-ncnn-static.sh') }}
      - name: Plugin and tarball
        run: |
          set -eu
          cmake -S vsplugin -B build -DCMAKE_BUILD_TYPE=Release -DPMML_ORT_INCLUDE=/tmp/pmml-rt/ort/core/include -DPMML_NCNN_DIR=/tmp/ncnn -DCMAKE_SHARED_LINKER_FLAGS='-static-libstdc++ -static-libgcc' -DCMAKE_EXE_LINKER_FLAGS='-static-libstdc++ -static-libgcc'
          export PUSHMPC_PMML_GRAPHS=/tmp/pmml-graphs
          if [ -f mpvnative-art/hook/pushmpc_hook.so ]; then export PUSHMPC_MPVNATIVE_DIR=$PWD/mpvnative-art/hook; else echo "::warning title=native hook::no mpvnative-hook artifact for ${{ matrix.arch }}: the tarball has no mpvnative/"; fi
          # Plex from Flathub (LD_PRELOAD): the preload and the self-test host, built here (glibc 2.28); the libavfilter 8
          # builds and the engine come from the native hook folder
          if [ -n "${PUSHMPC_MPVNATIVE_DIR:-}" ]; then
            mkdir -p /tmp/plexlin
            cc -shared -fPIC -O2 -Wall mpvnative/hook/pushmpc_preload.c -o /tmp/plexlin/pushmpc_preload.so -ldl -lpthread
            cc -O2 -Wall mpvnative/hook/libmpv_host.c -o /tmp/plexlin/pushmpc-plex-selftest -ldl
            export PUSHMPC_PLEX_DIR=/tmp/plexlin
          fi
          if [ -f kodi-linux/install.sh ]; then export PUSHMPC_KODI_DIR=$PWD/kodi-linux; elif [ "${{ matrix.arch }}" = x86_64 ]; then echo "::warning title=Kodi add-on::no pushmpc-kodi-Linux artifact: the tarball has no kodi/"; fi
          if [ -f vlc-linux/libpushmpc_plugin.so ]; then export PUSHMPC_VLC_PLUGIN=$PWD/vlc-linux/libpushmpc_plugin.so; else echo "::warning title=VLC module::no plugin-linux artifact for ${{ matrix.arch }}: the tarball has no vlc/"; fi
          for c in vlc-clips/hwclip.mkv vlc-clips/clips/hwclip.mkv; do [ -f "$c" ] && export PUSHMPC_VLC_SELFTEST_CLIP=$PWD/$c && break; done
          cmake --build build --target pushmpc_vs portable_test --parallel
          ./build/portable_test | tail -3
          ver=$(sed -n 's/.*PUSHMPC_VERSION_STR "\([^"]*\)".*/\1/p' filter/src/version.h)
          git config --global --add safe.directory "$PWD"
          sh packaging/linux/make-tarball.sh vsplugin/bin/pushmpc_vs.so dist ${{ matrix.arch }} "$ver"
          tar -tzf dist/pushmpc-linux-${{ matrix.arch }}-$ver.tar.gz
          if [ -n "${PUSHMPC_PLEX_DIR:-}" ]; then tar -tzvf dist/pushmpc-linux-${{ matrix.arch }}-$ver.tar.gz | grep '/plex/'; tar -tzf dist/pushmpc-linux-${{ matrix.arch }}-$ver.tar.gz | grep -q '/plex/pushmpc_preload.so$'; fi
          # pmml's graphs for the Homebrew formula (its pmml-graphs resource)
          if [ "${{ matrix.arch }}" = x86_64 ]; then tar -czf dist/pmml-graphs-$ver.tar.gz -C /tmp/pmml-graphs . && ls -la dist/pmml-graphs-$ver.tar.gz; fi
      - uses: actions/upload-artifact@v4
        with: { name: 'pushmpc-linux-${{ matrix.arch }}', path: dist/, if-no-files-found: error }

  # Plex for Mac / Plex HTPC: pushmpc-plex-mac-<version>.tar.gz, the bundle mpv-native.yml built and tested on macOS
  # (universal proxy libavfilter.8.dylib, the vf_pushmpc builds, the engines: VideoToolbox, Vulkan on MoltenVK, CPU;
  # the self-test and pushmpc-plex-mac.sh). The Homebrew formula's plex-mac resource; pushmpc-setup installs it into
  # the Plex apps. A failure there leaves it out of the release, nothing else.
  macos:
    needs: [mpvnative-extra]
    if: ${{ !cancelled() && format('{0}', inputs.components) != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: filter/src, persist-credentials: false }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: plexmac, path: plexmac }
      - name: pushmpc-plex-mac-<version>.tar.gz
        env:   # G13: a release (tag or beta, not a dry run) needs the bundle
          STRICT: ${{ (inputs.release_tag != '' || inputs.beta == true || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) && inputs.dry_run != true }}
        run: |
          ver=$(sed -n 's/.*PUSHMPC_VERSION_STR "\([^"]*\)".*/\1/p' filter/src/version.h)
          mkdir -p dist
          if [ -f plexmac/pushmpc-plex-mac.sh ] && [ -f plexmac/libavfilter.8.dylib ]; then
            chmod +x plexmac/pushmpc-plex-selftest plexmac/pushmpc-plex-mac.sh   # artifacts drop the exec bits
            tar -czf "dist/pushmpc-plex-mac-$ver.tar.gz" -C plexmac .
            tar -tzvf "dist/pushmpc-plex-mac-$ver.tar.gz"
            shasum -a 256 "dist/pushmpc-plex-mac-$ver.tar.gz"
          else
            echo "::warning title=Plex for Mac::no plexmac artifact (mpv-native.yml plex-macos): the release has no Plex for Mac bundle"
            [ "$STRICT" != true ] || { echo "::error title=Plex for Mac::a release needs the Plex for Mac bundle"; exit 1; }
          fi
      - uses: actions/upload-artifact@v4
        with: { name: pushmpc-macos, path: dist/, if-no-files-found: ignore }

  # The separate release assets from the components' extra parts: the VLC module for macOS (universal), PushMPC's mpv
  # as a Linux AppImage, and the Kodi add-on for Android (Kodi 21 and 22, arm64). Only publish waits for this job.
  # G13: the "extra" lines of scripts/release-components.txt are checked here (a release fails without one).
  extras:
    needs: [vlc-extra, mpvnative-extra, kodi-extra]
    if: ${{ !cancelled() && format('{0}', inputs.components) != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          sparse-checkout: |
            filter/src
            scripts
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: plugin-macos, path: x/vlc-macos }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: mpvnative-appimage, path: x/appimage }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { pattern: 'addon-Android-arm64-kodi*', path: x/android }
      - name: The assets, and the components check
        env:
          STRICT: ${{ (inputs.release_tag != '' || inputs.beta == true || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) && inputs.dry_run != true }}
        run: |
          ver=$(sed -n 's/.*PUSHMPC_VERSION_STR "\([^"]*\)".*/\1/p' filter/src/version.h)
          mkdir -p dist
          [ -f x/vlc-macos/libpushmpc_plugin.dylib ] && (cd x/vlc-macos && zip -q "../../dist/pushmpc-vlc-macos-$ver.zip" libpushmpc_plugin.dylib)
          a=$(ls x/appimage/*.AppImage 2>/dev/null | head -1)
          [ -n "$a" ] && cp "$a" "dist/PushMPC-mpv-linux-x86_64-$ver.AppImage" && chmod +x "dist/PushMPC-mpv-linux-x86_64-$ver.AppImage"
          for k in 21 22; do
            d=x/android/addon-Android-arm64-kodi$k
            [ -d "$d/inputstream.pushmpc" ] && (cd "$d" && zip -qr "../../../dist/pushmpc-kodi$k-android-arm64-$ver.zip" inputstream.pushmpc)
          done
          ls -la dist
          missing=''
          while read -r name where path; do
            case "$name" in ''|'#'*) continue ;; esac
            [ "$where" = extra ] || continue
            if ls dist/$path >/dev/null 2>&1; then echo "ok       $name ($path)"; else echo "MISSING  $name ($path)"; missing="$missing $name"; fi
          done < scripts/release-components.txt
          [ -z "$missing" ] && exit 0
          if [ "$STRICT" = true ]; then echo "::error title=Release components::missing:$missing (not publishing)"; exit 1; fi
          echo "::warning title=Release components::missing:$missing (dry run: not fatal)"
      - uses: actions/upload-artifact@v4
        with: { name: pushmpc-extras, path: dist/, if-no-files-found: ignore }

  # The Homebrew formula (Formula/pushmpc.rb; this repository is the tap): the source tarball the formula builds from
  # (pushmpc-<version>-src.tar.gz, a release asset, so its SHA-256 is ours and never changes), and the formula pointed at
  # this release's archives by scripts/update-formula.py. Runs on dry runs too (the diff is in the log); the publish job
  # attaches the tarball and, for a stable release, commits the same update to main once the assets exist.
  formula:
    needs: [build, linux, macos]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.linux.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ needs.build.outputs.sha }}', persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { name: pushmpc-linux-x86_64, path: a }
      - uses: actions/download-artifact@v4
        continue-on-error: true   # no Plex for Mac archive: the formula goes without it
        with: { name: pushmpc-macos, path: m }
      - name: Source tarball and the formula for this release (shown, not committed)
        run: |
          set -e
          ver=$(sed -n 's/.*PUSHMPC_VERSION_STR "\([^"]*\)".*/\1/p' filter/src/version.h)
          tag="${{ needs.build.outputs.tag }}"; [ -n "$tag" ] || tag="v$ver"   # a dry run: the tag it would have
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          mkdir -p src
          git archive --format=tar.gz --prefix="PushMPC-$ver/" HEAD > "src/pushmpc-$ver-src.tar.gz"
          python3 -I scripts/update-formula.py Formula/pushmpc.rb --version "$ver" \
            --src "src/pushmpc-$ver-src.tar.gz" --src-url "$base/pushmpc-$ver-src.tar.gz" \
            --pmml "a/pmml-graphs-$ver.tar.gz" --pmml-url "$base/pmml-graphs-$ver.tar.gz" \
            --plex "m/pushmpc-plex-mac-$ver.tar.gz" --plex-url "$base/pushmpc-plex-mac-$ver.tar.gz"
          ruby -c Formula/pushmpc.rb
          git diff --stat; git diff Formula/pushmpc.rb
      - uses: actions/upload-artifact@v4
        with: { name: pushmpc-src, path: src/, if-no-files-found: error }

  publish:
    # G13: a release goes out only with every component built (vlc, mpvnative, kodi, macos, formula all green)
    # and the extras (macOS VLC module, the mpv AppImage, Kodi for Android)
    needs: [build, gpu-smoke, linux, macos, formula, extras, vlc, vlc-extra, mpvnative, mpvnative-extra, kodi, kodi-extra]
    if: ${{ always() && needs.build.result == 'success' && needs.linux.result == 'success' && needs.vlc.result == 'success' && needs.vlc-extra.result == 'success' && needs.mpvnative.result == 'success' && needs.mpvnative-extra.result == 'success' && needs.kodi.result == 'success' && needs.kodi-extra.result == 'success' && needs.macos.result == 'success' && needs.formula.result == 'success' && needs.extras.result == 'success' && needs.build.outputs.tag != '' && inputs.dry_run != true && (needs.gpu-smoke.result == 'success' || needs.gpu-smoke.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GIT_TERMINAL_PROMPT: 0
      GCM_INTERACTIVE: never
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pushmpc-release
          path: release
      - uses: actions/download-artifact@v4
        with:
          pattern: pushmpc-linux-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        continue-on-error: true   # a release without the Plex for Mac bundle still goes out
        with: { name: pushmpc-macos, path: release }
      - uses: actions/download-artifact@v4
        continue-on-error: true   # the Homebrew source tarball (formula job)
        with: { name: pushmpc-src, path: release }
      - uses: actions/download-artifact@v4   # the extras job's assets (it checked them: required for a release)
        with: { name: pushmpc-extras, path: release }
      # the release body: docs/release-notes-<version>.md of the built commit when it exists, else the text below
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
          path: repo
          sparse-checkout: docs
          persist-credentials: false
      - name: Create the GitHub release
        timeout-minutes: 10
        run: |
          set -e
          pre=""; [ "${{ needs.build.outputs.prerelease }}" = "true" ] && pre="--prerelease"
          latest="--latest"; [ -n "$pre" ] && latest="--latest=false"
          if [ -f "repo/docs/release-notes-${TAG#v}.md" ]; then cp "repo/docs/release-notes-${TAG#v}.md" notes.md; else
          cat > notes.md <<'EOF'
          Download **PushMPC-Setup.exe** and run it (per user, no administrator rights). It downloads Veyra's runtime package
          from Veyra's GitHub release unless PushFPS or Veyra is already installed with the same files.

          Setup is not code-signed yet: Windows SmartScreen may say "Windows protected your PC". Click "More info", then
          "Run anyway". The release manifest (release.json) is signed; the updater checks it.

          Installed PushMPC updates itself (Windows Settings > Apps > PushMPC > Modify, or MPC-HC > Play > Filters >
          PushMPC Filter > About). The other files are the components the updater downloads.
          EOF
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "PushMPC ${TAG#v}" --notes-file notes.md \
            --target "${{ needs.build.outputs.sha }}" $pre $latest release/*
      # the Homebrew formula on main, for a stable release: main's own Formula/pushmpc.rb pointed at the assets just
      # published (the same script as the formula job). A failure here (main protected, a race) leaves the release as it is
      - name: Homebrew formula on main
        if: needs.build.outputs.prerelease != 'true' && needs.formula.result == 'success'
        continue-on-error: true
        run: |
          set -e
          ver="${{ needs.build.outputs.version }}"; [ -n "$ver" ] || ver="${TAG#v}"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          git clone -q --depth 1 --branch main "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" main-repo
          cd main-repo
          plex=""; [ ! -f "../release/pushmpc-plex-mac-$ver.tar.gz" ] || plex="../release/pushmpc-plex-mac-$ver.tar.gz"
          python3 -I scripts/update-formula.py Formula/pushmpc.rb --version "$ver" \
            --src "../release/pushmpc-$ver-src.tar.gz" --src-url "$base/pushmpc-$ver-src.tar.gz" \
            --pmml "../release/pmml-graphs-$ver.tar.gz" --pmml-url "$base/pmml-graphs-$ver.tar.gz" \
            ${plex:+--plex "$plex" --plex-url "$base/pushmpc-plex-mac-$ver.tar.gz"}
          git diff --quiet && { echo "the formula on main is already at $TAG"; exit 0; }
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -am "Homebrew formula: PushMPC $TAG"
          git push -q origin HEAD:main
          echo "::notice title=Homebrew formula::Formula/pushmpc.rb on main points at $TAG"
