# PushMPC for VLC 3.0.x (vlcplugin/): builds libpushmpc_plugin for Linux, Windows (MinGW cross build) and macOS, runs
# the engine test, then plays synthetic clips headless in the distro VLC, the official Windows VLC, the Flathub VLC
# and VLC.app (Homebrew cask), counting frames and
# timestamps with a CSV display, and checks real video outputs (OpenGL and X11 under Xvfb, Direct3D on WARP, macosx).
name: vlc-plugin

on:
  push:
    branches: ['track/vlc', 'track/vlc-2', 'track/vlc-3', 'track/vlc-4', 'track/vlc-hwfmt', 'track/vlc-hwfix', 'track/vlcship']
    paths: ['vlcplugin/**', 'vsplugin/engines/**', 'vsplugin/third_party/pushfps-portable/**', 'vsplugin/src/backend.h', '.github/workflows/vlc-plugin.yml', 'pushmpc/content-shim/**', 'pushmpc/include/pushmpc/content_detect.h', 'pushmpc/include/pushmpc/content_model.h', 'pushmpc/include/pushmpc/content_prompts.inc']
  # release.yml builds the release's VLC module through this workflow (artifacts plugin-win64, plugin-linux, clips)
  workflow_call:
    inputs:
      tests:
        description: 'run the test jobs (release.yml: false, build jobs only; push and dispatch always test)'
        type: boolean
        default: true
      part:
        description: 'release.yml: "release" = what its build and linux jobs take (Windows and Linux modules, the bridge, clips); "extra" = what only its publish job takes (the macOS module); empty = everything'
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      macos:
        description: 'Also run the macOS job (10x minutes while the repo is private)'
        type: boolean
        default: false
      macos_fsr:
        description: 'macOS FSR output fork: on-screen pixel test in the runner GUI session (dispatch only)'
        type: boolean
        default: false

concurrency:
  # called from release.yml, github.workflow is the caller's name: its own group there, never cancelled midway
  group: vlc-plugin-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.part }}
  cancel-in-progress: ${{ github.workflow == 'vlc-plugin' }}

env:
  VLC_WIN_VERSION: '3.0.24'

jobs:
  clips:
    if: ${{ inputs.part != 'extra' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/cache@v4
        id: c
        with: { path: clips, key: vlc-clips-v5 }
      - name: Synthetic clips (public by construction; 4 s testsrc2 + hard cut + 2 s smptebars, 24 fps; 8 and 10 bit; 720p; hardware-format clips)
        if: steps.c.outputs.cache-hit != 'true'
        run: |
          set -eu
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg >/dev/null
          mkdir -p clips
          g="testsrc2=s=320x180:r=24:d=4[a];smptebars=s=320x180:r=24:d=2[b];[a][b]concat=n=2:v=1[v]"
          ffmpeg -hide_banner -loglevel error -filter_complex "$g" -map '[v]' -c:v libx264 -pix_fmt yuv420p -g 48 clips/clip.mkv
          ffmpeg -hide_banner -loglevel error -filter_complex "$g" -map '[v]' -c:v libx264 -profile:v high10 -pix_fmt yuv420p10le -g 48 clips/clip10.mkv
          ffmpeg -hide_banner -loglevel error -filter_complex "${g//320x180/1280x720}" -map '[v]' -c:v libx264 -pix_fmt yuv420p -g 48 clips/clip720.mkv
          # 4:2:2: a picture format the engines do not take (the module converts it in front of them, or passes it at x1)
          ffmpeg -hide_banner -loglevel error -filter_complex "$g" -map '[v]' -c:v libx264 -profile:v high422 -pix_fmt yuv422p -g 48 clips/clip422.mkv
          # hardware-format clips: no B-frames (the null drivers draw by decode order), 640x360; H.264 High and HEVC Main 10
          # (also the installer's hardware self-test clip, pushmpc-selftest.mkv)
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=s=640x360:r=24:d=4 -c:v libx264 -profile:v high -bf 0 -pix_fmt yuv420p -g 48 clips/hwclip.mkv
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=s=640x360:r=24:d=4 -c:v libx265 -pix_fmt yuv420p10le -x265-params bframes=0:log-level=error -g 48 clips/hwclip10.mkv
          # not drawn: a textured gradient panning every frame with sensor noise (the content library measures it as not drawn,
          # as its own test's live picture); the VLC cases check that the held-drawing repair is never set on it
          ffmpeg -hide_banner -loglevel error -f lavfi -i "nullsrc=s=320x180:r=24:d=6,format=gray,geq=lum='60+(X+3*N)*120/(W+600)+25*sin((X+3*N)*0.14)*cos(Y*0.1)+random(1)*9-4',format=yuv420p" -c:v libx264 -pix_fmt yuv420p -g 48 clips/live.mkv
          for c in clip clip10 clip720 clip422 hwclip hwclip10 live; do ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames,pix_fmt -of default=nw=1 clips/$c.mkv > clips/$c.txt; cat clips/$c.txt; done
      - uses: actions/upload-artifact@v4
        with: { name: clips, path: clips, retention-days: 5 }

  # x86_64 (artifact plugin-linux) and aarch64 (plugin-linux-aarch64, on the Arm runner: Raspberry Pi 4/5, Arm laptops
  # and boards with a distro VLC 3)
  build-linux:
    if: ${{ inputs.part != 'extra' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04, art: plugin-linux }
          - { arch: aarch64, runner: ubuntu-24.04-arm, art: plugin-linux-aarch64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: VLC 3 plugin headers (Ubuntu's libvlccore-dev, copied out for the build container)
        run: |
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y libvlccore-dev mesa-common-dev glslang-tools >/dev/null
          # the SPIR-V of the zero-copy shaders (vlcplugin/src/vk), made here for the manylinux build
          mkdir -p vlcspv
          glslangValidator -V --target-env vulkan1.2 --vn kSpv_pm_dmabuf_in -o vlcspv/pm_dmabuf_in.h vlcplugin/src/vk/dmabuf_in.comp
          glslangValidator -V --target-env vulkan1.2 --vn kSpv_pm_dmabuf_out8 -o vlcspv/pm_dmabuf_out8.h vlcplugin/src/vk/dmabuf_out.comp
          glslangValidator -V --target-env vulkan1.2 -DB16 --vn kSpv_pm_dmabuf_out16 -o vlcspv/pm_dmabuf_out16.h vlcplugin/src/vk/dmabuf_out.comp
          mkdir -p vlcinc && cp -r /usr/include/vlc/plugins/. vlcinc/
          grep -n 'MODULE_SUFFIX' vlcinc/vlc_plugin.h
          # OpenGL headers for the OpenGL output fork (headers only: the fork resolves GL through VLC's provider)
          mkdir -p glinc && cp -r /usr/include/GL /usr/include/KHR glinc/
      - uses: actions/cache@v4
        with: { path: ~/vlc-src, key: vlc-src-3.0.24 }
      - name: VLC 3.0.24 sources for the output forks (release tarball, SHA-256 checked, PushMPC patches applied)
        run: sh vlcplugin/display/vlc3/fetch-vlc-sources.sh ~/vlc-src
      - name: Build in manylinux2014 (glibc 2.17, devtoolset) - one binary for every distro's VLC 3.0.x
        timeout-minutes: 15
        run: |
          set -eux
          # Ubuntu's headers name the entry __3_0_0ft64 (Debian time64 build); the alias adds upstream's __3_0_0f
          if grep -q '3_0_0ft64' vlcinc/vlc_plugin.h; then alt=vlc_entry__3_0_0f; else alt=vlc_entry__3_0_0ft64; fi
          docker run --rm -v "$PWD":/w -w /w quay.io/pypa/manylinux2014_${{ matrix.arch }} bash -euxc "
            gcc --version | head -1
            cmake -S vlcplugin -B build -DCMAKE_BUILD_TYPE=Release -DVLC_PLUGIN_INCLUDE=/w/vlcinc -DPM_ALT_ENTRY=$alt -DPM_FETCH_GPU_DEPS=ON -DPM_GL_INCLUDE=/w/glinc -DPM_SPV_DIR=/w/vlcspv
            cmake --build build -j4
            gcc -std=gnu11 -O2 -fPIC -shared -D__PLUGIN__ -DPUSHSPIKE_DUMP_ONLY -DMODULE_STRING='\"pushdump\"' -DPM_ALT_ENTRY=$alt \
              -I/w/vlcinc vlcplugin/spike/pushspike.c -o build/libpushdump_plugin.so
            ./build/pm_engine_test"
          mkdir -p out/linux
          cp build/libpushmpc_plugin.so build/libpushdump_plugin.so build/libpushmpc_gl_plugin.so out/linux/
      - name: PushMPC's content library (libpushmpc_content.so; ContentDetect + the image model through pmml) in manylinux2014, its CPU test
        timeout-minutes: 15
        run: |
          set -eux
          # the ONNX Runtime C API headers (pinned, SHA-256 checked; headers only: ONNX Runtime itself is loaded at run time
          # from the user's pmml runtime, and without it the hand-built cues decide)
          python3 -I pmml/scripts/fetch_runtime.py --pin scripts/ml-runtime-pin.json --platform linux-x64 --out ortrt --cache ~/ort-dl --flavors core --headers > /dev/null
          docker run --rm -v "$PWD":/w -w /w quay.io/pypa/manylinux2014_${{ matrix.arch }} bash -euxc "
            cmake -S pushmpc/content-shim -B build-content -DCMAKE_BUILD_TYPE=Release -DPMML_ORT_INCLUDE=/w/ortrt/ort/core/include
            cmake --build build-content -j4
            ./build-content/pushmpc_content_test
            PUSHMPC_CONTENT_NO_CELLS=1 ./build-content/pushmpc_content_test"
          cp build-content/libpushmpc_content.so out/linux/
      - name: GLIBC gate (newest symbol version <= 2.27, so Debian 11+, Ubuntu 18.04+ and a core18 snap load it)
        run: |
          set -eu
          for f in out/linux/*.so; do
            v=$(objdump -T "$f" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
            echo "$f: GLIBC_$v; $(objdump -p "$f" | grep NEEDED | tr -s ' ' | tr '\n' ' ')"
            case "$f" in *libpushmpc_content.so) ;; *) nm -D "$f" | grep -E 'vlc_entry__3_0_0f(t64)?$' ;; esac   # the content library is no VLC module
            [ "$(printf '%s\n2.27\n' "$v" | sort -V | tail -1)" = 2.27 ] || { echo "::error::$f needs GLIBC_$v (> 2.27)"; exit 1; }
            ! objdump -T "$f" | grep -q 'GLIBCXX\|CXXABI' || { echo "::error::$f depends on the system libstdc++"; exit 1; }
          done
          nm -C out/linux/libpushmpc_plugin.so | grep -q "pmdb::DmabufIO::Init" && echo "zero copy (VA-API dmabuf -> GPU engine) built in" \
            || { echo "::error::the zero-copy path is not in the build"; exit 1; }
      - uses: actions/upload-artifact@v4
        with: { name: '${{ matrix.art }}', path: out/linux, retention-days: 7 }

  build-windows:
    if: ${{ inputs.part != 'extra' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with: { path: ~/vlc-dl, key: 'vlc-win64-${{ env.VLC_WIN_VERSION }}' }
      - name: VLC win64 SDK (official 7z, SHA-256 checked) and MinGW-w64 (posix threads)
        run: |
          set -eu
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix p7zip-full ninja-build >/dev/null
          mkdir -p ~/vlc-dl && cd ~/vlc-dl
          f=vlc-${VLC_WIN_VERSION}-win64.7z; base=https://download.videolan.org/pub/videolan/vlc/${VLC_WIN_VERSION}/win64
          [ -s "$f" ] || curl -fsSL --retry 3 -o "$f" "$base/$f"
          curl -fsSL --retry 3 -o "$f.sha256" "$base/$f.sha256"
          echo "$(cut -d' ' -f1 "$f.sha256")  $f" | sha256sum -c -
          7z x -y -o"$RUNNER_TEMP/vlcwin" "$f" "vlc-${VLC_WIN_VERSION}/sdk" >/dev/null
      - uses: actions/cache@v4
        with: { path: ~/vlc-src, key: vlc-src-3.0.24 }
      - name: VLC 3.0.24 sources for the Direct3D 11 output fork (release tarball, SHA-256 checked, PushMPC patch applied)
        run: sh vlcplugin/display/vlc3/fetch-vlc-sources.sh ~/vlc-src
      - name: Cross build (plugin, engine test, CSV test display)
        run: |
          set -eux
          sdk="$RUNNER_TEMP/vlcwin/vlc-${VLC_WIN_VERSION}/sdk"
          ls -la "$sdk/lib"
          lib=$(ls "$sdk"/lib/libvlccore.dll.a "$sdk"/lib/libvlccore.a "$sdk"/lib/libvlccore.lib "$sdk"/lib/vlccore.lib 2>/dev/null | head -1)
          cmake -S vlcplugin -B build -G Ninja -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc-posix -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++-posix \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
            -DVLC_PLUGIN_INCLUDE="$sdk/include/vlc/plugins" -DVLC_CORE_LIB="$lib" -DPM_FETCH_GPU_DEPS=ON
          cmake --build build
          mkdir -p out/win64
          cp build/libpushmpc_plugin.dll build/pm_engine_test.exe build/libpushmpc_d3d11_plugin.dll build/pm_nis_test.exe out/win64/
          x86_64-w64-mingw32-gcc-posix -std=gnu11 -O2 -shared -D__PLUGIN__ -DPUSHSPIKE_DUMP_ONLY -DMODULE_STRING='"pushdump"' \
            -I"$sdk/include/vlc/plugins" vlcplugin/spike/pushspike.c -o out/win64/libpushdump_plugin.dll -L"$sdk/lib" -lvlccore -static-libgcc
          x86_64-w64-mingw32-objdump -p out/win64/libpushmpc_plugin.dll | grep -E "DLL Name|vlc_entry"
          # symbol map of the display fork, to read crash stacks from the test job
          { x86_64-w64-mingw32-objdump -x build/libpushmpc_d3d11_plugin.dll | grep -E "^ImageBase"; \
            x86_64-w64-mingw32-nm -n -C build/libpushmpc_d3d11_plugin.dll | grep -iE " [tT] "; } > out/win64/d3d11fork-symbols.txt || true
          wc -l out/win64/d3d11fork-symbols.txt
      - uses: actions/upload-artifact@v4
        with: { name: plugin-win64, path: out/win64, retention-days: 7 }

  test-linux:
    needs: [clips, build-linux]
    if: ${{ format('{0}', inputs.tests) != 'false' }}   # release.yml: build only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # the installer's vlcrc handling (install, VLC's rewrite, uninstall: a user's own values back, no PushMPC key
      # left) on synthetic files, under dash (Ubuntu's /bin/sh) and bash
      - name: pushmpc-vlc.sh's vlcrc cases (dash, bash)
        run: |
          dash vlcplugin/install/pushmpc-vlc-test.sh
          bash vlcplugin/install/pushmpc-vlc-test.sh
      - uses: actions/download-artifact@v4
        with: { path: art }
      - name: VLC (Ubuntu 24.04), Xvfb, Mesa
        run: |
          sudo apt-get -qq update >/dev/null
          sudo apt-get -qq install -y --no-install-recommends vlc-bin vlc-plugin-base vlc-plugin-video-output xvfb libgl1-mesa-dri >/dev/null
      - name: Module cases and real displays (distro VLC; per-user plugin folder via VLC_PLUGIN_PATH)
        run: |
          d=~/.local/share/pushmpc/vlc; mkdir -p "$d" && cp art/plugin-linux/*.so "$d/"
          export VLC=$(command -v vlc) PLUGDIR="$d" CLIP=art/clips/clip.mkv CLIP10=art/clips/clip10.mkv CLIP720=art/clips/clip720.mkv CLIP422=art/clips/clip422.mkv CLIPLIVE=art/clips/live.mkv OUT=res/linux \
                 SRC_FRAMES=$(sed -n 's/nb_read_frames=//p' art/clips/clip.txt) DISPLAYS="gl xcb_x11" \
                 LABEL="Linux, Ubuntu VLC $(dpkg-query -W -f='${Version}' vlc-bin)"
          xvfb-run -a -s "-screen 0 1280x720x24" bash vlcplugin/tests/run-module.sh
      - name: At x1 the module passes a picture it would convert through untouched (4:2:2, Smoother off)
        run: |
          grep -h "PushMPC" res/linux/off_422.log | sed 's/^[^:]*: //' | head -4
          grep -q "x1: I422 passes through untouched" res/linux/off_422.log             || { echo "::error::at x1 the module kept its converter in front"; exit 1; }
      - name: The held-drawing repair's lag mode on the worker (every frame), never set on a picture measured as not drawn
        run: bash vlcplugin/tests/lag-check.sh res/linux 1
      - name: ContentDetect in VLC (libpushmpc_content.so next to the module in the cases above)
        run: |
          grep -h "PushMPC: content" res/linux/x2.log | sed 's/^[^:]*: //' | head -8
          grep -q "PushMPC: content measured in the picture by" res/linux/x2.log && grep -q "frames measured" res/linux/x2.log \
            || { echo "::error::the module did not measure the content with libpushmpc_content.so"; exit 1; }
      - name: The OpenGL output fork (vout=pushmpc_gl, FSR 1) against VLC's gl on screen (Xvfb, llvmpipe)
        run: |
          set -u
          sudo apt-get -qq install -y --no-install-recommends ffmpeg >/dev/null
          ldd /usr/lib/x86_64-linux-gnu/vlc/plugins/video_output/libgl_plugin.so | grep -i placebo || echo "VLC's gl output: no libplacebo"
          PLUGDIR=~/.local/share/pushmpc/vlc OUT=res/gl-pixel xvfb-run -a -s "-screen 0 1280x720x24" bash vlcplugin/display/tests/gl_pixel_test.sh
      - name: The portable GPU engine (Vulkan) on Mesa's lavapipe
        run: |
          set -u
          sudo apt-get -qq install -y --no-install-recommends mesa-vulkan-drivers >/dev/null
          export VLC=$(command -v vlc) PLUGDIR=~/.local/share/pushmpc/vlc CLIP=art/clips/clip.mkv CLIP720=art/clips/clip720.mkv \
                 OUT=res/linux-gpu SRC_FRAMES=$(sed -n 's/nb_read_frames=//p' art/clips/clip.txt) PUSHMPC_VK_ALLOW_CPU=1 GPU_TEST=1 \
                 CASES="gpu_x4 gpu_x2_720" LABEL="Linux, GPU engine on lavapipe"
          bash vlcplugin/tests/run-module.sh
          grep -h "PushMPC 0" res/linux-gpu/gpu_x4.log | head -1
          grep -q "GPU engine (Vulkan)" res/linux-gpu/gpu_x4.log || { echo "::error::the GPU engine did not run"; exit 1; }
      - name: Installer round trip (native target; then a run with no arguments, from its vlcrc; then uninstall)
        run: |
          set -eu
          mkdir -p ~/.config/vlc && printf '[core]\nvideo-filter=adjust\n[avcodec]\n#avcodec-hw=any\n' > ~/.config/vlc/vlcrc
          cp ~/.config/vlc/vlcrc /tmp/vlcrc.before
          sh vlcplugin/install/pushmpc-vlc.sh install --plugin art/plugin-linux/libpushmpc_plugin.so --target native
          cat ~/.config/vlc/vlcrc; cat ~/.config/environment.d/60-pushmpc-vlc.conf
          grep -q '^video-filter=adjust:postproc:pushmpc_out$' ~/.config/vlc/vlcrc
          d=$(sed -n 's/^VLC_PLUGIN_PATH=//p' ~/.config/environment.d/60-pushmpc-vlc.conf)
          # PushMPC's OpenGL output (FSR 1) installed and set as VLC's output; VLC opens it from the vlcrc alone
          [ -f "$d/libpushmpc_gl_plugin.so" ] && grep -q '^vout=pushmpc_gl$' ~/.config/vlc/vlcrc || { echo "::error::the OpenGL output fork is not set up"; exit 1; }
          VLC_PLUGIN_PATH="$d" timeout 60 xvfb-run -a -s "-screen 0 1280x720x24" vlc -I dummy --no-audio --play-and-exit --avcodec-hw=none             --file-logging --logfile=/tmp/vout-installed.log --log-verbose=2 art/clips/clip.mkv >/dev/null 2>&1 || true
          grep -E 'using vout display module|PushMPC FSR' /tmp/vout-installed.log | sort | uniq -c
          grep -q 'using vout display module "pushmpc_gl"' /tmp/vout-installed.log || { echo "::error::VLC did not open pushmpc_gl from the installer's vlcrc"; exit 1; }
          cp art/plugin-linux/libpushdump_plugin.so "$d/"
          export VLC=$(command -v vlc) PLUGDIR="$d" CLIP=art/clips/clip.mkv OUT=res/installed CASES=installed INSTALLED_MULT=0 \
                 SRC_FRAMES=$(sed -n 's/nb_read_frames=//p' art/clips/clip.txt) LABEL="Linux, after the installer (Xvfb 60 Hz: Auto x2)"
          xvfb-run -a -s "-screen 0 1280x720x24" bash vlcplugin/tests/run-module.sh
          grep -h "PushMPC 0" res/installed/installed.log | head -1 | grep -q -- "-> x" || { echo "::error::the module did not run from the installer's settings"; exit 1; }
          rm -f "$d/libpushdump_plugin.so"
          sh vlcplugin/install/pushmpc-vlc.sh uninstall --target native
          diff <(grep -v -e '^#' -e '^\[' /tmp/vlcrc.before | grep .) <(grep -v -e '^#' -e '^\[' ~/.config/vlc/vlcrc | grep .) && echo "vlcrc restored (active settings)"
          [ ! -e ~/.config/environment.d/60-pushmpc-vlc.conf ] && [ ! -e "$d/libpushmpc_plugin.so" ] && [ ! -e "$d/libpushmpc_gl_plugin.so" ] && echo "files removed"
          grep -q '^vout=' ~/.config/vlc/vlcrc && { echo "::error::vout left in vlcrc"; exit 1; }; echo "vout restored"
      - name: Flathub VLC with the same plugin (flatpak override --env=VLC_PLUGIN_PATH, the installer's route)
        timeout-minutes: 20
        run: |
          set -u
          sudo apt-get -qq install -y flatpak >/dev/null
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.videolan.VLC >/dev/null 2>&1 || { echo "::warning::flatpak install failed"; exit 0; }
          d=~/.var/app/org.videolan.VLC/data/pushmpc/vlc; mkdir -p "$d" && cp art/plugin-linux/*.so "$d/"
          flatpak override --user --env=VLC_PLUGIN_PATH="$d" org.videolan.VLC
          flatpak run --user org.videolan.VLC --version 2>/dev/null | head -1
          flatpak run --user org.videolan.VLC --list 2>/dev/null | grep -E 'pushmpc' || echo "::warning::the Flathub VLC lists no PushMPC module"
          flatpak run --user org.videolan.VLC --list 2>/dev/null | grep -q pushmpc_gl && echo "pushmpc_gl loads in the Flathub VLC (the installer sets it there)"
          cp art/clips/clip.mkv ~/.var/app/org.videolan.VLC/clip.mkv
          export VLC="" VLC_WRAP="flatpak run --user org.videolan.VLC" PLUGDIR="$d" CLIP=$HOME/.var/app/org.videolan.VLC/clip.mkv \
                 OUT=res/flatpak SRC_FRAMES=$(sed -n 's/nb_read_frames=//p' art/clips/clip.txt) LABEL="Linux, Flathub VLC" \
                 CASES="base x2 x4 x8 vlcrc144"
          bash vlcplugin/tests/run-module.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-linux, path: res, retention-days: 7 }

  # aarch64: the same module in Ubuntu 24.04's arm64 VLC (frames multiplied, the portable GPU engine on lavapipe, the
  # OpenGL output fork's pixel test, the installer round trip)
  test-linux-arm:
    needs: [clips, build-linux]
    if: ${{ format('{0}', inputs.tests) != 'false' }}   # release.yml: build only
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: art }
      - name: VLC (Ubuntu 24.04 arm64), Xvfb, Mesa
        run: |
          sudo apt-get -qq update >/dev/null
          sudo apt-get -qq install -y --no-install-recommends vlc-bin vlc-plugin-base vlc-plugin-video-output xvfb libgl1-mesa-dri             mesa-vulkan-drivers ffmpeg python3 >/dev/null
          file art/plugin-linux-aarch64/*.so
      - name: Module cases (CPU engine) and the GPU engine on lavapipe
        # GPU_ALLOW_CPU: lavapipe for gpu_x4 only (PUSHMPC_VK_ALLOW_CPU for the whole run put x2/x4/x8 on lavapipe too)
        run: |
          set -u
          d=~/.local/share/pushmpc/vlc; mkdir -p "$d" && cp art/plugin-linux-aarch64/*.so "$d/"
          export VLC=$(command -v vlc) PLUGDIR="$d" CLIP=art/clips/clip.mkv CLIP720=art/clips/clip720.mkv OUT=res/arm                  SRC_FRAMES=$(sed -n 's/nb_read_frames=//p' art/clips/clip.txt) GPU_ALLOW_CPU=1 GPU_TEST=1                  CASES="base x2 x4 x8 gpu_x4" LABEL="Linux aarch64, Ubuntu VLC $(dpkg-query -W -f='${Version}' vlc-bin)"
          xvfb-run -a -s "-screen 0 1280x720x24" bash vlcplugin/tests/run-module.sh | tee res-arm.txt
          for c in x2 x4 x8; do grep -q "^PASS {\"case\": \"$c\"" res-arm.txt || { echo "::error::$c failed on aarch64"; exit 1; }; done
          grep -q "GPU engine (Vulkan)" res/arm/gpu_x4.log || { echo "::error::the GPU engine did not run on aarch64"; exit 1; }
      - name: The OpenGL output fork (FSR 1) against VLC's gl on screen
        run: PLUGDIR=~/.local/share/pushmpc/vlc OUT=res/gl-pixel-arm xvfb-run -a -s "-screen 0 1280x720x24" bash vlcplugin/display/tests/gl_pixel_test.sh
      - name: Installer round trip (native target, as from the aarch64 tarball)
        run: |
          set -eu
          rm -rf ~/.local/share/pushmpc/vlc
          mkdir -p ~/.config/vlc && printf '[core]\nvideo-filter=adjust\n[avcodec]\n#avcodec-hw=any\n' > ~/.config/vlc/vlcrc
          cp ~/.config/vlc/vlcrc /tmp/vlcrc.before
          sh vlcplugin/install/pushmpc-vlc.sh install --no-hw-selftest --plugin art/plugin-linux-aarch64/libpushmpc_plugin.so --target native
          cat ~/.config/vlc/vlcrc
          grep -q '^vout=pushmpc_gl$' ~/.config/vlc/vlcrc && [ -f ~/.local/share/pushmpc/vlc/libpushmpc_gl_plugin.so ] || { echo "::error::the OpenGL output fork is not set up"; exit 1; }
          sh vlcplugin/install/pushmpc-vlc.sh uninstall --target native
          diff <(grep -v -e '^#' -e '^\[' /tmp/vlcrc.before | grep .) <(grep -v -e '^#' -e '^\[' ~/.config/vlc/vlcrc | grep .) && echo "vlcrc restored (active settings)"
          [ ! -e ~/.local/share/pushmpc/vlc ] && echo "files removed"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-linux-arm, path: res, retention-days: 7 }

  # the manylinux2014 binary in other distros' own VLC (Debian 12: 3.0.21; Debian 13: t64 build;
  # Ubuntu 22.04: 3.0.16): it must load (entry name, glibc) and multiply frames
  test-distros:
    needs: [clips, build-linux]
    if: ${{ format('{0}', inputs.tests) != 'false' }}   # release.yml: build only
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'debian:13', 'ubuntu:22.04']
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: { image: '${{ matrix.image }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: art }
      - name: Distro VLC, then the module as an ordinary user (VLC refuses to run as root)
        shell: bash
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get -qq update >/dev/null && apt-get -qq install -y --no-install-recommends vlc-bin vlc-plugin-base python3 perl >/dev/null
          vlc --version 2>/dev/null | head -1 || true
          useradd -m tester; chown -R tester "$GITHUB_WORKSPACE"
          su tester -c "cd '$GITHUB_WORKSPACE' && d=\$HOME/.local/share/pushmpc/vlc && mkdir -p \$d && cp art/plugin-linux/*.so \$d/ && \
            VLC=/usr/bin/vlc PLUGDIR=\$d CLIP=art/clips/clip.mkv OUT=res/distro SRC_FRAMES=\$(sed -n 's/nb_read_frames=//p' art/clips/clip.txt) \
            LABEL='${{ matrix.image }} distro VLC' CASES='base x2 x4 x8' bash vlcplugin/tests/run-module.sh" | tee distro.txt
          grep -q '^PASS {"case": "x4"' distro.txt || { echo "::error::x4 failed in ${{ matrix.image }}"; exit 1; }
          # PushMPC's OpenGL output in this VLC: the installer sets vout=pushmpc_gl only where VLC lists it
          su tester -c "VLC_PLUGIN_PATH=\$HOME/.local/share/pushmpc/vlc vlc --list 2>/dev/null" | grep pushmpc || true
          su tester -c "VLC_PLUGIN_PATH=\$HOME/.local/share/pushmpc/vlc vlc --list 2>/dev/null" | grep -q pushmpc_gl             && echo "pushmpc_gl loads in ${{ matrix.image }}" || echo "::warning::pushmpc_gl does not load in ${{ matrix.image }}'s VLC (the installer keeps VLC's output there)"
  # The hardware-format path (VA-API / VDPAU pictures kept on the GPU) without a GPU: PushMPC's null drivers
  # (vlcplugin/tests/fakehw) decode by drawing a moving box, VLC's own VA-API (DRM) and VDPAU decoders use them, and
  # the CSV display measures where the box is in every shown frame. Quirk switches reproduce what real drivers differ in;
  # drivers that lose uploads must make PushMPC fall back to pass-through. Then the installer's self-test, both ways.
  test-hw:
    needs: [clips, build-linux]
    if: ${{ format('{0}', inputs.tests) != 'false' }}   # release.yml: build only
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: art }
      - name: VLC, Xvfb, libva / libvdpau headers; a DRM render node from vgem (VLC's VA-API DRM decoder opens one)
        run: |
          set -u
          sudo apt-get -qq update >/dev/null
          sudo apt-get -qq install -y --no-install-recommends vlc-bin vlc-plugin-base vlc-plugin-video-output xvfb \
            libva-dev libvdpau-dev libx11-dev vainfo >/dev/null
          echo "kernel $(uname -r)"; ls -l /dev/dri 2>&1 || true
          sudo modprobe vgem 2>/dev/null || { sudo apt-get -qq install -y "linux-modules-extra-$(uname -r)" >/dev/null 2>&1; sudo modprobe vgem; } \
            || echo "::warning::vgem not available"
          # /dev/udmabuf: the null VA-API driver's surfaces export as dmabufs through it (zero copy, GL interop)
          sudo modprobe udmabuf 2>/dev/null || echo "::warning::udmabuf not available"
          sudo udevadm settle || true; sleep 2; sudo chmod 666 /dev/dri/renderD* /dev/dri/card* /dev/udmabuf 2>/dev/null; ls -l /dev/dri /dev/udmabuf
          find /usr/lib/x86_64-linux-gnu/vlc \( -name '*vaapi*' -o -name '*vdpau*' \) | sort
      - name: Null VA-API and VDPAU drivers; the module's libva declarations against <va/va.h>
        run: |
          set -eux
          mkdir -p fakehw
          gcc -std=gnu11 -O2 -Wall -fPIC -shared -o fakehw/pmnull_drv_video.so vlcplugin/tests/fakehw/pmnull_drv_video.c -lpthread
          gcc -std=gnu11 -O2 -Wall -fPIC -shared -o fakehw/libvdpau_pmnull.so.1 vlcplugin/tests/fakehw/pmnull_vdpau.c -lpthread
          gcc -std=gnu11 -Wall -o fakehw/layout vlcplugin/tests/fakehw/pm_va_layout_check.c && fakehw/layout
          nm -D fakehw/pmnull_drv_video.so | grep vaDriverInit
          sudo chmod 666 /dev/dri/renderD128; ls -l /dev/dri
          LIBVA_DRIVERS_PATH=$PWD/fakehw LIBVA_DRIVER_NAME=pmnull vainfo --display drm --device /dev/dri/renderD128 || true
      - name: Zero copy without VLC (pm_dmabuf_test; udmabuf surfaces through the GPU engine on lavapipe vs the copy path)
        if: always()
        run: |
          set -u
          sudo apt-get -qq install -y --no-install-recommends libvlccore-dev glslang-tools mesa-vulkan-drivers ninja-build >/dev/null
          cmake -S vlcplugin -B dbt -G Ninja -DCMAKE_BUILD_TYPE=Release -DVLC_PLUGIN_INCLUDE=/usr/include/vlc/plugins \
            -DPM_FETCH_GPU_DEPS=ON -DPM_GLSLANG="$(command -v glslangValidator)" -DPM_DMABUF_TEST=ON > dbt.log 2>&1 \
            && cmake --build dbt --target pm_dmabuf_test >> dbt.log 2>&1 || { tail -40 dbt.log; echo "::error::pm_dmabuf_test build failed"; exit 1; }
          grep "zero copy" dbt.log
          vulkaninfo --summary 2>/dev/null | grep -iE "deviceName|driverInfo|apiVersion" | head -4 || true
          PUSHMPC_VK_ALLOW_CPU=1 ./dbt/pm_dmabuf_test && r=0 || r=$?
          echo "pm_dmabuf_test: exit $r"
          [ $r = 3 ] && echo "::warning::Ubuntu 24.04's lavapipe cannot import dmabufs here: zero copy is verified in the Debian 13 container"
          [ $r = 1 ] && { echo "::error::zero copy differs from the copy path"; exit 1; }
          PUSHMPC_VK_ALLOW_CPU=1 PUSHMPC_VK_NO_DMABUF=1 ./dbt/pm_dmabuf_test --expect-unavailable
      - name: VDPAU cases (Ubuntu 24.04's VLC 3.0.20 decodes through VDPAU; it ships no VA-API decoder module)
        run: |
          d=~/.local/share/pushmpc/vlc; mkdir -p "$d" && cp art/plugin-linux/*.so "$d/"
          export VLC=$(command -v vlc) PLUGDIR="$d" FAKEHW=$PWD/fakehw CLIP=art/clips/hwclip.mkv \
                 SRC_FRAMES=$(sed -n 's/nb_read_frames=//p' art/clips/hwclip.txt) OUT=res/hw VDPAU=1 \
                 CASES="vdp_base vdp_x4 vdp_x4_sync vdp_noput_x4 vdp_broken_x4" \
                 LABEL="Linux, Ubuntu VLC $(dpkg-query -W -f='${Version}' vlc-bin), null VDPAU driver"
          xvfb-run -a -s "-screen 0 1280x720x24" bash vlcplugin/tests/run-hw.sh
      - name: Installer hardware self-test through VDPAU (passes on the working driver, keeps software decoding on a broken one)
        if: always()
        run: |
          set -eu
          export VDPAU_DRIVER=pmnull VDPAU_DRIVER_PATH=$PWD/fakehw
          d=~/.local/share/pushmpc/vlc; st=$d/hw-selftest.txt; rc=~/.config/vlc/vlcrc
          rm -rf "$d"; mkdir -p ~/.config/vlc && printf '[core]\nvideo-filter=adjust\n[avcodec]\n#avcodec-hw=any\n' > $rc
          cp $rc /tmp/vlcrc.before
          echo "--- install under Xvfb: no GL interop on llvmpipe (no GL_NV_vdpau_interop), the VDPAU decoder tier passes -> avcodec-hw=vdpau"
          xvfb-run -a sh vlcplugin/install/pushmpc-vlc.sh install --plugin art/plugin-linux/libpushmpc_plugin.so --target native --clip art/clips/hwclip.mkv
          cat $rc; cat $st
          grep -q '^ok direct vdpau' $st || { echo "::error::VDPAU self-test did not pass"; tail -30 $d/pushmpc-selftest.log; exit 1; }
          grep -q '^avcodec-hw=vdpau$' $rc || { echo "::error::avcodec-hw is not vdpau after the decoder tier passed"; exit 1; }
          echo "--- a driver that loses uploads: the self-test fails, software decoding comes back"
          PMNULL_BROKEN=1 xvfb-run -a sh vlcplugin/install/pushmpc-vlc.sh selftest-hw --target native --clip art/clips/hwclip.mkv
          cat $st; grep -q '^failed' $st && grep -q '^avcodec-hw=none' $rc || { echo "::error::broken driver not caught"; exit 1; }
          echo "--- no X (no VDPAU) and no VA-API decoder: nothing proven, software decoding stays"
          sh vlcplugin/install/pushmpc-vlc.sh selftest-hw --target native --clip art/clips/hwclip.mkv
          cat $st; grep -q '^failed' $st && grep -q '^avcodec-hw=none' $rc || { echo "::error::no-decoder case changed settings"; exit 1; }
          echo "--- no clip: skipped"
          sh vlcplugin/install/pushmpc-vlc.sh selftest-hw --target native --clip /nonexistent.mkv
          sh vlcplugin/install/pushmpc-vlc.sh uninstall --target native
          cat $rc
          diff <(grep -v -e '^#' -e '^\[' /tmp/vlcrc.before | grep .) <(grep -v -e '^#' -e '^\[' $rc | grep .) && echo "vlcrc restored (active settings)"
          [ ! -e $st ] && echo "state removed"
      - name: VA-API in distro VLCs with a VA-API decoder (Debian 12 all DRM cases + headless self-test; Debian 13 zero copy + fallback tier; Debian 13 + backports Mesa GL interop, required; Ubuntu 22.04 3.0.16)
        if: always()
        run: |
          set -u; bad=0; sudo chmod 666 /dev/dri/renderD128 /dev/udmabuf 2>/dev/null
          dev="--device /dev/dri/renderD128"; [ -e /dev/udmabuf ] && dev="$dev --device /dev/udmabuf"
          for im in debian:12=full debian:13=desktop debian:13=interop ubuntu:22.04=subset; do
            img=${im%=*}; mode=${im#*=}; l=$(echo "$img" | tr -d ':.'); [ "$mode" = interop ] && l="$l-interop"
            docker run --rm $dev -v "$PWD":/w -w /w "$img" bash vlcplugin/tests/run-hw-distro.sh "$l" $mode || bad=1
            cat res/hw-$l/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          done
          exit $bad
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-hw, path: res, retention-days: 7 }

  # Snap VLC: the wrapper unsets VLC_PLUGIN_PATH, so the plugin bank never sees PushMPC. Route: a Lua interface script in
  # the snap's user Lua folder loads our .so with package.loadlib; its bootstrap checks VLC's module layout against the
  # exported getters and hands the postproc slot (and one rarely used filter, for pushmpc_out) to PushMPC, or does nothing.
  snap-spike:
    needs: [clips, build-linux]
    if: ${{ format('{0}', inputs.tests) != 'false' }}   # release.yml: build only
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: art }
      - name: Snap VLC with the Lua bootstrap (VLC's own yuv output counts the frames)
        run: |
          set -u
          sudo snap install vlc >/dev/null || { echo "::warning::snap install failed"; exit 0; }
          snap list vlc
          c=~/snap/vlc/common; mkdir -p $c/pushmpc && cp art/plugin-linux/libpushmpc_plugin.so $c/pushmpc/
          timeout 60 snap run vlc --version >/dev/null 2>&1 || true    # creates ~/snap/vlc/<revision>
          rev=$(snap list vlc | awk 'NR==2{print $3}'); lua=~/snap/vlc/$rev/.local/share/vlc/lua/intf
          mkdir -p $lua && cp vlcplugin/install/snap/pushmpc_boot.lua $lua/ && ls -la ~/snap/vlc/ $lua
          printf 'smoother=4\n' > $c/pushmpc/pushmpc.conf
          cp art/clips/clip.mkv $c/clip.mkv
          mkdir -p res/snap
          run() { # name, then the vlcrc's [core] lines
            name=$1; shift
            printf '[core]\n%s\n' "$@" > $c/vlcrc
            rm -f $c/$name.y4m
            timeout 90 snap run vlc -I dummy --no-audio --play-and-exit -vv --avcodec-hw=none --vout=yuv --yuv-yuv4mpeg2 \
              --yuv-file=$c/$name.y4m $c/clip.mkv > res/snap/$name.log 2>&1 && rc=0 || rc=$?
            frames=$(grep -a -o FRAME $c/$name.y4m 2>/dev/null | wc -l)
            echo "== $name: exit $rc frames=$frames"
            grep -hE "PushMPC|pushmpc|lua|luaintf|postproc|Failed|denied" res/snap/$name.log | sort | uniq -c | head -15
          }
          run base 'extraintf='
          run boot 'extraintf=luaintf' 'lua-intf=pushmpc_boot' 'video-filter=postproc:pushmpc_out'
          PUSHMPC_SNAP_BOOT=0 run boot_off 'extraintf=luaintf' 'lua-intf=pushmpc_boot' 'video-filter=postproc:pushmpc_out'
          sudo dmesg 2>/dev/null | grep -i 'apparmor="DENIED"' | grep -i vlc | tail -5 || true
          b=$(grep -a -o FRAME $c/base.y4m 2>/dev/null | wc -l); x=$(grep -a -o FRAME $c/boot.y4m 2>/dev/null | wc -l)
          echo "base $b frames, with the bootstrap $x frames"
          [ "$x" -ge $((b * 3)) ] && echo "::notice::Snap VLC runs PushMPC (x$((x / (b > 0 ? b : 1))))" || echo "::warning::Snap bootstrap did not multiply frames"
          echo "--- the installer's snap target: install, play with its settings only (Auto from pushmpc.conf -> smoother 4 here), uninstall"
          rm -f $c/vlcrc $c/pushmpc/pushmpc.conf ~/snap/vlc/*/.local/share/vlc/lua/intf/pushmpc_boot.lua
          sh vlcplugin/install/pushmpc-vlc.sh install --plugin art/plugin-linux/libpushmpc_plugin.so --target snap
          printf 'smoother=4\n' > $c/pushmpc/pushmpc.conf
          cat $c/vlcrc
          timeout 90 snap run vlc -I dummy --no-audio --play-and-exit -vv --vout=yuv --yuv-yuv4mpeg2 --yuv-file=$c/installed.y4m \
            $c/clip.mkv > res/snap/installed.log 2>&1 && rc=0 || rc=$?
          i=$(grep -a -o FRAME $c/installed.y4m 2>/dev/null | wc -l)
          echo "installed: exit $rc, $i frames"; grep -h "snap boot" res/snap/installed.log || true
          sh vlcplugin/install/pushmpc-vlc.sh uninstall --target snap; cat $c/vlcrc
          [ "$i" -ge $((b * 3)) ] && echo "::notice::installer snap target: x$((i / (b > 0 ? b : 1)))" || { echo "::error::installer snap target did not run PushMPC"; exit 1; }
      - name: Snap VLC with hardware decoding through the null drivers (VA-API by environment; VDPAU through the bootstrap's test hook)
        if: always()
        run: |
          set -u
          snap list vlc >/dev/null 2>&1 || { echo "::warning::no snap VLC"; exit 0; }
          sudo apt-get -qq install -y --no-install-recommends libva-dev libvdpau-dev libx11-dev xvfb >/dev/null
          sudo modprobe vgem 2>/dev/null || { sudo apt-get -qq install -y "linux-modules-extra-$(uname -r)" >/dev/null 2>&1; sudo modprobe vgem; } || true
          sudo modprobe udmabuf 2>/dev/null || true
          # the snap's device cgroup (opengl interface) takes render nodes udev has tagged
          sudo udevadm trigger --subsystem-match=drm --action=change; sudo udevadm settle || true
          sudo chmod 666 /dev/dri/renderD* /dev/udmabuf 2>/dev/null; ls -l /dev/dri /dev/udmabuf 2>&1
          echo "--- the snap's hardware decoders and GL converters"
          find /snap/vlc/current/ \( -name '*vaapi*' -o -name '*vdpau*' -o -name 'libglconv*' \) 2>/dev/null | sed 's|.*/||' | sort | tr '\n' ' '; echo
          echo "--- what the launch chain does with the drivers' variables"
          LIBVA_DRIVERS_PATH=/pm-test VDPAU_DRIVER_PATH=/pm-test timeout 60 snap run --shell vlc -c 'env | grep -E "^(LIBVA|VDPAU)"' || true
          c=~/snap/vlc/common; mkdir -p $c/pmnull $c/pushmpc res/snap
          gcc -std=gnu11 -O2 -fPIC -shared -o $c/pmnull/pmnull_drv_video.so vlcplugin/tests/fakehw/pmnull_drv_video.c -lpthread
          gcc -std=gnu11 -O2 -fPIC -shared -o $c/pmnull/libvdpau_pmnull.so.1 vlcplugin/tests/fakehw/pmnull_vdpau.c -lpthread
          # PushMPC through the Lua bootstrap again (the installer test above removed it)
          cp art/plugin-linux/libpushmpc_plugin.so $c/pushmpc/
          rev=$(snap list vlc | awk 'NR==2{print $3}'); lua=~/snap/vlc/$rev/.local/share/vlc/lua/intf
          mkdir -p $lua && cp vlcplugin/install/snap/pushmpc_boot.lua $lua/
          printf 'smoother=4\n' > $c/pushmpc/pushmpc.conf
          printf '[core]\nextraintf=luaintf\nlua-intf=pushmpc_boot\nvideo-filter=postproc:pushmpc_out\n' > $c/vlcrc
          cp art/clips/hwclip.mkv $c/hwclip.mkv
          S=$(sed -n 's/nb_read_frames=//p' art/clips/hwclip.txt)
          Xvfb :99 -ac -screen 0 1280x720x24 >/dev/null 2>&1 &
          sleep 2
          bad=0
          case_hw() { # name hw expect mult env...
            name=$1; hw=$2; expect=$3; mult=$4; shift 4
            rm -f $c/$name.y4m
            env "$@" timeout 90 snap run vlc -I dummy --no-audio --play-and-exit -vv --avcodec-hw=$hw --vout=yuv --yuv-yuv4mpeg2 \
              --yuv-file=$c/$name.y4m $c/hwclip.mkv > res/snap/$name.log 2>&1 && rc=0 || rc=$?
            echo "== $name: exit $rc"
            grep -hE "for hardware decoding|PushMPC|snap boot|hw decoder|Failed" res/snap/$name.log | sort | uniq -c | head -10
            [ -s $c/$name.y4m ] && python3 vlcplugin/tests/y4mcx.py $c/$name.y4m res/snap/$name.csv
            python3 vlcplugin/tests/hwcheck.py $name res/snap/$name.csv res/snap/$name.log --expect $expect --mult $mult --src-frames $S || bad=1
          }
          VA="LIBVA_DRIVERS_PATH=$c/pmnull LIBVA_DRIVER_NAME=pmnull"
          # shellcheck disable=SC2086
          case_hw snap_va_base   vaapi_drm base 1 $VA PUSHMPC_SNAP_BOOT=0
          case_hw snap_va_x4     vaapi_drm hw   4 $VA
          case_hw snap_va_broken vaapi_drm pass 4 $VA PMNULL_BROKEN=1
          VD="DISPLAY=:99 VDPAU_DRIVER=pmnull PUSHMPC_TEST_VDPAU_DRIVER_PATH=$c/pmnull"
          case_hw snap_vdp_x4    vdpau     hw   4 $VD
          rm -f $c/vlcrc $c/pushmpc/pushmpc.conf $lua/pushmpc_boot.lua
          exit $bad
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-snap, path: res, retention-days: 7 }

  # pm_pushcore.dll (MSVC: vsplugin's pushcore host + the filter's Auto) and the stub pushcore.dll for the tests
  build-bridge:
    if: ${{ inputs.part != 'extra' }}   # release.yml stages it into the vlc component (build waits for it)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # the Windows installer's vlcrc handling on synthetic files, in PowerShell 7 and in Windows PowerShell 5.1 (the
      # one Setup runs it with)
      - name: pushmpc-vlc.ps1's vlcrc cases (pwsh, Windows PowerShell 5.1)
        shell: pwsh
        run: |
          pwsh -NoProfile -File vlcplugin/install/pushmpc-vlc-test.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File vlcplugin/install/pushmpc-vlc-test.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          exit 0
      - name: Build pm_pushcore.dll and the stub core
        shell: bash
        run: |
          set -eux
          cmake -S vlcplugin/pushcore_bridge -B bb -A x64
          cmake --build bb --config Release
          cmake -S vsplugin -B bs -A x64
          cmake --build bs --config Release --target pushcore_stub
          mkdir -p out/stub
          cp "$(find bb -name pm_pushcore.dll | head -1)" out/
          cp "$(find bs vsplugin/bin -name pushcore.dll 2>/dev/null | head -1)" out/stub/
          ls -la out out/stub
      - name: Zero copy (pushcore on the player's D3D11 device, texture slices in and out) on WARP with the stub core
        shell: bash
        run: |
          set -u
          t=$(find bb -name pm_pc_zc_test.exe | head -1)
          timeout 120 "$t" "$(cygpath -aw out/pm_pushcore.dll)" "$(cygpath -aw out/stub)"
      - name: The bridge's configuration ABI (ABI 2 callers; ABI 3 upscaler, real frames out, updates) on WARP with the stub core
        shell: bash
        run: |
          set -u
          t=$(find bb -name pm_pc_abi_test.exe | head -1)
          mkdir -p abi-scratch
          timeout 180 "$t" "$(cygpath -aw out/pm_pushcore.dll)" "$(cygpath -aw out/stub)" "$(cygpath -aw abi-scratch)"
      - name: The Direct3D 11 output's pushcore upscaler sharing the core with the filter (Auto's switch, the draw) on WARP with the stub core
        shell: bash
        run: |
          set -u
          t=$(find bb -name pm_pcsr_test.exe | head -1)
          mkdir -p pcsr-scratch
          timeout 300 "$t" "$(cygpath -aw out/pm_pushcore.dll)" "$(cygpath -aw out/stub)" "$(cygpath -aw pcsr-scratch)"
      - name: PushMPC's content library (pushmpc_content.dll, MSVC; ContentDetect + the image model through pmml) and its CPU test
        shell: bash
        run: |
          set -eux
          python -I pmml/scripts/fetch_runtime.py --pin scripts/ml-runtime-pin.json --platform win-x64 --out ortrt --cache "$RUNNER_TEMP/ort-dl" --flavors core --headers > /dev/null
          cmake -S pushmpc/content-shim -B bcs -A x64 -DPMML_ORT_INCLUDE="$(cygpath -m "$PWD/ortrt/ort/core/include")"
          cmake --build bcs --config Release
          "$(find bcs -name pushmpc_content_test.exe | head -1)"
          PUSHMPC_CONTENT_NO_CELLS=1 "$(find bcs -name pushmpc_content_test.exe | head -1)"   # as an older library: no GPU tap exports
          cp "$(find bcs -name pushmpc_content.dll | head -1)" out/
      - uses: actions/upload-artifact@v4
        with: { name: bridge-win64, path: out, retention-days: 7 }

  test-windows:
    needs: [clips, build-windows, build-bridge]
    if: ${{ format('{0}', inputs.tests) != 'false' }}   # release.yml: build only
    runs-on: windows-latest
    timeout-minutes: 30
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: art }
      - uses: actions/cache@v4
        with: { path: ~/vlc-dl, key: 'vlc-win64-${{ env.VLC_WIN_VERSION }}' }
      - name: Engine test
        run: art/plugin-win64/pm_engine_test.exe
      - name: NIS upscaler of the Direct3D 11 output fork, on WARP (no VLC)
        run: art/plugin-win64/pm_nis_test.exe
      - name: VLC ${{ env.VLC_WIN_VERSION }} (official portable 7z, SHA-256 checked)
        run: |
          set -eu
          mkdir -p ~/vlc-dl && cd ~/vlc-dl
          f=vlc-${VLC_WIN_VERSION}-win64.7z; base=https://download.videolan.org/pub/videolan/vlc/${VLC_WIN_VERSION}/win64
          [ -s "$f" ] || curl -fsSL --retry 3 -o "$f" "$base/$f"
          curl -fsSL --retry 3 -o "$f.sha256" "$base/$f.sha256"
          echo "$(cut -d' ' -f1 "$f.sha256")  $f" | sha256sum -c -
          7z x -y -o"$RUNNER_TEMP/vlcwin" "$f" >/dev/null
      - name: Module cases and real displays (per-user plugin folder via VLC_PLUGIN_PATH, no admin)
        run: |
          d="$LOCALAPPDATA/PushMPC/vlc"; mkdir -p "$d" && cp art/plugin-win64/*.dll "$d/"
          export VLC="$RUNNER_TEMP/vlcwin/vlc-${VLC_WIN_VERSION}/vlc.exe" PLUGDIR="$(cygpath -w "$d")" CLIP=art/clips/clip.mkv \
                 CLIP10=art/clips/clip10.mkv CLIP720=art/clips/clip720.mkv CLIPLIVE=art/clips/live.mkv OUT=res/windows SRC_FRAMES=$(sed -n 's/nb_read_frames=//p' art/clips/clip.txt | tr -d '\r') \
                 PY=python DISPLAYS="direct3d11 direct3d9" NORC=1 LABEL="Windows, VLC ${VLC_WIN_VERSION} win64"
          bash vlcplugin/tests/run-module.sh
          bash vlcplugin/tests/lag-check.sh res/windows 0
      - name: ContentDetect in VLC (pushmpc_content.dll next to the module; without it the module runs as before)
        run: |
          set -u
          # the module cases above ran without the library: they said so and ran as before
          grep -h "PushMPC: content not measured" res/windows/x2.log | head -1 | grep -q "pushmpc_content.dll is not next to the module" \
            || { echo "::error::without pushmpc_content.dll the module did not say so"; grep -h "PushMPC" res/windows/x2.log | head; exit 1; }
          d="$LOCALAPPDATA/PushMPC/vlc"; cp art/bridge-win64/pushmpc_content.dll "$d/"
          export VLC="$RUNNER_TEMP/vlcwin/vlc-${VLC_WIN_VERSION}/vlc.exe" PLUGDIR="$(cygpath -w "$d")" CLIP=art/clips/clip.mkv OUT=res/windows-content \
                 CLIPLIVE=art/clips/live.mkv SRC_FRAMES=$(sed -n 's/nb_read_frames=//p' art/clips/clip.txt | tr -d '\r') PY=python NORC=1 \
                 CASES="x2 x2_lag x4_lag x2_live" LABEL="Windows, with the content library"
          bash vlcplugin/tests/run-module.sh
          bash vlcplugin/tests/lag-check.sh res/windows-content 1
          grep -h "PushMPC: content" res/windows-content/x2.log | sed 's/^[^:]*: //' | head -8
          grep -q "PushMPC: content measured in the picture by" res/windows-content/x2.log && grep -q "frames measured" res/windows-content/x2.log \
            || { echo "::error::the module did not measure the content with pushmpc_content.dll"; exit 1; }
          rm -f "$d/pushmpc_content.dll"
      - name: The Direct3D 11 output fork in VLC (vout=pushmpc_d3d11 on WARP; software decoding keeps VLC's quad there)
        run: |
          set +e -u +o pipefail
          d="$LOCALAPPDATA/PushMPC/vlc"
          export VLC_PLUGIN_PATH="$(cygpath -w "$d")"
          mkdir -p res/windows-d3d11fork
          # WARP has no video decoder: d3d11va falls back after the output opened (a path real GPUs do not take), so these
          # runs decode in software; the same runs with VLC's own direct3d11 output are the reference
          # a crash must not leave a Windows Error Reporting dialog or a stray vlc.exe that blocks the next runs
          reg add 'HKCU\Software\Microsoft\Windows\Windows Error Reporting' //v DontShowUI //t REG_DWORD //d 1 //f > /dev/null
          # first, the fork under the SDK's console debugger: on a crash it prints the stack (module + offset; the
          # build job's d3d11fork-symbols.txt maps the fork's offsets to functions)
          cdb="/c/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe"
          if [ -x "$cdb" ]; then
            timeout 120 "$cdb" -g -G -c "r; kn 40; lm; q" "$RUNNER_TEMP/vlcwin/vlc-${VLC_WIN_VERSION}/vlc.exe" -I dummy --no-audio \
              --play-and-exit --avcodec-hw=none --vout=pushmpc_d3d11 --pushmpc-d3d11-upscale=linear art/clips/clip720.mkv \
              > res/windows-d3d11fork/cdb.txt 2>&1
            grep -nE "^[0-9a-f]{2} |c0000|Access violation|exception|second chance|pushmpc_d3d11|libvlccore|libvlc " res/windows-d3d11fork/cdb.txt | head -60
            taskkill //F //T //IM vlc.exe > /dev/null 2>&1
          else echo "no cdb"; fi
          for vout in direct3d11:- pushmpc_d3d11:linear pushmpc_d3d11:auto pushmpc_d3d11:nis; do
            v=${vout%%:*}; mode=${vout#*:}; tag=$v-$mode
            extra=""; [ "$mode" != - ] && extra="--pushmpc-d3d11-upscale=$mode"
            for flt in none pp; do
              fargs=""; [ $flt = pp ] && fargs="--video-filter=postproc:pushmpc_out --pushmpc-smoother=2"
              timeout 60 "$RUNNER_TEMP/vlcwin/vlc-${VLC_WIN_VERSION}/vlc.exe" -I dummy --no-audio --play-and-exit --avcodec-hw=none \
                --file-logging --logfile=res/windows-d3d11fork/$tag-$flt.log --log-verbose=2 --vout=$v $extra $fargs \
                art/clips/clip720.mkv && rc=0 || rc=$?
              echo "== $tag $flt: exit $rc"; echo "$tag-$flt $rc" >> res/windows-d3d11fork/rc.txt
              grep -hE "using vout display module|PushMPC NIS|Using .* scaler|generated=" res/windows-d3d11fork/$tag-$flt.log | sort | uniq -c | head -5
              [ $rc = 0 ] || tail -4 res/windows-d3d11fork/$tag-$flt.log
              taskkill //F //T //IM vlc.exe > /dev/null 2>&1; taskkill //F //IM WerFault.exe > /dev/null 2>&1
            done
          done
          cat res/windows-d3d11fork/rc.txt
          grep -q 'using vout display module "pushmpc_d3d11"' res/windows-d3d11fork/pushmpc_d3d11-auto-none.log || { echo "::error::the fork did not open"; exit 1; }
          ref=$(sed -n 's/^direct3d11---none //p' res/windows-d3d11fork/rc.txt); bad=""
          while read -r t r; do case $t in pushmpc_d3d11-*) [ "$r" = 0 ] || [ "$r" = "$ref" ] || { echo "::error::$t exit $r (reference $ref)"; bad=1; } ;; esac; done < res/windows-d3d11fork/rc.txt
          [ -z "$bad" ] || exit 1
      - name: pushcore through pm_pushcore.dll (the stub core on WARP; 720p)
        run: |
          set -u
          d="$LOCALAPPDATA/PushMPC/vlc"; cp art/bridge-win64/pm_pushcore.dll "$d/"
          mkdir -p "$LOCALAPPDATA/PushMPC/core" && cp art/bridge-win64/stub/pushcore.dll "$LOCALAPPDATA/PushMPC/core/"
          export VLC="$RUNNER_TEMP/vlcwin/vlc-${VLC_WIN_VERSION}/vlc.exe" PLUGDIR="$(cygpath -w "$d")" CLIP=art/clips/clip.mkv \
                 CLIP720=art/clips/clip720.mkv OUT=res/windows-pushcore SRC_FRAMES=$(sed -n 's/nb_read_frames=//p' art/clips/clip.txt | tr -d '\r') \
                 PY=python PUSHCORE=1 CASES="pc_x2_720 pc_x2_720_inline pc_x2_720_held" LABEL="Windows, pushcore (stub core, WARP)"
          bash vlcplugin/tests/run-module.sh
          grep -h "PushMPC 0\|pushcore\|PushMPC: close\|output stage:" res/windows-pushcore/*.log | sort | uniq -c | head -20
          grep -q "pushcore's lag mode" res/windows-pushcore/pc_x2_720_held.log || { echo "::error::pushcore's lag mode did not run"; exit 1; }
          cp -r "$LOCALAPPDATA/PushMPC/logs" res/windows-pushcore/ 2>/dev/null || true; tail -40 res/windows-pushcore/logs/*.log 2>/dev/null || true
          rm -f "$d/pm_pushcore.dll"; rm -rf "$LOCALAPPDATA/PushMPC/core"
      - name: Installer round trip (HKCU VLC_PLUGIN_PATH + %APPDATA%\vlc\vlcrc; the vlc component with pushcore and the D3D11 output; runs with no arguments; uninstall)
        run: |
          set -eu
          mkdir -p "$APPDATA/vlc" && printf '[core]\n#vout=\n#video-filter=\nvolume=200\n[direct3d11]\n#d3d11-upscale-mode=linear\n' > "$APPDATA/vlc/vlcrc"
          before=$(sha256sum "$APPDATA/vlc/vlcrc" | cut -d' ' -f1)
          # the files as Setup's vlc component stages them (scripts/pushmpc-install.ps1 Stage-Vlc)
          comp="$RUNNER_TEMP/vlc-component"; mkdir -p "$comp"
          cp art/plugin-win64/libpushmpc_plugin.dll art/plugin-win64/libpushmpc_d3d11_plugin.dll art/bridge-win64/pm_pushcore.dll vlcplugin/install/pushmpc-vlc.ps1 "$comp/"
          powershell -NoProfile -ExecutionPolicy Bypass -File "$(cygpath -w "$comp/pushmpc-vlc.ps1")" -Action Install -SkipVlcCheck \
            -Plugin "$(cygpath -w "$comp/libpushmpc_plugin.dll")"
          cat "$APPDATA/vlc/vlcrc"
          grep -q '^video-filter=postproc:pushmpc_out' "$APPDATA/vlc/vlcrc"; grep -q '^d3d11-upscale-mode=super' "$APPDATA/vlc/vlcrc"
          grep -q '^vout=pushmpc_d3d11' "$APPDATA/vlc/vlcrc" || { echo "::error::vout=pushmpc_d3d11 not set"; exit 1; }
          pd="$LOCALAPPDATA/PushMPC/vlc"
          for x in libpushmpc_plugin.dll pm_pushcore.dll libpushmpc_d3d11_plugin.dll; do [ -f "$pd/$x" ] || { echo "::error::$x not installed"; exit 1; }; done
          pp=$(powershell -NoProfile -Command "[Environment]::GetEnvironmentVariable('VLC_PLUGIN_PATH','User')" | tr -d '\r')
          echo "VLC_PLUGIN_PATH (user) = $pp"
          cp art/plugin-win64/libpushdump_plugin.dll "$(cygpath -u "$pp")/"
          export VLC="$RUNNER_TEMP/vlcwin/vlc-${VLC_WIN_VERSION}/vlc.exe" PLUGDIR="$pp" CLIP=art/clips/clip.mkv OUT=res/installed \
                 CASES=installed INSTALLED_MULT=0 PY=python SRC_FRAMES=$(sed -n 's/nb_read_frames=//p' art/clips/clip.txt | tr -d '\r') \
                 LABEL="Windows, after the installer (Auto from the runner's display mode)" HWARGS=" "
          bash vlcplugin/tests/run-module.sh
          grep -h "PushMPC 0" res/installed/installed.log | head -1 | grep -q -- "-> x" || { echo "::error::the module did not run from the installer's settings"; exit 1; }
          # pushcore through the installed pm_pushcore.dll: the stub core where Setup puts the core (WARP, 720p, x2)
          mkdir -p "$LOCALAPPDATA/PushMPC/core" && cp art/bridge-win64/stub/pushcore.dll "$LOCALAPPDATA/PushMPC/core/"
          CLIP=art/clips/clip720.mkv OUT=res/installed-pushcore HWARGS=--avcodec-hw=none INSTALLED_MULT=2 INSTALLED_ARGS="--pushmpc-engine=2 --pushmpc-warp --pushmpc-smoother=2" \
            SRC_FRAMES=$(sed -n 's/nb_read_frames=//p' art/clips/clip720.txt | tr -d '\r') LABEL="Windows, after the installer: pushcore (stub core, WARP)" \
            bash vlcplugin/tests/run-module.sh
          grep -h "PushMPC 0" res/installed-pushcore/installed.log | head -2
          grep -h "PushMPC 0" res/installed-pushcore/installed.log | head -1 | grep -q -- "-> x2 (pushcore: " \
            || { echo "::error::the installed module did not run on pushcore"; grep -h "PushMPC" res/installed-pushcore/installed.log | head; exit 1; }
          rm -rf "$LOCALAPPDATA/PushMPC/core"
          rm -f "$(cygpath -u "$pp")/libpushdump_plugin.dll"
          # VLC with no arguments opens PushMPC's Direct3D 11 output from the vlcrc (WARP: software decoding). A process started
          # after the install (Explorer got the installer's WM_SETTINGCHANGE "Environment") takes VLC_PLUGIN_PATH from
          # HKCU\Environment; this shell started before the install, so the run gets the value read from there, as such a
          # process would (empty when the installer did not write it: then the check below fails)
          envpp=$(powershell -NoProfile -Command "(Get-ItemProperty -Path 'HKCU:\Environment' -Name VLC_PLUGIN_PATH -ErrorAction SilentlyContinue).VLC_PLUGIN_PATH" | tr -d '\r')
          echo "HKCU\\Environment VLC_PLUGIN_PATH = $envpp"
          VLC_PLUGIN_PATH="$envpp" timeout 60 "$VLC" -I dummy --no-audio --play-and-exit --avcodec-hw=none --file-logging --logfile=res/installed/vout.log --log-verbose=2 \
            art/clips/clip720.mkv > /dev/null 2>&1 || true
          taskkill //F //T //IM vlc.exe > /dev/null 2>&1 || true
          grep -hE "using vout display module|PushMPC NIS|generated=" res/installed/vout.log | sort | uniq -c || true
          grep -q 'using vout display module "pushmpc_d3d11"' res/installed/vout.log || { echo "::error::VLC did not open pushmpc_d3d11 from the installer's vlcrc"; exit 1; }
          powershell -NoProfile -ExecutionPolicy Bypass -File "$(cygpath -w "$comp/pushmpc-vlc.ps1")" -Action Uninstall
          cat "$APPDATA/vlc/vlcrc"
          left=$(powershell -NoProfile -Command "[Environment]::GetEnvironmentVariable('VLC_PLUGIN_PATH','User')" | tr -d '\r')
          [ -z "$left" ] && echo "VLC_PLUGIN_PATH removed"; ! grep -q '^video-filter=' "$APPDATA/vlc/vlcrc" && echo "video-filter restored"
          [ "$(sha256sum "$APPDATA/vlc/vlcrc" | cut -d' ' -f1)" = "$before" ] || { echo "::error::vlcrc not restored byte for byte"; exit 1; }
          echo "vlcrc restored byte for byte"
          [ ! -e "$pd" ] || { echo "::error::files left: $(ls "$pd")"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-windows, path: res, retention-days: 7 }

  macos:
    # public repository: standard macOS runners are free, so macOS runs on every push. release.yml: part extra, build
    # only (the module is a release asset); the clips job is not in that part
    needs: [clips]
    if: ${{ !cancelled() && inputs.part != 'release' && needs.clips.result != 'failure' }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: ${{ format('{0}', inputs.tests) != 'false' }}
        with: { name: clips, path: art/clips }
      - uses: actions/cache@v4
        if: ${{ format('{0}', inputs.tests) != 'false' }}
        with: { path: ~/Library/Caches/Homebrew/downloads, key: brew-vlc-cask-v1 }
      - uses: actions/cache@v4
        with: { path: ~/vlc-dl, key: 'vlc-win64-${{ env.VLC_WIN_VERSION }}' }
      - name: VLC.app (cask, for the tests) and the VLC 3 plugin headers (from the official SDK)
        env:
          TESTS: ${{ format('{0}', inputs.tests) != 'false' }}
        run: |
          set -eu
          [ "$TESTS" != true ] || brew install --cask vlc >/dev/null
          brew install p7zip ninja >/dev/null 2>&1 || true
          mkdir -p ~/vlc-dl && cd ~/vlc-dl
          f=vlc-${VLC_WIN_VERSION}-win64.7z
          [ -s "$f" ] || curl -fsSL --retry 3 -o "$f" "https://download.videolan.org/pub/videolan/vlc/${VLC_WIN_VERSION}/win64/$f"
          7z x -y -o"$RUNNER_TEMP/vlcwin" "$f" "vlc-${VLC_WIN_VERSION}/sdk/include" >/dev/null
      - name: Build (universal arm64 + x86_64)
        run: |
          set -eux
          inc="$RUNNER_TEMP/vlcwin/vlc-${VLC_WIN_VERSION}/sdk/include/vlc/plugins"
          cmake -S vlcplugin -B build -G Ninja -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DVLC_PLUGIN_INCLUDE="$inc" -DPM_FETCH_GPU_DEPS=ON
          cmake --build build
          ./build/pm_engine_test
          mkdir -p out/mac && cp build/libpushmpc_plugin.dylib out/mac/
          clang -std=gnu11 -O2 -dynamiclib -undefined dynamic_lookup -arch arm64 -arch x86_64 -D__PLUGIN__ -DPUSHSPIKE_DUMP_ONLY \
            -DMODULE_STRING='"pushdump"' -I"$inc" vlcplugin/spike/pushspike.c -o out/mac/libpushdump_plugin.dylib
          codesign -s - -f out/mac/*.dylib
          lipo -info out/mac/libpushmpc_plugin.dylib
      - name: PushMPC's content library (libpushmpc_content.dylib, universal; ContentDetect + the image model through pmml) and its CPU test
        run: |
          set -eux
          python3 -I pmml/scripts/fetch_runtime.py --pin scripts/ml-runtime-pin.json --platform osx-arm64 --out ortrt --cache "$RUNNER_TEMP/ort-dl" --flavors core --headers > /dev/null
          cmake -S pushmpc/content-shim -B build-content -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DPMML_ORT_INCLUDE="$PWD/ortrt/ort/core/include"
          cmake --build build-content
          ./build-content/pushmpc_content_test
          cp build-content/libpushmpc_content.dylib out/mac/ && codesign -s - -f out/mac/libpushmpc_content.dylib
          lipo -info out/mac/libpushmpc_content.dylib
      - uses: actions/upload-artifact@v4
        with: { name: content-macos, path: out/mac/libpushmpc_content.dylib, if-no-files-found: error, retention-days: 7 }
      # the release asset (release.yml publishes it as pushmpc-vlc-macos-<version>.zip)
      - uses: actions/upload-artifact@v4
        with: { name: plugin-macos, path: out/mac/libpushmpc_plugin.dylib, if-no-files-found: error, retention-days: 7 }
      - name: Module cases and the macosx display (VLC_PLUGIN_PATH, plugin outside the signed bundle)
        if: ${{ format('{0}', inputs.tests) != 'false' }}   # release.yml: build only
        run: |
          d=~/Library/Application\ Support/PushMPC/vlc; mkdir -p "$d" && cp out/mac/*.dylib "$d/"
          export VLC=/Applications/VLC.app/Contents/MacOS/VLC PLUGDIR="$d" CLIP=art/clips/clip.mkv CLIP10=art/clips/clip10.mkv \
                 OUT=res/macos SRC_FRAMES=$(sed -n 's/nb_read_frames=//p' art/clips/clip.txt) LABEL="macOS, VLC.app cask" \
                 HWARGS="--codec=avcodec,none --avcodec-hw=none"
          # (no real-display case: VLC's macosx vout needs the macosx interface, which needs a logged-in GUI session)
          bash vlcplugin/tests/run-module.sh
      - name: ContentDetect in VLC (libpushmpc_content.dylib next to the module in the cases above)
        if: ${{ format('{0}', inputs.tests) != 'false' }}
        run: |
          grep -h "PushMPC: content" res/macos/x2.log | sed 's/^[^:]*: //' | head -8
          grep -q "PushMPC: content measured in the picture by" res/macos/x2.log && grep -q "frames measured" res/macos/x2.log \
            || { echo "::error::the module did not measure the content with libpushmpc_content.dylib"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-macos, path: res, retention-days: 7 }

  # dispatch only: PushMPC's macOS OpenGL output fork (pushmpc_macosx, FSR 1) against VLC's macosx output on the screen of
  # the runner's logged-in GUI session
  macos-fsr:
    if: github.event_name == 'workflow_dispatch' && inputs.macos_fsr
    runs-on: macos-15   # macos-14 is retired ("not supported")
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with: { path: ~/vlc-dl, key: 'vlc-win64-${{ env.VLC_WIN_VERSION }}' }
      - uses: actions/cache@v4
        with: { path: ~/vlc-src, key: vlc-src-3.0.24 }
      - name: VLC.app (cask), the VLC 3 plugin headers (official SDK) and the VLC 3.0.24 sources (tarball, SHA-256 checked)
        run: |
          set -eu
          brew install --cask vlc >/dev/null
          brew install p7zip ninja >/dev/null 2>&1 || true
          mkdir -p ~/vlc-dl && cd ~/vlc-dl
          f=vlc-${VLC_WIN_VERSION}-win64.7z
          [ -s "$f" ] || curl -fsSL --retry 3 -o "$f" "https://download.videolan.org/pub/videolan/vlc/${VLC_WIN_VERSION}/win64/$f"
          7z x -y -o"$RUNNER_TEMP/vlcwin" "$f" "vlc-${VLC_WIN_VERSION}/sdk/include" >/dev/null
          cd "$GITHUB_WORKSPACE" && sh vlcplugin/display/vlc3/fetch-vlc-sources.sh ~/vlc-src
      - name: Build pushmpc_macosx
        run: |
          set -eux
          inc="$RUNNER_TEMP/vlcwin/vlc-${VLC_WIN_VERSION}/sdk/include/vlc/plugins"
          cmake -S vlcplugin -B build -G Ninja -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DVLC_PLUGIN_INCLUDE="$inc"
          cmake --build build --target pushmpc_macosx_plugin
          mkdir -p out/mac && cp build/libpushmpc_macosx_plugin.dylib out/mac/ && codesign -s - -f out/mac/*.dylib
          lipo -info out/mac/libpushmpc_macosx_plugin.dylib; file /Applications/VLC.app/Contents/MacOS/VLC
      - name: On-screen pixel test (pushmpc_macosx off / FSR against VLC's macosx output)
        run: |
          d=~/Library/Application\ Support/PushMPC/vlc; mkdir -p "$d" && cp out/mac/*.dylib "$d/"
          system_profiler SPDisplaysDataType 2>/dev/null | grep -E "Resolution|Display Type" || true
          VLC=/Applications/VLC.app/Contents/MacOS/VLC PLUGDIR="$d" OUT=res/mac-pixel bash vlcplugin/display/tests/mac_pixel_test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-macos-fsr, path: res, retention-days: 7 }
