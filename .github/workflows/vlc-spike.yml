# On track/deint-probe this file carries the deinterlace probe (main keeps the VLC spike; a dispatch with
# --ref track/deint-probe runs this version).
# Deinterlace probe (dispatch only; nothing in the product changes): can PushMPC deinterlace (or inverse-telecine)
# interlaced video FIRST and then generate frames, instead of stepping aside? Exact ground truth: 60p masters woven into
# 60i (two fields per frame, top first), and a 24p master hard-telecined (2:3) to 30i; every arm's output is scored
# against its master (tests/deint-probe/score.py: frame count, rate, luma PSNR frame by frame, exact frames), and
# PushMPC's own CombMeter (tests/deint-probe/comb_probe.cpp) says what combing is left. Evidence lines start "probe:".
#   ffmpeg   the deinterlacers themselves (bwdif, yadif, w3fdif, estdif, nnedi) and the inverse telecine (fieldmatch +
#            decimate, pullup), the reference for what each algorithm reaches
#   mpv-vs   Windows, the pinned mpv + VapourSynth + pushmpc_vs (portable backend, CPU): with --deinterlace=yes / auto
#            and an explicit bwdif before or after the filter, the rate and the combing verdict PushMPC's filter sees
#            (its log), mpv's filter chain order (-v), and d3d11vpp's deinterlacer where the runner offers it
#   mpv-native  Linux, PushMPC's own mpv (the mpv-native AppImage artifact): the same arms through vf=pushmpc
#   vlc      Linux, the distro VLC 3 + the PushMPC module (vlc-plugin artifact): --deinterlace=0/1/-1 with bwdif and
#            yadif2x, where the deinterlace filter sits against PushMPC's (VLC's chain log), the verdict and the rate
name: vlc-spike (deint-probe on track/deint-probe)

on:
  workflow_dispatch:
    inputs:
      native_run:
        description: 'mpv-native run id for the AppImage (empty: the newest successful run)'
        type: string
        default: ''
      vlc_run:
        description: 'vlc-plugin run id for plugin-linux (empty: the newest successful run)'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clips:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Masters (60p and 24p, synthetic, public by construction), woven 60i, hard-telecined 30i
        run: |
          set -eu
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg >/dev/null
          mkdir -p clips && cd clips
          # 4 s each, 1280x720: a test pattern, a Mandelbrot zoom (fine detail everywhere), a textured pan with noise
          ffmpeg -v error -y -f lavfi -i "testsrc2=s=1280x720:r=60000/1001:d=4" -pix_fmt yuv420p -c:v ffv1 m60-testsrc2.mkv
          ffmpeg -v error -y -f lavfi -i "mandelbrot=s=1280x720:r=60000/1001:end_scale=0.5,trim=duration=4" -pix_fmt yuv420p -c:v ffv1 m60-mandel.mkv
          ffmpeg -v error -y -f lavfi -i "nullsrc=s=1280x720:r=60000/1001:d=4,format=gray,geq=lum='128+60*sin((X+3*N)*0.07)*cos((Y-N)*0.05)+30*sin((X*0.31+Y*0.17+5*N)*0.2)+random(1)*6-3',format=yuv420p" -c:v ffv1 m60-pan.mkv
          ffmpeg -v error -y -f lavfi -i "mandelbrot=s=1280x720:r=24000/1001:end_scale=0.5,trim=duration=4" -pix_fmt yuv420p -c:v ffv1 m24-mandel.mkv
          for m in testsrc2 mandel pan; do
            # 60i: the top field of master frame 2j, the bottom field of 2j+1 (top first); ffv1 for the filters, and
            # lossless x264 with interlaced coding for the players (their decoders flag the frames interlaced)
            ffmpeg -v error -y -i m60-$m.mkv -vf "tinterlace=mode=interleave_top,setfield=tff" -c:v ffv1 i60-$m.mkv
            ffmpeg -v error -y -i m60-$m.mkv -vf "tinterlace=mode=interleave_top,setfield=tff" -c:v libx264 -qp 0 -flags +ildct+ilme -x264-params tff=1 -pix_fmt yuv420p i60-$m-x264.mkv
          done
          ffmpeg -v error -y -i m24-mandel.mkv -vf "telecine=first_field=t:pattern=23,setfield=tff" -c:v ffv1 tc30-mandel.mkv
          ffmpeg -v error -y -i m24-mandel.mkv -vf "telecine=first_field=t:pattern=23,setfield=tff" -c:v libx264 -qp 0 -flags +ildct+ilme -x264-params tff=1 -pix_fmt yuv420p tc30-mandel-x264.mkv
          for f in *.mkv; do echo "$f: $(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames,avg_frame_rate,field_order -of csv=p=0 $f)"; done
      - uses: actions/upload-artifact@v4
        with: { name: deint-clips, path: clips, retention-days: 5 }

  ffmpeg:
    needs: clips
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: deint-clips, path: clips }
      - name: ffmpeg, the meter tool, nnedi's weights
        run: |
          set -eu
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg g++ >/dev/null
          g++ -O2 -std=c++20 -Ipushmpc/include tests/deint-probe/comb_probe.cpp -o comb_probe
          curl -fsSL -o nnedi3_weights.bin https://github.com/dubhater/vapoursynth-nnedi3/raw/master/src/nnedi3_weights.bin
          sha256sum nnedi3_weights.bin
      - name: The deinterlacers against the 60p masters (double rate, one output per field)
        run: |
          set -u
          comb() { ffmpeg -v error -i "$1" -vf format=gray -f rawvideo -y /tmp/g.raw && ./comb_probe /tmp/g.raw 1280 720; }
          for m in testsrc2 mandel pan; do
            echo "probe: ffmpeg $m woven 60i, no deinterlace: $(comb clips/i60-$m.mkv)"
            for a in "bwdif=mode=send_field:parity=tff" "yadif=mode=send_field:parity=tff" "w3fdif=deint=all" "estdif=mode=field:parity=tff" "nnedi=weights=nnedi3_weights.bin:field=af"; do
              n=${a%%=*}
              vf="$a"; [ "$n" = w3fdif ] && vf="setfield=tff,$a"
              t0=$(date +%s.%N)
              if ffmpeg -v error -y -i clips/i60-$m.mkv -vf "$vf" -c:v ffv1 out-$n-$m.mkv; then
                t1=$(date +%s.%N)
                echo "probe: ffmpeg $m $n: $(python3 tests/deint-probe/score.py ffmpeg ffprobe out-$n-$m.mkv clips/m60-$m.mkv); $(comb out-$n-$m.mkv); $(echo "($t1 - $t0) / 4" | bc -l | cut -c1-5) s per s of video (runner CPU)"
              else echo "probe: ffmpeg $m $n: failed"; fi
              rm -f out-$n-$m.mkv
            done
          done
      - name: Inverse telecine against the 24p master
        run: |
          set -u
          for a in "fieldmatch=order=tff,decimate" "fieldmatch=order=tff:combmatch=full,decimate" "pullup,fps=24000/1001"; do
            ffmpeg -v error -y -i clips/tc30-mandel.mkv -vf "$a" -c:v ffv1 ivtc.mkv && echo "probe: ffmpeg telecine $a: $(python3 tests/deint-probe/score.py ffmpeg ffprobe ivtc.mkv clips/m24-mandel.mkv)" || echo "probe: ffmpeg telecine $a: failed"
          done
          ffmpeg -v error -i clips/tc30-mandel.mkv -vf format=gray -f rawvideo -y /tmp/g.raw && echo "probe: telecined 30i itself: $(./comb_probe /tmp/g.raw 1280 720)"
      - name: The distro mpv's own deinterlacer (encode mode, no PushMPC) against the masters
        run: |
          set -u
          sudo apt-get -qq install -y mpv >/dev/null; mpv --version | head -1
          for m in testsrc2 pan; do
            for a in "--deinterlace=yes" "--vf=lavfi=[bwdif=mode=send_field]" "--vf=lavfi=[yadif=mode=send_field]"; do
              mpv --no-config -v clips/i60-$m-x264.mkv $a --o=mpv.mkv --of=matroska --ovc=ffv1 --no-audio > mpv.log 2>&1 || true
              echo "probe: mpv $(mpv --version | head -1 | cut -d' ' -f2) $m $a: $(python3 tests/deint-probe/score.py ffmpeg ffprobe mpv.mkv clips/m60-$m.mkv)"
              grep -iE "deint|bwdif|yadif" mpv.log | grep -iE "vf|filter|userdeint" | head -3 | sed 's/^/  /'
            done
          done
          for a in "--vf=lavfi=[fieldmatch=order=tff,decimate]" "--vf=lavfi=[pullup]"; do
            mpv --no-config clips/tc30-mandel-x264.mkv $a --o=mpv.mkv --of=matroska --ovc=ffv1 --no-audio > mpv.log 2>&1 || true
            echo "probe: mpv telecine $a: $(python3 tests/deint-probe/score.py ffmpeg ffprobe mpv.mkv clips/m24-mandel.mkv)"
          done

  mpv-native:
    needs: clips
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: deint-clips, path: clips }
      - name: PushMPC's mpv (the AppImage of an mpv-native run) and ffmpeg for the scores
        run: |
          set -eu
          # the AppImage takes the X11 / graphics / audio stack from the host (make-appimage.sh)
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg libfuse2 libxpresent1 libxss1 libxv1 libxrandr2 libxinerama1 libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libwayland-cursor0 libwayland-egl1 libegl1 libgl1 libgbm1 libvulkan1 libva2 libva-drm2 libva-x11-2 libvdpau1 libasound2t64 libpulse0 >/dev/null
          id="${{ inputs.native_run }}"
          [ -n "$id" ] || id=$(gh run list -R "$GITHUB_REPOSITORY" -w mpv-native.yml -s success -L 1 --json databaseId -q '.[0].databaseId')
          echo "mpv-native run $id"
          gh run download "$id" -R "$GITHUB_REPOSITORY" -n mpvnative-appimage -D app
          chmod +x app/*.AppImage; ls -la app
      - name: Deinterlace arms through vf=pushmpc (x2, CPU engine)
        run: |
          set -u
          M="env -u LD_LIBRARY_PATH -u PUSHMPC_ENGINE APPIMAGE_EXTRACT_AND_RUN=1 $(ls app/*.AppImage)"
          $M --version 2>&1 | head -3   # a missing host library shows here
          for m in testsrc2 pan; do
            for a in "" "--deinterlace=yes" "--deinterlace=auto" "--vf=lavfi=[bwdif=mode=send_field],pushmpc=smoother=2" "--vf=pushmpc=smoother=2,lavfi=[bwdif=mode=send_field]"; do
              vf="--vf=pushmpc=smoother=2"; case "$a" in --vf=*) vf="$a"; a="" ;; esac
              $M --no-config -v --msg-level=all=v clips/i60-$m-x264.mkv $a $vf --o=n.mkv --of=matroska --ovc=ffv1 --no-audio > n.log 2>&1 || true
              v=$(grep -hoE "interlaced: interlaced input \([^)]*\)|progressive \(measured\): [0-9]+ of [0-9]+ moving frames combed" n.log | head -1)
              fr=$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames,avg_frame_rate -of csv=p=0 n.mkv 2>/dev/null)
              echo "probe: mpv-native $m ${a:-no deinterlace} $vf: PushMPC saw: ${v:-no verdict logged}; output frames,rate: $fr (source 120 frames 60i = 240 fields)"
              grep -E "\[vf\]" n.log | grep -iE "deint|bwdif|yadif|pushmpc|lavfi" | head -4 | sed 's/^/  /'
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: deint-native-logs, path: '*.log', retention-days: 5 }

  vlc:
    needs: clips
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: deint-clips, path: clips }
      - name: Distro VLC 3 and the PushMPC module (plugin-linux of a vlc-plugin run)
        run: |
          set -eu
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y --no-install-recommends vlc-bin vlc-plugin-base vlc-plugin-video-output >/dev/null
          id="${{ inputs.vlc_run }}"
          [ -n "$id" ] || id=$(gh run list -R "$GITHUB_REPOSITORY" -w vlc-plugin.yml -s success -L 1 --json databaseId -q '.[0].databaseId')
          echo "vlc-plugin run $id"
          gh run download "$id" -R "$GITHUB_REPOSITORY" -n plugin-linux -D plug
          ls -la plug; vlc --version 2>/dev/null | head -1
      - name: --deinterlace 0 / 1 (bwdif, yadif2x) / -1 (auto) in front of PushMPC (x2)
        run: |
          set -u
          export VLC_PLUGIN_PATH="$PWD/plug"
          for m in testsrc2 pan; do
            for a in "--deinterlace=0" "--deinterlace=1 --deinterlace-mode=bwdif" "--deinterlace=1 --deinterlace-mode=yadif2x" "--deinterlace=-1 --deinterlace-mode=bwdif"; do
              # shellcheck disable=SC2086
              timeout 90 vlc -I dummy --no-audio --play-and-exit --no-video-title-show --no-osd --file-logging --logfile=v.log --log-verbose=2 \
                --vout=pushdump --pushdump-file=v.csv --avcodec-hw=none $a --video-filter=postproc:pushmpc_out --pushmpc-smoother=2 clips/i60-$m-x264.mkv > /dev/null 2>&1 || true
              got=$(( $(wc -l < v.csv) - 1 ))
              v=$(grep -hoE "PushMPC: (interlaced: interlaced input \([^)]*\)|progressive \(measured\): [0-9]+ of [0-9]+ moving frames combed)" v.log | head -1)
              echo "probe: vlc $m $a: PushMPC saw: ${v:-no verdict logged}; $got pictures shown (source 120 frames 60i = 240 fields; x2 of 240 = 480)"
              grep -hE "as static|as interactive|deinterlac" v.log | sed 's/^[^:]*: //' | sort -u | head -6 | sed 's/^/  /'
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: deint-vlc-logs, path: '*.log', retention-days: 5 }

  mpv-vs:
    needs: clips
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: deint-clips, path: clips }
      - name: Fetch the pinned VapourSynth runtime and mpv
        shell: pwsh
        run: |
          $pin = Get-Content scripts/vapoursynth-pin.json -Raw | ConvertFrom-Json
          $vs = Join-Path $env:RUNNER_TEMP 'vs'; $mpv = Join-Path $env:RUNNER_TEMP 'mpv'
          New-Item -ItemType Directory $vs, $mpv -Force | Out-Null
          function Fetch($entry, $file) {
            if ($entry.sha256 -match 'TODO' -or $entry.url -match 'TODO') { throw "scripts/vapoursynth-pin.json: $($entry.what) is not pinned yet (TODO)" }
            Invoke-WebRequest -Uri $entry.url -OutFile $file
            $h = (Get-FileHash $file -Algorithm SHA256).Hash
            if ($h -ne $entry.sha256.ToUpperInvariant()) { throw "SHA-256 mismatch for $($entry.url): $h" }
          }
          Fetch $pin.python "$env:RUNNER_TEMP\python.zip"; Expand-Archive "$env:RUNNER_TEMP\python.zip" $vs -Force
          Fetch $pin.vapoursynth "$env:RUNNER_TEMP\vs.zip"; Expand-Archive "$env:RUNNER_TEMP\vs.zip" $vs -Force
          # R7x+ portable: the runtime is a wheel inside the zip, installed as its vspipe.bat expects
          # (lib\site-packages\vapoursynth); lib\site-packages goes into the embeddable Python's ._pth
          if ($pin.vapoursynth.wheel) {
            $sp = Join-Path $vs $pin.vapoursynth.wheelTo; New-Item -ItemType Directory $sp -Force | Out-Null
            foreach ($w in Get-ChildItem (Join-Path $vs $pin.vapoursynth.wheel)) { Write-Host "wheel $($w.Name)"; tar -xf $w.FullName -C $sp; if ($LASTEXITCODE) { throw "unpack $($w.Name)" } }
            foreach ($pth in Get-ChildItem $vs -Filter 'python*._pth') { Add-Content $pth.FullName $pin.vapoursynth.wheelTo.Replace('/', '\') }
          }
          Fetch $pin.mpvForCi "$env:RUNNER_TEMP\mpv.7z"; 7z x "$env:RUNNER_TEMP\mpv.7z" "-o$mpv" -y | Out-Null
          Write-Host '--- runtime layout'; Get-ChildItem $vs -Recurse -File | Where-Object { $_.Extension -in '.exe', '.dll', '.bat', '.pyd', '.h', '._pth' } | ForEach-Object { Write-Host "  $($_.FullName.Substring($vs.Length + 1))" }
          foreach ($b in Get-ChildItem $vs -Filter *.bat) { Write-Host "--- $($b.Name)"; Get-Content $b.FullName | Write-Host }
          Get-ChildItem $vs -Filter *._pth | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_.FullName | Write-Host }
          # SDK headers from the pinned package, the LGPL text from the pinned source of the same tag
          $sdk = 'vsplugin/third_party/vapoursynth'; New-Item -ItemType Directory $sdk -Force | Out-Null
          foreach ($h in $pin.vapoursynth.sdkHeaders) { Copy-Item (Join-Path $vs $h) $sdk }
          Fetch $pin.vapoursynth.source "$env:RUNNER_TEMP\vs-src.tar.gz"
          $src = Join-Path $env:RUNNER_TEMP 'vs-src'; New-Item -ItemType Directory $src -Force | Out-Null; tar -xzf "$env:RUNNER_TEMP\vs-src.tar.gz" -C $src
          $lic = Get-ChildItem $src -Recurse -File | Where-Object { $_.Name -match '^COPYING.LESSER$|^COPYING.*LGPL|^LICENSE.*LGPL' } | Select-Object -First 1
          if (-not $lic) { Get-ChildItem $src -Depth 1 | ForEach-Object { Write-Host "  src: $($_.Name)" }; throw 'no LGPL licence file in the VapourSynth source' }
          Copy-Item $lic.FullName $sdk
          @("VapourSynth SDK headers from VapourSynth $($pin.vapoursynth.tag) (github.com/vapoursynth/vapoursynth), LGPL-2.1-or-later;",
            "see $($lic.Name). Fetched by .github/workflows/vsplugin.yml from the packages pinned in scripts/vapoursynth-pin.json.") | Set-Content "$sdk/README.txt"
          Get-ChildItem $sdk | ForEach-Object { Write-Host "sdk: $($_.Name) $($_.Length)" }
          $vss = Get-ChildItem $vs -Recurse -Filter VSScript.dll | Select-Object -First 1
          if (-not $vss) { throw 'VSScript.dll not found in the runtime' }
          "$vs" | Out-File -Append $env:GITHUB_PATH
          if ($vss.DirectoryName -ne $vs) { $vss.DirectoryName | Out-File -Append $env:GITHUB_PATH }
          "VSDIR=$vs" | Out-File -Append $env:GITHUB_ENV
          "MPVDIR=$mpv" | Out-File -Append $env:GITHUB_ENV
      - name: Build pushmpc_vs (stub core; the portable backend runs on the CPU)
        shell: cmd
        run: vsplugin\build.cmd notest
      - name: Deinterlace arms through pushmpc.vpy (portable x2), d3d11vpp where offered
        shell: pwsh
        run: |
          $t = Join-Path $env:RUNNER_TEMP 'vs'; New-Item -ItemType Directory $t -Force | Out-Null
          Copy-Item vsplugin\scripts\pushmpc.vpy, vsplugin\bin\pushmpc_vs.dll $t
          $vpy = "$t\pushmpc.vpy".Replace('\', '/')
          $ud = 'backend=portable,smoother=2'
          & "$env:MPVDIR\mpv.com" --version | Select-Object -First 1
          $arms = @(
            @('no deinterlace', @("--vf=vapoursynth=file=[$vpy]:user-data=[$ud]")),
            @('--deinterlace=yes', @('--deinterlace=yes', "--vf=vapoursynth=file=[$vpy]:user-data=[$ud]")),
            @('--deinterlace=auto', @('--deinterlace=auto', "--vf=vapoursynth=file=[$vpy]:user-data=[$ud]")),
            @('bwdif before', @("--vf=lavfi=[bwdif=mode=send_field],vapoursynth=file=[$vpy]:user-data=[$ud]")),
            @('bwdif after', @("--vf=vapoursynth=file=[$vpy]:user-data=[$ud],lavfi=[bwdif=mode=send_field]")),
            @('d3d11vpp adaptive deint (hwdec d3d11va)', @('--hwdec=d3d11va', '--vf=d3d11vpp=deint=yes:mode=adaptive', "--vf-append=vapoursynth=file=[$vpy]:user-data=[$ud]"))
          )
          foreach ($m in 'testsrc2', 'pan') {
            foreach ($a in $arms) {
              $log = Join-Path $t ("vs-$m-" + ($a[0] -replace '\W', '') + '.log'); $plog = "$log.plugin"; New-Item -ItemType Directory $plog -Force | Out-Null
              $env:PUSHMPC_VS_LOG_DIR = $plog
              & "$env:MPVDIR\mpv.com" --no-config -v --vo=null --ao=null --untimed --hwdec=no @($a[1]) "clips\i60-$m-x264.mkv" 2>&1 | Out-File $log
              $p = (Get-ChildItem $plog -Filter *.log | ForEach-Object { Get-Content $_.FullName -Raw }) -join "`n"
              $v = [regex]::Match($p, 'interlaced: interlaced input \([^)]*\)|progressive \(measured\)[^\r\n]*').Value
              $r = [regex]::Match($p, 'portable: \d+x\d+ \d+-bit, [\d/]+ fps').Value
              $st = (Get-Content "$env:TEMP\pushmpc-vs-*.txt" -ErrorAction SilentlyContinue | Select-String '^fps=') -join ' '
              Write-Host "probe: mpv-vs $m $($a[0]): PushMPC saw: $(if ($v) { $v } else { 'no verdict logged' }); clip as declared: $(if ($r) { $r } else { 'no portable line' }); measured $st"
              Get-Content $log | Select-String '\[vf\].*(userdeint|deint|bwdif|yadif|vapoursynth|d3d11vpp)|d3d11vpp|Could not|failed' | Select-Object -First 4 | ForEach-Object { Write-Host "  $($_.Line)" }
              Remove-Item "$env:TEMP\pushmpc-vs-*.txt" -ErrorAction SilentlyContinue
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: deint-vs-logs, path: '${{ runner.temp }}/vs/*.log*', retention-days: 5 }
