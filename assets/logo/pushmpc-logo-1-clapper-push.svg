<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>PushMPC logo, concept 1: Clapper Push</title>
  <defs>
    <linearGradient id="push" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF8A1A"/>
      <stop offset="1" stop-color="#8EF02E"/>
    </linearGradient>
    <clipPath id="bar">
      <path d="M78 150 L96 96 L446 52 L452 108 Z"/>
    </clipPath>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="#11161D" stroke="#2B3542" stroke-width="8"/>
  <!-- clapper bar, slightly open -->
  <g clip-path="url(#bar)">
    <rect x="60" y="40" width="400" height="120" fill="#E9EDF2"/>
    <path d="M90 160 L150 40 L200 40 L140 160 Z M190 160 L250 40 L300 40 L240 160 Z M290 160 L350 40 L400 40 L340 160 Z M390 160 L450 40 L500 40 L440 160 Z" fill="#11161D"/>
  </g>
  <!-- play triangle -->
  <path d="M120 200 Q120 186 133 193 L300 293 Q312 300 300 307 L133 407 Q120 414 120 400 Z" fill="#FFFFFF"/>
  <!-- push chevrons: generated frames -->
  <path d="M326 236 L390 300 L326 364" fill="none" stroke="#FF8A1A" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M396 236 L460 300 L396 364" fill="none" stroke="#8EF02E" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
