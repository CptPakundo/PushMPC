ShortDescription: PushFPS video enhancement in media players (MPC-HC, MPC-BE, PotPlayer, mpv and more)
Description: |-
  PushMPC brings PushFPS's video enhancement into media players: frame generation up to 8x, RTX Video Super
  Resolution, the scene-cut guard, SDR to HDR and Auto. It installs per user and sets up the players it finds
  (MPC-HC, MPC-BE, PotPlayer; mpv, mpv.net, SMPlayer, MPC-QT, Kodi and the Jellyfin/Plex MPV shims through its
  VapourSynth plugin). Every player change is undone exactly by the uninstall.
